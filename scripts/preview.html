    }
    // Auto-load fresh data on startup (also refreshes dropdown via /api/accounts/list)
    refreshAll();
    // Auto-detect new collection after packs opened / logout — poll every 8s
    setInterval(async () => {
      if (_refreshInProgress) return;
      try {
        const sm = await fetch('/api/collection/source-mtime', { signal: AbortSignal.timeout(3000) }).then(r => r.json());
        if (sm.sourceMtime && sm.sourceMtime > _lastSourceMtime + 0.5) {
          const btn = document.getElementById('refresh-btn');
          if (btn) { btn.style.color = '#b07a30'; btn.title = 'New collection detected — refreshing…'; }
          await refreshAll();
          if (btn) { btn.style.color = ''; btn.title = ''; }
        }
      } catch {}
    }, 8000);
  } catch {
    document.getElementById('detail').innerHTML =
      `<div class="placeholder">⚠ Needs a local server.<br>
       <code>python3 scripts/server.py</code><br>
       Then open <a href="http://localhost:8765/preview.html" style="color:#b07a30">localhost:8765/preview.html</a></div>`;
  }
}

const CLUE_TIER_CONFIG = {
  beginner: {label:'Beginner', color:'#c8a830', bg:'#2a2010'},
  easy:     {label:'Easy',     color:'#50c050', bg:'#102010'},
  medium:   {label:'Medium',   color:'#c8c030', bg:'#202010'},
  hard:     {label:'Hard',     color:'#4080c0', bg:'#101828'},
  elite:    {label:'Elite',    color:'#9050d0', bg:'#1e1028'},
  master:   {label:'Master',   color:'#d03030', bg:'#280a0a'},
};
const CLUE_TIER_ORDER = ['beginner','easy','medium','hard','elite','master'];

function buildCardList() {
  for (const name of Object.keys(monsterDrops)) {
    const hasCombat = !!monsterDrops[name]?.combatLevel;
    allCards.push({name, type: hasCombat ? 'monster' : 'npc'});
  }
  for (const [name, d] of Object.entries(itemSources)) {
    // Every entry in itemSources is a v1.0 catalog card — show them all.
    // Currency and Food get their own categories; others use cardCategories tags.
    let cats;
    if (CURRENCY_NAMES.has(name)) cats = ['Currency'];
    else if (name in foodData) cats = ['Food'];
    else cats = cardCategories[name] || [];
    allCards.push({name, type:'item', cats});
  }
  // Virtual clue scroll cards — always at top of list
  for (const tier of CLUE_TIER_ORDER)
    allCards.push({name: `Clue scroll (${tier})`, type: 'clue', tier});
  allCards.sort((a,b) => {
    // Clue scrolls sort before everything else
    if (a.type === 'clue' && b.type !== 'clue') return -1;
    if (b.type === 'clue' && a.type !== 'clue') return  1;
    if (a.type === 'clue' && b.type === 'clue')
      return CLUE_TIER_ORDER.indexOf(a.tier) - CLUE_TIER_ORDER.indexOf(b.tier);
    return a.name.localeCompare(b.name);
  });
  renderList(allCards);
}

function filterCards() {
  const q       = document.getElementById('search').value.toLowerCase();
  const owned_f = document.getElementById('owned-filter').value;
  const catFil  = document.getElementById('cat-filter').value;
  const setFil  = document.getElementById('set-filter')?.value || 'all';

  // Resolve the pack object once for set filtering
  const setPackObj = (setFil !== 'all' && packCatalog)
    ? packCatalog.packs.find(p => p.id === setFil) : null;

  const sortBy = document.getElementById('sort-select')?.value || 'name';

  let filtered = allCards.filter(c => {
    if (q && !c.name.toLowerCase().includes(q)) return false;
    // Clue scroll virtual cards: skip owned/set filters; pass cat filter when 'all' or 'clueScrolls'
    if (c.type === 'clue') {
      return catFil === 'all' || catFil === 'clueScrolls';
    }
    if (owned_f === 'owned'     && !isOwned(c.name)) return false;
    if (owned_f === 'not-owned' &&  isOwned(c.name)) return false;
    if (catFil !== 'all') {
      if (catFil === 'clueScrolls') return false;
      if (catFil === 'wishlisted')  return wishlist.has(c.name);
      if (catFil === 'monsters') return c.type === 'monster';
      if (catFil === 'npcs')     return c.type === 'npc';
      if (c.type !== 'item') return false;
      const cats = c.cats || [];
      if (catFil === 'other') {
        if (cats.length > 0) return false;
      } else {
        if (!cats.includes(catFil)) return false;
      }
    }
    if (setPackObj && !_cardInPack(c.name, setPackObj)) return false;
    return true;
  });

  if (sortBy === 'recent') {
    filtered = [...filtered].sort((a, b) => {
      const ta = cardTimestamps[a.name] || 0;
      const tb = cardTimestamps[b.name] || 0;
      return tb !== ta ? tb - ta : a.name.localeCompare(b.name);
    });
  }

  renderList(filtered, sortBy);
}

// Items that should be classified as Currency regardless of Card.json categories
const CURRENCY_NAMES = new Set([
  'Coins', 'Platinum token', 'Tokkul', 'Trading sticks', 'Mark of grace',
  'Ecto-token', 'Golden nugget', 'Nuggets', 'Crystal shards', 'Hallowed mark',
  'Hallowed crystal shard', 'Warrior guild token', 'Castle wars ticket',
  'Archery ticket', 'Agility arena ticket', 'Wilderness agility ticket',
  'Coin pouch',
]);

// Short category abbreviation for the sidebar badge
const CAT_ABBR = {
  Weapon:'Wpn', Ammo:'Ammo', Rune:'Rune',
  Armour:'Arm', Consumable:'Pot', Food:'Food', Clue:'Clue',
  Slayer:'Slay', General:'Gen', Currency:'Coin',
};

function renderList(cards, sortBy = 'name') {
  const list = document.getElementById('card-list');
  list.innerHTML = '';
  for (const card of cards) {
    const el = document.createElement('div');
    if (card.type === 'clue') {
      const cfg = CLUE_TIER_CONFIG[card.tier] || {};
      el.className = 'card-item' + (card.name === selected ? ' selected' : '');
      const clueImgHtml = `<img src="https://oldschool.runescape.wiki/images/Clue_scroll_(${card.tier}).png" style="width:20px;height:20px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;margin-right:5px" onerror="this.style.display='none'">`;
      el.innerHTML = clueImgHtml + `<span class="card-name">${card.name}</span>`
        + `<span style="font-size:9px;color:${cfg.color};background:${cfg.bg};border-radius:2px;padding:1px 5px">${cfg.label}</span>`;
    } else {
      const ownedCls = isOwned(card.name) ? ' owned-card' : '';
      el.className = 'card-item' + (card.name === selected ? ' selected' : '') + ownedCls;
      const firstCat = card.cats?.[0];
      let catTag;
      if (card.type === 'item' && firstCat) {
        if (firstCat === 'Currency') {
          catTag = `<span class="card-cat" style="background:#1e1600;color:#a07830">Coin</span>`;
        } else if (firstCat === 'Food') {
          const hp = foodData[card.name];
          catTag = `<span class="card-cat food-cat" title="Heals ${hp} HP">+${hp}hp</span>`;
        } else {
          catTag = `<span class="card-cat">${CAT_ABBR[firstCat] || firstCat}</span>`;
        }
      } else if (card.type === 'npc') {
        catTag = `<span class="card-type" style="background:#1a1a2e;color:#6a7aaa">NPC</span>`;
      } else if (card.type === 'monster') {
        const cb = monsterDrops[card.name]?.combatLevel;
        catTag = `<span class="card-type">Cb ${cb ?? '?'}</span>`;
      } else {
        catTag = `<span class="card-type">${card.type}</span>`;
      }
      const imgUrl = _cardImg(card.name) || '';
      const imgHtml = imgUrl
        ? `<img src="${imgUrl}" style="width:20px;height:20px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;margin-right:5px" onerror="this.style.display='none'">`
        : '<span style="width:20px;flex-shrink:0;margin-right:5px"></span>';
      el.innerHTML = `${imgHtml}<span class="card-name">${card.name}</span>${catTag}`;
    }
    el.onclick = () => showCard(card.name, card.type);
    list.appendChild(el);
  }
}

// ─── Skill levels ──────────────────────────────────────────────────────────
function getLevel(skill) { return skills[skill] || 1; }
// OSRS combat level from current stats (Hitpoints defaults to 10, as on a new account)
function getCombatLevel() {
  const lv = k => skills[k] || (k === 'Hitpoints' ? 10 : 1);
  const base  = 0.25 * (lv('Defence') + lv('Hitpoints') + Math.floor(lv('Prayer') / 2));
  const melee = 0.325 * (lv('Attack') + lv('Strength'));
  const range = 0.325 * Math.floor(lv('Ranged') * 1.5);
  const mage  = 0.325 * Math.floor(lv('Magic') * 1.5);
  return Math.floor(base + Math.max(melee, range, mage));
}

// ─── Cross-tab navigation history ─────────────────────────────────────────
// Each entry: {tab, name, type, skill, quest} — full app state snapshot
let navHistory = [];
let navForward = [];

function captureState() {
  return {tab: activeTab, name: selected, type: selectedType,
          skill: selectedSkill, quest: selectedQuest, pack: selectedPack, boss: selectedBoss};
}

function pushHistoryEntry() {
  const state = captureState();
  // Only push if there's meaningful state to save
  if (!state.tab) return;
  navHistory.push(state);
  if (navHistory.length > 50) navHistory.shift();
  navForward = [];
  updateNavButtons();
}

function updateNavButtons() {
  const backBtn = document.getElementById('global-back-btn');
  const fwdBtn  = document.getElementById('global-fwd-btn');
  if (backBtn) backBtn.disabled = navHistory.length === 0;
  if (fwdBtn)  fwdBtn.disabled  = navForward.length === 0;
}

function navigate(state) {
  // Restore full app state without pushing history
  _renderTab(state.tab, false);  // don't reset selection — we restore it below
  if (state.tab === 'skilling') {
    selectedSkill = null;
    if (state.skill) showSkillDetail(state.skill, false);
    else renderSkillGrid();
  } else if (state.tab === 'questing') {
    selectedQuest = null;
    if (state.quest) showQuestDetail(state.quest, false);
    else renderQuestList();
  } else if (state.tab === 'packs') {
    selectedPack = state.pack || null;
    renderPackList();
    if (selectedPack) showPackDetail(selectedPack, null, false);
  } else if (state.tab === 'wishlist') {
    renderWishlist();
  } else if (state.tab === 'bosses') {
    selectedBoss = state.boss || null;
    _renderBossFilterBtns();
    renderBossList();
    if (selectedBoss) showBossDetail(selectedBoss);
  } else if (state.tab === 'cards') {
    selected = state.name; selectedType = state.type;
    filterCards();
    if (state.name) refreshDetail();
  }
  updateNavButtons();
}

function navigateBack() {
  if (!navHistory.length) return;
  navForward.push(captureState());
  const prev = navHistory.pop();
  navigate(prev);
}

function navigateForward() {
  if (!navForward.length) return;
  navHistory.push(captureState());
  const next = navForward.pop();
  navigate(next);
}

// ─── Card display ──────────────────────────────────────────────────────────
function showCard(name, type, push = true) {
  if (push) pushHistoryEntry();
  // A version (Infernal harpoon) opens its card's page (Dragon harpoon) with a version banner
  const info = _cardInfo(name);
  if (info && info.exact !== name && !cardDetails[name]) { selectedVersion = name; name = info.exact; type = info.type; }
  else selectedVersion = null;
  selected = name; selectedType = type;
  if (activeTab !== 'cards') _renderTab('cards', false);
  filterCards();
  refreshDetail(true);
}

function refreshDetail(resetScroll = false) {
  if (!selected) return;
  const detail = document.getElementById('detail');
  if (!detail) return;
  const scroll = resetScroll ? 0 : detail.scrollTop;
  if (selectedType === 'monster') renderMonster(selected, detail);
  else if (selectedType === 'clue') renderClueScroll(selected.match(/\((\w+)\)$/)?.[1], detail);
  else if (selectedType === 'ingredient') renderIngredient(selected, detail);
  else renderItem(selected, detail);
  detail.scrollTop = scroll;
  updateNavButtons();
}

function rarityClass(r) { return 'rarity-' + (r||'Unknown').replace(/ /g,'-'); }

// Convert a fraction string like "1/128" to a rarity label
function fractionToRarity(frac) {
  if (!frac) return 'Unknown';
  if (frac === '1/1') return 'Always';
  const m = frac.match(/^([\d.]+)\/([\d,.]+)$/);
  if (!m) return 'Unknown';
  // Same buckets as scripts/rarity_mapper.py, which match the OSRS Wiki's colours
  const n = parseFloat(m[2].replace(/,/g,'')) / parseFloat(m[1]);  // 1-in-n
  if (n <= 1)    return 'Always';
  if (n <= 25)   return 'Common';
  if (n < 100)   return 'Uncommon';
  if (n < 1000)  return 'Rare';
  return 'Very Rare';
}

// ─── Rarity helpers ────────────────────────────────────────────────────────
const RARITY_RANK = { Always:0, Common:1, Uncommon:2, Rare:3, 'Very Rare':4, 'Extremely Rare':5 };
function fractionValue(f) {
  // Returns numeric drop probability (lower = rarer)
  if (!f) return 1;
  const m = f.match(/^([\d.]+)\/([\d,.]+)$/);
  if (!m) return 1;
  return parseFloat(m[1]) / parseFloat(m[2].replace(/,/g,''));
}

// Deduplicate a monster list by card name, keeping the most common entry per monster
// (highest drop probability — best rate the player can get this item).
function dedupeMonsters(list) {
  const best = {};
  for (const m of list) {
    const prev = best[m.card];
    if (!prev) { best[m.card] = m; continue; }
    const prevRank = RARITY_RANK[prev.rarity] ?? 99;
    const newRank  = RARITY_RANK[m.rarity]  ?? 99;
    // Lower rank = more common; prefer that
    if (newRank < prevRank) { best[m.card] = m; continue; }
    // Same rarity label — prefer higher fraction value (more frequent)
    if (newRank === prevRank && fractionValue(m.fraction) > fractionValue(prev.fraction))
      best[m.card] = m;
  }
  return Object.values(best);
}

// ─── Progress pill HTML ────────────────────────────────────────────────────
function progressPill(count, total, isRdt) {
  if (total === 0) return '';
  const pct  = total ? (count/total)*100 : 0;
  const done = count === total;
  const color = isRdt ? '#2a3a6a' : (done ? '#00c853' : '#e8c97a');
  return `<div class="progress-pill">
    <span class="fraction">
      <span class="num" style="color:${color}">${count}</span>
      <span class="den"> / ${total}</span>
    </span>
    <div class="pbar">
      <div class="pbar-fill${done && !isRdt ? ' complete' : ''}" style="width:${pct}%;${isRdt?'background:#2a3a6a':''}"></div>
    </div>
  </div>`;
}

// ─── Drop row HTML (clickable to toggle owned) ─────────────────────────────
// Inline req tags shown next to a monster name in drop rows
// Returns HTML string for e.g. "Slay 85 ✓" / "Sail 75 ✗"
function monsterReqTags(monsterData) {
  if (!monsterData) return '';
  let html = '';
  const checks = [
    {key:'slayerLevel',  skill:'Slayer',  abbr:'Slay'},
    {key:'sailingLevel', skill:'Sailing', abbr:'Sail'},
  ];
  for (const {key, skill, abbr} of checks) {
    const lvl = monsterData[key];
    if (!lvl) continue;
    const met = getLevel(skill) >= lvl;
    html += `<span style="font-size:10px;margin-left:4px;color:${met?'#c87820':'#8a4a10'}">${abbr} ${lvl}${met?' ✓':' ✗'}</span>`;
  }
  return html;
}

function dropRowHtml(cardName, rarity, fraction, isRdt, note) {
  const ownedCard = isOwned(cardName);
  // RDT rows still show ownership — owned = green tick, not-owned = dimmed diamond
  const indClass  = ownedCard ? 'owned' : (isRdt ? 'rdt' : 'locked');
  const nameClass = ownedCard ? 'owned' : (isRdt ? 'rdt' : 'locked');
  const rowClass  = ownedCard ? 'owned' : (isRdt ? '' : 'locked');
  const symbol    = ownedCard ? '✓' : (isRdt ? '◇' : '✗');
  const rarityBg  = isRdt && !ownedCard ? 'background:#0d0d1a;color:#4a5a8a;' : '';

  const reqTags = monsterReqTags(monsterDrops[cardName]);

  return `<div class="drop-row ${rowClass}" style="cursor:pointer" data-nav="${escHtml(cardName)}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
    <div class="drop-indicator ${indClass}">${symbol}</div>
    <span class="drop-name ${nameClass}">${cardName}${reqTags}</span>
    <span class="rarity-badge ${rarityClass(rarity)}" style="${rarityBg}">${rarity}</span>
    <span class="fraction">${fraction || '—'}</span>
    ${_rowWishStar(cardName, ownedCard, note)}
  </div>`;
}

// ─── Monster view ──────────────────────────────────────────────────────────
// Deduplicate drops by card name, keeping the entry with the highest drop probability.
// Some monsters (e.g. Scurrius) have multiple drop tables on the same wiki page,
// causing the same item to appear twice with different fractions.
function dedupeDrops(drops) {
  const best = new Map();
  for (const d of drops) {
    const key = d.card;
    if (!best.has(key)) { best.set(key, d); continue; }
    // Compare probabilities: parse "N/D" → rate, keep higher rate
    const rate = frac => {
      if (!frac) return 0;
      const m = frac.match(/^([\d.]+)\/([\d,.]+)$/);
      return m ? parseFloat(m[1]) / parseFloat(m[2].replace(/,/g,'')) : 0;
    };
    if (rate(d.fraction) > rate(best.get(key).fraction)) best.set(key, d);
  }
  return [...best.values()];
}

// ─── Pack acquisition helpers ──────────────────────────────────────────────

function _buildPackPools() {
  // Build {packId → {tierLabel → count}} from card_details (tier + regions) and
  // card_categories (labels). Single-pack only (skip *_large variants).
  if (!packCatalog) return null;
  const pools = {};
  for (const pack of packCatalog.packs) {
    if (!pack.id.endsWith('_large')) pools[pack.id] = {};
  }
  for (const [name, detail] of Object.entries(cardDetails)) {
    const tier    = detail.tier;
    if (!tier) continue;
    const regions = detail.regions || [];
    const labels  = cardCategories[name] || [];
    for (const pack of packCatalog.packs) {
      if (pack.id.endsWith('_large')) continue;
      const filters = pack.category || [];
      let inPack = filters.length === 0;   // Standard = all cards
      if (!inPack) {
        for (const f of filters) {
          if (regions.includes(f) || labels.includes(f)) { inPack = true; break; }
        }
      }
      if (inPack) {
        if (!pools[pack.id][tier]) pools[pack.id][tier] = 0;
        pools[pack.id][tier]++;
      }
    }
  }
  return pools;
}

function _cardInPack(name, pack) {
  const filters = pack.category || [];
  if (filters.length === 0) return true;
  const regions = (cardDetails[name] || {}).regions || [];
  const labels  = cardCategories[name] || [];
  for (const f of filters) {
    if (regions.includes(f) || labels.includes(f)) return true;
  }
  return false;
}

function packAcquisitionHtml(name) {
  if (!packCatalog || !packPools) return '';
  const tier = (cardDetails[name] || {}).tier;
  if (!tier) return '';

  const rows = [];
  for (const pack of packCatalog.packs) {
    if (pack.id.endsWith('_large')) continue;
    if (!_cardInPack(name, pack)) continue;
    const tierPool  = (packPools[pack.id] || {})[tier] || 0;
    const totalPool = Object.values(packPools[pack.id] || {}).reduce((s, n) => s + n, 0);
    rows.push({ id: pack.id, name: pack.name, price: pack.price, tierPool, totalPool });
  }
  if (rows.length === 0) return '';

  const fmt = n => n.toLocaleString();
  return `<div class="section">
    <div class="section-header">Pack Acquisition</div>
    <table class="pack-table">
      <tr><th>Pack</th><th class="r">Price</th><th class="r">${tier}s / set size</th></tr>
      ${rows.map(r => `<tr>
        <td style="cursor:pointer;color:#bba050;text-decoration:underline dotted"
          data-pack="${r.id}" onclick="_navToPack(this)">${r.name}</td>
        <td class="r" style="color:#e8c97a">${fmt(r.price)}</td>
        <td class="r"><span style="color:#888">${r.tierPool}</span><span style="color:#444"> / ${fmt(r.totalPool)}</span></td>
      </tr>`).join('')}
    </table>
    <div style="font-size:10px;color:#444;margin-top:4px">Smaller pool = better odds. Exact drop rates are server-side.</div>
  </div>`;
}

// ─── Wishlist ──────────────────────────────────────────────────────────────

// Cards a wishlisted quest contributes: required requirements only, or also the
// optional / recommended ones (wishlistQuestRec). Unique, in requirement order.
function _questWishCards(qn, includeRec = wishlistQuestRec.has(qn)) {
  const out = [];
  for (const s of (bmQuestCards[qn]?.sections || []))
    for (const r of (s.requirements || []))
      if (includeRec || !r.optional) out.push(..._reqCards(r));
  return [...new Set(out)];
}

// All wishlisted card names across all sources (owned or not).
function _wishlistedCardSet() {
  const s = new Set(wishlist.keys());
  for (const qn of wishlistedQuests)
    for (const c of _questWishCards(qn)) s.add(c);
  for (const g of wishlistGroups)
    for (const c of g.cards) s.add(c);
  return s;
}

// Collect every unowned card the player still needs across all wishlist sources.
function _wishlistUnownedTargets() {
  const targets = new Set();
  // Individual starred cards
  for (const [name] of wishlist) {
    if (!isOwned(name)) targets.add(name);
  }
  // Quest-wishlisted cards (all requirement cards in every section)
  for (const qn of wishlistedQuests)
    for (const c of _questWishCards(qn))
      if (!isOwned(c)) targets.add(c);
  // Groups: only include cards from unsatisfied groups
  for (const g of wishlistGroups) {
    if (g.cards.some(_slayerCardFeasible)) continue; // already satisfied (owned + accessible)
    for (const c of g.cards) if (!isOwned(c)) targets.add(c);
  }
  // Clue steps: include unowned items from wishlisted steps
  for (const step of wishlistedClueSteps) {
    for (const item of (step.items || [])) {
      if (!isOwned(item)) targets.add(item);
    }
  }
  return targets;
}

// For each non-large pack, count how many unowned targets fall in its pool.
// Returns [{id, name, thumbnail, count, totalPool, cards}] sorted by count desc, then pool asc.
function _wishlistPackRecs(targets) {
  if (!packCatalog || !packPools || !targets.size) return [];
  const recs = [];
  for (const pack of packCatalog.packs) {
    if (pack.id.endsWith('_large')) continue;
    const matching = [];
    for (const name of targets) {
      if ((cardDetails[name] || {}).tier && _cardInPack(name, pack)) matching.push(name);
    }
    if (!matching.length) continue;
    const totalPool = Object.values(packPools[pack.id] || {}).reduce((s, n) => s + n, 0);
    recs.push({ id: pack.id, name: pack.name, thumbnail: pack.thumbnail || '', count: matching.length, totalPool });
  }
  return recs.sort((a, b) => b.count - a.count || a.totalPool - b.totalPool);
}

// Shared hover grid for "any one of these" chips (tool tiers, crossbows, light sources…):
// card images, owned ones bright and first, the rest dimmed — same look as the pack tooltip.
// Usage: <span ${_cardGridTipAttrs(cards, 'Any axe')}>…</span>
function _cardGridTipAttrs(cards, caption) {
  return `data-tipcards="${escHtml(JSON.stringify(cards))}" data-tipcaption="${escHtml(caption || '')}"` +
    ` onmouseover="_showCardGridTip(this)" onmouseout="_hideCardGridTip()"`;
}
// Rows variant: one line per option, e.g. each Barrows brother then their set pieces.
// rows = [{label, cards:[…], need?:[…]}]; a row whose `need` cards are all owned is marked complete.
function _cardRowsTipAttrs(rows, caption) {
  return `data-tiprows="${escHtml(JSON.stringify(rows))}" data-tipcaption="${escHtml(caption || '')}"` +
    ` onmouseover="_showCardGridTip(this)" onmouseout="_hideCardGridTip()"`;
}
function _showCardGridTip(el) {
  let cards = [], rows = null;
  try {
    cards = JSON.parse(el.dataset.tipcards || '[]');
    rows = el.dataset.tiprows ? JSON.parse(el.dataset.tiprows) : null;
  } catch (e) { return; }
  if (!cards.length && !(rows && rows.length)) return;
  let tip = document.getElementById('_card-grid-tip');

    tip = document.createElement('div');
    tip.id = '_card-grid-tip';
    tip.style.cssText = 'position:fixed;z-index:9999;background:#1c1c1c;border:1px solid #3a3020;border-radius:4px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.75);pointer-events:none;display:none';
    document.body.appendChild(tip);
  }
  const owned = cards.filter(c => isOwned(c)), missing = cards.filter(c => !isOwned(c));
  const cell = (c, own) => {
    const img = _cardImg(c);
    const inner = img
      ? `<img src="${img}" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated" onerror="this.style.display='none'">`
      : `<span style="font-size:8px;color:#666;padding:2px;text-align:center;line-height:1.1">${escHtml(c.slice(0, 8))}</span>`;
    return `<div title="${escHtml(c)}" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:3px;overflow:hidden;background:#111;border:1px solid ${own ? '#2a5a2a' : '#222'};opacity:${own ? 1 : 0.3}">${inner}</div>`;
  };
  const cap = el.dataset.tipcaption;
  if (rows) {
    tip.innerHTML = (cap ? `<div style="font-size:10px;color:#888;margin-bottom:6px">${escHtml(cap)}</div>` : '')
      + rows.map(r => {
          const done = (r.need || r.cards).every(c => isOwned(c));
          return `<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px">
            <span style="width:62px;font-size:10px;color:${done ? '#76c442' : '#888'}">${done ? '\u2713 ' : ''}${escHtml(r.label)}</span>
            ${r.cards.map(c => cell(c, isOwned(c))).join('')}</div>`;
        }).join('');
  } else {
    tip.innerHTML = `<div style="font-size:10px;color:#888;margin-bottom:6px">${cap ? escHtml(cap) + ' \xb7 ' : ''}${owned.length}/${cards.length} owned${owned.length ? ' \u2014 ' + escHtml(owned.join(', ')) : ''}</div>`
      + `<div style="display:flex;flex-wrap:wrap;gap:4px;max-width:260px">${owned.map(c => cell(c, true)).join('')}${missing.map(c => cell(c, false)).join('')}</div>`;
  }
  const rect = el.getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = rect.left + 'px';
  tip.style.top = (rect.bottom + 6) + 'px';
  requestAnimationFrame(() => {
    const tr = tip.getBoundingClientRect();
    if (tr.right > window.innerWidth - 8) tip.style.left = (window.innerWidth - tr.width - 8) + 'px';
    if (tr.bottom > window.innerHeight - 8) tip.style.top = (rect.top - tr.height - 6) + 'px';
  });
}
function _hideCardGridTip() {
  const tip = document.getElementById('_card-grid-tip');
  if (tip) tip.style.display = 'none';
}

function _showPackTip(event, el) {

    if (tr.bottom > window.innerHeight - 8) tip.style.top  = (rect.top - tr.height - 6) + 'px';

function _loadWishlist() {
  try {
    const raw = localStorage.getItem('tcg_wishlist');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.v === 2) {
      wishlist = new Map(Object.entries(d.items || {}));
      wishlistedQuests = new Set(d.quests || []);
      wishlistQuestRec = new Set(d.questsRec || d.quests || []);
      wishlistGroups = d.groups || [];
      wishlistedClueSteps = d.clueSteps || [];
    } else {
      // Migrate from old Set format (v1 — just an array of names)
      wishlist = new Map((Array.isArray(d) ? d : []).map(n => [n, {note:''}]));
      wishlistedQuests = new Set();
      wishlistGroups = [];
      wishlistedClueSteps = [];
    }
  } catch { wishlist = new Map(); wishlistedQuests = new Set(); wishlistGroups = []; wishlistedClueSteps = []; }
}

function _saveWishlist() {
  const items = {};
  for (const [k, v] of wishlist) items[k] = v;
  localStorage.setItem('tcg_wishlist', JSON.stringify({
    v: 2,
    items,
    quests: [...wishlistedQuests].sort(),
    questsRec: [...wishlistQuestRec].filter(q => wishlistedQuests.has(q)).sort(),
    groups: wishlistGroups,
    clueSteps: wishlistedClueSteps,
  }));
}

function _isClueStepWishlisted(text) {
  return wishlistedClueSteps.some(s => s.text === text);
}

// Strip a step's card contributions from wishlist when it is un-starred.
function _removeClueStepCards(step) {
  const noteTag = `${step.tier} clue`;
  for (const card of (step.items || [])) {
    if (!wishlist.has(card)) continue;
    const entry = wishlist.get(card);
    const remaining = entry.note.split(',').map(t => t.trim()).filter(t => t && t !== noteTag);
    if (remaining.length === 0) {
      wishlist.delete(card);
    } else {
      entry.note = remaining.join(', ');
    }
  }
}

function _toggleClueStepWish(el) {
  const text  = el.dataset.stepText;
  const type  = el.dataset.stepType;
  const tier  = el.dataset.stepTier;
  const items = JSON.parse(el.dataset.stepItems || '[]');
  const idx   = wishlistedClueSteps.findIndex(s => s.text === text);
  if (idx >= 0) {
    const step = wishlistedClueSteps[idx];
    wishlistedClueSteps.splice(idx, 1);
    _removeClueStepCards(step);
    el.textContent = '☆';
    el.classList.remove('active');
  } else {
    wishlistedClueSteps.push({ type, tier, text, items });
    // Add unowned items to the main wishlist card grid (same pattern as wishlistQuest)
    const noteTag = `${tier} clue`;
    for (const card of items) {
      if (isOwned(card)) continue;
      if (wishlist.has(card)) {
        const entry = wishlist.get(card);
        if (!entry.note.includes(noteTag)) entry.note = entry.note ? entry.note + ', ' + noteTag : noteTag;
      } else {
        wishlist.set(card, { note: noteTag });
      }
    }
    el.textContent = '★';
    el.classList.add('active');
  }
  _saveWishlist();
  refreshDetail();
  if (activeTab === 'wishlist') renderWishlist();
}

function removeClueStep(text) {
  const step = wishlistedClueSteps.find(s => s.text === text);
  wishlistedClueSteps = wishlistedClueSteps.filter(s => s.text !== text);
  if (step) _removeClueStepCards(step);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

// Clue step card chip — navigatable chip with an embedded ★ split off to the right.
// navType: 'item' or 'monster'
function _clueCardChipHtml(name, navType) {
  const own = isOwned(name);
  const bg  = own ? '#0d1c09' : '#1c0d09';
  const col = own ? '#76c442' : '#c84a00';
  const sym = own ? '✓' : '✗';
  const wled = wishlist.has(name);
  const divCol = own ? '#1a3a0d' : '#3a1a0d';
  return `<span style="display:inline-flex;align-items:center;background:${bg};border-radius:3px;overflow:hidden">` +
    `<span style="font-size:11px;color:${col};padding:2px 6px 2px 7px;cursor:pointer"` +
    ` data-nav="${escHtml(name)}" data-nav-type="${navType}"` +
    ` onclick="showCard(this.dataset.nav,this.dataset.navType)">${sym} ${escHtml(name)}</span>` +
    `<span class="wish-star${wled?' active':''}" style="font-size:10px;padding:2px 5px;border-left:1px solid ${divCol}"` +
    ` data-card="${escHtml(name)}"` +
    ` onclick="event.stopPropagation();toggleWishlist(this.dataset.card)"` +
    ` title="${wled?'Remove from wishlist':'Add to wishlist'}">${wled?'★':'☆'}</span>` +
    `</span>`;
}

// Small inline wish star for use inside rows (drop tables, quest requirements, etc.).
// owned=true → greyed out (you already have it); stop propagation to avoid row navigation.
// When note is provided, active state reflects whether that specific context tag is present,
// so each page's star toggles its own contribution independently.
function _rowWishStar(name, owned, note) {
  const inWishlist = wishlist.has(name);
  let wled, elsewhere;
  if (note) {
    const entry = wishlist.get(name);
    wled = entry ? entry.note.split(',').map(t => t.trim()).includes(note) : false;
    elsewhere = inWishlist && !wled;
  } else {
    wled = inWishlist;
    elsewhere = false;
  }
  const cls = wled ? ' active' : (elsewhere ? ' elsewhere' : '');
  const sym = (wled || elsewhere) ? '★' : '☆';
  const tip = wled ? 'Remove tag' : (elsewhere ? 'Already wishlisted — click to add this tag' : 'Add to wishlist');
  return `<span class="wish-star${cls}"
    ${owned ? 'style="opacity:0.3"' : ''}
    data-card="${escHtml(name)}"
    ${note ? `data-note="${escHtml(note)}"` : ''}
    onclick="event.stopPropagation();toggleWishlist(this.dataset.card,this.dataset.note)"
    title="${tip}">${sym}</span>`;
}

function toggleWishlist(name, note) {
  if (note) {
    // Context-aware toggle: add/remove just this tag, keep other tags intact
    if (wishlist.has(name)) {
      const entry = wishlist.get(name);
      const parts = entry.note.split(',').map(t => t.trim()).filter(Boolean);
      if (parts.includes(note)) {
        // This tag is already present — remove it
        const remaining = parts.filter(t => t !== note);
        if (remaining.length === 0) wishlist.delete(name);
        else entry.note = remaining.join(', ');
      } else {
        // Append this tag to the existing entry
        entry.note = [...parts, note].join(', ');
      }
    } else {
      // Not yet wishlisted — add with context + any auto-discovered tags
      const autoNote = _buildAutoNote(name);
      const combined = [note, autoNote].filter(Boolean).join(', ');
      wishlist.set(name, {note: combined});
    }
  } else {
    // No context — simple toggle (header stars)
    if (wishlist.has(name)) wishlist.delete(name);
    else {
      // Add '★' marker so manual pins survive quest/clue/group auto-removal
      const autoNote = _buildAutoNote(name);
      const combined = ['★', autoNote].filter(Boolean).join(', ');
      wishlist.set(name, {note: combined});
    }
  }
  _saveWishlist();
  refreshDetail();
  if (activeTab === 'wishlist') renderWishlist();
}

// Build a note for a newly-added card by checking which wishlisted quests,
// groups, and clue steps it belongs to, so the label is restored on re-add.
function _buildAutoNote(name) {
  const tags = [];
  for (const qn of wishlistedQuests) {
    if (_questWishCards(qn).includes(name)) tags.push(qn);
  }
  for (const g of wishlistGroups) {
    if (g.cards.includes(name)) tags.push(g.name);
  }
  for (const step of wishlistedClueSteps) {
    if ((step.items || []).includes(name)) {
      const tag = `${step.tier} clue`;
      if (!tags.includes(tag)) tags.push(tag);
    }
  }
  return tags.join(', ');
}

// ── Wishlist left-panel search ────────────────────────────────────────────────
function _wlSearchInput(q) {
  const el = document.getElementById('wl-search-results');
  if (!el) return;
  const lower = q.trim().toLowerCase();

  let cards, quests;
  if (lower.length > 0) {
    cards  = allCards.filter(c => c.type !== 'clue' && c.name.toLowerCase().includes(lower));
    quests = Object.keys(questsData).filter(n => n.toLowerCase().includes(lower));
  } else {
    // No query: show all wishlisted items
    cards  = allCards.filter(c => wishlist.has(c.name));
    quests = [...wishlistedQuests];
  }

  if (!lower && !cards.length && !quests.length) {
    el.innerHTML = '<div style="padding:20px 12px;color:#333;font-size:11px;text-align:center;line-height:1.7">Type a card or quest name<br>to search &amp; add</div>';
    return;
  }
  if (lower && !cards.length && !quests.length) {
    el.innerHTML = '<div style="padding:10px 12px;color:#444;font-size:11px">No cards or quests found</div>';
    return;
  }

  const cardHtml = cards.slice(0, 40).map(c => {
    const wled = wishlist.has(c.name);
    const own  = isOwned(c.name);
    const safe = c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    const imgUrl = _cardImg(c.name) || '';
    const ctype = c.type || 'item';
    return `<div style="display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;border-bottom:1px solid #0f0f0f"
      data-card="${safe}" onclick="_wlSearchToggle(this.dataset.card)"
      onmouseenter="this.style.background='#161616'" onmouseleave="this.style.background=''">
      ${imgUrl ? `<img src="${imgUrl}" style="width:20px;height:20px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">` : '<span style="width:20px;flex-shrink:0"></span>'}
      <span style="flex:1;font-size:11px;color:${own?'#76c442':'#aaa'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted"
        data-nav="${safe}" data-nav-type="${ctype}" onclick="event.stopPropagation();_navToCard(this)" title="View card">${c.name}</span>
      <span style="font-size:12px;flex-shrink:0;color:${wled?'#4a7a4a':'#2a4a2a'};font-weight:700" title="${wled?'Remove from wishlist':'Add to wishlist'}">${wled?'★':'☆'}</span>
    </div>`;
  }).join('');

  const questHtml = quests.slice(0, 20).map(qn => {
    const wled = wishlistedQuests.has(qn);
    const safe = qn.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div style="display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;border-bottom:1px solid #0f0f0f"
      data-quest="${safe}" onclick="_wlQuestToggle(this.dataset.quest)"
      onmouseenter="this.style.background='#161616'" onmouseleave="this.style.background=''">
      <span style="width:20px;flex-shrink:0;font-size:10px;text-align:center;color:#7a6a3a">Q</span>
      <span style="flex:1;font-size:11px;color:#bba050;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted"
        data-quest="${safe}" onclick="event.stopPropagation();_navToQuest(this)"
        title="Open quest page">${qn}</span>
      <span style="font-size:12px;flex-shrink:0;color:${wled?'#7a6a3a':'#2a2a1a'};font-weight:700" title="${wled?'Remove quest from wishlist':'Add quest cards to wishlist'}">${wled?'★':'☆'}</span>
    </div>`;
  }).join('');

  // If both sections have results and we have a query, show section headers
  let html = '';
  if (lower && quests.length && cards.length) {
    if (cardHtml) html += `<div style="padding:4px 10px;font-size:9px;color:#444;letter-spacing:.05em;text-transform:uppercase;background:#0a0a0a">Cards</div>${cardHtml}`;
    if (questHtml) html += `<div style="padding:4px 10px;font-size:9px;color:#444;letter-spacing:.05em;text-transform:uppercase;background:#0a0a0a">Quests</div>${questHtml}`;
  } else {
    html = cardHtml + questHtml;
  }
  el.innerHTML = html;
}

function _wlQuestToggle(questName) {
  if (wishlistedQuests.has(questName)) {
    removeQuestFromWishlist(questName);
  } else {
    wishlistQuest(questName);
  }
  const input = document.getElementById('wl-search');
  if (input) _wlSearchInput(input.value);
}

function _wlSearchToggle(name) {
  if (wishlist.has(name)) {
    wishlist.delete(name);
  } else {
    wishlist.set(name, {note: _buildAutoNote(name)});
  }
  _saveWishlist();
  renderWishlist();
}

function removeFromWishlist(name) {
  wishlist.delete(name);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

function removeWishlistTag(name, tag) {
  if (!wishlist.has(name)) return;
  const entry = wishlist.get(name);
  const remaining = entry.note.split(',').map(t => t.trim()).filter(t => t && t !== tag);
  if (remaining.length === 0) wishlist.delete(name);
  else entry.note = remaining.join(', ');
  _saveWishlist();
  renderWishlist();
  refreshDetail();
}

function removeQuestFromWishlist(questName) {
  // Smart cleanup: strip quest name from auto-added card notes
  const questCards = _questWishCards(questName, true);
  for (const card of questCards) {
    if (!wishlist.has(card)) continue;
    const entry   = wishlist.get(card);
    const cleaned = _noteRemoveTag(entry.note, questName);
    if (!cleaned) wishlist.delete(card); else entry.note = cleaned;
  }
  wishlistedQuests.delete(questName);
  wishlistQuestRec.delete(questName);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

// Strip a single tag from a comma-separated note string
function _noteRemoveTag(note, tag) {
  return note.split(',').map(p => p.trim()).filter(p => p && p !== tag).join(', ');
}

function clearWishlist() {
  const parts = [
    wishlist.size && `${wishlist.size} card${wishlist.size === 1 ? '' : 's'}`,
    wishlistedQuests.size && `${wishlistedQuests.size} quest${wishlistedQuests.size === 1 ? '' : 's'}`,
    wishlistGroups.length && `${wishlistGroups.length} group${wishlistGroups.length === 1 ? '' : 's'}`,
    wishlistedClueSteps.length && `${wishlistedClueSteps.length} clue step${wishlistedClueSteps.length === 1 ? '' : 's'}`,
  ].filter(Boolean);
  if (!parts.length) return;
  if (!confirm(`Clear your whole wishlist?\n\nThis removes ${parts.join(', ')}. It can't be undone.`)) return;
  wishlist.clear();
  wishlistedQuests.clear();
  wishlistGroups = [];
  wishlistedClueSteps = [];
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
  refreshDetail();  // un-star any open card page
}

function saveWishlistNote(name, note) {
  const entry = wishlist.get(name);
  if (entry) { entry.note = note.trim(); _saveWishlist(); }
}

// ── Note popover ──────────────────────────────────────────────────────────────
let _notePopoverCloseHandler = null;

function openNotePopover(btn, cardName) {
  // Close any existing popover first
  _closeNotePopover();

  const meta = wishlist.get(cardName) || {note:''};
  const pop = document.createElement('div');
  pop.id = 'note-popover';
  pop.style.cssText = 'position:fixed;z-index:9999;background:#1c1c1c;border:1px solid #333;border-radius:4px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,0.6);width:220px';

  const safeCard = cardName.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  pop.innerHTML = `
    <div style="font-size:10px;color:#777;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cardName}</div>
    <textarea id="note-popover-input" placeholder="Why do you want this?" rows="3"
      style="width:100%;box-sizing:border-box;background:#111;border:1px solid #333;color:#ccc;padding:5px 7px;border-radius:3px;font-size:11px;resize:vertical;outline:none;font-family:inherit">${meta.note}</textarea>
    <div style="display:flex;gap:5px;margin-top:7px;justify-content:flex-end">
      <button onclick="_closeNotePopover()" style="background:none;border:1px solid #2a2a2a;color:#666;padding:2px 9px;border-radius:3px;font-size:10px;cursor:pointer">Cancel</button>
      <button data-card="${safeCard}" onclick="_saveNotePopover(this.dataset.card)"
        style="background:#1a2a1a;border:1px solid #2a4a2a;color:#76c442;padding:2px 9px;border-radius:3px;font-size:10px;cursor:pointer">Save</button>
    </div>`;
  document.body.appendChild(pop);

  // Position below the button, left-aligned, clamped to viewport
  const rect = btn.getBoundingClientRect();
  let top  = rect.bottom + 5;
  let left = rect.left;
  pop.style.top  = top  + 'px';
  pop.style.left = left + 'px';
  // After paint, clamp right edge
  requestAnimationFrame(() => {
    const pr = pop.getBoundingClientRect();
    if (pr.right > window.innerWidth - 8)  pop.style.left = (window.innerWidth - pr.width - 8) + 'px';
    if (pr.bottom > window.innerHeight - 8) pop.style.top  = (rect.top - pr.height - 5) + 'px';
  });

  pop.querySelector('#note-popover-input').focus();

  // Close on outside click (next tick so this click doesn't immediately close it)
  setTimeout(() => {
    _notePopoverCloseHandler = e => { if (!pop.contains(e.target)) _closeNotePopover(); };
    document.addEventListener('click', _notePopoverCloseHandler);
  }, 0);
}

function _closeNotePopover() {
  const pop = document.getElementById('note-popover');
  if (pop) pop.remove();
  if (_notePopoverCloseHandler) {
    document.removeEventListener('click', _notePopoverCloseHandler);
    _notePopoverCloseHandler = null;
  }
}

function _saveNotePopover(cardName) {
  const input = document.getElementById('note-popover-input');
  if (input) saveWishlistNote(cardName, input.value);
  _closeNotePopover();
  // Re-render so button colour/title updates
  if (activeTab === 'wishlist') renderWishlist();
}

    <div id="group-editor-modal" style="background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:18px 20px;width:360px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;gap:10px;overflow:hidden">
      <div style="display:flex;align-items:center">
        <span style="font-size:13px;color:#ccc;font-weight:500">${gi < 0 ? 'New group' : 'Edit group'}</span>

      <div style="font-size:10px;color:#666;margin-bottom:-6px">Add cards — group is satisfied when you own <em>any one</em></div>
      <input id="ge-search" placeholder="Search cards…" autocomplete="off" oninput="_geRenderSearch(this.value)"
        style="background:#111;border:1px solid #333;color:#ccc;padding:6px 9px;border-radius:3px;font-size:11px;outline:none">
      <div id="ge-results" style="overflow-y:auto;max-height:140px;border:1px solid #222;border-radius:3px;background:#0c0c0c"></div>
      <div>
        <div style="font-size:10px;color:#666;margin-bottom:5px">In group (<span id="ge-count">${g.cards.length}</span>)</div>
        <div id="ge-chips" style="display:flex;flex-wrap:wrap;gap:4px;min-height:22px"></div>
      </div>
      <div style="display:flex;gap:6px;justify-content:flex-end;padding-top:4px;border-top:1px solid #222">
        <button onclick="closeGroupEditor()" style="background:none;border:1px solid #2a2a2a;color:#666;padding:4px 14px;border-radius:3px;font-size:11px;cursor:pointer">Cancel</button>
        <button data-gi="${gi}" onclick="saveGroupEditor(parseInt(this.dataset.gi))"

      </div>

  document.body.appendChild(overlay);

function _geRenderSearch(q) {
  const el = document.getElementById('ge-results');
  if (!el) return;
  if (!q || q.length < 2) { el.innerHTML = ''; return; }
  const lower = q.toLowerCase();
  const matches = allCards.filter(c => c.name.toLowerCase().includes(lower) && !window._geCards.includes(c.name)).slice(0, 25);
  if (!matches.length) { el.innerHTML = '<div style="padding:6px 9px;color:#333;font-size:10px">No matches</div>'; return; }
  el.innerHTML = matches.map(c => {
    const own  = isOwned(c.name);
    const safe = c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div style="padding:5px 9px;cursor:pointer;font-size:11px;color:${own?'#76c442':'#999'};display:flex;align-items:center;gap:7px;border-bottom:1px solid #111"
      data-card="${safe}" onclick="_geAddCard(this.dataset.card)"
      onmouseenter="this.style.background='#1c1c1c'" onmouseleave="this.style.background=''">
      <span style="font-size:9px;color:${own?'#00c853':'#333'}">${own?'✓':'○'}</span>${c.name}</div>`;
  }).join('');
}

function _geAddCard(name) {
  if (window._geCards.includes(name)) return;
  window._geCards.push(name);
  _geRenderChips();
  const search = document.getElementById('ge-search');
  if (search) _geRenderSearch(search.value);
}

function _geRemoveCard(name) {
  window._geCards = window._geCards.filter(c => c !== name);
  _geRenderChips();
  const search = document.getElementById('ge-search');
  if (search) _geRenderSearch(search.value);
}

function _geRenderChips() {
  const el    = document.getElementById('ge-chips');
  const count = document.getElementById('ge-count');
  if (!el) return;
  if (count) count.textContent = window._geCards.length;
  if (!window._geCards.length) { el.innerHTML = '<span style="font-size:10px;color:#2a2a2a">None yet</span>'; return; }
  el.innerHTML = window._geCards.map(c => {
    const own  = isOwned(c);
    const safe = c.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:${own?'#0d2210':'#111'};border:1px solid ${own?'#2a5a2a':'#2a2a2a'};color:${own?'#76c442':'#aaa'};border-radius:3px;padding:2px 5px;font-size:10px">
      ${c}<span data-card="${safe}" onclick="_geRemoveCard(this.dataset.card)" style="color:#555;cursor:pointer;line-height:1" title="Remove">×</span></span>`;
  }).join('');
}

function closeGroupEditor() {
  const overlay = document.getElementById('group-editor-overlay');
  if (overlay) overlay.remove();
  window._geCards = null; window._geIdx = null;
}

function saveGroupEditor(gi) {
  const nameEl = document.getElementById('ge-name');
  const name   = (nameEl ? nameEl.value.trim() : '') || 'Unnamed group';
  const cards  = window._geCards || [];
  if (!cards.length) { closeGroupEditor(); return; }

  // If editing, strip the old group name from any auto-added notes first
  const oldGroup = (gi >= 0 && gi < wishlistGroups.length) ? wishlistGroups[gi] : null;
  if (oldGroup) {
    for (const card of oldGroup.cards) {
      if (!wishlist.has(card)) continue;
      const entry   = wishlist.get(card);
      const cleaned = _noteRemoveTag(entry.note, oldGroup.name);
      if (!cleaned) wishlist.delete(card); else entry.note = cleaned;
    }
  }

  // Save group
  if (oldGroup) wishlistGroups[gi] = {name, cards: [...cards]};
  else wishlistGroups.push({name, cards: [...cards]});

  // Auto-populate individual wishlist with group name as note (unowned cards only)
  for (const card of cards) {
    if (isOwned(card)) continue;  // already have it — show in group but don't clutter wishlist
    if (wishlist.has(card)) {
      const entry = wishlist.get(card);
      if (!entry.note.includes(name)) entry.note = entry.note ? entry.note + ', ' + name : name;
    } else {
      wishlist.set(card, {note: name});
    }
  }

  _saveWishlist();
  closeGroupEditor();
  if (activeTab === 'wishlist') renderWishlist();
}

function removeGroup(gi) {
  const g = wishlistGroups[gi];
  if (!g) return;
  // Smart cleanup: strip group name from auto-added card notes
  for (const card of g.cards) {
    if (!wishlist.has(card)) continue;
    const entry   = wishlist.get(card);
    const cleaned = _noteRemoveTag(entry.note, g.name);
    if (!cleaned) wishlist.delete(card); else entry.note = cleaned;
  }
  wishlistGroups.splice(gi, 1);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

// includeRec: also wishlist the optional / recommended cards. Calling again with
// includeRec on an already-wishlisted quest upgrades it (adds the extra cards).
function wishlistQuest(questName, includeRec = false) {
  if (wishlistedQuests.has(questName) && (!includeRec || wishlistQuestRec.has(questName))) return 0;
  wishlistedQuests.add(questName);
  if (includeRec) wishlistQuestRec.add(questName);

  // Add unowned BM quest cards to the individual wishlist with the quest name as the note
  const questCards = _questWishCards(questName);
  for (const card of questCards) {
    if (isOwned(card)) continue;  // already have it — no need to wishlist
    if (wishlist.has(card)) {
      const entry = wishlist.get(card);
      if (!entry.note.includes(questName)) entry.note = entry.note ? entry.note + ', ' + questName : questName;
    } else {
      wishlist.set(card, {note: questName});
    }
  }

  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
  return 1;
}

// ── Category helper ───────────────────────────────────────────────────────────
const _EQUIP_CATS = new Set(['Weapon','Armour','Ammo','Shield','Cape','Helm','Boot','Glove','Amulet','Ring','Jewellery']);
function _wlCategory(name) {
  if (monsterDrops[name]) return monsterDrops[name].combatLevel ? 'monster' : 'npc';
  const cats = cardCategories[name] || [];
  if (cats.includes('Tool')) return 'tool';
  if (cats.some(c => _EQUIP_CATS.has(c))) return 'equipment';
  if (cats.includes('Currency')) return 'currency';
  return 'other';
}

function _cardType(name) {
  const card = allCards.find(c => c.name === name);
  return card ? card.type : (monsterDrops[name] ? 'monster' : 'item');
}

    for (const qn of [...wishlistedQuests].sort()) {

          <span style="font-size:13px;color:#bba050;font-weight:500;cursor:pointer;text-decoration:underline dotted"

          <button data-quest="${qSafe}" onclick="removeQuestFromWishlist(this.dataset.quest)"

      for (const c of unique.sort()) {

        const chipTitle = wled ? '' : `title="${c.replace(/"/g,'&quot;')} removed from wishlist"`;
        questHtml += `<span style="${chipStyle};border:1px solid;border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer" ${chipTitle}

  if (wishlistGroups.length) {

    html += `<div class="section"><div class="section-header">Groups <span style="font-size:10px;font-weight:400;color:#555;margin-left:6px">${satCount}/${wishlistGroups.length} satisfied</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px">`;
    for (let gi = 0; gi < wishlistGroups.length; gi++) {
      const g = wishlistGroups[gi];
      const satisfied = g.cards.some(_slayerCardFeasible);
      const ownedCount = g.cards.filter(c => isOwned(c)).length;
      const anyBlocked = !satisfied && g.cards.some(c => isOwned(c) && !_slayerCardFeasible(c));

        const safe = c.replace(/&/g,'&amp;').replace(/"/g,'&quot;');

            ...((g2.quests||[]).filter(q => !completedQuests.has(q)).map(q => 'Quest: '+q)),
            ...(Object.entries(g2.skills||{}).filter(([s,l]) => getLevel(s)<l).map(([s,l]) => s+' '+l+' req')),

  // ── Individual card sections ────────────────────────────────────────────────

  const byCategory = {tool:[], equipment:[], currency:[], monster:[], npc:[], other:[]};
  for (const [name] of wishlist) byCategory[_wlCategory(name)]?.push(name);

      const badge = own
        ? `<div style="position:absolute;top:3px;right:3px;background:#00c853;color:#000;border-radius:2px;font-size:8px;padding:1px 4px;font-weight:700;line-height:1.5" title="Owned">✓</div>`

          ? `<div style="position:absolute;top:3px;right:3px;background:#a05000;color:#ffd080;border-radius:2px;font-size:8px;padding:1px 4px;font-weight:700;line-height:1.5" title="Group satisfied by another card">✓</div>`
          : '';

              style="color:#2a2a2a;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0" title="Remove">×</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Clue step sections ──────────────────────────────────────────────────────
  let clueStepHtml = '';
  if (wishlistedClueSteps.length) {
    clueStepHtml += `<div class="section"><div class="section-header">Clue Steps</div>`;
    const _WL_TIER_COLORS = {
      Beginner:'#c8a830', Easy:'#50c050', Medium:'#c8c030',
      Hard:'#4080c0', Elite:'#9050d0', Master:'#d03030',
    };
    const _WL_TYPE_LABELS = {
      emote:'Emote', sherlock:'Sherlock', falo:'Falo',
      cryptic:'Cryptic', anagram:'Anagram', cipher:'Cipher',
    };
    for (const step of wishlistedClueSteps) {
      const allItems  = step.items || [];
      // Determine nav type per item: monster card → 'monster', else 'item'
      const anyReady  = allItems.some(i => isOwned(i));
      const allReady  = allItems.length > 0 && allItems.every(i => isOwned(i));
      const borderCol = allReady ? '#76c442' : anyReady ? '#c8a830' : (allItems.length ? '#c84a00' : '#333');
      const tierCol   = _WL_TIER_COLORS[step.tier] || '#666';
      const typeStr   = _WL_TYPE_LABELS[step.type] || step.type;
      const tierBadge = `<span style="font-size:9px;color:${tierCol};border:1px solid ${tierCol}55;background:${tierCol}18;border-radius:2px;padding:1px 5px;white-space:nowrap;flex-shrink:0">${step.tier} clue · ${typeStr}</span>`;
      const textSafe = step.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      const displayText = step.type === 'falo' ? `"${escHtml(step.text)}"` : escHtml(step.text);
      const textStyle = step.type === 'falo' ? 'font-style:italic;color:#888' : 'color:#bbb';
      clueStepHtml += `<div style="margin:6px 0;background:#161616;border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;border-left:3px solid ${borderCol}">
        <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:${allItems.length?'6px':'0'}">
          <span style="font-size:11px;flex:1;${textStyle}">${displayText}</span>
          ${tierBadge}
          <button data-step-text="${textSafe}" onclick="removeClueStep(this.dataset.stepText)"

      if (allItems.length) {

          const navType = monsterDrops[it] ? 'monster' : 'item';
          clueStepHtml += _clueCardChipHtml(it, navType);
        }
        clueStepHtml += `</div>`;
      }
      clueStepHtml += `</div>`;
    }
    clueStepHtml += `</div>`;
  }

  html += questHtml;
  html += clueStepHtml;
  container.innerHTML = html;
}

function _getPackCards(pack) {
  // All allCards entries that belong to this pack and have a tier (excludes virtual clue scroll cards)
  return allCards.filter(c => {
    if (!(cardDetails[c.name] || {}).tier) return false;
    return _cardInPack(c.name, pack);
  });
}
