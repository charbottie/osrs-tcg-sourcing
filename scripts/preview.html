// ─── Ingredient detail page ─────────────────────────────────────────────────
function renderIngredient(name, container) {
  const info = ingredientInfo[name] || {};
  const prod = info.production || null;
  const shops = info.shops || [];
  const spawns = info.spawns || [];
  const wikiUrl = 'https://oldschool.runescape.wiki/w/' + encodeURIComponent(name.replace(/ /g, '_'));

  let html = `<h1>${name}${wikiLink(name)}</h1>
    <div class="subtitle" style="color:#666">
      Intermediary item — not a TCG card
    </div>`;

  // Production
  if (prod) {
    const skill = prod.skill || '';
    const level = prod.level || 0;
    const playerLevel = getLevel(skill);
    const canCraft = playerLevel >= level;
    const skillColor = {
      Fletching: '#5a9a30', Smithing: '#8a7a40', Cooking: '#9a4a20',
      Crafting: '#7a5a30', Herblore: '#3a8a3a', Runecrafting: '#6a4a9a',
      Construction: '#7a6a40', Farming: '#4a8a4a', Magic: '#5a5aaa',
      Firemaking: '#aa5a20', Mining: '#5a5a7a', Woodcutting: '#5a7a30',
      Fishing: '#3a5a8a',
    }[skill] || '#6a8aee';

    const ingRows = (prod.ingredients || []).map(ing => {
      const isCard = itemSources[ing.item] !== undefined;
      if (!isCard) {
        // Nested non-card ingredient — clickable to its own page
        return `<div class="prod-ingredient" style="cursor:pointer"
          data-nav="${ing.item}" data-nav-type="ingredient"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">
          <div class="drop-indicator" style="color:#555">○</div>
          <span class="prod-ingredient-name" style="color:#777">${ing.item}</span>
          <span class="prod-ingredient-qty">×${ing.quantity}</span>
          <span style="font-size:9px;padding:1px 5px;border-radius:8px;background:#1a1a1a;
            border:1px solid #333;color:#555;margin-left:6px;white-space:nowrap">no card</span>
        </div>`;
      }
      const ingOwned = isOwned(ing.item);
      const cls = ingOwned ? 'owned' : 'locked';
      const sym = ingOwned ? '✓' : '✗';
      return `<div class="prod-ingredient" style="cursor:pointer"
        data-nav="${ing.item}" data-nav-type="item"
        onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="prod-ingredient-name ${cls}">${ing.item}</span>
        <span class="prod-ingredient-qty">×${ing.quantity}</span>
      </div>`;
    }).join('');

    // Implicit tools (Knife, Chisel, moulds, etc. — from wiki + hard-coded fallbacks)
    const implicitTools = getImplicitTools(skill, prod.ingredients || [], prod.tools, prod.facilities);
    const toolRows = implicitTools.map(tool => {
      const toolOwned = isOwned(tool);
      const cls = toolOwned ? 'owned' : 'locked';
      const sym = toolOwned ? '✓' : '✗';
      const isToolCard = itemSources[tool] !== undefined;
      if (isToolCard) {
        return `<div class="prod-ingredient" style="cursor:pointer"
          data-nav="${tool}" data-nav-type="item"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">
          <div class="drop-indicator ${cls}">${sym}</div>
          <span class="prod-ingredient-name ${cls}">${tool}</span>
          <span class="prod-ingredient-qty" style="color:#555;font-style:italic">tool</span>
        </div>`;
      }
      return `<div class="prod-ingredient" style="cursor:default">
        <div class="drop-indicator" style="color:#555">○</div>
        <span class="prod-ingredient-name" style="color:#555">${tool}</span>
        <span class="prod-ingredient-qty" style="color:#444;font-style:italic">tool</span>
      </div>`;
    }).join('');

    html += `<div class="section"><div class="section-header">How to obtain</div>
      <div class="production-card">
        <div class="production-skill">${skill}
          <span class="level-req${canCraft?'':' locked'}"
            style="background:${canCraft?'':'#3a1a00'};color:${canCraft?skillColor:'#c84a00'}">
            Level ${level}${canCraft?' ✓':' — need '+(level-playerLevel)+' more lvls'}
          </span>
        </div>
        ${prod.facilities ? `<div class="production-facilities">${facilityNote(prod.facilities) || `<span style="color:#888">Requires: ${prod.facilities}</span>`}</div>` : ''}
        <div class="production-ingredients">${ingRows}${toolRows}</div>
      </div>
    </div>`;

  } else if (shops.length) {
    const shopRows = shops.map(s => {
      const isCard = itemSources[s.currency] !== undefined;
      const curOwned = isCard ? isOwned(s.currency) : null;
      const col = curOwned === true ? '#76c442' : curOwned === false ? '#c84a00' : '#888';
      const sym = curOwned === true ? ' ✓' : curOwned === false ? ' ✗' : '';
      const price = s.price != null ? `${s.price.toLocaleString()}× ` : '';
      const curHtml = isCard
        ? `<span style="cursor:pointer;color:${col}" data-nav="${s.currency}" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${price}${s.currency}${sym}</span>`
        : `<span style="color:#888">${price}${s.currency}</span>`;
      return `<div class="drop-row" style="cursor:default;background:#0d0d0d">
        <div class="drop-indicator" style="color:#6a8aaa">◈</div>
        <span class="drop-name" style="color:#aaa;flex:1">${s.seller}</span>
        <span style="font-size:11px;margin-left:8px">${curHtml}</span>
      </div>`;
    }).join('');
    html += `<div class="section"><div class="section-header">How to obtain</div>${shopRows}</div>`;

  } else if (spawns.length) {
    const spawnRows = spawns.map(loc =>
      `<div class="drop-row" style="cursor:default">
        <div class="drop-indicator" style="color:#5a7a30">◈</div>
        <span class="drop-name" style="color:#aaa">${cleanSpawnText(loc)}</span>
      </div>`
    ).join('');
    html += `<div class="section"><div class="section-header">How to obtain</div>${spawnRows}</div>`;

  } else {
    html += `<div class="section"><div class="section-header">How to obtain</div>
      <div style="color:#555;font-size:12px;padding:8px 0">
        No skilling data found — check the
        <a href="${wikiUrl}" target="_blank" rel="noopener" style="color:#6a8aee">OSRS Wiki</a>
        for details.
      </div>
    </div>`;
  }

  // "Also obtained from" — monster drops / activities from Item sources table
  const itemSrcs = info.itemSources || [];
  if (itemSrcs.length) {
    const srcRows = itemSrcs.map(s => {
      const isMonsterCard = monsterDrops[s.source] !== undefined;
      const isItemCard    = itemSources[s.source] !== undefined;
      const isCard        = isMonsterCard || isItemCard;
      const cardType      = isMonsterCard ? 'monster' : 'item';
      const srcOwned      = isCard ? isOwned(s.source) : null;
      const indCls        = srcOwned === true ? 'owned' : srcOwned === false ? 'locked' : '';
      const sym           = srcOwned === true ? '✓' : srcOwned === false ? '✗' : '◈';
      const frac          = s.fraction;
      const rarLabel      = frac ? fractionToRarity(frac) : (s.wiki_label || '');
      const rarHtml       = rarLabel
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span>${frac ? `<span class="fraction">${frac}</span>` : ''}`
        : '';
      const qtyHtml       = s.quantity
        ? `<span style="font-size:10px;color:#555;margin-left:4px">×${s.quantity}</span>`
        : '';
      const lvlHtml       = s.level
        ? `<span style="font-size:10px;color:#555;margin-left:4px">(${s.level})</span>`
        : '';

      if (isCard) {
        return `<div class="drop-row ${indCls}" style="cursor:pointer"
          data-nav="${s.source}" data-nav-type="${cardType}"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">
          <div class="drop-indicator ${indCls}">${sym}</div>
          <span class="drop-name ${indCls}">${s.source}${lvlHtml}${qtyHtml}</span>
          ${rarHtml}
        </div>`;
      }
      return `<div class="drop-row" style="cursor:default">
        <div class="drop-indicator" style="color:#555">◈</div>
        <span class="drop-name" style="color:#777">${s.source}${lvlHtml}${qtyHtml}</span>
        ${rarHtml}
      </div>`;
    }).join('');
    html += `<div class="section"><div class="section-header">Also obtained from</div>${srcRows}</div>`;
  }

  // "Used to make" — TCG cards that use this as an ingredient
  const usedBy = Object.entries(itemSources).filter(([, data]) => {
    const ings = data.production?.ingredients || [];
    return ings.some(i => i.item === name);
  }).map(([itemName]) => itemName);

  if (usedBy.length) {
    const usedRows = usedBy.map(cardName => {
      const cardOwned = isOwned(cardName);
      const cls = cardOwned ? 'owned' : 'locked';
      const sym = cardOwned ? '✓' : '✗';
      return `<div class="drop-row ${cls}" style="cursor:pointer"
        data-nav="${cardName}" data-nav-type="item"
        onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="drop-name ${cls}">${cardName}</span>
      </div>`;
    }).join('');
    html += `<div class="section"><div class="section-header">Used to make</div>${usedRows}</div>`;
  }

  container.innerHTML = html;
}

function renderProduction(prod) {
  const skill       = prod.skill || '';
  const level       = prod.level || 0;
  const ingredients = prod.ingredients || [];
  const outputQty   = prod.outputQuantity;
  const facilities  = prod.facilities;
  const playerLevel = getLevel(skill);
  const canCraft    = playerLevel >= level;

  const skillColor = {
    Fletching: '#5a9a30', Smithing: '#8a7a40', Cooking: '#9a4a20',
    Crafting: '#7a5a30', Herblore: '#3a8a3a', Runecrafting: '#6a4a9a',
    Construction: '#7a6a40', Farming: '#4a8a4a', Magic: '#5a5aaa',
    Firemaking: '#aa5a20', Mining: '#5a5a7a', Woodcutting: '#5a7a30',
    Fishing: '#3a5a8a',
  }[skill] || '#6a8aee';

  const implicitTools = getImplicitTools(skill, ingredients, prod.tools, prod.facilities);
  // Non-card ingredients are skipped from ownership check (they can't be collected)
  const allIngredientsOwned = ingredients.every(i => !itemSources[i.item] || isOwned(i.item))
                           && implicitTools.every(t => isOwned(t));

  let rows = ingredients.map(ing => {
    const isCard   = itemSources[ing.item] !== undefined;
    const ingOwned = isOwned(ing.item);
    if (!isCard) {
      return renderNonCardIngredient(ing.item, ing.quantity);
    }
    const cls = ingOwned ? 'owned' : 'locked';
    const sym = ingOwned ? '✓' : '✗';
    return `<div class="prod-ingredient" style="cursor:pointer" data-nav="${ing.item}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
      <div class="drop-indicator ${cls}">${sym}</div>
      <span class="prod-ingredient-name ${cls}">${ing.item}</span>
      <span class="prod-ingredient-qty">×${ing.quantity}</span>
    </div>`;
  }).join('');

  // Implicit tools (Hammer for smithing, Needle for leather crafting)
  rows += implicitTools.map(tool => {
    const toolOwned = isOwned(tool);
    const cls = toolOwned ? 'owned' : 'locked';
    const sym = toolOwned ? '✓' : '✗';
    return `<div class="prod-ingredient" style="cursor:pointer" data-nav="${tool}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
      <div class="drop-indicator ${cls}">${sym}</div>
      <span class="prod-ingredient-name ${cls}">${tool}</span>
      <span class="prod-ingredient-qty" style="color:#555;font-style:italic">tool</span>
    </div>`;
  }).join('');

  return `<div class="section">
    <div class="section-header">Production</div>
    <div class="production-card">
      <div class="production-skill">
        ${skill}
        <span class="level-req${canCraft?'':' locked'}" style="background:${canCraft?'':'#3a1a00'};color:${canCraft?skillColor:'#c84a00'}">
          Level ${level}${canCraft?' ✓':' — need '+(level-playerLevel)+' more lvls'}
        </span>
      </div>
      ${facilityNote(facilities) ? `<div class="production-facilities">${facilityNote(facilities)}</div>` : ''}
      <div class="production-ingredients">${rows}</div>
      ${outputQty && outputQty > 1 ? `<div class="prod-output-note">Produces ${outputQty}× per craft</div>` : ''}
      ${allIngredientsOwned ? '' : `<div class="prod-output-note" style="color:#c84a00;margin-top:6px">▲ Some ingredients not yet in collection</div>`}
    </div>
  </div>`;
}

// ─── Clue Scroll view ──────────────────────────────────────────────────────
function renderClueScroll(tier, container) {
  const cfg      = CLUE_TIER_CONFIG[tier] || {label:tier, color:'#888', bg:'#111'};
  const sources  = clueScrollSources[tier] || [];
  const rewards  = clueRewardsByTier[tier]  || [];

  // Split sources: monsters in our catalog vs skilling/other
  const monsterSources  = sources.filter(s => monsterDrops[s.source]);
  const otherSources    = sources.filter(s => !monsterDrops[s.source]);

  const ownedMonSrc  = monsterSources.filter(s => isOwned(s.source)).length;
  const totalRewards = rewards.length;
  const ownedRewards = rewards.filter(n => isOwned(n)).length;

  const tierBadge = `<span style="background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.color}55;border-radius:3px;padding:2px 10px;font-size:11px;font-weight:600;margin-left:8px">${cfg.label}</span>`;

  const clueWikiUrl = `https://oldschool.runescape.wiki/w/Clue_scroll_(${tier})`;
  const clueImgUrl = `https://oldschool.runescape.wiki/images/Clue_scroll_(${tier}).png`;
  const clueImgHtml = `<img src="${clueImgUrl}" style="float:right;max-width:64px;max-height:64px;image-rendering:pixelated;margin-left:8px" onerror="this.style.display='none'">`;
  let html = `<h1>${clueImgHtml}Clue scroll ${tierBadge}<a href="${clueWikiUrl}" target="_blank" rel="noopener" title="View on OSRS Wiki"
    style="color:#555;font-size:11px;text-decoration:none;margin-left:8px;vertical-align:middle"
    onclick="event.stopPropagation()">↗ wiki</a></h1>
    <div class="subtitle" style="color:#666">Virtual card — tracks sources &amp; reward completion</div>
    <div class="stats-bar">
      <div class="stat-block">
        <div class="stat-label">Monster Sources</div>
        <div class="stat-value" style="color:${ownedMonSrc>0?'#e8c97a':'#555'}">${ownedMonSrc}<span class="den"> / ${monsterSources.length}</span></div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Rewards Owned</div>
        <div class="stat-value" style="color:${cfg.color}">${ownedRewards}<span class="den"> / ${totalRewards}</span></div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Other Sources</div>
        <div class="stat-value" style="color:#555">${otherSources.length}</div>
      </div>
    </div>`;

  // ── Step achievability summary ────────────────────────────────────────────
  if (clueSteps && clueSteps.stepCounts) {
    const capTier = tier.charAt(0).toUpperCase() + tier.slice(1);
    const sc = clueSteps.stepCounts;
    const TIER_COLOR = {
      Beginner:'#c8a830', Easy:'#50c050', Medium:'#c8c030',
      Hard:'#4080c0', Elite:'#9050d0', Master:'#d03030',
    };
    const col = TIER_COLOR[capTier] || '#888';
    const spadeOwned = isOwned('Spade');

    // Compute achievable + total per type for this tier
    const rows = [];

    // Helper — ownership bar spark
    function _bar(done, total) {
      if (!total) return '';
      const pct = Math.round(done / total * 100);
      return `<div style="display:inline-block;width:60px;height:4px;background:#222;border-radius:2px;vertical-align:middle;margin-left:6px">
        <div style="width:${pct}%;height:100%;background:${done===total?'#76c442':done>0?col:'#555'};border-radius:2px"></div>
      </div>`;
    }

    function _row(label, done, total, note) {
      if (!total) return;
      rows.push({label, done, total, note: note||''});
    }

    // Quest-locked location patterns for clue step achievability
    const _CLUE_QUEST_LOCKS = [
      { re: /canifis|mort myre|port phasmatys|burgh de rott/i, quest: 'Priest in Peril' },
      { re: /lletya/i,                                          quest: 'Underground Pass' },
      { re: /prifddinas/i,                                      quest: 'Song of the Elves' },
      { re: /\bape atoll\b/i,                                   quest: 'Monkey Madness I' },
      { re: /sophanem|pyramid plunder/i,                        quest: "Icthlarin's Little Helper" },
      { re: /zul-andra/i,                                       quest: 'Regicide' },
      { re: /tyras camp/i,                                      quest: 'Regicide' },
      { re: /neitiznot/i,                                       quest: 'The Fremennik Isles' },
      { re: /lunar isle|astral altar/i,                         quest: 'Lunar Diplomacy' },
      { re: /\bweiss\b/i,                                       quest: 'Making Friends with My Arm' },
      { re: /cam torum/i,                                       quest: "Twilight's Promise" },
    ];
    function _locLocked(loc) {
      // Only gate if we have quest data; empty set → assume all areas accessible
      if (!loc || completedQuests.size === 0) return false;
      return _CLUE_QUEST_LOCKS.some(({re, quest}) => re.test(loc) && !completedQuests.has(quest));
    }

    // Case-insensitive monster card check (NPC names in step data may differ in case)
    const _monsterCardNames = new Set(Object.keys(monsterDrops).map(k => k.toLowerCase()));
    function _npcBlocked(npc) {
      return npc && _monsterCardNames.has(npc.toLowerCase()) && !isOwned(npc);
    }

    // Emote
    const emoteSteps = (clueSteps.emote || {})[capTier] || [];
    if (emoteSteps.length) {
      const achievable = emoteSteps.filter(s =>
        !s.items || s.items.length === 0 || s.items.every(i => isOwned(i))
      ).length;
      _row('Emote', achievable, emoteSteps.length);
    }

    // Cryptic — all steps now fully structured; check each step individually
    const crypticSteps = (clueSteps.cryptic || {})[capTier] || [];
    if (crypticSteps.length) {
      const achievable = crypticSteps.filter(s => {
        if (s.type === 'dig')    return spadeOwned;
        if (_locLocked(s.location)) return false;
        if (s.type === 'talk')   return !_npcBlocked(s.npc);
        return true; // search/inspect — no card required
      }).length;
      _row('Cryptic', achievable, crypticSteps.length);
    }

    // Anagram — fully structured; quest-locked areas and unowned NPC cards block steps
    const anagramSteps = (clueSteps.anagram || {})[capTier] || [];
    if (anagramSteps.length) {
      const achievable = anagramSteps.filter(s =>
        !_locLocked(s.location) && !_npcBlocked(s.npc)
      ).length;
      _row('Anagram', achievable, anagramSteps.length);
    }

    // Cipher — all talk-to NPC steps; check NPC card ownership
    const cipherSteps = (clueSteps.cipher || {})[capTier] || [];
    if (cipherSteps.length) {
      const achievable = cipherSteps.filter(s => !_npcBlocked(s.npc)).length;
      _row('Cipher', achievable, cipherSteps.length);
    }

    // Map — achievable only if Spade owned
    const mapTotal = (sc.map || {})[capTier] || 0;
    if (mapTotal) _row('Map', spadeOwned ? mapTotal : 0, mapTotal);

    // Coordinate — achievable only if Spade owned
    const coordTotal = (sc.coordinate || {})[capTier] || 0;
    if (coordTotal) _row('Coordinate', spadeOwned ? coordTotal : 0, coordTotal);

    // Hot/cold
    const hotcoldTotal = (sc.hotcold || {})[capTier] || 0;
    if (hotcoldTotal) _row('Hot/cold', hotcoldTotal, hotcoldTotal);

    // Scan
    const scanTotal = (sc.scan || {})[capTier] || 0;
    if (scanTotal) _row('Scan', scanTotal, scanTotal);

    // Sherlock
    const sherlockSteps = (clueSteps.sherlock || {})[capTier] || [];
    if (sherlockSteps.length) {
      const achievable = sherlockSteps.filter(t =>
        (t.items || []).every(i => !itemSources[i] || isOwned(i))
      ).length;
      _row('Sherlock', achievable, sherlockSteps.length);
    }

    // Falo
    const faloSteps = capTier === 'Master' ? (clueSteps.falo || []) : [];
    if (faloSteps.length) {
      const achievable = faloSteps.filter(s => s.items.some(i => isOwned(i))).length;
      _row('Falo', achievable, faloSteps.length);
    }

    if (rows.length) {
      const grandTotal     = rows.reduce((s, r) => s + r.total, 0);
      const grandAchievable = rows.reduce((s, r) => s + r.done, 0);
      html += `<div class="section">
        <div class="section-header">Step Achievability
          <span style="float:right;font-size:11px;font-weight:400;color:${grandAchievable===grandTotal?'#76c442':col}">
            ${grandAchievable} / ${grandTotal} steps
          </span>
        </div>`;
      for (const r of rows) {
        const allDone = r.done === r.total;
        const pct = r.total ? Math.round(r.done / r.total * 100) : 0;
        html += `<div style="display:flex;align-items:center;padding:3px 0;font-size:12px">
          <span style="width:80px;color:#888;flex-shrink:0">${r.label}</span>
          <div style="flex:1;height:5px;background:#1a1a1a;border-radius:3px;margin:0 8px">
            <div style="width:${pct}%;height:100%;background:${allDone?'#76c442':r.done>0?col:'#333'};border-radius:3px;transition:width .3s"></div>
          </div>
          <span style="width:52px;text-align:right;color:${allDone?'#76c442':r.done>0?col:'#555'};flex-shrink:0">${r.done}<span style="color:#444"> / ${r.total}</span></span>
          ${r.note ? `<span style="width:80px;text-align:right;font-size:10px;color:#444;flex-shrink:0">${r.note}</span>` : ''}
        </div>`;
      }
      html += `</div>`;
    }
  }

  // Monster sources section
  html += `<div class="section">
    <div class="section-header">Monster Sources ${progressPill(ownedMonSrc, monsterSources.length, false)}</div>`;
  if (monsterSources.length === 0) {
    html += `<div class="empty-note">No monster sources in catalog.</div>`;
  } else {
    const sorted = [...monsterSources]
      .filter(s => isOwned(s.source))
      .sort((a, b) => (a.level||999) - (b.level||999));
    if (sorted.length === 0) {
      html += `<div class="empty-note">No unlocked monster sources yet.</div>`;
    }
    for (const s of sorted) {
      const owned = isOwned(s.source);
      const cls   = owned ? 'owned' : 'locked';
      const sym   = owned ? '✓' : '✗';
      const cmb   = monsterDrops[s.source]?.combatLevel;
      const cmbHtml = cmb ? `<span style="font-size:10px;color:#555;margin-left:4px">Cmb ${cmb}</span>` : '';
      const reqTags = monsterReqTags(monsterDrops[s.source]);
      const rarLabel = fractionToRarity(s.rarity);
      const rarHtml  = s.rarity
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${s.rarity}</span>`
        : '';
      html += `<div class="drop-row ${cls}" style="cursor:pointer" data-nav="${s.source}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="drop-name ${cls}">${s.source}${cmbHtml}${reqTags}</span>
        ${rarHtml}
      </div>`;
    }
  }
  html += `</div>`;

  // Other sources (skilling, implings, etc.)
  if (otherSources.length > 0) {
    html += `<div class="section"><div class="section-header">Other Sources</div>`;
    for (const s of otherSources) {
      const rarLabel = fractionToRarity(s.rarity);
      const rarHtml  = s.rarity
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${s.rarity}</span>`
        : '';
      html += `<div class="drop-row" style="cursor:default;background:#0d0d0d">
        <div class="drop-indicator" style="color:#555">◈</div>
        <span class="drop-name" style="color:#888">${s.source}${s.level ? ` (lv ${s.level})` : ''}</span>
        ${rarHtml}
      </div>`;
    }
    html += `</div>`;
  }

  // Rewards section
  const tierRarities = clueRewardRarities[tier] || {};
  html += `<div class="section">
    <div class="section-header">Possible Rewards ${progressPill(ownedRewards, totalRewards, false)}</div>`;
  if (rewards.length === 0) {
    html += `<div class="empty-note">No reward data loaded.</div>`;
  } else {
    // Sort: owned first, then by rarity rate (rarest last within each group)
    const sortedR = [...rewards].sort((a, b) => {
      const ao = isOwned(a), bo = isOwned(b);
      if (ao !== bo) return ao ? -1 : 1;
      return a.localeCompare(b);
    });
    for (const name of sortedR) {
      const owned   = isOwned(name);
      const cls     = owned ? 'owned' : 'locked';
      const sym     = owned ? '✓' : '✗';
      const frac    = tierRarities[name] || '';
      const rarLabel = frac ? fractionToRarity(frac) : '';
      const rarHtml  = frac
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${frac}</span>`
        : '';
      html += `<div class="drop-row ${cls}" style="cursor:pointer" data-nav="${name}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="drop-name ${cls}">${name}</span>
        ${rarHtml}
      </div>`;
    }
  }
  html += `</div>`;

  // ── Clue-specific step sections ────────────────────────────────────────────
  if (clueSteps) {
    const capTier = tier.charAt(0).toUpperCase() + tier.slice(1);

    // Emote clue steps for this tier
    const emoteSteps = (clueSteps.emote || {})[capTier] || [];
    const hasDoubleAgent = ['Hard','Elite','Master'].includes(capTier);
    if (emoteSteps.length > 0) {
      const stepsWithItems = emoteSteps.filter(s => s.items && s.items.length > 0);
      const allOwned = stepsWithItems.filter(s => s.items.every(i => isOwned(i))).length;
      const daOwned  = hasDoubleAgent && isOwned('Double agent');
      html += `<div class="section">
        <div class="section-header">Emote Clue Steps ${progressPill(allOwned, stepsWithItems.length, false)}</div>
        ${hasDoubleAgent ? `<div style="margin:0 0 6px;padding:6px 8px;background:#1c0a0a;border-radius:4px;border-left:3px solid #c84a00;font-size:11px">
          <span style="color:${daOwned?'#76c442':'#c84a00'};font-weight:600">${daOwned?'✓':'✗'} Double agent</span>
          <span style="color:#555;margin-left:6px">must be defeated before collecting reward</span>
          <span style="cursor:pointer;color:#4a6aaa;margin-left:8px;font-size:10px"
            data-nav="Double agent" data-nav-type="monster"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">→ card</span>
        </div>` : ''}
        <div style="font-size:10px;color:#555;padding:0 0 6px">Steps requiring items · ${stepsWithItems.length} of ${emoteSteps.length} total</div>`;
      for (const step of emoteSteps) {
        const items = step.items || [];
        const hasItems = items.length > 0;
        const allItemsOwned = hasItems && items.every(i => isOwned(i));
        const anyOwned = items.some(i => isOwned(i));
        const borderCol = allItemsOwned ? '#76c442' : anyOwned ? '#c8a830' : (hasItems ? '#c84a00' : '#333');
        html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${borderCol}">
          <div style="font-size:12px;color:#bbb;margin-bottom:${hasItems?'6px':'0'}">${escHtml(step.clueText)}</div>`;
        if (hasItems) {
          html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">`;
          for (const it of items) {
            const own = isOwned(it);
            const bg  = own ? '#0d1c09' : '#1c0d09';
            const col = own ? '#76c442' : '#c84a00';
            const sym = own ? '✓' : '✗';
            html += `<span style="font-size:11px;background:${bg};color:${col};border-radius:3px;padding:2px 7px;cursor:pointer"
              data-nav="${escHtml(it)}" data-nav-type="item"
              onclick="showCard(this.dataset.nav,this.dataset.navType)">${sym} ${escHtml(it)}</span>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }

    // Sherlock tasks for Elite / Master
    const sherlockTier = capTier === 'Elite' ? 'Elite' : capTier === 'Master' ? 'Master' : null;
    if (sherlockTier) {
      const sherlockTasks = (clueSteps.sherlock || {})[sherlockTier] || [];
      const tasksWithItems = sherlockTasks.filter(t => t.items && t.items.length > 0);
      if (sherlockTasks.length > 0) {
        html += `<div class="section">
          <div class="section-header">Sherlock Tasks</div>
          <div style="font-size:10px;color:#555;padding:0 0 6px">${sherlockTasks.length} tasks · items required where known</div>`;
        for (const task of sherlockTasks) {
          const items = task.items || [];
          const hasItems = items.length > 0;
          const allItemsOwned = hasItems && items.every(i => isOwned(i));
          const borderCol = allItemsOwned ? '#76c442' : (hasItems ? '#9050d0' : '#333');
          html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${borderCol}">
            <div style="font-size:12px;color:#bbb;margin-bottom:${hasItems?'6px':'0'}">${escHtml(task.task)}</div>`;
          if (hasItems) {
            html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px">`;
            for (const it of items) {
              const own = isOwned(it);
              // Only items that are cards show owned state; others shown neutral
              const isCard = !!itemSources[it];
              const bg  = isCard ? (own ? '#0d1c09' : '#1c0d09') : '#111';
              const col = isCard ? (own ? '#76c442' : '#c84a00') : '#888';
              const sym = isCard ? (own ? '✓ ' : '✗ ') : '';
              html += `<span style="font-size:11px;background:${bg};color:${col};border-radius:3px;padding:2px 7px;cursor:${isCard?'pointer':'default'}"
                ${isCard ? `data-nav="${escHtml(it)}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)"` : ''}>${sym}${escHtml(it)}</span>`;
            }
            html += `</div>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }
    }

    // Falo the Bard for Master tier
    if (capTier === 'Master') {
      const faloSteps = clueSteps.falo || [];
      if (faloSteps.length > 0) {
        html += `<div class="section">
          <div class="section-header">Falo the Bard</div>
          <div style="font-size:10px;color:#555;padding:0 0 6px">Equip any one valid item per step</div>`;
        for (const step of faloSteps) {
          const items = step.items || [];
          const anyOwned = items.some(i => isOwned(i));
          const borderCol = anyOwned ? '#76c442' : '#d03030';
          html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${borderCol}">
            <div style="font-size:12px;color:#888;font-style:italic;margin-bottom:6px">"${escHtml(step.lyric)}"</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">`;
          for (const it of items) {
            const own = isOwned(it);
            const bg  = own ? '#0d1c09' : '#1c0d09';
            const col = own ? '#76c442' : '#c84a00';
            const sym = own ? '✓' : '✗';
            html += `<span style="font-size:11px;background:${bg};color:${col};border-radius:3px;padding:2px 7px;cursor:pointer"
              data-nav="${escHtml(it)}" data-nav-type="item"
              onclick="showCard(this.dataset.nav,this.dataset.navType)">${sym} ${escHtml(it)}</span>`;
          }
          html += `</div></div>`;
        }
        html += `</div>`;
      }
    }

    // Cryptic talk-to NPC steps for this tier
    const crypticSteps = (clueSteps.cryptic || {})[capTier] || [];
    if (crypticSteps.length > 0) {
      html += `<div class="section">
        <div class="section-header">Cryptic Clues — Talk to NPC</div>
        <div style="font-size:10px;color:#555;padding:0 0 6px">${crypticSteps.length} steps · speak to the named NPC</div>`;
      for (const step of crypticSteps) {
        const npcCard = step.npc && monsterDrops[step.npc] !== undefined;
        const npcOwned = npcCard && isOwned(step.npc);
        const borderCol = npcCard ? (npcOwned ? '#76c442' : '#c84a00') : '#333';
        html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${borderCol}">
          <div style="font-size:12px;color:#bbb;margin-bottom:4px">${escHtml(step.clueText)}</div>
          ${step.npc ? `<span style="font-size:11px;padding:2px 7px;border-radius:3px;
            background:${npcCard?(npcOwned?'#0d1c09':'#1c0d09'):'#111'};
            color:${npcCard?(npcOwned?'#76c442':'#c84a00'):'#888'};
            cursor:${npcCard?'pointer':'default'}"
            ${npcCard ? `data-nav="${escHtml(step.npc)}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)"` : ''}
            >${npcCard?(npcOwned?'✓ ':'✗ '):''}${escHtml(step.npc)}</span>` : ''}
          ${step.charlieItems ? `<div style="margin-top:6px"><span style="font-size:10px;color:#555">Brings one of: </span>${step.charlieItems.map(it => {
            const own = isOwned(it);
            return `<span style="font-size:11px;background:${own?'#0d1c09':'#1c0d09'};color:${own?'#76c442':'#c84a00'};border-radius:3px;padding:2px 6px;margin-left:4px;cursor:pointer"
              data-nav="${escHtml(it)}" data-nav-type="item"
              onclick="showCard(this.dataset.nav,this.dataset.navType)">${own?'✓':'✗'} ${escHtml(it)}</span>`;
          }).join('')}</div>` : ''}
        </div>`;
      }
      html += `</div>`;
    }

    // Anagram clue steps for this tier
    const anagramSteps = (clueSteps.anagram || {})[capTier] || [];
    if (anagramSteps.length > 0) {
      const ownedAnagrams = anagramSteps.filter(s => s.npc && isOwned(s.npc)).length;
      const cardAnagrams  = anagramSteps.filter(s => s.npc && monsterDrops[s.npc] !== undefined).length;
      html += `<div class="section">
        <div class="section-header">Anagram Clues ${cardAnagrams > 0 ? progressPill(ownedAnagrams, cardAnagrams, false) : ''}</div>
        <div style="font-size:10px;color:#555;padding:0 0 6px">${anagramSteps.length} anagrams · solve and talk to the NPC</div>`;
      for (const step of anagramSteps) {
        const npcCard  = step.npc && monsterDrops[step.npc] !== undefined;
        const npcOwned = npcCard && isOwned(step.npc);
        const borderCol = npcCard ? (npcOwned ? '#76c442' : '#c84a00') : '#333';
        html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${borderCol}">
          <div style="font-size:11px;color:#888;font-family:monospace;letter-spacing:2px;margin-bottom:4px">${escHtml(step.anagram)}</div>
          ${step.npc ? `<span style="font-size:11px;padding:2px 7px;border-radius:3px;
            background:${npcCard?(npcOwned?'#0d1c09':'#1c0d09'):'#111'};
            color:${npcCard?(npcOwned?'#76c442':'#c84a00'):'#888'};
            cursor:${npcCard?'pointer':'default'}"
            ${npcCard ? `data-nav="${escHtml(step.npc)}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)"` : ''}
            >${npcCard?(npcOwned?'✓ ':'✗ '):''}${escHtml(step.npc)}</span>` : ''}
          ${step.challenge ? `<span style="font-size:10px;color:#555;margin-left:8px">answer: ${escHtml(step.challenge)}</span>` : ''}
        </div>`;
      }
      html += `</div>`;
    }

    // Cipher clues (Easy / Medium / Hard)
    const cipherSteps = (clueSteps.cipher || {})[capTier] || [];
    if (cipherSteps.length > 0) {
      const ownedCiphers = cipherSteps.filter(s => s.npc && isOwned(s.npc)).length;
      const cardCiphers  = cipherSteps.filter(s => s.npc && monsterDrops[s.npc] !== undefined).length;
      html += `<div class="section">
        <div class="section-header">Cipher Clues ${cardCiphers > 0 ? progressPill(ownedCiphers, cardCiphers, false) : ''}</div>
        <div style="font-size:10px;color:#555;padding:0 0 6px">${cipherSteps.length} ciphers · decode and talk to the NPC</div>`;
      for (const step of cipherSteps) {
        const npcCard  = step.npc && monsterDrops[step.npc] !== undefined;
        const npcOwned = npcCard && isOwned(step.npc);
        const borderCol = npcCard ? (npcOwned ? '#76c442' : '#c84a00') : '#333';
        html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${borderCol}">
          <div style="font-size:11px;color:#888;font-family:monospace;letter-spacing:2px;margin-bottom:4px">${escHtml(step.cipher)}</div>
          ${step.npc ? `<span style="font-size:11px;padding:2px 7px;border-radius:3px;
            background:${npcCard?(npcOwned?'#0d1c09':'#1c0d09'):'#111'};
            color:${npcCard?(npcOwned?'#76c442':'#c84a00'):'#888'};
            cursor:${npcCard?'pointer':'default'}"
            ${npcCard ? `data-nav="${escHtml(step.npc)}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)"` : ''}
            >${npcCard?(npcOwned?'✓ ':'✗ '):''}${escHtml(step.npc)}</span>` : ''}
          ${step.challenge ? `<span style="font-size:10px;color:#555;margin-left:8px">answer: ${escHtml(step.challenge)}</span>` : ''}
        </div>`;
      }
      html += `</div>`;
    }

    // Map clues — Spade required for Beginner through Elite
    const MAP_TIERS = ['Beginner','Easy','Medium','Hard','Elite'];
    if (MAP_TIERS.includes(capTier)) {
      const spadeOwned = isOwned('Spade');
      html += `<div class="section">
        <div class="section-header">Map Clues</div>
        <div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${spadeOwned?'#76c442':'#c84a00'}">
          <div style="font-size:11px;color:#666;margin-bottom:4px">Dig at the marked location</div>
          <span style="font-size:11px;padding:2px 7px;border-radius:3px;
            background:${spadeOwned?'#0d1c09':'#1c0d09'};color:${spadeOwned?'#76c442':'#c84a00'};cursor:pointer"
            data-nav="Spade" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${spadeOwned?'✓':'✗'} Spade</span>
        </div>
      </div>`;
    }

    // Coordinate clues — Spade + combat NPCs (Hard: Sara/Zamo, Elite: Armadylean/Bandosian, Master: Ancient Wizards/Brassican)
    const COORD_TIERS = ['Medium','Hard','Elite','Master'];
    if (COORD_TIERS.includes(capTier)) {
      const spadeOwned = isOwned('Spade');

      // Per-tier combat NPC config
      const COORD_COMBAT = {
        Hard:   [{npc:'Saradomin wizard', label:'outside Wilderness'},
                 {npc:'Zamorak wizard',   label:'inside Wilderness'}],
        Elite:  [{npc:'Armadylean guard', label:'one of two possible'},
                 {npc:'Bandosian guard',  label:'one of two possible'}],
        Master: [{npc:'Ancient Wizard',   label:'multi-combat area (×3)'},
                 {npc:'Brassican Mage',   label:'single-combat area'}],
      };
      const combatNpcs = COORD_COMBAT[capTier] || [];

      function _npcBadge(npc, label) {
        const hasCard = monsterDrops[npc] !== undefined;
        const owned   = hasCard && isOwned(npc);
        return `<div style="display:flex;align-items:center;gap:6px;margin-top:4px">
          <span style="font-size:11px;padding:2px 7px;border-radius:3px;
            background:${hasCard?(owned?'#0d1c09':'#1c0d09'):'#111'};
            color:${hasCard?(owned?'#76c442':'#c84a00'):'#888'};
            cursor:${hasCard?'pointer':'default'}"
            ${hasCard ? `data-nav="${escHtml(npc)}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)"` : ''}
            >${hasCard?(owned?'✓ ':'✗ '):''}${escHtml(npc)}</span>
          <span style="font-size:10px;color:#444">${label}</span>
        </div>`;
      }

      html += `<div class="section">
        <div class="section-header">Coordinate Clues</div>
        <div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${spadeOwned?'#76c442':'#c84a00'}">
          <div style="font-size:11px;color:#666;margin-bottom:4px">Dig at the given coordinates</div>
          <span style="font-size:11px;padding:2px 7px;border-radius:3px;
            background:${spadeOwned?'#0d1c09':'#1c0d09'};color:${spadeOwned?'#76c442':'#c84a00'};cursor:pointer"
            data-nav="Spade" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${spadeOwned?'✓':'✗'} Spade</span>
          ${combatNpcs.length ? `<div style="font-size:10px;color:#555;margin-top:8px">${capTier} coords spawn a combat NPC at the dig spot:</div>
            ${combatNpcs.map(c => _npcBadge(c.npc, c.label)).join('')}` : ''}
        </div>
      </div>`;
    }
  }

  container.innerHTML = html;
}

// ─── Item view ─────────────────────────────────────────────────────────────
function renderItem(name, container) {
  const data        = itemSources[name] || {};
  const monsters    = data.monsters    || [];
  const rdtMonsters = data.rdtMonsters || [];
  const quests      = data.quests      || [];
  const gathering   = data.gathering;
  const production  = data.production  || null;
  const spawns      = data.spawns      || [];
  const shops       = data.shops       || [];
  const clueTiers   = data.clueTiers   || [];

  // For items: "owned" means the player has THIS item card
  const itemOwned = isOwned(name);

  const healHp = foodData[name];
  const itemCats = CURRENCY_NAMES.has(name) ? ['Currency']
    : healHp ? ['Food']
    : (cardCategories[name] || []);
  const catBadges = itemCats.map(c => {
    if (c === 'Food') return `<span style="font-size:9px;background:#0d1c09;color:#5a9a30;border-radius:2px;padding:1px 5px;margin-left:4px">Food · heals ${healHp} HP</span>`;
    if (c === 'Currency') return `<span style="font-size:9px;background:#1e1600;color:#a07830;border-radius:2px;padding:1px 5px;margin-left:4px">Currency</span>`;
    return `<span style="font-size:9px;background:#0d1e2e;color:#4a6a8a;border-radius:2px;padding:1px 5px;margin-left:4px">${c}</span>`;
  }).join('');
  const detail  = cardDetails[name] || {};
  const imgHtml = detail.imageUrl
    ? `<img src="${detail.imageUrl}" style="float:right;max-width:64px;max-height:64px;image-rendering:pixelated;margin-left:8px" onerror="this.style.display='none'">`
    : '';
  const examHtml = detail.examine
    ? `<div style="font-size:11px;color:#888;font-style:italic;margin-top:3px">${detail.examine}</div>`
    : '';

  let html = `<h1>${name}${imgHtml}${wikiLink(name)}</h1>
    <div class="subtitle">Item card${tierBadgeHtml(name)}${catBadges} · <span style="color:${itemOwned?'#00c853':'#7a5020'}">${itemOwned?'✓ Owned':'✗ Not owned'}</span>
      <span style="color:#555;font-size:10px;margin-left:8px;cursor:pointer" data-nav="${name}" onclick="toggleOwned(this.dataset.nav)">(toggle)</span>
      ${examHtml}
    </div>`;

  const allMonsterSources = dedupeMonsters(monsters);
  const monstersOwnedStat = allMonsterSources.filter(m => isOwned(m.card)).length;
  const monsterColor = monsters.length === 0 ? '#555'
    : monstersOwnedStat === allMonsterSources.length ? '#00c853' : '#e8c97a';

  html += `<div class="stats-bar">
    <div class="stat-block">
      <div class="stat-label">Monster Sources</div>
      <div class="stat-value" style="color:${monsterColor}">${monstersOwnedStat}<span class="den"> / ${allMonsterSources.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Quests</div>
      <div class="stat-value">${quests.length}<span class="den"> quests</span></div>
    </div>
    ${gathering ? (() => {
      const canG = getLevel(gathering.skill) >= gathering.level;
      const hasTool = !TOOL_TIERS[gathering.tool] || (() => {
        for (const t of TOOL_TIERS[gathering.tool]) if (isOwned(t.name) && getLevel(gathering.skill) >= t.skillReq) return true;
        return false;
      })();
      const gColor = (canG && hasTool) ? '#76c442' : '#c84a00';
      return `<div class="stat-block">
        <div class="stat-label">Gathering</div>
        <div class="stat-value" style="color:${gColor};font-size:13px">${gathering.skill} ${gathering.level}</div>
      </div>`;
    })() : (production ? (() => {
      const canP = getLevel(production.skill) >= production.level;
      const implP = getImplicitTools(production.skill, production.ingredients, production.tools, production.facilities);
      const allOwned = (production.ingredients || []).every(i => !itemSources[i.item] || isOwned(i.item))
                    && implP.every(t => isOwned(t));
      const pColor = (canP && allOwned) ? '#6a8aee' : '#c84a00';
      return `<div class="stat-block">
        <div class="stat-label">Craftable</div>
        <div class="stat-value" style="color:${pColor};font-size:13px">${production.skill} ${production.level}</div>
      </div>`;
    })() : '')}
    ${spawns.length ? `<div class="stat-block">
      <div class="stat-label">Ground Spawns</div>
      <div class="stat-value" style="font-size:13px">${spawns.length}</div>
    </div>` : ''}
    ${shops.length ? `<div class="stat-block">
      <div class="stat-label">Shops</div>
      <div class="stat-value" style="font-size:13px;color:#8ab4d4">${shops.length}</div>
    </div>` : ''}
    ${clueSteps?.itemIndex?.[name]?.length ? `<div class="stat-block">
      <div class="stat-label">Clue Steps</div>
      <div class="stat-value" style="font-size:13px;color:#c8a830">${clueSteps.itemIndex[name].length}</div>
    </div>` : ''}
  </div>`;

  html += packAcquisitionHtml(name);

  // Gathering
  if (gathering) {
    const playerLevel = getLevel(gathering.skill);
    const canGather   = playerLevel >= gathering.level;
    const tiers     = TOOL_TIERS[gathering.tool];
    const skillLvl  = getLevel(gathering.skill);  // e.g. Mining or Woodcutting level
    // bestTier = highest tier where player OWNS the card AND meets the skill level req
    let bestTier = null;
    if (tiers) {
      for (const t of tiers)
        if (isOwned(t.name) && skillLvl >= t.skillReq) bestTier = t;
    }

    // Tool ownership — tiered tools (Pickaxe/Axe) use bestTier; others resolve per-part
    const toolParts     = !tiers ? resolveToolParts(gathering.tool) : [];
    const allToolsOwned = tiers ? !!bestTier : toolParts.every(p => p.owned);

    const tieredToolNote = !tiers ? '' : bestTier
      ? ` — best owned: <strong style="color:#e8c97a">${bestTier.name}</strong>`
      : ` — <span style="color:#c84a00">no ${gathering.tool.toLowerCase()} in collection</span>`;

    // Build the tool display HTML
    let toolHtml;
    if (tiers) {
      toolHtml = `<strong>${gathering.tool}</strong>${tieredToolNote}`;
    } else if (toolParts.length === 0) {
      toolHtml = `<strong>${gathering.tool}</strong>`;   // "None"
    } else {
      toolHtml = toolParts.map((p, i) => {
        const col      = p.owned ? '#76c442' : '#c84a00';
        const sym      = p.owned ? '✓' : '✗';
        const noteHtml = p.note ? ` <span style="color:#888;font-size:10px">(${p.note})</span>` : '';
        const sep      = i > 0 ? ' <span style="color:#555"> + </span>' : '';
        const isCard   = itemSources[p.label] !== undefined;
        const inner    = `<strong style="color:${col}">${p.label} ${sym}</strong>${noteHtml}`;
        return sep + (isCard
          ? `<span style="cursor:pointer" data-nav="${p.label}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">${inner}</span>`
          : inner);
      }).join('');
    }

    const canActuallyGather = canGather && allToolsOwned;
    html += `<div class="section">
      <div class="section-header">Gathering</div>
      <div class="gathering-card">
        <div class="gathering-skill" style="color:${canActuallyGather?'#76c442':'#c84a00'}">
          ${gathering.skill}
          <span class="level-req${canGather?'':' locked'}">
            Level ${gathering.level}${canGather?' ✓':' — need '+(gathering.level-playerLevel)+' more lvls'}
          </span>
        </div>
        <div class="gathering-detail">${gathering.method}</div>
        <div class="gathering-tool">Tool: ${toolHtml}</div>
        ${tiers ? renderToolTiers(tiers, gathering.skill) : ''}
      </div>
    </div>`;
  }

  // Production (crafting/cooking/smithing/fletching/etc.)
  if (production) {
    html += renderProduction(production);
  }

  // Ground spawns
  if (spawns.length) {
    html += `<div class="section">
      <div class="section-header">Ground Spawns <span style="font-size:10px;color:#666;font-weight:normal;text-transform:none;letter-spacing:0">${spawns.length} location${spawns.length!==1?'s':''}</span></div>
      ${spawns.map(s => `<div class="spawn-row">📍 ${cleanSpawnText(s)}</div>`).join('')}
    </div>`;
  }

  // Clue scroll reward tiers
  if (clueTiers.length > 0) {
    const TIER_STYLE = {
      beginner: {bg:'#2a2010',color:'#c8a830',label:'Beginner'},
      easy:     {bg:'#102010',color:'#50c050',label:'Easy'},
      medium:   {bg:'#202010',color:'#c8c030',label:'Medium'},
      hard:     {bg:'#101828',color:'#4080c0',label:'Hard'},
      elite:    {bg:'#1e1028',color:'#9050d0',label:'Elite'},
      master:   {bg:'#280a0a',color:'#d03030',label:'Master'},
    };
    html += `<div class="section">
      <div class="section-header">Clue Scroll Reward</div>`;
    for (const tier of clueTiers) {
      const s    = TIER_STYLE[tier] || {bg:'#1a1a1a',color:'#888',label:tier};
      const frac = (clueRewardRarities[tier] || {})[name] || '';
      const rarLabel = frac ? fractionToRarity(frac) : '';
      html += `<div class="drop-row" style="cursor:pointer" onclick="showCard('Clue scroll (${tier})','clue')">
        <div class="drop-indicator" style="color:${s.color}">◈</div>
        <span class="drop-name" style="color:${s.color}">${s.label}</span>
        ${frac ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${frac}</span>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  // Shops & Rewards section
  if (shops.length > 0) {
    html += `<div class="section">
      <div class="section-header">Shops &amp; Rewards</div>`;
    for (const shop of shops) {
      const isCard    = itemSources[shop.currency] !== undefined;
      const curOwned  = isCard ? isOwned(shop.currency) : null;
      const curCol    = curOwned === true ? '#76c442' : curOwned === false ? '#c84a00' : '#888';
      const curSym    = curOwned === true ? ' ✓' : curOwned === false ? ' ✗' : '';
      const priceStr  = shop.price != null ? `${shop.price.toLocaleString()}× ` : '';
      const curHtml   = isCard
        ? `<span style="cursor:pointer;color:${curCol}" data-nav="${shop.currency}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">${priceStr}${shop.currency}${curSym}</span>`
        : `<span style="color:#888">${priceStr}${shop.currency}</span>`;
      html += `<div class="drop-row" style="cursor:default;background:#0d0d0d">
        <div class="drop-indicator" style="color:#6a8aaa">◈</div>
        <span class="drop-name" style="color:#aaa;flex:1">${shop.seller}</span>
        <span style="font-size:11px;margin-left:8px;flex-shrink:0">${curHtml}</span>
      </div>`;
    }
    html += `</div>`;
  }

  // Monster drops
  const dedupedMonsters = allMonsterSources;  // already deduped above
  const monstersUnlocked = monstersOwnedStat;
  html += `<div class="section">
    <div class="section-header">
      Dropped By
      ${progressPill(monstersUnlocked, dedupedMonsters.length, false)}
    </div>`;
  if (dedupedMonsters.length === 0) {
    html += `<div class="empty-note">Not found as a monster drop${gathering?' (gathered instead)':''}.</div>`;
  } else {
    const sortedMonsters = [...dedupedMonsters].sort((a, b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return a.card.localeCompare(b.card);
    });
    for (const m of sortedMonsters) {
      const mOwned  = isOwned(m.card);
      const indCls  = mOwned ? 'owned' : 'locked';
      const symbol  = mOwned ? '✓' : '✗';
      const cmb      = monsterDrops[m.card]?.combatLevel;
      const cmbHtml  = cmb ? `<span style="font-size:10px;color:#555;margin-left:4px">Cmb ${cmb}</span>` : '';
      const reqTags  = monsterReqTags(monsterDrops[m.card]);
      html += `<div class="drop-row ${mOwned?'owned':'locked'}" style="cursor:pointer" data-nav="${m.card}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${indCls}">${symbol}</div>
        <span class="drop-name ${indCls}">${m.card}${cmbHtml}${reqTags}</span>
        <span class="rarity-badge ${rarityClass(m.rarity)}">${m.rarity}</span>
        <span class="fraction">${m.fraction||'—'}</span>
      </div>`;
    }
  }
  html += `</div>`;

  // RDT monsters
  if (rdtMonsters.length > 0) {
    html += `<div class="section">
      <div class="section-header">Also on Rare Drop Table <span class="rdt-header-note">${rdtMonsters.length} monsters</span></div>
      <div class="rdt-banner">This item appears on the shared Rare &amp; Gem Drop Table. Many monsters can drop it via the RDT — these are not monster-specific sources.</div>`;
    for (const m of rdtMonsters.slice(0, 6))
      html += dropRowHtml(m.card, m.rarity, m.fraction, true);
    if (rdtMonsters.length > 6)
      html += `<div class="empty-note" style="padding:6px 0">…and ${rdtMonsters.length-6} more</div>`;
    html += `</div>`;
  }

  // Quests
  html += `<div class="section"><div class="section-header">Quests</div>`;
  if (quests.length === 0) {
    html += `<div class="empty-note">No quest association.</div>`;
  } else {
    for (const q of quests) {
      html += `<div class="quest-row"><span class="quest-name">${q}</span></div>`;
    }
  }
  html += `</div>`;

  // ── Required for quests (from BM quest card data) ─────────────────────────
  html += requiredForQuestsHtml(name);

  // ── Clue step usage ────────────────────────────────────────────────────────
  html += clueStepUsageHtml(name);

  container.innerHTML = html;
}

// ─── Clue step usage section (item detail view) ───────────────────────────
// Returns HTML showing every emote/Sherlock/Falo step that requires this item.
function clueStepUsageHtml(itemName) {
  if (!clueSteps || !clueSteps.itemIndex) return '';
  const steps = clueSteps.itemIndex[itemName];
  if (!steps || steps.length === 0) return '';

  const TIER_COLOR = {
    Beginner:'#c8a830', Easy:'#50c050', Medium:'#c8c030',
    Hard:'#4080c0', Elite:'#9050d0', Master:'#d03030',
  };

  let html = `<div class="section"><div class="section-header">Clue Step Requirements</div>`;

  for (const step of steps) {
    const otherItems = (step.items || []).filter(i => i !== itemName);

    if (step.type === 'emote') {
      const col = TIER_COLOR[step.tier] || '#888';
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">
          Emote Clue · ${step.tier}
        </div>
        <div style="font-size:12px;color:#bbb;margin-bottom:${otherItems.length?'6px':'0'}">${escHtml(step.clueText)}</div>`;
      if (otherItems.length) {
        html += `<div style="font-size:11px;color:#666;margin-top:4px">Also need:</div>`;
        for (const it of otherItems) {
          const own = isOwned(it);
          const cls = own ? '#76c442' : '#c84a00';
          const sym = own ? '✓' : '✗';
          html += `<div style="font-size:11px;padding:2px 0;cursor:pointer;color:${cls}"
            data-nav="${escHtml(it)}" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${sym} ${escHtml(it)}</div>`;
        }
      }
      html += `</div>`;

    } else if (step.type === 'sherlock') {
      const col = step.tier === 'Master' ? '#d03030' : '#9050d0';
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">
          Sherlock · ${step.tier}
        </div>
        <div style="font-size:12px;color:#bbb;margin-bottom:${otherItems.length?'6px':'0'}">${escHtml(step.task)}</div>`;
      if (otherItems.length) {
        html += `<div style="font-size:11px;color:#666;margin-top:4px">Also accepted:</div>`;
        for (const it of otherItems) {
          const own = isOwned(it);
          const cls = own ? '#76c442' : '#aaa';
          html += `<div style="font-size:11px;padding:2px 0;cursor:pointer;color:${cls}"
            data-nav="${escHtml(it)}" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${escHtml(it)}</div>`;
        }
      }
      html += `</div>`;

    } else if (step.type === 'falo') {
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid #d03030">
        <div style="font-size:10px;color:#d03030;font-weight:600;margin-bottom:4px">
          Falo the Bard · Master
        </div>
        <div style="font-size:12px;color:#888;font-style:italic;margin-bottom:${otherItems.length?'6px':'0'}">"${escHtml(step.lyric)}"</div>`;
      if (otherItems.length) {
        html += `<div style="font-size:11px;color:#666;margin-top:4px">Also accepted:</div>`;
        for (const it of otherItems) {
          const own = isOwned(it);
          const cls = own ? '#76c442' : '#aaa';
          html += `<div style="font-size:11px;padding:2px 0;cursor:pointer;color:${cls}"
            data-nav="${escHtml(it)}" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${escHtml(it)}</div>`;
        }
      }
      html += `</div>`;

    } else if (step.type === 'charlie') {
      const otherItems = (step.charlieItems || []).filter(i => i !== itemName);
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid #c8a830">
        <div style="font-size:10px;color:#c8a830;font-weight:600;margin-bottom:4px">
          Charlie the Tramp · Beginner
        </div>
        <div style="font-size:12px;color:#bbb;margin-bottom:${otherItems.length?'6px':'0'}">Bring him this item (one of 4 possible)</div>`;
      if (otherItems.length) {
        html += `<div style="font-size:11px;color:#666;margin-top:4px">Other possible items:</div>`;
        for (const it of otherItems) {
          const own = isOwned(it);
          html += `<div style="font-size:11px;padding:2px 0;cursor:pointer;color:${own?'#76c442':'#aaa'}"
            data-nav="${escHtml(it)}" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${escHtml(it)}</div>`;
        }
      }
      html += `</div>`;

    } else if (step.type === 'cryptic_dig') {
      const col = TIER_COLOR[step.tier] || '#888';
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Cryptic Clue (dig) · ${step.tier}</div>
        <div style="font-size:12px;color:#bbb">${step.count} dig-type step${step.count!==1?'s':''} — required to dig at the clue location</div>
      </div>`;

    } else if (step.type === 'map') {
      const col = TIER_COLOR[step.tier] || '#888';
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Map Clue · ${step.tier}</div>
        <div style="font-size:12px;color:#bbb">Required to dig at the marked location</div>
      </div>`;

    } else if (step.type === 'coordinate') {
      const col = TIER_COLOR[step.tier] || '#888';
      html += `<div style="margin:6px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Coordinate Clue · ${step.tier}</div>
        <div style="font-size:12px;color:#bbb">Required to dig at the given coordinates</div>
      </div>`;
    }
  }

  html += `</div>`;
  return html;
}

// ─── Clue step NPC usage (monster/NPC card detail view) ───────────────────
// Shows clue steps that require talking to / fighting this NPC.
function clueStepNpcHtml(npcName) {
  if (!clueSteps || !clueSteps.npcIndex) return '';
  const steps = clueSteps.npcIndex[npcName];
  if (!steps || steps.length === 0) return '';

  const TIER_COLOR = {
    Beginner:'#c8a830', Easy:'#50c050', Medium:'#c8c030',
    Hard:'#4080c0', Elite:'#9050d0', Master:'#d03030',
  };

  let html = `<div class="section"><div class="section-header">Required for Clue Steps</div>`;

  for (const step of steps) {
    const col = TIER_COLOR[step.tier] || '#888';

    if (step.type === 'emote_combat') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Emote Clue · ${step.tier} · Combat</div>
        <div style="font-size:12px;color:#bbb">${escHtml(step.clueText)}</div>
      </div>`;

    } else if (step.type === 'sherlock') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Sherlock · ${step.tier}</div>
        <div style="font-size:12px;color:#bbb">${escHtml(step.task)}</div>
      </div>`;

    } else if (step.type === 'falo') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid #d03030">
        <div style="font-size:10px;color:#d03030;font-weight:600;margin-bottom:4px">Falo the Bard · Master</div>
        <div style="font-size:12px;color:#888;font-style:italic">"${escHtml(step.lyric)}"</div>
      </div>`;

    } else if (step.type === 'cryptic') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Cryptic Clue · ${step.tier}</div>
        <div style="font-size:12px;color:#bbb;margin-bottom:${step.charlieItems?'6px':'0'}">${escHtml(step.clueText)}</div>
        ${step.charlieItems ? (() => {
          const items = step.charlieItems;
          let s = `<div style="font-size:11px;color:#666;margin-bottom:4px">Brings one of:</div><div style="display:flex;flex-wrap:wrap;gap:4px">`;
          for (const it of items) {
            const own = isOwned(it);
            s += `<span style="font-size:11px;background:${own?'#0d1c09':'#1c0d09'};color:${own?'#76c442':'#c84a00'};border-radius:3px;padding:2px 7px;cursor:pointer"
              data-nav="${escHtml(it)}" data-nav-type="item"
              onclick="showCard(this.dataset.nav,this.dataset.navType)">${own?'✓':'✗'} ${escHtml(it)}</span>`;
          }
          return s + '</div>';
        })() : ''}
      </div>`;

    } else if (step.type === 'anagram') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Anagram Clue · ${step.tier}</div>
        <div style="font-size:12px;color:#888;font-family:monospace;letter-spacing:2px">${escHtml(step.anagram)}</div>
        ${step.challenge ? `<div style="font-size:11px;color:#555;margin-top:4px">Challenge answer: ${escHtml(step.challenge)}</div>` : ''}
      </div>`;

    } else if (step.type === 'cipher') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Cipher Clue · ${step.tier}</div>
        <div style="font-size:12px;color:#888;font-family:monospace;letter-spacing:2px">${escHtml(step.cipher)}</div>
        ${step.challenge ? `<div style="font-size:11px;color:#555;margin-top:4px">Challenge answer: ${escHtml(step.challenge)}</div>` : ''}
      </div>`;

    } else if (step.type === 'coordinate_combat') {
      const sub = step.alt ? ' (alternate)' : step.wilderness ? ' · Wilderness' : '';
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Coordinate Clue · ${step.tier} · Combat${sub}</div>
        <div style="font-size:12px;color:#bbb">Spawns at the dig spot — must be defeated</div>
      </div>`;

    } else if (step.type === 'hotcold_combat') {
      html += `<div style="margin:4px 0;padding:8px;background:#0d0d0d;border-radius:4px;border-left:3px solid ${col}">
        <div style="font-size:10px;color:${col};font-weight:600;margin-bottom:4px">Hot/Cold Clue · ${step.tier} · Combat</div>
        <div style="font-size:12px;color:#bbb">Spawns when digging in single-combat areas</div>
      </div>`;
    }
  }

  html += `</div>`;
  return html;
}

// ─── Tool tier rows HTML ───────────────────────────────────────────────────
// skillName = e.g. "Mining" or "Woodcutting" — used to check level gate
function renderToolTiers(tiers, skillName) {
  const skillLvl = getLevel(skillName);

  // best = highest tier the player OWNS and can USE (skill level ok)
  let bestName = null;
  for (const t of tiers)
    if (isOwned(t.name) && skillLvl >= t.skillReq) bestName = t.name;

  let html = `<div class="tool-tiers">`;
  for (const t of tiers) {
    const hasCard  = isOwned(t.name);
    const levelOk  = skillLvl >= t.skillReq;
    const isBest   = t.name === bestName;

    let cls, label;
    if (isBest) {
      cls = 'best';    label = '✓';
    } else if (hasCard && !levelOk) {
      // Own it but level gate not met — show the level required
      cls = 'locked';  label = `need ${skillName} ${t.skillReq}`;
    } else if (hasCard) {
      // Own it, level ok, just not the best available
      cls = 'available'; label = '✓';
    } else {
      // Don't own the card — show as unavailable, no level details
      cls = '';         label = '—';
    }

    html += `<div class="tool-tier-row ${cls}">
      <div class="tier-dot"></div>
      <span class="tier-name">${t.name}</span>
      <span class="tier-req">${label}</span>
    </div>`;
  }
  return html + `</div>`;
}

// ─── Refresh all — collection + levels + quest sync ───────────────────────
async function refreshAll() {
  if (_refreshInProgress) return;
  _refreshInProgress = true;
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.disabled = true; btn.textContent = '↻ …'; }
  const rsn = document.getElementById('rsn-input')?.value.trim() || '';
  await Promise.allSettled([
    refreshCollection(),
    lookupLevels(rsn),
    syncQuestsFromScreenshots(rsn),
  ]);
  // Refresh the account dropdown with latest data from server
  try {
    const acData = await fetch('/api/accounts/list', { signal: AbortSignal.timeout(8000) }).then(r => r.json());
    if (acData.accounts?.length) {
      // Merge fresh ownedCards from allCollections into the account list
      populateAccountDropdown(acData.accounts);
      // Re-select current account so dropdown stays put
      const sel = document.getElementById('rsn-input');
      if (sel && rsn && [...sel.options].some(o => o.value === rsn)) sel.value = rsn;
    }
  } catch {}
  // Record source mtime so auto-poll knows when next change occurs
  try {
    const sm = await fetch('/api/collection/source-mtime', { signal: AbortSignal.timeout(3000) }).then(r => r.json());
    if (sm.sourceMtime) _lastSourceMtime = sm.sourceMtime;
  } catch {}
  if (btn) { btn.textContent = '↻ Refresh'; btn.disabled = false; }
  _refreshInProgress = false;
}

// ─── Live collection refresh (requires server.py) ──────────────────────────
async function refreshCollection() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '↻ …';
  const rsn = document.getElementById('rsn-input')?.value.trim() || '';
  const url = rsn ? `/api/collection/refresh?player=${encodeURIComponent(rsn)}` : '/api/collection/refresh';
  try {
    const data = await fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    if (data.error) throw new Error(data.error);
    owned = new Set(data.ownedCards.map(n => n.toLowerCase()));
    _canGetCache = {};
    // Also update allCollections so subsequent client-side switches are fresh
    if (rsn && data.ownedCards) {
      const acKey = Object.keys(allCollections).find(k => k.toLowerCase() === rsn.toLowerCase()) || rsn;
      allCollections[acKey] = { cardCount: data.cardCount, ownedCards: data.ownedCards, credits: data.credits || 0 };
    }
    const label = rsn ? `${data.cardCount} cards owned · ${rsn}` : `${data.cardCount} cards owned · refreshed ${new Date().toLocaleTimeString()}`;
    document.getElementById('sim-summary').textContent = label;
    document.getElementById('sim-btn').style.display = 'none';
    filterCards();
    refreshDetail();
    if (activeTab === 'skilling') renderSkillGrid();
    if (activeTab === 'questing') renderQuestList();
    btn.textContent = '↻ Refresh';
    btn.disabled = false;
  } catch (e) {
    console.error('Refresh failed:', e);
    btn.textContent = '✗ Error';
    btn.style.color = '#c84a00';
    setTimeout(() => {
      btn.textContent = '↻ Refresh';
      btn.style.color = '';
      btn.disabled = false;
    }, 3000);
  }
}

// ─── Hiscores level lookup (requires server.py) ────────────────────────────
async function lookupLevels(rsn) {
  const _rsn = rsn || document.getElementById('rsn-input')?.value.trim();
  if (!_rsn) return;

  try {
    const data = await fetch(`/api/hiscores?player=${encodeURIComponent(_rsn)}`).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    if (data.error) throw new Error(data.error);

    // Merge returned levels into skills — only update skills we track
    for (const [skill, lvl] of Object.entries(data.levels)) {
      if (skill in skills) skills[skill] = lvl;
    }
    _canGetCache = {};
    refreshDetail();
    if (activeTab === 'skilling') renderSkillGrid();
    if (activeTab === 'questing') renderQuestList();
  } catch (e) {
    console.error('Level lookup failed:', e);
  }
}

// ─── Quest sync from RuneLite screenshots ──────────────────────────────────
// Tries server API first (/api/quests/completed?player=RSN), falls back to
// the static output/completed_quests.json generated by decode_completed_quests.py.
async function syncQuestsFromScreenshots(rsn) {
  const btn = document.getElementById('quest-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  const _rsn = rsn || (document.getElementById('quest-rsn-input')?.value ||
               document.getElementById('rsn-input')?.value || '').trim();

  let data = null;
  let source = 'file';

  // Try server API if we have an RSN
  if (_rsn) {
    try {
      const resp = await fetch(`/api/quests/completed?player=${encodeURIComponent(_rsn)}`, { signal: AbortSignal.timeout(3000) });
      if (resp.ok) {
        data = await resp.json();
        source = 'server';
      }
    } catch (_) { /* server not running — fall through */ }
  }

  // Fall back to static file — only apply it when the file's player matches the requested RSN
  if (!data) {
    try {
      const resp = await fetch(`output/completed_quests.json?v=${Date.now()}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const fileData = await resp.json();
      const filePlayer = (fileData.player || fileData.rsn || '').toLowerCase();
      // Accept only if: no RSN requested, OR file has a matching player tag.
      // A file with no player tag is ambiguous and must NOT be applied to a specific account.
      if (!_rsn || (filePlayer && filePlayer === _rsn.toLowerCase())) {
        data = fileData;
        source = 'file';
      }
      // else: file belongs to a different account — don't pollute this account's quests
    } catch (_) { /* file not found */ }
  }

  if (!data) {
    if (btn) {
      btn.textContent = 'No file';
      btn.style.color = '#884444';
      btn.title = _rsn
        ? `Server not running and no matching quest file.\nRun: python3 scripts/decode_completed_quests.py --player ${_rsn}`
        : 'Run: python3 scripts/decode_completed_quests.py';
      setTimeout(() => { btn.textContent = '↻ Sync'; btn.style.color = ''; btn.title = ''; btn.disabled = false; }, 3000);
    }
    return;
  }

  const before = _cqFile.size;
  _cqFile = new Set(data.completedQuests || []);
  completedQuests = new Set([..._cqFile, ..._cqManual]);
  _saveCq();
  const delta = _cqFile.size - before;
  renderQuestList();

  if (btn) {
    const label = source === 'server'
      ? (delta ? `+${delta} synced` : '✓ Up to date')
      : (delta ? `+${delta} (file)` : '✓ (file)');
    btn.textContent = label;
    btn.style.color = delta ? '#4a9a4a' : '#666';
    setTimeout(() => { btn.textContent = '↻ Sync'; btn.style.color = ''; btn.disabled = false; }, 2000);
  }
}

// Lazy reverse index: card name → [quest names that require it via bm_quest_cards.json]
let _questCardIndex = null;
function getQuestCardIndex() {
  if (_questCardIndex) return _questCardIndex;
  _questCardIndex = {};
  for (const [questName, q] of Object.entries(bmQuestCards)) {
    for (const section of (q.sections || [])) {
      for (const req of (section.requirements || [])) {
        for (const card of (req.cards || [])) {
          (_questCardIndex[card] = _questCardIndex[card] || []).push(questName);
        }
        for (const child of (req.children || [])) {
          for (const card of (child.cards || [])) {
            (_questCardIndex[card] = _questCardIndex[card] || []).push(questName);
          }
        }
      }
    }
  }
  return _questCardIndex;
}

// Shared HTML for "Required For" quest list section
function requiredForQuestsHtml(cardName) {
  const quests = getQuestCardIndex()[cardName] || [];
  if (quests.length === 0) return '';
  const completable = computeCompletableQuests();
  let html = `<div class="section"><div class="section-header">Required For</div><div style="margin-top:8px">`;
  const sorted = [...new Set(quests)].sort();
  for (const qName of sorted) {
    const done = completedQuests.has(qName);
    const ok   = completable.has(qName);
    const col  = done ? '#7ab07a' : ok ? '#c8a830' : '#9a5a5a';
    const sym  = done ? '☑' : ok ? '✓' : '✗';
    const status = done ? 'done' : ok ? 'available' : 'locked';
    html += `<div class="req-row" style="cursor:pointer"
      onclick="pushHistoryEntry();selectedQuest='${qName.replace(/'/g,"\\'")}';_renderTab('questing',false);showQuestDetail('${qName.replace(/'/g,"\\'")}',false)">
      <span class="req-icon" style="color:${col}">${sym}</span>
      <span class="req-label" style="color:${col}">${qName}</span>
      <span class="req-note">${status}</span>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}
