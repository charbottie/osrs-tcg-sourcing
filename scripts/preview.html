    <span class="prod-ingredient-name" style="color:#777">${itemName}</span>
    <span class="prod-ingredient-qty">×${quantity}</span>
    <span style="font-size:9px;padding:1px 5px;border-radius:8px;background:#1a1a1a;
      border:1px solid #333;color:#555;margin-left:6px;white-space:nowrap">no card</span>
  </div>`;
}

// ─── Ingredient detail page ─────────────────────────────────────────────────
function renderIngredient(name, container) {
  const info = ingredientInfo[name] || {};
  const prod = info.production || null;
  const shops = info.shops || [];
  const spawns = info.spawns || [];
  const wikiUrl = 'https://oldschool.runescape.wiki/w/' + encodeURIComponent(name.replace(/ /g, '_'));

  let html = `<h1>${name}${wikiLink(name)}</h1>
    <div class="subtitle" style="color:#666">
      Intermediary item — not a TCG card
    </div>`;

  // Production
  if (prod) {
    const skill = prod.skill || '';
    const level = prod.level || 0;
    const playerLevel = getLevel(skill);
    const canCraft = playerLevel >= level;
    const skillColor = {
      Fletching: '#5a9a30', Smithing: '#8a7a40', Cooking: '#9a4a20',
      Crafting: '#7a5a30', Herblore: '#3a8a3a', Runecrafting: '#6a4a9a',
      Construction: '#7a6a40', Farming: '#4a8a4a', Magic: '#5a5aaa',
      Firemaking: '#aa5a20', Mining: '#5a5a7a', Woodcutting: '#5a7a30',
      Fishing: '#3a5a8a',
    }[skill] || '#6a8aee';

    const ingRows = (prod.ingredients || []).map(ing => {
      const isCard = itemSources[ing.item] !== undefined;
      if (!isCard) {
        // Nested non-card ingredient — clickable to its own page
        return `<div class="prod-ingredient" style="cursor:pointer"
          data-nav="${ing.item}" data-nav-type="ingredient"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">
          <div class="drop-indicator" style="color:#555">○</div>
          <span class="prod-ingredient-name" style="color:#777">${ing.item}</span>
          <span class="prod-ingredient-qty">×${ing.quantity}</span>
          <span style="font-size:9px;padding:1px 5px;border-radius:8px;background:#1a1a1a;
            border:1px solid #333;color:#555;margin-left:6px;white-space:nowrap">no card</span>
        </div>`;
      }
      const ingOwned = isOwned(ing.item);
      const cls = ingOwned ? 'owned' : 'locked';
      const sym = ingOwned ? '✓' : '✗';
      return `<div class="prod-ingredient" style="cursor:pointer"
        data-nav="${ing.item}" data-nav-type="item"
        onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="prod-ingredient-name ${cls}">${ing.item}</span>
        <span class="prod-ingredient-qty">×${ing.quantity}</span>
      </div>`;
    }).join('');

    // Implicit tools (Knife, Chisel, moulds, etc. — from wiki + hard-coded fallbacks)
    const implicitTools = getImplicitTools(skill, prod.ingredients || [], prod.tools);
    const toolRows = implicitTools.map(tool => {
      const toolOwned = isOwned(tool);
      const cls = toolOwned ? 'owned' : 'locked';
      const sym = toolOwned ? '✓' : '✗';
      const isToolCard = itemSources[tool] !== undefined;
      if (isToolCard) {
        return `<div class="prod-ingredient" style="cursor:pointer"
          data-nav="${tool}" data-nav-type="item"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">
          <div class="drop-indicator ${cls}">${sym}</div>
          <span class="prod-ingredient-name ${cls}">${tool}</span>
          <span class="prod-ingredient-qty" style="color:#555;font-style:italic">tool</span>
        </div>`;
      }
      return `<div class="prod-ingredient" style="cursor:default">
        <div class="drop-indicator" style="color:#555">○</div>
        <span class="prod-ingredient-name" style="color:#555">${tool}</span>
        <span class="prod-ingredient-qty" style="color:#444;font-style:italic">tool</span>
      </div>`;
    }).join('');

    html += `<div class="section"><div class="section-header">How to obtain</div>
      <div class="production-card">
        <div class="production-skill">${skill}
          <span class="level-req${canCraft?'':' locked'}"
            style="background:${canCraft?'':'#3a1a00'};color:${canCraft?skillColor:'#c84a00'}">
            Level ${level}${canCraft?' ✓':' — need '+(level-playerLevel)+' more lvls'}
          </span>
        </div>
        ${prod.facilities ? `<div class="production-facilities">${facilityNote(prod.facilities) || `<span style="color:#888">Requires: ${prod.facilities}</span>`}</div>` : ''}
        <div class="production-ingredients">${ingRows}${toolRows}</div>
      </div>
    </div>`;

  } else if (shops.length) {
    const shopRows = shops.map(s => {
      const isCard = itemSources[s.currency] !== undefined;
      const curOwned = isCard ? isOwned(s.currency) : null;
      const col = curOwned === true ? '#76c442' : curOwned === false ? '#c84a00' : '#888';
      const sym = curOwned === true ? ' ✓' : curOwned === false ? ' ✗' : '';
      const price = s.price != null ? `${s.price.toLocaleString()}× ` : '';
      const curHtml = isCard
        ? `<span style="cursor:pointer;color:${col}" data-nav="${s.currency}" data-nav-type="item"
            onclick="showCard(this.dataset.nav,this.dataset.navType)">${price}${s.currency}${sym}</span>`
        : `<span style="color:#888">${price}${s.currency}</span>`;
      return `<div class="drop-row" style="cursor:default;background:#0d0d0d">
        <div class="drop-indicator" style="color:#6a8aaa">◈</div>
        <span class="drop-name" style="color:#aaa;flex:1">${s.seller}</span>
        <span style="font-size:11px;margin-left:8px">${curHtml}</span>
      </div>`;
    }).join('');
    html += `<div class="section"><div class="section-header">How to obtain</div>${shopRows}</div>`;

  } else if (spawns.length) {
    const spawnRows = spawns.map(loc =>
      `<div class="drop-row" style="cursor:default">
        <div class="drop-indicator" style="color:#5a7a30">◈</div>
        <span class="drop-name" style="color:#aaa">${cleanSpawnText(loc)}</span>
      </div>`
    ).join('');
    html += `<div class="section"><div class="section-header">How to obtain</div>${spawnRows}</div>`;

  } else {
    html += `<div class="section"><div class="section-header">How to obtain</div>
      <div style="color:#555;font-size:12px;padding:8px 0">
        No skilling data found — check the
        <a href="${wikiUrl}" target="_blank" rel="noopener" style="color:#6a8aee">OSRS Wiki</a>
        for details.
      </div>
    </div>`;
  }

  // "Also obtained from" — monster drops / activities from Item sources table
  const itemSrcs = info.itemSources || [];
  if (itemSrcs.length) {
    const srcRows = itemSrcs.map(s => {
      const isMonsterCard = monsterDrops[s.source] !== undefined;
      const isItemCard    = itemSources[s.source] !== undefined;
      const isCard        = isMonsterCard || isItemCard;
      const cardType      = isMonsterCard ? 'monster' : 'item';
      const srcOwned      = isCard ? isOwned(s.source) : null;
      const indCls        = srcOwned === true ? 'owned' : srcOwned === false ? 'locked' : '';
      const sym           = srcOwned === true ? '✓' : srcOwned === false ? '✗' : '◈';
      const frac          = s.fraction;
      const rarLabel      = frac ? fractionToRarity(frac) : (s.wiki_label || '');
      const rarHtml       = rarLabel
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span>${frac ? `<span class="fraction">${frac}</span>` : ''}`
        : '';
      const qtyHtml       = s.quantity
        ? `<span style="font-size:10px;color:#555;margin-left:4px">×${s.quantity}</span>`
        : '';
      const lvlHtml       = s.level
        ? `<span style="font-size:10px;color:#555;margin-left:4px">(${s.level})</span>`
        : '';

      if (isCard) {
        return `<div class="drop-row ${indCls}" style="cursor:pointer"
          data-nav="${s.source}" data-nav-type="${cardType}"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">
          <div class="drop-indicator ${indCls}">${sym}</div>
          <span class="drop-name ${indCls}">${s.source}${lvlHtml}${qtyHtml}</span>
          ${rarHtml}
        </div>`;
      }
      return `<div class="drop-row" style="cursor:default">
        <div class="drop-indicator" style="color:#555">◈</div>
        <span class="drop-name" style="color:#777">${s.source}${lvlHtml}${qtyHtml}</span>
        ${rarHtml}
      </div>`;
    }).join('');
    html += `<div class="section"><div class="section-header">Also obtained from</div>${srcRows}</div>`;
  }

  // "Used to make" — TCG cards that use this as an ingredient
  const usedBy = Object.entries(itemSources).filter(([, data]) => {
    const ings = data.production?.ingredients || [];
    return ings.some(i => i.item === name);
  }).map(([itemName]) => itemName);

  if (usedBy.length) {
    const usedRows = usedBy.map(cardName => {
      const cardOwned = isOwned(cardName);
      const cls = cardOwned ? 'owned' : 'locked';
      const sym = cardOwned ? '✓' : '✗';
      return `<div class="drop-row ${cls}" style="cursor:pointer"
        data-nav="${cardName}" data-nav-type="item"
        onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="drop-name ${cls}">${cardName}</span>
      </div>`;
    }).join('');
    html += `<div class="section"><div class="section-header">Used to make</div>${usedRows}</div>`;
  }

  container.innerHTML = html;
}

function renderProduction(prod) {
  const skill       = prod.skill || '';
  const level       = prod.level || 0;
  const ingredients = prod.ingredients || [];
  const outputQty   = prod.outputQuantity;
  const facilities  = prod.facilities;
  const playerLevel = getLevel(skill);
  const canCraft    = playerLevel >= level;

  const skillColor = {
    Fletching: '#5a9a30', Smithing: '#8a7a40', Cooking: '#9a4a20',
    Crafting: '#7a5a30', Herblore: '#3a8a3a', Runecrafting: '#6a4a9a',
    Construction: '#7a6a40', Farming: '#4a8a4a', Magic: '#5a5aaa',
    Firemaking: '#aa5a20', Mining: '#5a5a7a', Woodcutting: '#5a7a30',
    Fishing: '#3a5a8a',
  }[skill] || '#6a8aee';

  const implicitTools = getImplicitTools(skill, ingredients, prod.tools);
  // Non-card ingredients are skipped from ownership check (they can't be collected)
  const allIngredientsOwned = ingredients.every(i => !itemSources[i.item] || isOwned(i.item))
                           && implicitTools.every(t => isOwned(t));

  let rows = ingredients.map(ing => {
    const isCard   = itemSources[ing.item] !== undefined;
    const ingOwned = isOwned(ing.item);
    if (!isCard) {
      return renderNonCardIngredient(ing.item, ing.quantity);
    }
    const cls = ingOwned ? 'owned' : 'locked';
    const sym = ingOwned ? '✓' : '✗';
    return `<div class="prod-ingredient" style="cursor:pointer" data-nav="${ing.item}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
      <div class="drop-indicator ${cls}">${sym}</div>
      <span class="prod-ingredient-name ${cls}">${ing.item}</span>
      <span class="prod-ingredient-qty">×${ing.quantity}</span>
    </div>`;
  }).join('');

  // Implicit tools (Hammer for smithing, Needle for leather crafting)
  rows += implicitTools.map(tool => {
    const toolOwned = isOwned(tool);
    const cls = toolOwned ? 'owned' : 'locked';
    const sym = toolOwned ? '✓' : '✗';
    return `<div class="prod-ingredient" style="cursor:pointer" data-nav="${tool}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
      <div class="drop-indicator ${cls}">${sym}</div>
      <span class="prod-ingredient-name ${cls}">${tool}</span>
      <span class="prod-ingredient-qty" style="color:#555;font-style:italic">tool</span>
    </div>`;
  }).join('');

  return `<div class="section">
    <div class="section-header">Production</div>
    <div class="production-card">
      <div class="production-skill">
        ${skill}
        <span class="level-req${canCraft?'':' locked'}" style="background:${canCraft?'':'#3a1a00'};color:${canCraft?skillColor:'#c84a00'}">
          Level ${level}${canCraft?' ✓':' — need '+(level-playerLevel)+' more lvls'}
        </span>
      </div>
      ${facilityNote(facilities) ? `<div class="production-facilities">${facilityNote(facilities)}</div>` : ''}
      <div class="production-ingredients">${rows}</div>
      ${outputQty && outputQty > 1 ? `<div class="prod-output-note">Produces ${outputQty}× per craft</div>` : ''}
      ${allIngredientsOwned ? '' : `<div class="prod-output-note" style="color:#c84a00;margin-top:6px">▲ Some ingredients not yet in collection</div>`}
    </div>
  </div>`;
}

// ─── Clue Scroll view ──────────────────────────────────────────────────────
function renderClueScroll(tier, container) {
  const cfg      = CLUE_TIER_CONFIG[tier] || {label:tier, color:'#888', bg:'#111'};
  const sources  = clueScrollSources[tier] || [];
  const rewards  = clueRewardsByTier[tier]  || [];

  // Split sources: monsters in our catalog vs skilling/other
  const monsterSources  = sources.filter(s => monsterDrops[s.source]);
  const otherSources    = sources.filter(s => !monsterDrops[s.source]);

  const ownedMonSrc  = monsterSources.filter(s => isOwned(s.source)).length;
  const totalRewards = rewards.length;
  const ownedRewards = rewards.filter(n => isOwned(n)).length;

  const tierBadge = `<span style="background:${cfg.bg};color:${cfg.color};border:1px solid ${cfg.color}55;border-radius:3px;padding:2px 10px;font-size:11px;font-weight:600;margin-left:8px">${cfg.label}</span>`;

  const clueWikiUrl = `https://oldschool.runescape.wiki/w/Clue_scroll_(${tier})`;
  let html = `<h1>Clue scroll ${tierBadge}<a href="${clueWikiUrl}" target="_blank" rel="noopener" title="View on OSRS Wiki"
    style="color:#555;font-size:11px;text-decoration:none;margin-left:8px;vertical-align:middle"
    onclick="event.stopPropagation()">↗ wiki</a></h1>
    <div class="subtitle" style="color:#666">Virtual card — tracks sources &amp; reward completion</div>
    <div class="stats-bar">
      <div class="stat-block">
        <div class="stat-label">Monster Sources</div>
        <div class="stat-value" style="color:${ownedMonSrc>0?'#e8c97a':'#555'}">${ownedMonSrc}<span class="den"> / ${monsterSources.length}</span></div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Rewards Owned</div>
        <div class="stat-value" style="color:${cfg.color}">${ownedRewards}<span class="den"> / ${totalRewards}</span></div>
      </div>
      <div class="stat-block">
        <div class="stat-label">Other Sources</div>
        <div class="stat-value" style="color:#555">${otherSources.length}</div>
      </div>
    </div>`;

  // Monster sources section
  html += `<div class="section">
    <div class="section-header">Monster Sources ${progressPill(ownedMonSrc, monsterSources.length, false)}</div>`;
  if (monsterSources.length === 0) {
    html += `<div class="empty-note">No monster sources in catalog.</div>`;
  } else {
    const sorted = [...monsterSources]
      .filter(s => isOwned(s.source))
      .sort((a, b) => (a.level||999) - (b.level||999));
    if (sorted.length === 0) {
      html += `<div class="empty-note">No unlocked monster sources yet.</div>`;
    }
    for (const s of sorted) {
      const owned = isOwned(s.source);
      const cls   = owned ? 'owned' : 'locked';
      const sym   = owned ? '✓' : '✗';
      const cmb   = monsterDrops[s.source]?.combatLevel;
      const cmbHtml = cmb ? `<span style="font-size:10px;color:#555;margin-left:4px">Cmb ${cmb}</span>` : '';
      const reqTags = monsterReqTags(monsterDrops[s.source]);
      const rarLabel = fractionToRarity(s.rarity);
      const rarHtml  = s.rarity
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${s.rarity}</span>`
        : '';
      html += `<div class="drop-row ${cls}" style="cursor:pointer" data-nav="${s.source}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="drop-name ${cls}">${s.source}${cmbHtml}${reqTags}</span>
        ${rarHtml}
      </div>`;
    }
  }
  html += `</div>`;

  // Other sources (skilling, implings, etc.)
  if (otherSources.length > 0) {
    html += `<div class="section"><div class="section-header">Other Sources</div>`;
    for (const s of otherSources) {
      const rarLabel = fractionToRarity(s.rarity);
      const rarHtml  = s.rarity
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${s.rarity}</span>`
        : '';
      html += `<div class="drop-row" style="cursor:default;background:#0d0d0d">
        <div class="drop-indicator" style="color:#555">◈</div>
        <span class="drop-name" style="color:#888">${s.source}${s.level ? ` (lv ${s.level})` : ''}</span>
        ${rarHtml}
      </div>`;
    }
    html += `</div>`;
  }

  // Rewards section
  const tierRarities = clueRewardRarities[tier] || {};
  html += `<div class="section">
    <div class="section-header">Possible Rewards ${progressPill(ownedRewards, totalRewards, false)}</div>`;
  if (rewards.length === 0) {
    html += `<div class="empty-note">No reward data loaded.</div>`;
  } else {
    // Sort: owned first, then by rarity rate (rarest last within each group)
    const sortedR = [...rewards].sort((a, b) => {
      const ao = isOwned(a), bo = isOwned(b);
      if (ao !== bo) return ao ? -1 : 1;
      return a.localeCompare(b);
    });
    for (const name of sortedR) {
      const owned   = isOwned(name);
      const cls     = owned ? 'owned' : 'locked';
      const sym     = owned ? '✓' : '✗';
      const frac    = tierRarities[name] || '';
      const rarLabel = frac ? fractionToRarity(frac) : '';
      const rarHtml  = frac
        ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${frac}</span>`
        : '';
      html += `<div class="drop-row ${cls}" style="cursor:pointer" data-nav="${name}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${cls}">${sym}</div>
        <span class="drop-name ${cls}">${name}</span>
        ${rarHtml}
      </div>`;
    }
  }
  html += `</div>`;

  container.innerHTML = html;
}

// ─── Item view ─────────────────────────────────────────────────────────────
function renderItem(name, container) {
  const data        = itemSources[name] || {};
  const monsters    = data.monsters    || [];
  const rdtMonsters = data.rdtMonsters || [];
  const quests      = data.quests      || [];
  const gathering   = data.gathering;
  const production  = data.production  || null;
  const spawns      = data.spawns      || [];
  const shops       = data.shops       || [];
  const clueTiers   = data.clueTiers   || [];

  // For items: "owned" means the player has THIS item card
  const itemOwned = isOwned(name);

  const itemCats = cardCategories[name] || [];
  const catBadges = itemCats.map(c =>
    `<span style="font-size:9px;background:#0d1e2e;color:#4a6a8a;border-radius:2px;padding:1px 5px;margin-left:4px">${c}</span>`
  ).join('');
  const detail  = cardDetails[name] || {};
  const imgHtml = detail.imageUrl
    ? `<img src="${detail.imageUrl}" style="float:right;max-width:64px;max-height:64px;image-rendering:pixelated;margin-left:8px" onerror="this.style.display='none'">`
    : '';
  const examHtml = detail.examine
    ? `<div style="font-size:11px;color:#888;font-style:italic;margin-top:3px">${detail.examine}</div>`
    : '';

  let html = `<h1>${name}${imgHtml}${wikiLink(name)}</h1>
    <div class="subtitle">Item card${catBadges} · <span style="color:${itemOwned?'#00c853':'#7a5020'}">${itemOwned?'✓ Owned':'✗ Not owned'}</span>
      <span style="color:#555;font-size:10px;margin-left:8px;cursor:pointer" data-nav="${name}" onclick="toggleOwned(this.dataset.nav)">(toggle)</span>
      ${examHtml}
    </div>`;

  const allMonsterSources = dedupeMonsters(monsters);
  const monstersOwnedStat = allMonsterSources.filter(m => isOwned(m.card)).length;
  const monsterColor = monsters.length === 0 ? '#555'
    : monstersOwnedStat === allMonsterSources.length ? '#00c853' : '#e8c97a';

  html += `<div class="stats-bar">
    <div class="stat-block">
      <div class="stat-label">Monster Sources</div>
      <div class="stat-value" style="color:${monsterColor}">${monstersOwnedStat}<span class="den"> / ${allMonsterSources.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Quest Rewards</div>
      <div class="stat-value">${quests.length}<span class="den"> quests</span></div>
    </div>
    ${gathering ? (() => {
      const canG = getLevel(gathering.skill) >= gathering.level;
      const hasTool = !TOOL_TIERS[gathering.tool] || (() => {
        for (const t of TOOL_TIERS[gathering.tool]) if (isOwned(t.name) && getLevel(gathering.skill) >= t.skillReq) return true;
        return false;
      })();
      const gColor = (canG && hasTool) ? '#76c442' : '#c84a00';
      return `<div class="stat-block">
        <div class="stat-label">Gathering</div>
        <div class="stat-value" style="color:${gColor};font-size:13px">${gathering.skill} ${gathering.level}</div>
      </div>`;
    })() : (production ? (() => {
      const canP = getLevel(production.skill) >= production.level;
      const implP = getImplicitTools(production.skill, production.ingredients, production.tools);
      const allOwned = (production.ingredients || []).every(i => !itemSources[i.item] || isOwned(i.item))
                    && implP.every(t => isOwned(t));
      const pColor = (canP && allOwned) ? '#6a8aee' : '#c84a00';
      return `<div class="stat-block">
        <div class="stat-label">Craftable</div>
        <div class="stat-value" style="color:${pColor};font-size:13px">${production.skill} ${production.level}</div>
      </div>`;
    })() : '')}
    ${spawns.length ? `<div class="stat-block">
      <div class="stat-label">Ground Spawns</div>
      <div class="stat-value" style="font-size:13px">${spawns.length}</div>
    </div>` : ''}
    ${shops.length ? `<div class="stat-block">
      <div class="stat-label">Shops</div>
      <div class="stat-value" style="font-size:13px;color:#8ab4d4">${shops.length}</div>
    </div>` : ''}
  </div>`;

  // Gathering
  if (gathering) {
    const playerLevel = getLevel(gathering.skill);
    const canGather   = playerLevel >= gathering.level;
    const tiers     = TOOL_TIERS[gathering.tool];
    const skillLvl  = getLevel(gathering.skill);  // e.g. Mining or Woodcutting level
    // bestTier = highest tier where player OWNS the card AND meets the skill level req
    let bestTier = null;
    if (tiers) {
      for (const t of tiers)
        if (isOwned(t.name) && skillLvl >= t.skillReq) bestTier = t;
    }

    // Tool ownership — tiered tools (Pickaxe/Axe) use bestTier; others resolve per-part
    const toolParts     = !tiers ? resolveToolParts(gathering.tool) : [];
    const allToolsOwned = tiers ? !!bestTier : toolParts.every(p => p.owned);

    const tieredToolNote = !tiers ? '' : bestTier
      ? ` — best owned: <strong style="color:#e8c97a">${bestTier.name}</strong>`
      : ` — <span style="color:#c84a00">no ${gathering.tool.toLowerCase()} in collection</span>`;

    // Build the tool display HTML
    let toolHtml;
    if (tiers) {
      toolHtml = `<strong>${gathering.tool}</strong>${tieredToolNote}`;
    } else if (toolParts.length === 0) {
      toolHtml = `<strong>${gathering.tool}</strong>`;   // "None"
    } else {
      toolHtml = toolParts.map((p, i) => {
        const col      = p.owned ? '#76c442' : '#c84a00';
        const sym      = p.owned ? '✓' : '✗';
        const noteHtml = p.note ? ` <span style="color:#888;font-size:10px">(${p.note})</span>` : '';
        const sep      = i > 0 ? ' <span style="color:#555"> + </span>' : '';
        const isCard   = itemSources[p.label] !== undefined;
        const inner    = `<strong style="color:${col}">${p.label} ${sym}</strong>${noteHtml}`;
        return sep + (isCard
          ? `<span style="cursor:pointer" data-nav="${p.label}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">${inner}</span>`
          : inner);
      }).join('');
    }

    const canActuallyGather = canGather && allToolsOwned;
    html += `<div class="section">
      <div class="section-header">Gathering</div>
      <div class="gathering-card">
        <div class="gathering-skill" style="color:${canActuallyGather?'#76c442':'#c84a00'}">
          ${gathering.skill}
          <span class="level-req${canGather?'':' locked'}">
            Level ${gathering.level}${canGather?' ✓':' — need '+(gathering.level-playerLevel)+' more lvls'}
          </span>
        </div>
        <div class="gathering-detail">${gathering.method}</div>
        <div class="gathering-tool">Tool: ${toolHtml}</div>
        ${tiers ? renderToolTiers(tiers, gathering.skill) : ''}
      </div>
    </div>`;
  }

  // Production (crafting/cooking/smithing/fletching/etc.)
  if (production) {
    html += renderProduction(production);
  }

  // Ground spawns
  if (spawns.length) {
    html += `<div class="section">
      <div class="section-header">Ground Spawns <span style="font-size:10px;color:#666;font-weight:normal;text-transform:none;letter-spacing:0">${spawns.length} location${spawns.length!==1?'s':''}</span></div>
      ${spawns.map(s => `<div class="spawn-row">📍 ${cleanSpawnText(s)}</div>`).join('')}
    </div>`;
  }

  // Clue scroll reward tiers
  if (clueTiers.length > 0) {
    const TIER_STYLE = {
      beginner: {bg:'#2a2010',color:'#c8a830',label:'Beginner'},
      easy:     {bg:'#102010',color:'#50c050',label:'Easy'},
      medium:   {bg:'#202010',color:'#c8c030',label:'Medium'},
      hard:     {bg:'#101828',color:'#4080c0',label:'Hard'},
      elite:    {bg:'#1e1028',color:'#9050d0',label:'Elite'},
      master:   {bg:'#280a0a',color:'#d03030',label:'Master'},
    };
    html += `<div class="section">
      <div class="section-header">Clue Scroll Reward</div>`;
    for (const tier of clueTiers) {
      const s    = TIER_STYLE[tier] || {bg:'#1a1a1a',color:'#888',label:tier};
      const frac = (clueRewardRarities[tier] || {})[name] || '';
      const rarLabel = frac ? fractionToRarity(frac) : '';
      html += `<div class="drop-row" style="cursor:pointer" onclick="showCard('Clue scroll (${tier})','clue')">
        <div class="drop-indicator" style="color:${s.color}">◈</div>
        <span class="drop-name" style="color:${s.color}">${s.label}</span>
        ${frac ? `<span class="rarity-badge ${rarityClass(rarLabel)}">${rarLabel}</span><span class="fraction">${frac}</span>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  // Shops & Rewards section
  if (shops.length > 0) {
    html += `<div class="section">
      <div class="section-header">Shops &amp; Rewards</div>`;
    for (const shop of shops) {
      const isCard    = itemSources[shop.currency] !== undefined;
      const curOwned  = isCard ? isOwned(shop.currency) : null;
      const curCol    = curOwned === true ? '#76c442' : curOwned === false ? '#c84a00' : '#888';
      const curSym    = curOwned === true ? ' ✓' : curOwned === false ? ' ✗' : '';
      const priceStr  = shop.price != null ? `${shop.price.toLocaleString()}× ` : '';
      const curHtml   = isCard
        ? `<span style="cursor:pointer;color:${curCol}" data-nav="${shop.currency}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">${priceStr}${shop.currency}${curSym}</span>`
        : `<span style="color:#888">${priceStr}${shop.currency}</span>`;
      html += `<div class="drop-row" style="cursor:default;background:#0d0d0d">
        <div class="drop-indicator" style="color:#6a8aaa">◈</div>
        <span class="drop-name" style="color:#aaa;flex:1">${shop.seller}</span>
        <span style="font-size:11px;margin-left:8px;flex-shrink:0">${curHtml}</span>
      </div>`;
    }
    html += `</div>`;
  }

  // Monster drops
  const dedupedMonsters = allMonsterSources;  // already deduped above
  const monstersUnlocked = monstersOwnedStat;
  html += `<div class="section">
    <div class="section-header">
      Dropped By
      ${progressPill(monstersUnlocked, dedupedMonsters.length, false)}
    </div>`;
  if (dedupedMonsters.length === 0) {
    html += `<div class="empty-note">Not found as a monster drop${gathering?' (gathered instead)':''}.</div>`;
  } else {
    const sortedMonsters = [...dedupedMonsters].sort((a, b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return a.card.localeCompare(b.card);
    });
    for (const m of sortedMonsters) {
      const mOwned  = isOwned(m.card);
      const indCls  = mOwned ? 'owned' : 'locked';
      const symbol  = mOwned ? '✓' : '✗';
      const cmb      = monsterDrops[m.card]?.combatLevel;
      const cmbHtml  = cmb ? `<span style="font-size:10px;color:#555;margin-left:4px">Cmb ${cmb}</span>` : '';
      const reqTags  = monsterReqTags(monsterDrops[m.card]);
      html += `<div class="drop-row ${mOwned?'owned':'locked'}" style="cursor:pointer" data-nav="${m.card}" data-nav-type="monster" onclick="showCard(this.dataset.nav,this.dataset.navType)">
        <div class="drop-indicator ${indCls}">${symbol}</div>
        <span class="drop-name ${indCls}">${m.card}${cmbHtml}${reqTags}</span>
        <span class="rarity-badge ${rarityClass(m.rarity)}">${m.rarity}</span>
        <span class="fraction">${m.fraction||'—'}</span>
      </div>`;
    }
  }
  html += `</div>`;

  // RDT monsters
  if (rdtMonsters.length > 0) {
    html += `<div class="section">
      <div class="section-header">Also on Rare Drop Table <span class="rdt-header-note">${rdtMonsters.length} monsters</span></div>
      <div class="rdt-banner">This item appears on the shared Rare &amp; Gem Drop Table. Many monsters can drop it via the RDT — these are not monster-specific sources.</div>`;
    for (const m of rdtMonsters.slice(0, 6))
      html += dropRowHtml(m.card, m.rarity, m.fraction, true);
    if (rdtMonsters.length > 6)
      html += `<div class="empty-note" style="padding:6px 0">…and ${rdtMonsters.length-6} more</div>`;
    html += `</div>`;
  }

  // Quests
  html += `<div class="section"><div class="section-header">Quest Rewards</div>`;
  if (quests.length === 0) {
    html += `<div class="empty-note">Not a quest reward.</div>`;
  } else {
    for (const q of quests) {
      const chain = questChains[q];
      html += `<div class="quest-row"><span class="quest-name">${q}</span>`;
      if (chain?.prerequisites?.length)
        html += `<div class="quest-prereqs">requires: ${chain.prerequisites.join(', ')}</div>`;
      html += `</div>`;
    }
  }
  html += `</div>`;

  container.innerHTML = html;
}

// ─── Tool tier rows HTML ───────────────────────────────────────────────────
// skillName = e.g. "Mining" or "Woodcutting" — used to check level gate
function renderToolTiers(tiers, skillName) {
  const skillLvl = getLevel(skillName);

  // best = highest tier the player OWNS and can USE (skill level ok)
  let bestName = null;
  for (const t of tiers)
    if (isOwned(t.name) && skillLvl >= t.skillReq) bestName = t.name;

  let html = `<div class="tool-tiers">`;
  for (const t of tiers) {
    const hasCard  = isOwned(t.name);
    const levelOk  = skillLvl >= t.skillReq;
    const isBest   = t.name === bestName;

    let cls, label;
    if (isBest) {
      cls = 'best';    label = '✓';
    } else if (hasCard && !levelOk) {
      // Own it but level gate not met — show the level required
      cls = 'locked';  label = `need ${skillName} ${t.skillReq}`;
    } else if (hasCard) {
      // Own it, level ok, just not the best available
      cls = 'available'; label = '✓';
    } else {
      // Don't own the card — show as unavailable, no level details
      cls = '';         label = '—';
    }

    html += `<div class="tool-tier-row ${cls}">
      <div class="tier-dot"></div>
      <span class="tier-name">${t.name}</span>
      <span class="tier-req">${label}</span>
    </div>`;
  }
  return html + `</div>`;
}

// ─── Live collection refresh (requires server.py) ──────────────────────────
async function refreshCollection() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '↻ …';
  try {
    const data = await fetch('/api/collection/refresh').then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    if (data.error) throw new Error(data.error);
    owned = new Set(data.ownedCards.map(n => n.toLowerCase()));
    _canGetCache = {};
    document.getElementById('sim-summary').textContent =
      `${data.cardCount} cards owned · refreshed ${new Date().toLocaleTimeString()}`;
    document.getElementById('sim-btn').style.display = 'none';
    filterCards();
    refreshDetail();
    if (activeTab === 'skilling') renderSkillGrid();
    if (activeTab === 'questing') renderQuestList();
    btn.textContent = '↻ Refresh';
    btn.disabled = false;
  } catch (e) {
    console.error('Refresh failed:', e);
    btn.textContent = '✗ Error';
    btn.style.color = '#c84a00';
    setTimeout(() => {
      btn.textContent = '↻ Refresh';
      btn.style.color = '';
      btn.disabled = false;
    }, 3000);
  }
}

// ─── Hiscores level lookup (requires server.py) ────────────────────────────
async function lookupLevels() {
  const input = document.getElementById('rsn-input');
  const btn   = document.getElementById('levels-btn');
  const rsn   = input.value.trim();
  if (!rsn) return;

  btn.disabled = true;
  btn.textContent = '…';
  try {
    const data = await fetch(`/api/hiscores?player=${encodeURIComponent(rsn)}`).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    if (data.error) throw new Error(data.error);

    // Merge returned levels into skills — only update skills we track
    for (const [skill, lvl] of Object.entries(data.levels)) {
      if (skill in skills) skills[skill] = lvl;
    }
    _canGetCache = {};
    refreshDetail();
    if (activeTab === 'skilling') renderSkillGrid();
    if (activeTab === 'questing') renderQuestList();
    btn.textContent = '✓ ' + data.player;
    btn.style.color = '#00c853';
    setTimeout(() => { btn.textContent = 'Levels'; btn.style.color = ''; btn.disabled = false; }, 3000);
  } catch (e) {
    console.error('Level lookup failed:', e);
    btn.textContent = '✗ Error';
    btn.style.color = '#c84a00';
    setTimeout(() => { btn.textContent = 'Levels'; btn.style.color = ''; btn.disabled = false; }, 3000);
  }
}

// ─── Tab navigation ────────────────────────────────────────────────────────
function switchTab(tab) {
  if (tab !== activeTab) pushHistoryEntry();
  _renderTab(tab);
}

function _renderTab(tab, resetSelection = true) {
  activeTab = tab;
  // Update tab button styles
  for (const t of ['cards','skilling','questing','rules'])
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);

  const sidebar     = document.getElementById('sidebar');
  const mainContent = document.getElementById('main-content');

  if (tab === 'cards') {
    sidebar.style.display = 'flex';
    mainContent.style.display = 'flex';
    // Rebuild detail pane only if it doesn't exist (was replaced by another tab)
    if (!document.getElementById('detail')) {
      mainContent.innerHTML = `<div id="detail" style="flex:1;overflow-y:auto;padding:20px 24px;"><div class="placeholder">← Select a card to see sourcing info</div></div>`;
    }
    if (resetSelection) { selected = null; selectedType = null; }
    filterCards();
  } else {
    sidebar.style.display = 'none';
    mainContent.style.display = 'flex';
    mainContent.style.flexDirection = 'column';
    if (tab === 'skilling') {
      if (resetSelection) selectedSkill = null;
      mainContent.innerHTML = `<div id="skill-panel">
        <div id="skill-list-pane">
          <div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Skills</div>
          <div class="skill-grid" id="skill-grid"></div>
        </div>
        <div id="skill-detail-pane">
          <div class="placeholder" style="margin-top:60px;color:#444">← Select a skill</div>
        </div>
      </div>`;
      renderSkillGrid();
    } else if (tab === 'questing') {
      if (resetSelection) selectedQuest = null;
      mainContent.innerHTML = `<div id="quest-panel">
        <div id="quest-list-pane">
          <div id="quest-list-controls">
            <input id="quest-search" type="text" placeholder="Search quests…" oninput="renderQuestList()"
              style="background:#222;border:1px solid #444;color:#ddd;padding:6px 8px;border-radius:3px;font-size:12px;width:100%">
            <select id="quest-filter" onchange="renderQuestList()"
              style="background:#222;border:1px solid #444;color:#ccc;padding:4px 6px;border-radius:3px;font-size:11px">
              <option value="all">All quests</option>
              <option value="ok">Completable</option>
              <option value="close">Almost ready</option>
              <option value="free">Free quests</option>
              <option value="members">Members only</option>
            </select>
          </div>
          <div id="quest-list-scroll"></div>
        </div>
        <div id="quest-detail-pane">
          <div class="placeholder" style="margin-top:60px;color:#444">← Select a quest</div>
        </div>
      </div>`;
      renderQuestList();
    } else if (tab === 'rules') {
      mainContent.innerHTML = renderRulesTab();
    }
  }
}

// ─── Skilling tab ──────────────────────────────────────────────────────────

// OSRS skill order (3-column grid, left-to-right top-to-bottom)
const SKILL_ORDER = [

// Maps our skill names → OSRS wiki icon filename (some differ from skill name)
const SKILL_ICON_NAME = {
  Runecrafting: 'Runecraft',  // wiki uses "Runecraft_icon.png" not "Runecrafting_icon.png"
};
const _WIKI = 'https://oldschool.runescape.wiki/images/';
function skillIcon(skill, size=16) {
  const name = SKILL_ICON_NAME[skill] || skill;
  return `<img src="${_WIKI}${name}_icon.png" width="${size}" height="${size}"
    alt="${skill}" style="vertical-align:middle;image-rendering:pixelated;margin-right:3px">`;
}

function getTrainingMethods(skillName) {
  /**
   * Return an array of training method objects for a given skill.
   * Each object: {name, level, status, cardOwned, note, type}
   * status: 'available' | 'no-card' | 'locked-level' | 'locked-tool'
   */
  const myLevel = getLevel(skillName);
  const results = [];

  const GATHERING_SKILLS = new Set(['Mining','Woodcutting','Fishing','Farming']);
  const PRODUCTION_SKILLS = new Set(['Fletching','Smithing','Crafting','Cooking','Herblore','Construction','Runecrafting']);
  const MELEE_SKILLS = new Set(['Attack','Strength','Defence','Hitpoints']);

  if (skillName === 'Hunter') {
    // Hardcoded creature list — level + tool only (gathering rule, no card needed)
    for (const c of HUNTER_CREATURES) {
      const parts = resolveToolParts(c.tool);
      const missingCardParts = parts.filter(p => itemSources[p.label] && !p.owned);
      let status, note;
      if (myLevel < c.level) {
        status = 'locked-level';
        note = missingCardParts.length ? 'need: ' + missingCardParts.map(p => p.label).join(', ') : '';
      } else if (missingCardParts.length > 0) {
        status = 'locked-tool';
        note = 'need: ' + missingCardParts.map(p => p.label).join(', ');
      } else {
        status = 'available';
        note = c.tool !== 'None' ? c.tool : '';
      }
      results.push({name:c.name, level:c.level, status, cardOwned:true, note, xp:c.xp, type:'hunter'});
    }

  } else if (GATHERING_SKILLS.has(skillName)) {
    for (const [cardName, data] of Object.entries(itemSources)) {
      if (!data) continue;
      const g = data.gathering;
      if (!g || g.skill !== skillName) continue;
      const level = g.level;
      const cardOwned = isOwned(cardName);

      // Tool check — tool IS required to gather (Bronzeman: gated by level + tool)
      let toolNote = '';
      let toolLocked = false;
      if (g.tool && TOOL_TIERS[g.tool]) {
        const tiers = TOOL_TIERS[g.tool];
        const hasTool = tiers.some(t => isOwned(t.name) && myLevel >= t.skillReq);
        if (!hasTool) {
          toolLocked = true;
          const ownedAny = tiers.some(t => isOwned(t.name));
          toolNote = ownedAny ? 'level too low for tool' : 'no tool';
        } else {
          const bestTool = [...tiers].reverse().find(t => isOwned(t.name) && myLevel >= t.skillReq);
          if (bestTool) toolNote = bestTool.name;
        }
      } else if (g.tool && g.tool !== 'None') {
        const parts = resolveToolParts(g.tool);
        // Only card tools (in itemSources) create Bronzeman restrictions
        const missingCardParts = parts.filter(p => itemSources[p.label] && !p.owned);
        if (missingCardParts.length > 0) {
          toolLocked = true;
          toolNote = missingCardParts.map(p => p.label).join(', ') + ' needed';
        } else {
          toolNote = parts.filter(p => itemSources[p.label]).map(p => p.label).slice(0,2).join(' + ');
        }
      }

      let status;
      if (myLevel < level) status = 'locked-level';
      else if (toolLocked) status = 'locked-tool';
      else if (!cardOwned) status = 'no-card';  // can gather but resource can only be dropped/banked
      else status = 'available';

      results.push({name:cardName, level, status, cardOwned, note:toolNote, xp:g.xp, method:g.method, type:'gathering'});
    }

  } else if (skillName === 'Firemaking') {
    // Burning logs requires: log card + tinderbox card + Firemaking level
    const hasTinderbox = isOwned('Tinderbox');
    for (const [logName, fireLevel] of Object.entries(FIREMAKING_LEVELS)) {
      if (!itemSources[logName]) continue;
      const cardOwned = isOwned(logName);
      let status, note;
      if (!hasTinderbox) {
        status = 'locked-tool';
        note = 'no Tinderbox';
      } else if (myLevel < fireLevel) {
        status = 'locked-level';
        note = '';
      } else if (!cardOwned) {
        status = 'no-card';
        note = '';
      } else {
        status = 'available';
        note = '';
      }
      results.push({name:logName, level:fireLevel, status, cardOwned, note, type:'firemaking'});
    }

  } else if (skillName === 'Thieving') {
    // ── Stalls: hardcoded list (stolen items go to inventory, no card gate) ──
    for (const stall of THIEVING_STALLS) {
      const status = myLevel < stall.level ? 'locked-level' : 'available';
      results.push({name:stall.name, level:stall.level, status, cardOwned:true,
        note: `${stall.xp} xp`, xp:stall.xp, isPickpocket:false, npcCardRequired:false, type:'thieving'});
    }
    // ── Pickpockets: hardcoded NPC list (wiki scraper doesn't capture all NPCs) ─
    for (const npc of PICKPOCKET_NPCS) {
      const cardOwned = npc.card ? isOwned(npc.card) : true; // no card → no restriction
      const npcCardRequired = !!npc.card;
      let status;
      if (myLevel < npc.level) {
        status = 'locked-level';
      } else if (npcCardRequired && !cardOwned) {
        status = 'no-card';
      } else {
        status = 'available';
      }
      results.push({name:`Pickpocket ${npc.name}`, level:npc.level, status, cardOwned,
        note:`${npc.xp} xp`, xp:npc.xp, isPickpocket:true, npcCardRequired, type:'thieving'});
    }

  } else if (skillName === 'Prayer') {
    // Burying bones/ashes: need the card to use the item (Bronzeman rule)
    // Also check if the item is actually gettable (e.g. own Ourg bones card but no Ourg monster card)
    for (const bone of PRAYER_BONES) {
      if (!itemSources[bone.name]) continue;
      const cardOwned = isOwned(bone.name);
      const gettable = canGetItem(bone.name);
      let status;
      if (!cardOwned)      status = 'no-card';
      else if (!gettable)  status = 'no-source';
      else                 status = 'available';
      results.push({name:bone.name, level:1, status,
        cardOwned, note:`${bone.xp} xp`, xp:bone.xp, type:'prayer'});
    }

  } else if (skillName === 'Magic') {
    // Show actual castable spells based on rune card ownership + level
    for (const spell of MAGIC_SPELLS) {
      const missingRunes = Object.keys(spell.runes).filter(r => !isOwned(r));
      const levelOk = myLevel >= spell.level;
      let status, note;
      if (!levelOk) {
        status = 'locked-level';
        note = missingRunes.length ? 'need: ' + missingRunes.slice(0,2).join(', ') : '';
      } else if (missingRunes.length > 0) {
        status = 'no-card'; note = 'need: ' + missingRunes.slice(0,3).join(', ');
      } else {
        status = 'available'; note = Object.keys(spell.runes).join(', ');
      }
      results.push({name:spell.name, level:spell.level, status,
        cardOwned:missingRunes.length===0, note, type:'magic-spell'});
    }

  } else if (skillName === 'Ranged') {
    // Bow + arrow / crossbow + bolt combos, and standalone thrown
    for (const [bow, cfg] of Object.entries(BOW_COMPAT)) {
      if (!itemSources[bow]) continue;
      const bowOwned = isOwned(bow);
      const levelOk = myLevel >= cfg.level;
      const ownedAmmo = cfg.ammo.filter(a => isOwned(a));
      if (bowOwned && ownedAmmo.length) {
        for (const ammo of ownedAmmo) {
          results.push({name:`${bow} + ${ammo}`, level:cfg.level,
            status: levelOk ? 'available' : 'locked-level',
            cardOwned:true, note:'', weapon:bow, ammo, type:'ranged-setup'});
        }
      } else if (bowOwned) {
        results.push({name:bow, level:cfg.level, status:'no-card', cardOwned:false,
          note:`no ammo`, weapon:bow, ammo:null, type:'ranged-setup'});
      } else if (ownedAmmo.length) {
        results.push({name:bow, level:cfg.level, status:'no-card', cardOwned:false,
          note:`no bow`, weapon:bow, ammo:null, type:'ranged-setup'});
      }
      // If neither bow nor any ammo owned — skip
    }
    for (const t of STANDALONE_THROWN) {
      if (!itemSources[t.name]) continue;
      const owned = isOwned(t.name);
      const levelOk = myLevel >= t.level;
      results.push({name:t.name, level:t.level,
        status: !owned ? 'no-card' : !levelOk ? 'locked-level' : 'available',
        cardOwned:owned, note:'', weapon:t.name, ammo:null, type:'ranged-setup'});
    }

  } else if (MELEE_SKILLS.has(skillName)) {
    // Melee combat: need monster card to fight
    for (const mName of Object.keys(monsterDrops)) {
      if (!isOwned(mName)) continue;
      const cbLv = monsterDrops[mName].combatLevel;
      results.push({name:mName, level:cbLv||0, status:'available',
        cardOwned:true, note:'', combatLevel:cbLv, type:'combat'});
    }
    results.sort((a,b) => (a.level||0) - (b.level||0));
    return results;

  } else if (PRODUCTION_SKILLS.has(skillName)) {
    for (const [cardName, data] of Object.entries(itemSources)) {
      if (!data) continue;
      const p = data.production;
      if (!p || p.skill !== skillName) continue;
      // Skip methods that grant 0 XP — not training methods
      if (!p.xp || p.xp <= 0) continue;
      // For Cooking: skip burnt items (failed cooks, not intentional training)
      if (skillName === 'Cooking' && cardName.toLowerCase().startsWith('burnt')) continue;
      // Skip Chambers of Xeric fish — raw form only obtainable inside the raid, not a normal training method
      if (skillName === 'Cooking' && /^Raw .+ fish \(\d+\)$/.test(p.ingredients?.[0]?.item || '')) continue;
      const level = p.level || 0;
      const ings = p.ingredients || [];
      // Tool card check — production tools that are TCG cards must be owned.
      // Runecrafting: tiaras are altar-access items that can be bypassed via the Abyss.
      // Detect them by name pattern (all end in "tiara") and treat as optional.
      const isTiara = t => t.toLowerCase().endsWith('tiara');
      const allTools = p.tools || [];
      const hardTools = skillName === 'Runecrafting' ? allTools.filter(t => !isTiara(t)) : allTools;
      const missingTools = hardTools.filter(t => itemSources[t] && !isOwned(t));
      const missingTiara = skillName === 'Runecrafting' ? allTools.find(t => isTiara(t) && !isOwned(t)) : null;
      // Ingredient assessment: unowned cards → no-card; owned but unobtainable → no-source
      const blockedBy = [];    // owned-card or non-card ingredients that can't be obtained
      const missingCards = []; // card ingredients not yet owned
      for (const ing of ings) {
        const isCard = !!itemSources[ing.item];
        if (isCard && !isOwned(ing.item)) {
          missingCards.push(ing.item);       // don't own the card → no-card
        } else if (isCard && !canGetItem(ing.item)) {
          blockedBy.push(ing.item);          // own card but can't obtain → no-source
        } else if (!isCard && !canGetItem(ing.item)) {
          blockedBy.push(ing.item);          // non-card ingredient unreachable → no-source
        }
      }
      let status, note;
      if (myLevel < level) {
        status = 'locked-level'; note = '';
      } else if (missingTools.length > 0) {
        status = 'locked-tool'; note = 'need: ' + missingTools.slice(0,2).join(', ');
      } else if (blockedBy.length > 0) {
        status = 'no-source';
        // Show all blocking items (both unobtainable and missing cards) up to 3 total
        const allBlocked = [...blockedBy, ...missingCards].slice(0, 3);
        note = 'no source: ' + allBlocked.join(', ');
      } else if (missingCards.length > 0) {
        status = 'no-card'; note = 'need: ' + missingCards.slice(0,3).join(', ');
      } else {
        status = 'available';
        if (missingTiara) note = `use ${missingTiara} or Abyss`;
        else {
          const parts = [...ings.slice(0, 2).map(i => i.item), ...hardTools.slice(0, 1)];
          note = parts.join(' + ');
        }
      }
      // For Cooking with a single card ingredient, show that as the method name
      // For simple 1-ingredient cooking (e.g. Raw pike → Pike), show the raw ingredient as the name.
      // Don't apply to multi-ingredient recipes — they'd collapse to a shared ingredient (e.g. Equa leaves).
      const cardIngs = ings.filter(i => !!itemSources[i.item]).map(i => i.item);
      const singleIng = skillName === 'Cooking' && ings.length === 1 && cardIngs.length === 1 ? cardIngs[0] : null;
      results.push({name:cardName, displayName:singleIng||cardName, displayNav:singleIng||cardName, level, status, cardOwned:isOwned(cardName), note, xp:p.xp, type:'production', quests:p.quests||null});
    }

  } else if (skillName === 'Agility') {
    for (const c of AGILITY_COURSES) {
      results.push({name:c.name, level:c.level,
        status: myLevel >= c.level ? 'available' : 'locked-level',
        cardOwned:true, note:`${c.xp} xp/lap`, type:'agility'});
    }
  } else if (skillName === 'Slayer') {
    for (const [masterName, master] of Object.entries(SLAYER_TASKS)) {
      const levelOk = myLevel >= (master.slayerReq || 1);
      const availTasks = master.tasks.filter(t => t.cards.some(c => isOwned(c))).length;
      const status = !levelOk ? 'locked-level' : availTasks > 0 ? 'available' : 'no-card';
      results.push({name:masterName, level:master.slayerReq||0,
        status, cardOwned:availTasks > 0, note:`${availTasks}/${master.tasks.length} tasks`, type:'slayer'});
    }
  }

  // Sort: available first, then by level asc
  results.sort((a,b) => {
    const order = {available:0,'no-source':1,'no-card':2,'locked-tool':3,'locked-level':4};
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return (a.level||0) - (b.level||0);
  });
  return results;
}

function countAvailableMethods(skillName) {
  if (['Attack','Strength','Defence','Hitpoints'].includes(skillName))
    return Object.keys(monsterDrops).filter(m => isOwned(m)).length;
  if (skillName === 'Magic')
    return MAGIC_SPELLS.filter(s => getLevel('Magic') >= s.level && Object.keys(s.runes).every(r => isOwned(r))).length;
  if (skillName === 'Ranged')
    return getTrainingMethods('Ranged').filter(m => m.status === 'available').length;
  if (skillName === 'Prayer')
    return PRAYER_BONES.filter(b => itemSources[b.name] && isOwned(b.name) && canGetItem(b.name)).length;
  if (skillName === 'Agility') return AGILITY_COURSES.filter(c => getLevel('Agility') >= c.level).length;
  if (skillName === 'Slayer')  return Object.values(SLAYER_TASKS).filter(m => getLevel('Slayer') >= (m.slayerReq||1) && m.tasks.some(t => t.cards.some(c => isOwned(c)))).length;
  return getTrainingMethods(skillName).filter(m => m.status === 'available').length;
}

function renderSkillGrid() {
  const grid = document.getElementById('skill-grid');
  if (!grid) return;
  let html = '';
  for (const skill of SKILL_ORDER) {
    const lvl   = getLevel(skill);
    const count = countAvailableMethods(skill);
    const sel   = skill === selectedSkill ? ' selected' : '';
    const hasMeth = count > 0 ? ' has-methods' : '';
    html += `<div class="skill-cell${sel}${hasMeth}" onclick="showSkillDetail('${skill}')">

      <div class="skill-cell-count ${count===0?'zero':''}">${count} method${count!==1?'s':''}</div>

  }
  grid.innerHTML = html;
}

function showSlayerMasterDetail(masterName) {
  const master = SLAYER_TASKS[masterName];
  if (!master) return;
  const pane = document.getElementById('skill-detail-pane');
  if (!pane) return;

  const tasks = master.tasks;
  const totalWeight = tasks.reduce((s, t) => s + t.weight, 0);

  // Sort: owned tasks first, then by weight desc
  const sorted = [...tasks].sort((a, b) => {
    const aOwned = a.cards.some(c => isOwned(c));
    const bOwned = b.cards.some(c => isOwned(c));
    if (aOwned !== bOwned) return aOwned ? -1 : 1;
    return b.weight - a.weight;
  });

  const availCount = tasks.filter(t => t.cards.some(c => isOwned(c))).length;

  let rows = `<div class="section">
    <div class="section-header">${availCount} of ${tasks.length} tasks — you have a card</div>
    <div style="margin-top:8px">`;

  for (const t of sorted) {
    const ownedCards = t.cards.filter(c => isOwned(c));
    const owned = ownedCards.length > 0;
    const pct = ((t.weight / totalWeight) * 100).toFixed(1);
    const indCls = owned ? 'available' : 'locked';
    const nameCls = owned ? 'available' : 'locked';
    const noteText = owned ? ownedCards.join(', ') : 'no card';
    rows += `<div class="method-row">
      <div class="method-indicator ${indCls}"></div>
      <span class="method-name ${nameCls}">${t.task}</span>
      <span class="method-level" style="min-width:46px;text-align:right">${pct}%</span>
      <span class="method-note">${noteText}</span>
    </div>`;
  }
  rows += `</div></div>`;

  const reqStr = master.slayerReq > 1 ? `Slayer ${master.slayerReq}` : master.combatReq > 3 ? `Combat ${master.combatReq}` : 'No req';
  pane.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <button onclick="showSkillDetail('Slayer')" style="background:#2a2a2a;border:1px solid #444;color:#aaa;padding:4px 10px;cursor:pointer;border-radius:3px;font-size:12px">← Slayer</button>
      <h1 style="margin:0;font-size:16px">${masterName}</h1>
    </div>
    <div class="subtitle">${availCount}/${tasks.length} tasks available · ${reqStr}</div>
    <p style="color:#666;font-size:11px;margin-bottom:12px">% = chance of being assigned. Green = you own the relevant monster card.</p>
    ${rows}
  `;
}

function computeCompletableQuests() {
  /**
   * Iteratively propagate completability. A quest is completable if:
   *   - All prerequisites are completable (or not in our dataset)
   *   - All skill requirements are met (player level >= req)
   *   - All required items are owned (player has the card)
   *   - All kill requirements are owned (player has the monster card)
   * Returns a Set of completable quest names.
   */
  const completable = new Set();
  let changed = true;
  while (changed) {
    changed = false;
    for (const [name, q] of Object.entries(questsData)) {
      if (completable.has(name)) continue;
      const prereqsOk = (q.prerequisites || []).every(p => completable.has(p) || !questsData[p]);
      const skillsOk  = (q.skillRequirements || []).every(r => getLevel(r.skill) >= r.level);
      const itemsOk   = (q.itemsRequired || []).every(i => isOwned(i));
      const killsOk   = (q.killsRequired || []).every(k => isOwned(k));
      if (prereqsOk && skillsOk && itemsOk && killsOk) {
        completable.add(name); changed = true;
      }
    }
  }
  return completable;
}

function questStatus(questName, completable) {
  const q = questsData[questName];
  if (!q) return 'locked';
  if (completable.has(questName)) return 'ok';
  // "Close" = prereqs completable + skills ok, but missing ≤2 cards
  const prereqsOk = (q.prerequisites || []).every(p => completable.has(p) || !questsData[p]);
  const skillsOk  = (q.skillRequirements || []).every(r => getLevel(r.skill) >= r.level);
  if (!prereqsOk || !skillsOk) return 'locked';
  const missingItems = (q.itemsRequired || []).filter(i => !isOwned(i));
  const missingKills = (q.killsRequired || []).filter(k => !isOwned(k));
  if (missingItems.length + missingKills.length <= 2) return 'close';
  return 'locked';
}

function renderQuestList() {
  const scroll = document.getElementById('quest-list-scroll');
  if (!scroll) return;
  const q  = (document.getElementById('quest-search')?.value || '').toLowerCase();
  const f  = document.getElementById('quest-filter')?.value || 'all';
  const completable = computeCompletableQuests();

  let quests = Object.entries(questsData);

  // Filter
  quests = quests.filter(([name, data]) => {
    if (q && !name.toLowerCase().includes(q)) return false;
    const st = questStatus(name, completable);
    if (f === 'ok'      && st !== 'ok')    return false;
    if (f === 'close'   && st !== 'close') return false;
    if (f === 'free'    && data.members)   return false;
    if (f === 'members' && !data.members)  return false;
    return true;
  });

  // Sort: ok → close → locked, then alphabetical
  const orderMap = {ok:0, close:1, locked:2};
  quests.sort(([an, ad], [bn, bd]) => {
    const as = questStatus(an, completable), bs = questStatus(bn, completable);
    if (orderMap[as] !== orderMap[bs]) return orderMap[as] - orderMap[bs];
    return an.localeCompare(bn);
  });

  let html = '';
  for (const [name, data] of quests) {
    const st = questStatus(name, completable);
    const badge = st === 'ok' ? '✓' : (st === 'close' ? '~' : '✗');
    const badgeCls = st;
    const sel = name === selectedQuest ? ' selected' : '';
    const qp = data.questPoints ? `<span class="quest-qp">${data.questPoints}qp</span>` : '';
    const mem = data.members ? `<span class="quest-members-tag">M</span>` : '';
    html += `<div class="quest-item${sel}" onclick="showQuestDetail('${name.replace(/'/g,"\\'")}')">
      <span class="quest-badge ${badgeCls}">${badge}</span>
      <span class="quest-name">${name}</span>
      ${qp}${mem}
    </div>`;
  }
  scroll.innerHTML = html || `<div style="padding:12px;color:#444;font-size:12px">No quests match this filter.</div>`;
}

function showQuestDetail(questName, push = true) {
  if (push) pushHistoryEntry();
  selectedQuest = questName;
  // Update list selection
  document.querySelectorAll('.quest-item').forEach(el => {
    el.classList.toggle('selected', el.querySelector('.quest-name')?.textContent === questName);
  });

  const pane = document.getElementById('quest-detail-pane');
  if (!pane) return;
  const q = questsData[questName];
  if (!q) { pane.innerHTML = `<div class="placeholder">Quest data not found.</div>`; return; }

  const completable = computeCompletableQuests();
  const st = questStatus(questName, completable);

  const statusColor = st === 'ok' ? '#3a9a3a' : (st === 'close' ? '#c8a020' : '#9a3a3a');
  const statusLabel = st === 'ok' ? 'Completable' : (st === 'close' ? 'Almost ready' : 'Locked');

  // Subtitle
  const typeStr = q.members ? 'Members quest' : 'Free quest';
  const qpStr   = q.questPoints ? ` · ${q.questPoints} quest point${q.questPoints!==1?'s':''}` : '';

  let html = `<h1>${questName} ${wikiLink(questName)}
    <span style="font-size:12px;color:${statusColor};font-weight:normal;margin-left:8px">${statusLabel}</span>
  </h1>
  <div class="subtitle">${typeStr}${qpStr}</div>`;

  if (q.questNpc) {
    html += `<div class="section">
      <div class="section-header">Start NPC</div>
      <div style="margin-top:8px;font-size:13px;color:#aaa">${q.questNpc} <span style="color:#555;font-size:11px">(talk to — no card required)</span></div>
    </div>`;
  }

  // Prerequisites
  if (q.prerequisites?.length) {
    html += `<div class="section"><div class="section-header">Prerequisites</div><div style="margin-top:8px">`;
    for (const prereq of q.prerequisites) {
      const ok = completable.has(prereq) || !questsData[prereq];
      html += `<div class="req-row">
        <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
        <span class="req-label" style="cursor:pointer;color:${ok?'#c8c8c8':'#9a5a5a'}"
          onclick="showQuestDetail('${prereq.replace(/'/g,"\\'")}')">
          ${prereq}</span>
        <span class="req-note">${ok ? (questsData[prereq]?'completable':'unknown quest') : 'locked'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Skill requirements
  if (q.skillRequirements?.length) {
    html += `<div class="section"><div class="section-header">Skill Requirements</div><div style="margin-top:8px">`;
    for (const r of q.skillRequirements) {
      const myLvl = getLevel(r.skill);
      const ok    = myLvl >= r.level;
      html += `<div class="req-row">
        <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
        <span class="req-label">${r.skill} ${r.level}${r.boostable?'':' <span style="font-size:10px;color:#666">(not boostable)</span>'}</span>
        <span class="req-note">you: ${myLvl}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Items required
  if (q.itemsRequired?.length) {
    html += `<div class="section"><div class="section-header">Items Required</div><div style="margin-top:8px">`;
    for (const item of q.itemsRequired) {
      const ok = isOwned(item);
      const isCard = !!itemSources[item];
      html += `<div class="req-row">
        <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
        <span class="req-label" ${isCard?`style="cursor:pointer" onclick="pushHistoryEntry();_renderTab('cards');setTimeout(()=>showCard('${item.replace(/'/g,"\\'")}','item',false),50)"`:''}>${item}</span>
        <span class="req-note">${ok ? 'owned' : (isCard ? 'need card' : 'no TCG card')}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Enemies to defeat
  if (q.killsRequired?.length) {
    html += `<div class="section"><div class="section-header">Enemies to Defeat</div><div style="margin-top:8px">`;
    for (const kill of q.killsRequired) {
      const ok = isOwned(kill);
      const isCard = !!monsterDrops[kill];
      html += `<div class="req-row">
        <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
        <span class="req-label" ${isCard?`style="cursor:pointer" onclick="pushHistoryEntry();_renderTab('cards');setTimeout(()=>showCard('${kill.replace(/'/g,"\\'")}','monster',false),50)"`:''}>${kill}</span>
        <span class="req-note">${ok ? 'card owned' : (isCard ? 'need monster card' : 'no TCG card')}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Reward items note
  if (q.rewardItems?.length) {
    html += `<div class="section"><div class="section-header">Reward Items</div>
      <div style="margin-top:8px;font-size:12px;color:#888">
        ${q.rewardItems.map(r => `<span style="margin-right:8px">${r}</span>`).join('')}
      </div>
      <div style="font-size:10px;color:#555;margin-top:6px">Quest rewards are given directly — no card required to receive. You can drop/bank items you haven't unlocked.</div>
    </div>`;
  }

  if (!q.prerequisites?.length && !q.skillRequirements?.length && !q.itemsRequired?.length && !q.killsRequired?.length) {
    html += `<div style="color:#555;font-size:12px;margin-top:12px">No tracked requirements. Check the wiki for full details.</div>`;
  }

  pane.innerHTML = html;
}

    <table>
      <tr><th>Action</th><th>Card Required?</th></tr>
      <tr><td>Talk to an NPC / start a quest</td><td>No — always accessible</td></tr>
      <tr><td>Fight or kill an NPC</td><td>Yes — need the monster card</td></tr>
      <tr><td>Pickpocket an NPC</td><td>Yes — need the monster card</td></tr>
      <tr><td>Gather a resource (mine, chop, fish, farm, hunt)</td><td>No — gated by level + tool only</td></tr>
      <tr><td>Thieve from a stall</td><td>No — gated by level only; individual stolen items still require their card to use</td></tr>
      <tr><td>Buy from a shop</td><td>Yes — spending coins or any currency counts as using it; need the currency card</td></tr>
      <tr><td>Use, eat, equip, or operate an item</td><td>Yes — need the item card</td></tr>
      <tr><td>Use an item as a crafting ingredient</td><td>Yes — need the item card</td></tr>
      <tr><td>Produce an output item</td><td>No — you can produce even without the output card</td></tr>
      <tr><td>Pick up loot or items from the ground</td><td>No — you can always pick things up and bank them</td></tr>
      <tr><td>Receive an item as a quest reward</td><td>No — given directly, no card needed</td></tr>
      <tr><td>Hand over or use an item during a quest</td><td>Yes — need the item card, even if you were handed it during the quest</td></tr>
      <tr><td>Sell a card</td><td>You lose access — selling a card removes that unlock until you get it back</td></tr>
    </table>

    <h3>Gathering</h3>
    <p>You can mine, chop, fish, farm, hunt, and thieve from stalls based on your skill level and the tools you have — regardless of whether you own the card for the resource. Items you gather without owning the card can be banked but not used, equipped, or consumed.</p>
    <p><strong>Example:</strong> You own a Bronze axe but not the Logs card. You can still chop trees — but you can't light the logs, fletch them, or use them in any recipe.</p>

    <h3>Production</h3>
    <p>You need the card for every ingredient you actively use in a recipe. The output item doesn't need a card — you can produce it freely. But without the output card, you can only bank the result, not use it further.</p>
    <p><strong>Example:</strong> You own the Iron ore card. You can smelt Iron bars even without the Iron bar card. But you can't then smith those bars into equipment — that requires the Iron bar card.</p>

    <h3>Combat</h3>
    <p>You need the monster card to attack any NPC. You can always talk to NPCs, walk through their areas, and start quests without a card.</p>

    <h3>Shops</h3>
    <p>Spending coins or any other currency counts as <em>using</em> it, so you need the currency's card before you can buy from shops. Coins is a TCG card — until you unlock it, you can earn and bank gold but not spend it. The same applies to special currencies like Tokkul or marks of grace.</p>

    <h3>Quests</h3>
    <p>Quest start NPCs can always be talked to. To complete a quest you need:</p>
    <ul>
      <li>All prerequisite quests completed</li>
      <li>Skill levels meeting all requirements</li>
      <li>Monster cards for any required kills</li>
      <li>Cards for any items you must use or hand over during the quest — even if the game hands you that item mid-quest</li>
    </ul>

    <h3>Foils</h3>
    <p>Foil cards are cosmetically shiny but don't grant any extra unlocks. A foil Iron ore card unlocks exactly the same things as a regular Iron ore card.</p>

    <h3>No card exists</h3>
    <p>If no TCG card exists for an NPC or item, there is no restriction — you can interact with it freely. The card set covers 1,227 monsters and 5,149 resource items; anything outside that set is unrestricted.</p>
