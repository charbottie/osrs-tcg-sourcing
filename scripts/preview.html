// ── Reverse lookup: card → [{diaryName, tier, role, task?}] ────────────────
// Each entry now carries the specific task text so card pages can show exactly
// which task uses the card, not just the area+tier.
var DIARY_BY_CARD = {};
(function _buildDiaryByCard() {
  function _add(card, diaryName, tier, role, taskText) {
    if (!card) return;
    card = card.toLowerCase();  // keyed lowercase — look up with name.toLowerCase()
    if (!DIARY_BY_CARD[card]) DIARY_BY_CARD[card] = [];
    // Avoid duplicate entries when same card appears at both tier and task level
    const key = `${diaryName}|${tier}|${role}|${taskText||''}`;
    if (DIARY_BY_CARD[card].some(e => `${e.diaryName}|${e.tier}|${e.role}|${e.task||''}` === key)) return;
    DIARY_BY_CARD[card].push({ diaryName, tier, role, task: taskText || null });
  }
  for (const area of DIARY_DATA) {
    for (const tier of DIARY_TIERS) {
      const t = area[tier];
      if (!t) continue;
      // Task-level: index items, monsters, npc from each individual task
      for (const taskObj of (t.tasks || [])) {
        if (typeof taskObj !== 'object') continue;
        const taskText = taskObj.task || null;
        for (const i of (taskObj.items    || [])) _add(i, area.name, tier, 'item',    taskText);
        for (const m of (taskObj.monsters || [])) _add(m, area.name, tier, 'monster', taskText);
        if (taskObj.npc) _add(taskObj.npc, area.name, tier, 'npc', taskText);
      }
    }
  }
})();

// ── Dev check: card/quest names in hand-written data ───────────────────────
// Runs after data load. Warns (console only) for any name in SLAYER_TASKS,
// SLAYER_CARD_GATES, BOSS_DATA or DIARY_DATA that isn't a TCG card, and any
// quest name missing from quests.json (would never match completedQuests).
// Diary `npc` fields are skipped — many task NPCs intentionally aren't cards.
function _validateDataNames() {
  if (!Object.keys(monsterDrops).length || !Object.keys(questsData).length) return;
  const bad = [];
  const card = (n, where) => { if (!_cardInfo(n)) bad.push(`card "${n}" (${where})`); };
  const quest = (q, where) => { if (!(q in questsData)) bad.push(`quest "${q}" (${where})`); };
  for (const [c, g] of Object.entries(SLAYER_CARD_GATES)) {
    card(c, 'SLAYER_CARD_GATES');
    (g.quests || []).forEach(q => quest(q, 'SLAYER_CARD_GATES ' + c));
  }
  for (const [m, v] of Object.entries(SLAYER_TASKS))
    for (const t of v.tasks) t.cards.forEach(c => card(c, `SLAYER_TASKS ${m}/${t.task}`));
  for (const b of BOSS_DATA) {
    ['monsters','kcMonsters','items','relatedCards'].forEach(k => (b[k] || []).forEach(c => card(c, `BOSS_DATA ${b.name}`)));
    (b.quests || []).forEach(q => quest(q, `BOSS_DATA ${b.name}`));
  }
  for (const qs of Object.values(AREA_QUESTS)) qs.forEach(q => quest(q, 'AREA_QUESTS'));
  for (const area of DIARY_DATA) for (const tier of DIARY_TIERS) {
    const t = area[tier]; if (!t) continue;
    const where = `DIARY_DATA ${area.name} ${tier}`;
    [...(t.items || []), ...(t.monsters || [])].forEach(c => card(c, where));
    (t.quests || []).forEach(q => quest(q, where));
    for (const x of (t.tasks || [])) {
      if (typeof x !== 'object') continue;
      [...(x.items || []), ...(x.monsters || [])].forEach(c => card(c, where));
      (x.quests || []).forEach(q => quest(q, where));
    }
  }
  if (bad.length) console.warn(`[data check] ${bad.length} unresolved name(s):\n  ` + [...new Set(bad)].join('\n  '));
  else console.info('[data check] all card and quest names resolve');
}

// ── Evaluate a single tier ──────────────────────────────────────────────────
function evaluateDiaryTier(area, tier) {
  const t = area[tier];
  if (!t) return null;

  // Tier-wide quests (true blockers — can't start any task without these)
  const tierQuestSet = new Set([
    ...(AREA_QUESTS[area.name] || []),
    ...(t.quests || []),
  ]);
  const blockers = [];
  for (const q of tierQuestSet) {
    if (!completedQuests.has(q)) blockers.push('Quest: ' + q);
  }

  // Collect all quests required by individual tasks (not already in tier quests)
  const taskQuestMap = new Map(); // quest → [{taskText}]
  for (const taskObj of (t.tasks || [])) {
    if (typeof taskObj !== 'object') continue;
    for (const q of (taskObj.quests || [])) {
      if (tierQuestSet.has(q)) continue; // already shown as tier-blocker
      if (!taskQuestMap.has(q)) taskQuestMap.set(q, []);
      taskQuestMap.get(q).push(taskObj.task || '');
    }
  }
  const taskQuestGates = [...taskQuestMap.entries()].map(([quest, tasks]) => ({
    quest,
    done: completedQuests.has(quest),
    tasks,
  }));

  // Skill gates (informational — shown amber, not hard blockers)
  const levelGates = [];
  for (const [skill, req] of Object.entries(t.skills || {})) {
    if (req <= 1) continue; // level 1 is no real requirement
    const have = getLevel(skill);
    levelGates.push({ skill, have, req, ok: have >= req });
  }

  // Item cards
  const ownedItems   = (t.items || []).filter(i => isOwned(i));
  const missingItems = (t.items || []).filter(i => !isOwned(i));

  // Monster cards
  const ownedMonsters   = (t.monsters || []).filter(m => isOwned(m));
  const missingMonsters = (t.monsters || []).filter(m => !isOwned(m));

  let status;
  if (blockers.length > 0) status = 'locked';
  else if (missingItems.length > 0 || missingMonsters.length > 0 || levelGates.some(g => !g.ok)) status = 'partial';
  else status = 'available';

  return { status, blockers, taskQuestGates, levelGates, ownedItems, missingItems, ownedMonsters, missingMonsters };
}

// ── Left-pane list ──────────────────────────────────────────────────────────
function renderDiaryList() {
  const listEl = document.getElementById('diary-list-scroll');
  if (!listEl) return;

  const q = diarySearch.toLowerCase();
  const filtered = DIARY_DATA.filter(a => !q || a.name.toLowerCase().includes(q));

  let html = '';
  for (const area of filtered) {
    const isSel = area.name === selectedDiary;

    // Compute per-tier status for pip dots (task-based)
    const pips = DIARY_TIERS.map(tier => {
      const t2 = area[tier];
      if (!t2) return '';
      const ev2   = evaluateDiaryTier(area, tier);
      const tasks2 = t2.tasks || [];
      const done2  = tasks2.filter((_, i) => isDiaryTicked(area.name, tier, 'task', String(i))).length;
      const skillsOk2 = ev2.levelGates.every(g => g.ok);
      let st2;
      if (done2 === tasks2.length && skillsOk2) st2 = 'available';
      else st2 = 'partial';
      const col = st2 === 'available' ? '#3a7a3a' : st2 === 'partial' ? '#7a6010' : '#5a2020';
      return `<span class="diary-tier-pip" style="background:${col}" title="${DIARY_TIER_LABEL[tier]}: ${st2}"></span>`;
    }).join('');

    html += `<div class="diary-item${isSel?' selected':''}" onclick="showDiary('${escHtml(area.name)}')">
      <div style="font-size:12px;color:${isSel?'#e8c97a':'#bbb'};margin-bottom:3px">${escHtml(area.name)}</div>
      <div>${pips}</div>
    </div>`;
  }

  if (!html) html = `<div style="padding:16px;color:#444;font-size:12px">No diaries match.</div>`;
  listEl.innerHTML = html;
}

// ── Diary tick helpers (localStorage-backed manual task completion) ──────────
function _diaryTickKey(dn, tier, type, task) {
  return `dtick\x1f${dn}\x1f${tier}\x1f${type}\x1f${task}`;
}
function isDiaryTicked(dn, tier, type, task) {
  return localStorage.getItem(_diaryTickKey(dn, tier, type, task)) === '1';
}
function toggleDiaryTick(dn, tier, type, task) {
  const k = _diaryTickKey(dn, tier, type, task);
  if (localStorage.getItem(k) === '1') localStorage.removeItem(k);
  else localStorage.setItem(k, '1');
  showDiaryDetail(dn);
}
function selectDiaryTier(dn, tier) {
  selectedDiaryTier = tier;
  showDiaryDetail(dn);
}

// Wishlist all missing cards from a diary tier
function wishlistDiaryTier(diaryName, tier) {
  const area = DIARY_DATA.find(a => a.name === diaryName);
  if (!area || !area[tier]) return;
  const t = area[tier];
  const label = `${diaryName} ${tier.charAt(0).toUpperCase()+tier.slice(1)}`;
  let added = 0;
  for (const card of [...(t.items||[]), ...(t.monsters||[])]) {
    if (!isOwned(card) && !wishlist.has(card)) {
      wishlist.set(card, { note: label });
      added++;
    }
  }
  if (added > 0) _saveWishlist();
  // Brief feedback flash on button
  const btn = document.getElementById(`wl-tier-btn-${tier}`);
  if (btn) { btn.textContent = `+${added} added`; btn.style.color='#76c442'; setTimeout(()=>{ btn.textContent='☆ Wishlist missing'; btn.style.color=''; }, 1800); }
}

// ── Right-pane detail ───────────────────────────────────────────────────────
function showDiaryDetail(name) {
  selectedDiary = name;
  renderDiaryList();

  const pane = document.getElementById('diary-detail-pane');
  if (!pane) return;

  const area = DIARY_DATA.find(a => a.name === name);
  if (!area) return;

  // Default tier selection
  if (!selectedDiaryTier || !area[selectedDiaryTier]) {
    selectedDiaryTier = DIARY_TIERS.find(t => area[t]) || 'easy';
  }

  // Count ticked tasks out of total tasks for a tier
  function countTasks(tier) {
    const t = area[tier];
    if (!t) return { done: 0, total: 0 };
    const tasks = t.tasks || [];
    const done  = tasks.filter((_, i) => isDiaryTicked(name, tier, 'task', String(i))).length;
    return { done, total: tasks.length };
  }

  // Status for the top strip chip
  function chipStatus(tier) {
    const t = area[tier];
    if (!t) return null;
    const ev = evaluateDiaryTier(area, tier);
    const c = countTasks(tier);
    const skillsOk = ev.levelGates.every(g => g.ok);
    return (c.done === c.total && skillsOk) ? 'available' : 'partial';
  }

  const wikiHref = `https://oldschool.runescape.wiki/w/${encodeURIComponent(area.name.replace(/ /g,'_'))}_Diary`;

  // ── Top summary strip ──────────────────────────────────────────────────────
  let html = `<div style="padding:20px 24px;max-width:820px">
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
      <h1 style="font-size:18px;color:#e8c97a;margin:0">${escHtml(area.name)} Diary</h1>
      <a href="${wikiHref}" target="_blank" style="font-size:11px;color:#4a6a8a;text-decoration:none">\u2197 wiki</a>
    </div>
    ${area.rewardNpc ? (() => {
      const ci = _cardInfo(area.rewardNpc);
      if (!ci) {
        return `<div style="font-size:11px;color:#555;margin-bottom:12px;display:flex;align-items:center;gap:6px">Collect rewards from:
          <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;background:#111;border:1px solid #252525;color:#555;font-size:11px"
            title="This NPC is not a TCG card">${escHtml(area.rewardNpc)} <span style="font-size:9px;opacity:0.5">not a card</span></span>
        </div>`;
      }
      const npcOwned = isOwned(ci.exact);
      const npcCol   = npcOwned ? '#5a9a5a' : '#c05050';
      const npcBg    = npcOwned ? '#0a180a' : '#180808';
      const npcBdr   = npcOwned ? '#2a5a2a' : '#5a2a2a';
      const npcSym   = npcOwned ? '\u2713' : '\u2717';
      return `<div style="font-size:11px;color:#555;margin-bottom:12px;display:flex;align-items:center;gap:6px">Collect rewards from:
        <span data-card="${escHtml(ci.exact)}" data-type="${ci.type}" onclick="showCard(this.dataset.card,this.dataset.type)"
          style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;background:${npcBg};border:1px solid ${npcBdr};color:${npcCol};cursor:pointer;font-size:11px"
          title="${npcOwned?'Owned — click to view':'Not owned — click to view'}">${npcSym} ${escHtml(area.rewardNpc)}</span>
      </div>`;
    })() : '<div style="margin-bottom:12px"></div>'}
    <div style="display:flex;gap:8px;margin-bottom:20px">`;

  for (const tier of DIARY_TIERS) {
    if (!area[tier]) continue;
    const st     = chipStatus(tier);
    const c      = countTasks(tier);
    const isAct  = tier === selectedDiaryTier;
    const stCol  = st==='available'?'#76c442':st==='partial'?'#c8a020':'#c85040';
    const stLbl  = st==='available'?'Ready'  :st==='partial'?'Partial':'Locked';
    const aBg    = isAct ? DIARY_TIER_BG[tier]   : '#0e0e0e';
    const aBdr   = isAct ? DIARY_TIER_COLOR[tier] : '#2a2a2a';

    html += `<div data-dn="${escHtml(name)}" data-tier="${tier}"
        onclick="selectDiaryTier(this.dataset.dn,this.dataset.tier)"
        style="flex:1;min-width:100px;padding:10px 12px;background:${aBg};border:2px solid ${aBdr};border-radius:6px;cursor:pointer">
      <div style="font-size:12px;font-weight:700;color:${DIARY_TIER_COLOR[tier]};margin-bottom:3px">${DIARY_TIER_LABEL[tier]}</div>
      <div style="font-size:11px;color:${stCol};margin-bottom:3px">${stLbl}</div>
      <div style="font-size:10px;color:#555">${c.done}/${c.total} tasks</div>
    </div>`;
  }
  html += `</div>`;

  // ── Selected tier detail ───────────────────────────────────────────────────
  const tier = selectedDiaryTier;
  const t = area[tier];
  if (t) {
    const ev = evaluateDiaryTier(area, tier);
    const hasMissingCards = [...(t.items||[]),...(t.monsters||[])].some(c => !isOwned(c));

    html += `<div style="background:#111;border-radius:6px;border:1px solid #222;padding:14px 16px">`;

    // Header: tier name + wishlist button
    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="font-size:13px;font-weight:700;color:${DIARY_TIER_COLOR[tier]}">${DIARY_TIER_LABEL[tier]}</span>
      ${hasMissingCards ? `<button id="wl-tier-btn-${tier}"
        data-dn="${escHtml(name)}" data-tier="${tier}"
        onclick="wishlistDiaryTier(this.dataset.dn,this.dataset.tier)"
        style="font-size:10px;background:none;border:1px solid #333;border-radius:3px;color:#666;padding:2px 8px;cursor:pointer">☆ Wishlist missing cards</button>` : ''}
    </div>`;

    // ── Prerequisites (compact auto-detected section) ────────────────────────
    const hasPrereqs = ev.blockers.length || ev.levelGates.length || ev.taskQuestGates.length;
    if (hasPrereqs) {
      html += `<div style="margin-bottom:14px;padding:10px 12px;background:#0a0a0a;border-radius:4px;border:1px solid #1a1a1a">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#3a3a3a;margin-bottom:7px">Prerequisites</div>`;

      // Tier-wide quest requirements (block the whole tier)
      for (const b of ev.blockers) {
        const qName = b.replace(/^Quest: /, '');
        const done  = completedQuests.has(qName);
        const col   = done ? '#4a7a4a' : '#7a3a3a';
        const icon  = done ? '\u2713' : '\u2717';
        html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:${col}">
          <span>${icon}</span><span>${escHtml(qName)}</span></div>`;
      }

      // Skill requirements
      for (const { skill, have, req, ok } of ev.levelGates) {
        const col     = ok ? '#4a7a4a' : '#7a6a20';
        const icon    = ok ? '\u2713' : '\u26a0\ufe0f';
        const lvlText = ok ? `${req}` : `${have}/${req}`;
        html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:${col}">
          <span>${icon}</span>${skillIcon(skill,13)}<span>${skill} ${lvlText}</span></div>`;
      }

      // Per-task quest requirements (only block individual tasks)
      if (ev.taskQuestGates.length) {
        if (ev.blockers.length || ev.levelGates.length) {
          html += `<div style="margin-top:6px;border-top:1px solid #1a1a1a"></div>`;
        }
        html += `<div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#2a2a2a;margin:5px 0 3px">Some tasks require</div>`;
        for (const { quest, done, tasks } of ev.taskQuestGates) {
          const col  = done ? '#4a7a4a' : '#7a3a3a';
          const icon = done ? '\u2713' : '\u2717';
          const tip  = tasks.join('; ');
          html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:${col}" title="${escHtml(tip)}">
            <span>${icon}</span><span>${escHtml(quest)}</span></div>`;
        }
      }

      html += `</div>`;
    }

    // ── Task checklist ───────────────────────────────────────────────────────
    const tasks = t.tasks || [];
    if (tasks.length) {
      html += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#3a3a3a;margin-bottom:6px">Tasks</div>`;
      tasks.forEach((taskObj, i) => {
        const taskText    = typeof taskObj === 'object' ? taskObj.task : taskObj;
        const rawSkills   = (typeof taskObj === 'object' && taskObj.skills)   ? taskObj.skills   : {};
        // Filter out non-numeric keys the data script may have nested inside skills
        const reqSkills   = Object.fromEntries(Object.entries(rawSkills).filter(([,v]) => typeof v === 'number'));
        const nestedItems = Array.isArray(rawSkills.items) ? rawSkills.items : [];
        const nestedTools = Array.isArray(rawSkills.tools) ? rawSkills.tools : [];
        const reqItems    = [...(typeof taskObj === 'object' && taskObj.items   ? taskObj.items   : []), ...nestedItems];
        const reqMonsters = (typeof taskObj === 'object' && taskObj.monsters) ? taskObj.monsters : [];
        const reqNpc      = (typeof taskObj === 'object' && taskObj.npc)      ? taskObj.npc      : null;
        const reqTools    = [...(typeof taskObj === 'object' && taskObj.tools  ? taskObj.tools   : []), ...nestedTools];
        const _areaQuests = (typeof AREA_QUESTS !== 'undefined' && AREA_QUESTS[name]) ? AREA_QUESTS[name] : [];
        const _taskQuests = (typeof taskObj === 'object' && taskObj.quests) ? taskObj.quests : [];
        const reqQuests   = [...new Set([..._areaQuests, ..._taskQuests])];

        const ticked = isDiaryTicked(name, tier, 'task', String(i));
        const boxBdr = ticked ? '#2a5a2a' : '#303030';
        const boxBg  = ticked ? '#1a3a1a' : '#141414';
        const rowBg  = ticked ? '#080e08' : '#0c0c0c';
        const rowBdr = ticked ? '#182218' : '#181818';

        // Build inline requirement badges
        let reqHtml = '';
        for (const [skill, req] of Object.entries(reqSkills)) {
          const have = getLevel(skill);
          const ok   = have >= req;
          const col  = ok ? '#2a5a2a' : '#4a3a0a';
          const tcol = ok ? '#4a9a4a' : '#a08020';
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:${ok?'#0d1e0d':'#161000'};border:1px solid ${col};font-size:10px;color:${tcol}">${skillIcon(skill,10)}${escHtml(skill)} ${req}</span>`;
        }
        for (const q of reqQuests) {
          const done = completedQuests.has(q);
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:${done?'#0a180a':'#180808'};border:1px solid ${done?'#2a5a2a':'#5a2a2a'};font-size:10px;color:${done?'#5a9a5a':'#c05050'}"
            title="${done?'Quest complete':'Quest required'}">${done?'\u2713':'\u2717'} ${escHtml(q)}</span>`;
        }
        // Helper: render a card chip — green ✓ if owned, red ✗ if not; grey if not a card
        function chipFor(displayName, fallbackType) {
          const ci = _cardInfo(displayName);
          if (!ci) {
            return `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:#111;border:1px solid #252525;font-size:10px;color:#555"
              title="Not a TCG card">${escHtml(displayName)}</span>`;
          }
          const owned = isOwned(ci.exact);
          const bg  = owned ? '#0a180a' : '#180808';
          const bdr = owned ? '#2a5a2a' : '#5a2a2a';
          const col = owned ? '#5a9a5a' : '#c05050';
          const sym = owned ? '\u2713'  : '\u2717';
          return `<span data-card="${escHtml(ci.exact)}" data-type="${ci.type}" onclick="showCard(this.dataset.card,this.dataset.type);event.stopPropagation()"
            style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:${bg};border:1px solid ${bdr};font-size:10px;color:${col};cursor:pointer"
            title="${owned?'Owned \u2014 click to view':'Not owned \u2014 click to view'}">${sym} ${escHtml(displayName)}</span>`;
        }
        for (const item of reqItems) {
          reqHtml += chipFor(item, 'item');
        }
        for (const mon of reqMonsters) {
          reqHtml += chipFor(mon, 'monster');
        }
        if (reqNpc) {
          reqHtml += chipFor(reqNpc, 'monster');
        }
        for (const tool of reqTools) {
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:#111418;border:1px solid #252030;font-size:10px;color:#666"
            title="Tool required">\u2692 ${escHtml(tool)}</span>`;
        }

        html += `<div style="display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:4px;border:1px solid ${rowBdr};background:${rowBg};margin-bottom:3px">
          <div data-dn="${escHtml(name)}" data-tier="${tier}" data-idx="${i}"
            onclick="toggleDiaryTick(this.dataset.dn,this.dataset.tier,'task',String(this.dataset.idx))"
            style="width:16px;height:16px;flex-shrink:0;margin-top:1px;border-radius:3px;border:1px solid ${boxBdr};background:${boxBg};display:flex;align-items:center;justify-content:center;cursor:pointer"
            title="${ticked?'Click to un-tick':'Click to mark done'}">
            ${ticked?`<span style="color:#76c442;font-size:11px;line-height:1">\u2713</span>`:''}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;color:${ticked?'#666':'#aaa'};line-height:1.4;${ticked?'text-decoration:line-through;':''}">${escHtml(taskText)}</div>
            ${reqHtml ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">${reqHtml}</div>` : ''}
          </div>
        </div>`;
      });
    }

    html += `</div>`;
  }

  html += `</div>`;
  pane.innerHTML = html;
}

function showDiary(name) {
  if (activeTab !== 'diaries') {
    pushHistoryEntry();
    selectedDiary = name;
    _renderTab('diaries', false);
  } else {
    if (name !== selectedDiary) pushHistoryEntry();
    showDiaryDetail(name);
  }
}

// ─── Old single-pane boss render (kept for reference, no longer used) ───────
function _renderBossingLegacy() {
  const el = document.getElementById('bosses-content');
  if (!el) return;

  const CATEGORIES = [
    { key:'raid',      label:'Raids & Instanced Content' },
    { key:'skilling',  label:'Skilling Bosses' },
    { key:'boss',      label:'Regular Bosses' },
    { key:'wilderness',label:'Wilderness Bosses' },
  ];

  const STATUS_ORDER = { available:0, partial:1, locked:2 };

  let html = '';
  for (const { key, label } of CATEGORIES) {
    const bosses = BOSS_DATA.filter(b => b.category === key);
    const evaluated = bosses.map(b => ({ boss:b, ...evaluateBoss(b) }));
    evaluated.sort((a,b) => {
      const so = STATUS_ORDER[a.status] - STATUS_ORDER[b.status];
      if (so !== 0) return so;
      // Within same status, sort by card completion % desc (boss room + KC combined)
      const aTotal = (a.boss.monsters || []).length + (a.boss.kcMonsters || []).length;
      const bTotal = (b.boss.monsters || []).length + (b.boss.kcMonsters || []).length;
      const aPct = aTotal ? (a.ownedMonsters.length + a.ownedKcMonsters.length) / aTotal : 1;
      const bPct = bTotal ? (b.ownedMonsters.length + b.ownedKcMonsters.length) / bTotal : 1;
      return bPct - aPct;
    });

    const avail = evaluated.filter(e => e.status === 'available').length;
    const partial = evaluated.filter(e => e.status === 'partial').length;

    html += `<div class="section" style="margin-bottom:20px">
      <div class="section-header">${label}
        <span style="font-size:10px;font-weight:400;color:#555;margin-left:8px">${avail} ready · ${partial} partial</span>
      </div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">`;

    for (const { boss, status, ownedMonsters, missingMonsters, ownedKcMonsters, missingKcMonsters, blockers, levelGates, missingItems, missingTools, ownedToolName, optionalOwned, optionalMissing, warmOwned, warmMissing, lightOwned, lightMissing } of evaluated) {
      const total = (boss.monsters || []).length;
      const owned = ownedMonsters.length;
      const indCol = status === 'available' ? '#76c442' : status === 'partial' ? '#c8a020' : '#6a2a2a';
      const indBg  = status === 'available' ? '#0d2210' : status === 'partial' ? '#1a1400' : '#1a0808';
      const indBorder = status === 'available' ? '#2a5a2a' : status === 'partial' ? '#3a2a00' : '#4a1a1a';

      // KC chips — shown as a labelled sub-section if present
      let kcHtml = '';
      if ((boss.kcMonsters || []).length > 0) {
        const kcTotal = boss.kcMonsters.length;
        const kcOwned = ownedKcMonsters.length;
        const kcCol = kcOwned === kcTotal ? '#76c442' : kcOwned > 0 ? '#c8a020' : '#555';
        let kcChips = '';
        for (const m of boss.kcMonsters) {
          const own = isOwned(m); const safe = escHtml(m);
          const type = _cardType(m) || 'monster';
          kcChips += `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#555'};background:${own?'#0d2210':'#111'};border:1px solid ${own?'#2a5a2a':'#222'};border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap"
            data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">${own?'✓ ':''}${safe}</span>`;
        }
        kcHtml = `<div style="margin-bottom:4px"><span style="font-size:9px;color:${kcCol};letter-spacing:0.04em;margin-right:5px;text-transform:uppercase">KC ${kcOwned}/${kcTotal}</span><span style="display:inline-flex;flex-wrap:wrap;gap:3px">${kcChips}</span></div>`;
      }

      // Build card chips — boss room monsters
      let chipsHtml = '';
      for (const m of (boss.monsters || [])) {
        const own = isOwned(m);
        const safe = escHtml(m);
        const type = _cardType(m) || 'monster';
        chipsHtml += `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#555'};background:${own?'#0d2210':'#111'};border:1px solid ${own?'#2a5a2a':'#222'};border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap"
          data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">${own?'✓ ':''}${safe}</span>`;
      }
      // Item chips — required
      for (const item of (boss.items || [])) {
        if (!itemSources[item]) continue;
        const own = isOwned(item);
        const safe = escHtml(item);
        chipsHtml += `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#e8a030'};background:${own?'#0d2210':'#1a0f00'};border:1px solid ${own?'#2a5a2a':'#4a2800'};border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap"
          data-card="${safe}" data-type="item" onclick="showCard(this.dataset.card,'item')">${own?'✓ ':'⚑ '}${safe}</span>`;
      }
      // Tool chips — always "Axe (any)" style; tooltip shows best owned tier
      for (const toolKey of (boss.tools || [])) {
        const ownedName = ownedToolName[toolKey];
        const label = escHtml(toolKey) + ' (any)';
        const col = ownedName ? '#76c442' : '#e8a030';
        const bg  = ownedName ? '#0d2210' : '#1a0f00';
        const bdr = ownedName ? '#2a5a2a' : '#4a2800';
        const tip = ownedName ? `title="Best owned: ${ownedName}"` : `title="No ${toolKey} owned"`;
        chipsHtml += `<span ${tip} style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${col};background:${bg};border:1px solid ${bdr};border-radius:3px;padding:1px 5px;white-space:nowrap">${ownedName?'✓ ':'⚑ '}${label}</span>`;
      }
      // Optional item chips — grey with "optional" marker
      for (const item of [...(optionalOwned||[]), ...(optionalMissing||[])]) {
        const own = isOwned(item);
        const safe = escHtml(item);
        chipsHtml += `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#444'};background:#111;border:1px solid #222;border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap;opacity:0.75"
          data-card="${safe}" data-type="item" onclick="showCard(this.dataset.card,'item')" title="Optional">${own?'✓ ':''}${safe} <span style="color:#333;font-size:9px">opt</span></span>`;
      }
      // Related cards — purely informational (grey)
      for (const card of (boss.relatedCards || [])) {
        const own = isOwned(card);
        const safe = escHtml(card);
        const type = _cardType(card) || 'item';
        chipsHtml += `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#444'};background:#111;border:1px dashed ${own?'#2a5a2a':'#333'};border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap;opacity:0.7"
          data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)" title="Related">${own?'✓ ':''}${safe}</span>`;
      }

      // Blocker badges
      let blockersHtml = '';
      for (const b of blockers) {
        blockersHtml += `<span style="font-size:10px;color:#c85040;background:#1a0808;border:1px solid #4a1a1a;border-radius:3px;padding:1px 6px;white-space:nowrap">✗ ${escHtml(b)}</span>`;
      }

      // Level gate badges — amber informational (from evaluateBoss levelGates)
      let lvlHtml = '';
      for (const { skill, have, req, ok } of (levelGates || [])) {
        const col = ok ? '#76c442' : '#c8a020';
        const bg  = ok ? '#0d2210' : '#1a1400';
        const bdr = ok ? '#2a5a2a' : '#3a2a00';
        lvlHtml += `<span style="font-size:10px;color:${col};background:${bg};border:1px solid ${bdr};border-radius:3px;padding:1px 6px;white-space:nowrap">${skill} ${have}/${req}</span>`;
      }

      const kcTotal = (boss.kcMonsters || []).length;
      const progressStr = (total + kcTotal) > 0 ? `${owned + ownedKcMonsters.length}/${total + kcTotal} cards` : '';

      html += `<div style="background:${indBg};border:1px solid ${indBorder};border-radius:4px;padding:8px 10px">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:${(chipsHtml||blockersHtml||lvlHtml)?'6px':'0'}">
          <span style="font-size:12px;font-weight:600;color:${indCol};flex:1">${escHtml(boss.name)}</span>
          ${progressStr ? `<span style="font-size:10px;color:${status==='available'?'#76c442':status==='partial'?'#c8a020':'#666'};flex-shrink:0">${progressStr}</span>` : ''}
        </div>
        ${lvlHtml || blockersHtml ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:${(kcHtml||chipsHtml)?'5px':'0'}">${lvlHtml}${blockersHtml}</div>` : ''}
        ${chipsHtml ? `<div>${boss.kcMonsters && boss.kcMonsters.length ? `<span style="font-size:9px;color:#555;letter-spacing:0.04em;text-transform:uppercase;margin-right:5px">Boss room</span>` : ''}<span style="display:inline-flex;flex-wrap:wrap;gap:3px">${chipsHtml}</span></div>` : ''}
        ${kcHtml}
        ${boss.warmClothing ? (() => {
          const wTotal = boss.warmClothing.length;
          const wOwned = warmOwned.length;
          const wCapped = wOwned >= 4;
          const wCol = wCapped ? '#76c442' : wOwned > 0 ? '#c8a020' : '#555';
          const wChips = boss.warmClothing.map(item => {
            const own = isOwned(item); const safe = escHtml(item);
            return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#444'};background:#111;border:1px solid ${own?'#2a5a2a':'#222'};border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap"
              data-card="${safe}" data-type="item" onclick="showCard(this.dataset.card,'item')">${own?'✓ ':''}${safe}</span>`;
          }).join('');
          return `<div style="margin-top:5px"><span style="font-size:10px;color:${wCol};margin-right:6px">Warm clothing ${wOwned}/${wTotal} owned${wCapped?' (capped)':wOwned>=4?' (capped)':''}</span><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:3px">${wChips}</div></div>`;
        })() : ''}
        ${boss.lightSource ? (() => {
          const lOwned = lightOwned.length;
          const lTotal = LIGHT_SOURCE_ITEMS.length;
          const lCol = lOwned > 0 ? '#76c442' : '#e8a030';
          const lChips = LIGHT_SOURCE_ITEMS.map(item => {
            const own = isOwned(item); const safe = escHtml(item);
            return `<span style="display:inline-flex;align-items:center;gap:2px;font-size:10px;color:${own?'#76c442':'#444'};background:#111;border:1px solid ${own?'#2a5a2a':'#222'};border-radius:3px;padding:1px 5px;cursor:pointer;white-space:nowrap"
              data-card="${safe}" data-type="item" onclick="showCard(this.dataset.card,'item')">${own?'✓ ':''}${safe}</span>`;
          }).join('');
          return `<div style="margin-top:5px"><span style="font-size:10px;color:${lCol};margin-right:6px">Light source — ${lOwned}/${lTotal} owned (need 1)</span><div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:3px">${lChips}</div></div>`;
        })() : ''}
        ${boss.note ? `<div style="font-size:10px;color:#444;margin-top:4px">${escHtml(boss.note)}</div>` : ''}
      </div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

// ─── Questing tab ──────────────────────────────────────────────────────────

/**
 * Check whether all card groups for a quest are satisfied using BM data.
 * Returns {cardsOk, missingCount} where cardsOk=true means all groups have ≥1 owned card.
 * Falls back to quests.json itemsRequired + killsRequired if no BM data.
 */
function checkQuestCards(name, q) {
  const bm = bmQuestCards[name];
  if (bm) {
    let missing = 0;
    // Schema 2: sections → requirements → {cards, type}
    for (const section of (bm.sections || [])) {
      for (const req of (section.requirements || [])) {
        const cards = req.cards || [];
        if (!cards.length) continue;
        if (req.optional) continue;  // avoidable — not counted as blocking
        // skillAlt: requirement satisfied if player has the skill level alternative
        const altOk = req.skillAlt
          ? getLevel(req.skillAlt.skill) >= req.skillAlt.level
          : false;
        if (altOk) continue;
        if (req.type === 'enemy' || req.type === 'npc') {
          // Each card must be owned individually
          for (const card of cards) { if (!isOwned(card)) missing++; }
        } else {
          // Item: any-of group — at least one owned satisfies the requirement
          if (!cards.some(card => isOwned(card))) missing++;
        }
      }
    }
    return { cardsOk: missing === 0, missingCount: missing };
  }
  // Fallback to wiki infobox data
  const missingItems = (q.itemsRequired || []).filter(i => !isOwned(i));
  const missingKills = (q.killsRequired || []).filter(k => !isOwned(k));
  const missing = missingItems.length + missingKills.length;
  return { cardsOk: missing === 0, missingCount: missing };
}

function computeCompletableQuests() {
  /**
   * Iteratively propagate completability. A quest is completable if:
   *   - Manually marked done (always counts — player has finished it)
   *   - All prerequisites are completable/done (or not in our dataset)
   *   - All skill requirements are met (player level >= req)
   *   - All card groups satisfied (prefer BM data; fallback to wiki infobox)
   * Returns a Set of completable quest names (includes done quests).
   */
  const completable = new Set(completedQuests); // done quests seed the set
  let changed = true;
  while (changed) {
    changed = false;
    for (const [name, q] of Object.entries(questsData)) {
      if (completable.has(name)) continue;
      const prereqsOk = (q.prerequisites || []).every(p => completable.has(p) || !questsData[p]);
      const skillsOk  = (q.skillRequirements || []).every(r => getLevel(r.skill) >= r.level);
      const { cardsOk } = checkQuestCards(name, q);
      if (prereqsOk && skillsOk && cardsOk) {
        completable.add(name); changed = true;
      }
    }
  }
  return completable;
}

function questStatus(questName, completable) {
  if (completedQuests.has(questName)) return 'done';
  const q = questsData[questName];
  if (!q) return 'locked';
  if (completable.has(questName)) return 'ok';
  // "Close" = prereqs completable + skills ok, but missing ≤2 cards
  const prereqsOk = (q.prerequisites || []).every(p => completable.has(p) || !questsData[p]);
  const skillsOk  = (q.skillRequirements || []).every(r => getLevel(r.skill) >= r.level);
  if (!prereqsOk || !skillsOk) return 'locked';
  const { missingCount } = checkQuestCards(questName, q);
  if (missingCount <= 2) return 'close';
  return 'locked';
}

function isMiniquest(name) {
  // A quest is a miniquest if BM data flags it, or if it has 0 quest points and
  // isn't in the main BM quest list (best-effort for wiki-only entries).
  if (bmQuestCards[name]?._miniquest) return true;
  if (!bmQuestCards[name] && questsData[name]?.questPoints === 0) return true;
  return false;
}

function questItemHtml(name, data, completable) {
  const st = questStatus(name, completable);
  const badge = st === 'done' ? '☑' : (st === 'ok' ? '✓' : (st === 'close' ? '~' : '✗'));
  const doneCls = st === 'done' ? ' done-quest' : '';
  const sel = name === selectedQuest ? ' selected' : '';
  const qp = data.questPoints ? `<span class="quest-qp">${data.questPoints}qp</span>` : '';
  const mem = data.members ? `<span class="quest-members-tag">M</span>` : '';
  const mini = isMiniquest(name) ? `<span class="quest-miniquest-tag">mini</span>` : '';
  return `<div class="quest-item${sel}${doneCls}" data-quest="${escHtml(name)}" onclick="showQuestDetail(this.dataset.quest)">
    <span class="quest-badge ${st}">${badge}</span>
    <span class="quest-name">${name}</span>
    ${qp}${mem}${mini}
  </div>`;
}

function renderQuestStats(completable) {
  const el = document.getElementById('quest-stats');
  if (!el) return;

  let doneCount = 0, doneQP = 0;
  let availCount = 0, availQP = 0;
  let totalCount = 0, totalQP = 0;

  for (const [name, q] of Object.entries(questsData)) {
    const qp = q.questPoints || 0;
    totalCount++;
    totalQP += qp;
    if (completedQuests.has(name)) {
      doneCount++; doneQP += qp;
    } else if (completable.has(name)) {
      availCount++; availQP += qp;
    }
  }

  el.innerHTML = `
    <div class="qstat done-col">
      <div class="qstat-val">${doneCount}</div>
      <div class="qstat-sub">Completed</div>
      <div class="qstat-qp">${doneQP} QP</div>
    </div>
    <div class="qstat avail-col">
      <div class="qstat-val">${availCount}</div>
      <div class="qstat-sub">Available</div>
      <div class="qstat-qp">+${availQP} QP</div>
    </div>
    <div class="qstat">
      <div class="qstat-val">${totalCount}</div>
      <div class="qstat-sub">Total</div>
      <div class="qstat-qp">${totalQP} QP</div>
    </div>`;
}

function renderQuestList() {
  const scroll = document.getElementById('quest-list-scroll');
  if (!scroll) return;
  const search = (document.getElementById('quest-search')?.value || '').toLowerCase();
  const f      = document.getElementById('quest-filter')?.value || 'all';
  const completable = computeCompletableQuests();
  renderQuestStats(completable);

  const orderMap = {ok:0, close:1, locked:2, done:3};
  const sortFn = ([an], [bn]) => {
    const as = questStatus(an, completable), bs = questStatus(bn, completable);
    if (orderMap[as] !== orderMap[bs]) return orderMap[as] - orderMap[bs];
    return an.localeCompare(bn);
  };

  let mainQuests = [], miniquests = [];
  for (const [name, data] of Object.entries(questsData)) {
    if (search && !name.toLowerCase().includes(search)) continue;
    const st = questStatus(name, completable);
    if (f === 'ok'      && st !== 'ok')       continue;
    if (f === 'close'   && st !== 'close')    continue;
    if (f === 'done'    && st !== 'done')     continue;
    if (f === 'notdone' && st === 'done')     continue;
    if (f === 'free'    && data.members)      continue;
    if (f === 'members' && !data.members)     continue;
    if (isMiniquest(name)) miniquests.push([name, data]);
    else                   mainQuests.push([name, data]);
  }

  mainQuests.sort(sortFn);
  miniquests.sort(sortFn);

  const doneMain  = mainQuests.filter(([n]) => completedQuests.has(n)).length;
  const doneMini  = miniquests.filter(([n]) => completedQuests.has(n)).length;

  let html = '';
  if (mainQuests.length) {
    const doneStr = doneMain ? ` · ${doneMain} done` : '';
    html += `<div class="quest-section-header">Quests (${mainQuests.length}${doneStr})</div>`;
    for (const [name, data] of mainQuests) html += questItemHtml(name, data, completable);
  }
  if (miniquests.length) {
    const doneStr = doneMini ? ` · ${doneMini} done` : '';
    html += `<div class="quest-section-header" style="margin-top:4px">Miniquests (${miniquests.length}${doneStr}) — wiki data only</div>`;
    for (const [name, data] of miniquests) html += questItemHtml(name, data, completable);
  }
  if (!html) html = `<div style="padding:12px;color:#444;font-size:12px">No quests match this filter.</div>`;
  scroll.innerHTML = html;
}

function showQuestDetail(questName, push = true) {
  if (push) pushHistoryEntry();
  selectedQuest = questName;
  // Hide welcome panel, update list selection
  const welcome = document.getElementById('quest-welcome');
  if (welcome) welcome.style.display = 'none';
  document.querySelectorAll('.quest-item').forEach(el => {
    el.classList.toggle('selected', el.querySelector('.quest-name')?.textContent === questName);
  });

  const pane = document.getElementById('quest-detail-pane');
  if (!pane) return;
  const q = questsData[questName];
  if (!q) { pane.innerHTML = `<div class="placeholder">Quest data not found.</div>`; return; }

  const completable = computeCompletableQuests();
  const st = questStatus(questName, completable);
  const mini = isMiniquest(questName);

  const statusColor = st === 'ok' ? '#3a9a3a' : (st === 'close' ? '#c8a020' : '#9a3a3a');
  const statusLabel = st === 'ok' ? 'Completable' : (st === 'close' ? 'Almost ready' : 'Locked');

  // Subtitle
  const typeStr = mini
    ? (q.members ? 'Members miniquest' : 'Free miniquest')
    : (q.members ? 'Members quest' : 'Free quest');
  const qpStr   = q.questPoints ? ` · ${q.questPoints} quest point${q.questPoints!==1?'s':''}` : '';

  const isDone = completedQuests.has(questName);
  const doneBtn = `<button data-quest="${escHtml(questName)}" onclick="toggleQuestDone(this.dataset.quest)"
    style="float:right;margin-top:2px;padding:4px 10px;font-size:11px;cursor:pointer;border-radius:3px;border:1px solid;
      ${isDone
        ? 'background:#2a1e08;border-color:#7a5020;color:#b07a30'
        : 'background:#0e1e0e;border-color:#2a5a2a;color:#4a9a4a'}">
    ${isDone ? '✓ Completed — mark undone' : 'Mark as completed'}
  </button>`;

  const _bmWishCards = (bmQuestCards[questName]?.sections || [])
    .flatMap(s => s.requirements || [])
    .flatMap(r => r.cards || [])
    .filter((c, i, a) => a.indexOf(c) === i); // dedupe
  const _bmMissing = _bmWishCards.filter(c => !isOwned(c) && !wishlist.has(c));
  const _qnSafe = questName.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const wishQuestBtn = _bmWishCards.length
    ? `<button data-quest="${_qnSafe}" onclick="const n=wishlistQuest(this.dataset.quest);this.textContent=n?'★ Wishlisted!':'★ Already wishlisted';this.disabled=true;this.style.color='#888'"
        style="margin-left:8px;background:none;border:1px solid #3a3a1a;color:#9a9a3a;padding:3px 9px;border-radius:3px;font-size:10px;cursor:pointer">
        ☆ Wishlist quest cards${_bmMissing.length ? ' ('+_bmMissing.length+' missing)' : ''}
      </button>`
    : '';

  let html = `<h1>${questName} ${wikiLink(questName)}
    <span style="font-size:12px;color:${isDone?'#b07a30':statusColor};font-weight:normal;margin-left:8px">${isDone?'Done':statusLabel}</span>
  </h1>
  <div class="subtitle">${typeStr}${qpStr} ${doneBtn}${wishQuestBtn}</div>`;

  if (mini) {
    html += `<div style="background:#150e1a;border:1px solid #3a2850;border-radius:4px;padding:8px 12px;margin:10px 0;font-size:11px;color:#8a6aaa;line-height:1.6">
      ⚠ <strong style="color:#a080cc">Miniquest</strong> — requirements shown here come from the OSRS wiki infobox only.
      Mid-quest items and exact card names may be missing. Check the wiki for the full walkthrough.
    </div>`;
  }

  if (q.questNpc) {
    const _bmForNpc = bmQuestCards[questName];
    const _hasNpcSection = _bmForNpc?.sections?.some(s => s.label === 'NPC Interactions');
    if (!_hasNpcSection) {
      html += `<div class="section">
        <div class="section-header">Start NPC</div>
        <div style="margin-top:8px;font-size:13px;color:#aaa">${q.questNpc} <span style="color:#555;font-size:11px">(talk to — no card required)</span></div>
      </div>`;
    }
  }

  // Prerequisites
  if (q.prerequisites?.length) {
    html += `<div class="section"><div class="section-header">Prerequisites</div><div style="margin-top:8px">`;
    for (const prereq of q.prerequisites) {
      const st    = questStatus(prereq, completable);
      const pass  = st === 'done' || st === 'ok';
      const sym   = pass ? '✓' : st === 'close' ? '~' : '✗';
      const col   = pass ? '#c8c8c8' : st === 'close' ? '#c8a830' : '#9a5a5a';
      const iCls  = pass ? 'ok' : st === 'close' ? 'close' : 'fail';
      const note  = pass ? 'ready' : st === 'close' ? 'close' : (!questsData[prereq] ? 'unknown' : 'locked');
      html += `<div class="req-row">
        <span class="req-icon ${iCls}">${sym}</span>
        <span class="req-label" style="cursor:pointer;color:${col}"
          data-quest="${escHtml(prereq)}" onclick="showQuestDetail(this.dataset.quest)">
          ${prereq}</span>
        <span class="req-note">${note}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Skill requirements
  // Skills that can ONLY be trained by fighting monsters with a combat level.
  // Reaching these levels requires owning at least some monster cards.
  const MONSTER_TRAINED_SKILLS = new Set([
    'Attack', 'Strength', 'Defence', 'Hitpoints', 'Ranged', 'Slayer',
  ]);
  if (q.skillRequirements?.length) {
    html += `<div class="section"><div class="section-header">Skill Requirements</div><div style="margin-top:8px">`;
    for (const r of q.skillRequirements) {
      const myLvl     = getLevel(r.skill);
      const ok        = myLvl >= r.level;
      const needsMobs = MONSTER_TRAINED_SKILLS.has(r.skill);
      const mobTag    = needsMobs
        ? ` <span style="font-size:10px;color:#666" title="This skill can only be trained by fighting monsters with a combat level">⚔ monsters</span>`
        : '';
      html += `<div class="req-row">
        <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
        <span class="req-label">${r.skill} ${r.level}${r.boostable?'':' <span style="font-size:10px;color:#666">(not boostable)</span>'}${mobTag}</span>
        <span class="req-note">you: ${myLvl}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Card requirements — BM data (schema 2: sections → requirements → {label, cards, type})
  const bm = bmQuestCards[questName];
  if (bm) {
    const itemRows = [], monsterRows = [], npcRows = [];

    for (const section of (bm.sections || [])) {
      for (const req of (section.requirements || [])) {
        const cards = req.cards || [];
        if (!cards.length) continue;
        const label = req.label || cards[0] || '';

        if (req.type === 'npc') {
          // NPC interaction — must own the NPC card to talk to / interact with this NPC
          for (const card of cards) {
            const ok = isOwned(card);
            const isCard = !!monsterDrops[card];
            const nav = isCard
              ? `style="cursor:pointer" data-nav="${escHtml(card)}" data-nav-type="monster" onclick="_navToCard(this)"`
              : '';
            const _npcImg = (cardDetails[card]||{}).imageUrl ? `<img src="${(cardDetails[card]||{}).imageUrl}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">` : '';
            npcRows.push({ ok, html: `<div class="req-row">
              <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
              ${_npcImg}
              <span class="req-label" ${nav}>${label}</span>
              <span class="req-note">${ok ? 'card owned' : (isCard ? 'need card' : 'no TCG card')}</span>
              ${isCard ? _rowWishStar(card, ok) : ''}
            </div>` });
          }
        } else if (req.type === 'enemy') {
          // Each enemy card is a separate requirement
          for (const card of cards) {
            const ok = isOwned(card);
            const isCard = !!monsterDrops[card];
            const nav = isCard
              ? `style="cursor:pointer" data-nav="${escHtml(card)}" data-nav-type="monster" onclick="_navToCard(this)"`
              : '';
            const _monImg = (cardDetails[card]||{}).imageUrl ? `<img src="${(cardDetails[card]||{}).imageUrl}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">` : '';
            if (req.optional) {
              monsterRows.push({ ok: true, optional: true, html: `<div class="req-row" style="opacity:0.5">
                <span class="req-icon" style="color:#666">~</span>
                ${_monImg}
                <span class="req-label" ${nav} style="color:#666">${card}</span>
                <span class="req-note" style="color:#555">${ok ? 'card owned' : (isCard ? 'no card' : 'no TCG card')} · can be avoided</span>
              </div>` });
            } else {
              monsterRows.push({ ok, html: `<div class="req-row">
                <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
                ${_monImg}
                <span class="req-label" ${nav}>${card}</span>
                <span class="req-note">${ok ? 'card owned' : (isCard ? 'need card' : 'no TCG card')}</span>
                ${isCard ? _rowWishStar(card, ok) : ''}
              </div>` });
            }
          }
        } else if (cards.length === 1) {
          // Single item card
          const card = cards[0];
          const altOk  = req.skillAlt ? getLevel(req.skillAlt.skill) >= req.skillAlt.level : false;
          const altTag = req.skillAlt ? ` <span style="font-size:10px;color:#666">OR ${req.skillAlt.skill} ${req.skillAlt.level}</span>` : '';
          const ok = isOwned(card) || altOk;
          const isItemCard = !!itemSources[card];
          const nav = isItemCard
            ? `style="cursor:pointer" data-nav="${escHtml(card)}" data-nav-type="item" onclick="_navToCard(this)"`
            : '';
          const displayLabel = (label !== card) ? `${label} <span style="font-size:10px;color:#666">(${card})</span>` : `${card}${altTag}`;
          const noteText = altOk ? `${req.skillAlt.skill} ${req.skillAlt.level} ✓` : ok ? 'owned' : 'need card';
          const _itemImg = (cardDetails[card]||{}).imageUrl ? `<img src="${(cardDetails[card]||{}).imageUrl}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">` : '';
          itemRows.push({ ok, html: `<div class="req-row">
            <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
            ${_itemImg}
            <span class="req-label" ${nav}>${displayLabel}</span>
            <span class="req-note">${noteText}</span>
            ${isItemCard ? _rowWishStar(card, ok) : ''}
          </div>` });
        } else {
          // Any-of group — tier owned → obtainable → locked
          const groupOk = cards.some(c => isOwned(c));
          const levelSorted = sortCardsByLevel(cards);
          const owned_  = levelSorted.filter(c => isOwned(c));
          const getable = levelSorted.filter(c => !isOwned(c) && canGetItem(c));
          const locked_ = levelSorted.filter(c => !isOwned(c) && !canGetItem(c));
          const tiered  = [...owned_, ...getable, ...locked_];

          const optHtml = tiered.map((c, i) => {
            const cardOwned   = isOwned(c);
            const cardGetable = !cardOwned && canGetItem(c);
            const color       = cardOwned ? '#7ab07a' : cardGetable ? '#c8a830' : '#555';
            const prevLocked  = i > 0 && locked_.includes(tiered[i-1]);
            const sepColor    = (locked_.includes(c) || prevLocked) ? '#333' : '#444';
            const sep   = i > 0 ? `<span style="color:${sepColor}"> · </span>` : '';
            const inner = `<span style="color:${color}">${c}</span>`;
            return sep + (itemSources[c]
              ? `<span style="cursor:pointer" data-nav="${escHtml(c)}" data-nav-type="item" onclick="_navToCard(this)">${inner}</span>`
              : inner);
          }).join('');

          itemRows.push({ ok: groupOk, html: `<div class="req-row" style="align-items:flex-start">
            <span class="req-icon ${groupOk?'ok':'fail'}" style="margin-top:2px">${groupOk?'✓':'✗'}</span>
            <div style="flex:1">
              <div class="req-label" style="color:#888;font-size:11px;margin-bottom:3px">${/^an?y?\s/i.test(label) ? label : `Any: ${label}`}</div>
              <div style="font-size:11px;line-height:1.6">${optHtml}</div>
            </div>
          </div>` });
        }
      }
    }

    const totalRows = itemRows.length + monsterRows.length + npcRows.length;
    if (totalRows > 0) {
      if (npcRows.length > 0) {
        html += `<div class="section"><div class="section-header">NPC Interactions</div><div style="margin-top:8px">`;
        for (const r of [...npcRows.filter(r=>!r.ok), ...npcRows.filter(r=>r.ok)]) html += r.html;
        html += `</div></div>`;
      }
      if (itemRows.length > 0) {
        html += `<div class="section"><div class="section-header">Items &amp; Cards Required</div><div style="margin-top:8px">`;
        for (const r of [...itemRows.filter(r=>!r.ok), ...itemRows.filter(r=>r.ok)]) html += r.html;
        html += `</div></div>`;
      }
      if (monsterRows.length > 0) {
        const optionalCount = monsterRows.filter(r => r.optional).length;
        const hdr = optionalCount
          ? `Enemies to Defeat <span style="font-size:10px;color:#555;font-weight:normal">(${optionalCount} optional)</span>`
          : 'Enemies to Defeat';
        html += `<div class="section"><div class="section-header">${hdr}</div><div style="margin-top:8px">`;
        // required missing → required owned → optional
        const required = monsterRows.filter(r => !r.optional);
        const optional = monsterRows.filter(r => r.optional);
        for (const r of [...required.filter(r=>!r.ok), ...required.filter(r=>r.ok), ...optional]) html += r.html;
        html += `</div></div>`;
      }
    } else {
      html += `<div style="color:#555;font-size:12px;margin-top:4px">No card requirements tracked. Check the wiki for full details.</div>`;
    }
  } else {
    // Fallback: wiki infobox data (may include non-card items)
    if (q.itemsRequired?.length) {
      html += `<div class="section"><div class="section-header">Items Required <span style="font-size:10px;color:#555;font-weight:normal">(wiki infobox)</span></div><div style="margin-top:8px">`;
      for (const item of q.itemsRequired) {
        const ok = isOwned(item);
        const isCard = !!itemSources[item];
        html += `<div class="req-row">
          <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
          <span class="req-label" ${isCard?`style="cursor:pointer" data-nav="${escHtml(item)}" data-nav-type="item" onclick="_navToCard(this)"`:''}>${item}</span>
          <span class="req-note">${ok ? 'owned' : (isCard ? 'need card' : 'no TCG card')}</span>
          ${isCard ? _rowWishStar(item, ok) : ''}
        </div>`;
      }
      html += `</div></div>`;
    }
    if (q.killsRequired?.length) {
      html += `<div class="section"><div class="section-header">Enemies to Defeat</div><div style="margin-top:8px">`;
      for (const kill of q.killsRequired) {
        const ok = isOwned(kill);
        const isCard = !!monsterDrops[kill];
        html += `<div class="req-row">
          <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
          <span class="req-label" ${isCard?`style="cursor:pointer" data-nav="${escHtml(kill)}" data-nav-type="monster" onclick="_navToCard(this)"`:''}>${kill}</span>
          <span class="req-note">${ok ? 'card owned' : (isCard ? 'need monster card' : 'no TCG card')}</span>
          ${isCard ? _rowWishStar(kill, ok) : ''}
        </div>`;
      }
      html += `</div></div>`;
    }
  }

  // Reward items note
  if (q.rewardItems?.length) {
    html += `<div class="section"><div class="section-header">Reward Items</div>
      <div style="margin-top:8px;font-size:12px;color:#888">
        ${q.rewardItems.map(r => `<span style="margin-right:8px">${r}</span>`).join('')}
      </div>
      <div style="font-size:10px;color:#555;margin-top:6px">Quest rewards are given directly — no card required to receive. You can drop/bank items you haven't unlocked.</div>
    </div>`;
  }

  if (!q.prerequisites?.length && !q.skillRequirements?.length && !bm && !q.itemsRequired?.length && !q.killsRequired?.length) {
    html += `<div style="color:#555;font-size:12px;margin-top:12px">No tracked requirements. Check the wiki for full details.</div>`;
  }

  pane.innerHTML = html;
}

function computeTotalStats() {
  const totals = {};
  for (const k of STAT_KEYS) totals[k] = 0;
  // If a 2H weapon is equipped, ignore the shield slot entirely
  const wpnName = getEquipped('weapon');
  const wpnItem = wpnName ? (equipBySlot['weapon'] || []).find(i => i.name === wpnName) : null;
  const has2h   = wpnItem && wpnItem.is2h;
  for (const slot of Object.keys(SLOT_FULL)) {
    if (slot === 'shield' && has2h) continue;
    const eq = getEquipped(slot);
    if (!eq) continue;
    const item = (equipBySlot[slot] || []).find(i => i.name === eq);
    if (!item || !item.stats) continue;
    for (const [k, v] of Object.entries(item.stats)) {
      if (totals[k] !== undefined) totals[k] += v;
    }
  }
  return totals;
}

function buildItemTooltip(item, eqItem) {
  const stats  = item.stats  || {};
  const eqStats = (eqItem && eqItem.name !== item.name && eqItem.stats) || {};
  const activeKeys = STAT_KEYS.filter(k => stats[k] || eqStats[k]);
  if (!activeKeys.length && !Object.keys(item.reqLvl || {}).length) {
    return '<div style="color:#444;font-style:italic;font-size:10px">No combat stats</div>';
  }
  const rows = activeKeys.map(k => {
    const v   = stats[k]   || 0;
    const ev  = eqStats[k] || 0;
    const d   = v - ev;
    const suf = k === 'magic_damage' ? '%' : '';
    const sign = v >= 0 ? '+' : '';
    let delta = '';
    if (eqItem && eqItem.name !== item.name && d !== 0) {
      delta = d > 0
        ? ` <span class="tt-delta pos">(+${d})</span>`
        : ` <span class="tt-delta neg">(${d})</span>`;
    }
    return `<div class="tt-row"><span>${STAT_SHORT[k]}</span><span>${sign}${v}${suf}${delta}</span></div>`;
  }).join('');
  const reqs = item.reqLvl || {};
  const reqStr = Object.entries(reqs).filter(([,v])=>v>0)
    .map(([k,v])=>`${k[0].toUpperCase()+k.slice(1)} ${v}`).join(', ');
  const reqHtml = reqStr
    ? `<div class="tt-req">Requires: ${reqStr}</div>`
    : '';
  return rows + reqHtml;
}

const PRAYER_BY_STYLE = {
  melee:  ['none','piety','chivalry'],

  magic:  ['none','augury','mystic'],
};

let dpsSettings = {
  prayer: 'none',
  atkStyle: 'aggressive', // melee: accurate/aggressive/controlled; ranged: rapid/accurate
  enemyDefLvl: 1,
  enemyDefBonus: 0,
};

function loadDpsSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('dps_settings') || '{}');
    Object.assign(dpsSettings, s);
  } catch {}
}
function saveDpsSettings() {
  localStorage.setItem('dps_settings', JSON.stringify(dpsSettings));
}

function meetsReqLvl(item) {
  const reqs = item.reqLvl || {};
  for (const [skill, lvl] of Object.entries(reqs)) {
    const skillName = skill.charAt(0).toUpperCase() + skill.slice(1);
    if (getLevel(skillName) < lvl) return false;
  }
  return true;
}

function calcDps() {
  const style  = activeEquipStyle;
  const s      = computeTotalStats();
  const prayer = DPS_PRAYERS[dpsSettings.prayer] || DPS_PRAYERS.none;
  const enemyDef   = Math.max(1, parseInt(dpsSettings.enemyDefLvl)  || 1);
  const enemyBonus = Math.max(0, parseInt(dpsSettings.enemyDefBonus) || 0);

  // Get equipped weapon speed
  const eqWpnName = getEquipped('weapon');
  const wpnItem   = eqWpnName ? (equipBySlot['weapon'] || []).find(i => i.name === eqWpnName) : null;
  let   baseSpeed = (wpnItem && wpnItem.attackSpeed) || 4;

  if (style === 'melee') {
    const strOff = dpsSettings.atkStyle === 'aggressive' ? 3 : dpsSettings.atkStyle === 'controlled' ? 1 : 0;
    const atkOff = dpsSettings.atkStyle === 'accurate'   ? 3 : dpsSettings.atkStyle === 'controlled' ? 1 : 0;
    const effStr = Math.floor(getLevel('Strength') * prayer.mStr) + strOff + 8;
    const effAtk = Math.floor(getLevel('Attack')   * prayer.mAtk) + atkOff + 8;
    const eqStr  = s.melee_strength || 0;
    const eqAtk  = Math.max(s.attack_stab || 0, s.attack_slash || 0, s.attack_crush || 0);
    const maxHit = Math.floor(0.5 + effStr * (eqStr + 64) / 640);
    const atkRoll = Math.floor(effAtk * (eqAtk + 64));
    const defRoll = Math.floor((enemyDef + 9) * (enemyBonus + 64));
    const hitChance = atkRoll > defRoll
      ? 1 - (defRoll + 2) / (2 * (atkRoll + 1))
      : atkRoll / (2 * (defRoll + 1));
    const dps = (maxHit / 2) * Math.max(0, Math.min(1, hitChance)) / (baseSpeed * 0.6);
    return { maxHit, hitChance: Math.max(0, Math.min(1, hitChance)), dps, speed: baseSpeed };
  }

  if (style === 'ranged') {
    const isRapid = dpsSettings.atkStyle === 'rapid';
    const atkOff  = isRapid ? 0 : 3;
    const speed   = isRapid ? Math.max(1, baseSpeed - 1) : baseSpeed;
    const effAtk  = Math.floor(getLevel('Ranged') * prayer.rAtk) + atkOff + 8;
    const effStr  = Math.floor(getLevel('Ranged') * prayer.rStr) + atkOff + 8;
    const eqStr   = s.ranged_strength || 0;
    const eqAtk   = s.attack_ranged || 0;
    const maxHit  = Math.floor(0.5 + effStr * (eqStr + 64) / 640);
    const atkRoll = Math.floor(effAtk * (eqAtk + 64));
    const defRoll = Math.floor((enemyDef + 9) * (enemyBonus + 64));
    const hitChance = atkRoll > defRoll
      ? 1 - (defRoll + 2) / (2 * (atkRoll + 1))
      : atkRoll / (2 * (defRoll + 1));
    const dps = (maxHit / 2) * Math.max(0, Math.min(1, hitChance)) / (speed * 0.6);
    return { maxHit, hitChance: Math.max(0, Math.min(1, hitChance)), dps, speed };
  }

  return null; // magic — too spell-dependent
}

function dpsSettingChanged() {
  const prayerEl = document.getElementById('dps-prayer');
  const styleEl  = document.getElementById('dps-style');
  const defLvlEl = document.getElementById('dps-def-lvl');
  const defBonEl = document.getElementById('dps-def-bonus');
  if (prayerEl) dpsSettings.prayer    = prayerEl.value;
  if (styleEl)  dpsSettings.atkStyle  = styleEl.value;
  if (defLvlEl) dpsSettings.enemyDefLvl   = parseInt(defLvlEl.value) || 1;
  if (defBonEl) dpsSettings.enemyDefBonus = parseInt(defBonEl.value) || 0;
  saveDpsSettings();
  updateDpsOutput();
}

function updateDpsOutput() {
  const el = document.getElementById('dps-output');
  if (!el) return;
  const result = calcDps();
  if (!result) {
    el.innerHTML = `<span style="color:#333;font-style:italic">Magic DPS requires spell selection</span>`;
    return;
  }
  const { maxHit, hitChance, dps, speed } = result;
  el.innerHTML = `
    <div class="dps-val"><span class="dps-val-num">${maxHit}</span><span class="dps-val-lbl">Max Hit</span></div>
    <div class="dps-val"><span class="dps-val-num">${(hitChance*100).toFixed(1)}%</span><span class="dps-val-lbl">Accuracy</span></div>
    <div class="dps-val"><span class="dps-val-num">${dps.toFixed(2)}</span><span class="dps-val-lbl">DPS</span></div>
    <div class="dps-val"><span class="dps-val-num">${speed}t</span><span class="dps-val-lbl">Speed</span></div>`;
}
