<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1a1a;
    color: #c8c8c8;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Tab bar ── */
  #tab-bar {
    display: flex;
    background: #111;
    border-bottom: 1px solid #333;
    padding: 0 8px;
    flex-shrink: 0;
  }
  .tab-btn {
    padding: 8px 16px;
    font-size: 12px;
    color: #666;
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: color 0.1s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tab-btn:hover { color: #aaa; }
  .tab-btn.active { color: #e8c97a; border-bottom-color: #e8c97a; }

  /* ── App content wrapper ── */
  #app-content { flex: 1; display: flex; overflow: hidden; }

  /* ── Skilling tab ── */
  #skill-panel { flex: 1; display: flex; overflow: hidden; }
  #skill-list-pane {
    width: 280px; min-width: 280px;
    background: #141414;
    border-right: 1px solid #333;
    overflow-y: auto;
    padding: 12px;
  }
  #skill-detail-pane { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .skill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .skill-cell {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    padding: 8px 6px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.1s;
  }
  .skill-cell:hover { border-color: #444; }
  .skill-cell.selected { border-color: #b07a30; background: #1e1800; }
  .skill-cell.has-methods { border-color: #2a3a2a; }
  .skill-cell-name { font-size: 10px; color: #888; margin-bottom: 2px; }
  .skill-cell-level { font-size: 16px; color: #e8c97a; font-weight: 600; }
  .skill-cell-count { font-size: 9px; color: #4a8a4a; margin-top: 2px; }
  .skill-cell-count.zero { color: #444; }

  .method-row {
    display: flex; align-items: center;
    padding: 5px 0; gap: 8px;
    border-bottom: 1px solid #1f1f1f;
    font-size: 12px;
  }
  .method-row:last-child { border-bottom: none; }
  .method-indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .method-indicator.available  { background: #3a8a3a; }
  .method-indicator.no-card    { background: #4a4a20; }
  .method-indicator.no-source  { background: #7a4a10; }
  .method-indicator.locked     { background: #5a2a2a; }
  .method-name { flex: 1; }
  .method-name.available  { color: #c8c8c8; }
  .method-name.no-card    { color: #667; cursor: pointer; }
  .method-name.no-source  { color: #8a5a20; }
  .method-name.locked     { color: #5a3a3a; }
  .method-level { font-size: 10px; color: #555; min-width: 36px; text-align: right; }
  .method-note  { font-size: 10px; color: #666; }

  /* ── Questing tab ── */
  #quest-panel { flex: 1; display: flex; overflow: hidden; }
  #quest-list-pane {
    width: 320px; min-width: 320px;
    background: #141414;
    border-right: 1px solid #333;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #quest-list-controls { padding: 8px; border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 6px; }
  #quest-list-scroll { flex: 1; overflow-y: auto; }
  #quest-detail-pane { flex: 1; overflow-y: auto; padding: 20px 24px; }

  .quest-item {
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid #1a1a1a;
    display: flex; align-items: center; gap: 8px;
    transition: background 0.1s;
  }
  .quest-item:hover { background: #1c1c1c; }
  .quest-item.selected { background: #2a2000; border-left: 2px solid #b07a30; }
  .quest-badge {
    font-size: 10px; font-weight: 700;
    width: 16px; text-align: center; flex-shrink: 0;
  }
  .quest-badge.ok      { color: #3a9a3a; }
  .quest-badge.close   { color: #c8a020; }
  .quest-badge.locked  { color: #7a3a3a; }
  .quest-badge.done    { color: #b07a30; }
  .quest-item.done-quest { background: #131310; }
  .quest-item.done-quest .quest-name { text-decoration: line-through; color: #666; }
  .quest-item.done-quest:hover { background: #1c1c18; }
  .quest-item.done-quest.selected { background: #2a2000; }
  .quest-item.done-quest.selected .quest-name { color: #c8c8c8; text-decoration: none; }
  .quest-name { flex: 1; font-size: 12px; }
  .quest-qp { font-size: 10px; color: #555; flex-shrink: 0; }
  .quest-members-tag { font-size: 9px; color: #4a6a8a; background: #0d1e2e; border-radius: 2px; padding: 1px 3px; flex-shrink: 0; }
  #quest-stats {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 1px; background: #222; border-radius: 4px; overflow: hidden;
    margin-bottom: 2px;
  }
  .qstat {
    background: #161616; padding: 7px 8px; text-align: center;
  }
  .qstat-val  { font-size: 15px; font-weight: 700; color: #ddd; line-height: 1.2; }
  .qstat-sub  { font-size: 10px; color: #555; margin-top: 1px; }
  .qstat-qp   { font-size: 11px; color: #888; margin-top: 1px; }
  .qstat.done-col  .qstat-val { color: #b07a30; }
  .qstat.avail-col .qstat-val { color: #4a9a4a; }
  .quest-section-header {
    padding: 6px 12px 4px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: #555; background: #111;
    border-bottom: 1px solid #222;
    position: sticky; top: 0; z-index: 1;
  }
  .quest-miniquest-tag { font-size: 9px; color: #5a4a7a; background: #1a1028; border-radius: 2px; padding: 1px 3px; flex-shrink: 0; }

  .req-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 0; font-size: 12px;
    border-bottom: 1px solid #1a1a1a;
  }
  .req-row:last-child { border-bottom: none; }
  .req-icon { font-size: 12px; width: 14px; flex-shrink: 0; }
  .req-icon.ok     { color: #3a9a3a; }
  .req-icon.fail   { color: #9a3a3a; }
  .req-icon.warn   { color: #8a6a20; }
  .req-icon.close  { color: #c8a020; }
  .req-label { flex: 1; }
  .req-note  { font-size: 10px; color: #666; }

  /* ── Rules tab ── */
  #rules-panel { flex: 1; overflow-y: auto; padding: 32px 40px; max-width: 720px; }
  #rules-panel h2 { color: #e8c97a; font-size: 16px; margin-bottom: 16px; }
  #rules-panel h3 { color: #c8b060; font-size: 13px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
  #rules-panel p, #rules-panel li { color: #999; line-height: 1.6; margin-bottom: 8px; font-size: 13px; }
  #rules-panel ul { padding-left: 20px; }
  #rules-panel table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; }
  #rules-panel th { text-align: left; padding: 6px 10px; font-size: 11px; color: #888; border-bottom: 1px solid #333; text-transform: uppercase; letter-spacing: 0.5px; }
  #rules-panel td { padding: 6px 10px; font-size: 12px; border-bottom: 1px solid #222; }
  #rules-panel td:first-child { color: #c8c8c8; }
  #rules-panel td:last-child { color: #5a9a5a; }

  /* ── Left: card list ── */
  #sidebar {
    width: 260px;
    min-width: 260px;
    background: #141414;
    border-right: 1px solid #333;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #sidebar h2 {
    padding: 12px 14px 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    border-bottom: 1px solid #333;
  }

  #controls {
    padding: 8px;
    border-bottom: 1px solid #333;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #search {
    background: #222;
    border: 1px solid #444;
    color: #ddd;
    padding: 6px 8px;
    border-radius: 3px;
    font-size: 12px;
    width: 100%;
  }
  #search:focus { outline: none; border-color: #b07a30; }
  #filter-row { display: flex; gap: 6px; }

  select {
    background: #222;
    border: 1px solid #444;
    color: #ccc;
    padding: 4px 6px;
    border-radius: 3px;
    font-size: 11px;
    flex: 1;
  }

  #card-list { overflow-y: auto; flex: 1; }

  .card-item {
    padding: 7px 14px;
    cursor: pointer;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.1s;
  }
  .card-item:hover         { background: #1e1e1e; }
  .card-item.selected      { background: #2a2000; border-left: 2px solid #b07a30; }
  .card-item.owned-card    { border-left: 2px solid #2a6b35; }
  .card-item.selected.owned-card { border-left: 2px solid #b07a30; }
  .card-name { flex: 1; }
  .card-type { font-size: 10px; color: #666; margin-left: 8px; }
  .card-cat  { font-size: 9px; color: #4a6a8a; background:#0d1e2e; border-radius:2px; padding:1px 4px; margin-left:6px; white-space:nowrap; }
  .food-cat  { color: #5a9a30; background: #0d1c09; cursor: default; }

  /* ── Right: detail ── */
  #detail { flex: 1; overflow-y: auto; padding: 20px 24px; }
  #detail .placeholder { color: #444; margin-top: 60px; text-align: center; font-size: 15px; }
  #detail h1           { font-size: 18px; color: #e8c97a; margin-bottom: 4px; }
  #detail .subtitle    { color: #666; font-size: 11px; margin-bottom: 12px; }

  .section { margin-bottom: 22px; }

  .section-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ── Progress pill: "3 / 7" ── */
  .progress-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: normal;
    text-transform: none;
    letter-spacing: 0;
  }
  .progress-pill .fraction { color: #aaa; }
  .progress-pill .fraction .num { color: #e8c97a; font-weight: 700; }
  .progress-pill .fraction .den { color: #666; }
  .pbar {
    width: 60px;
    height: 5px;
    background: #2a2a2a;
    border-radius: 3px;
    overflow: hidden;
  }
  .pbar-fill { height: 100%; background: #e8c97a; border-radius: 3px; transition: width 0.2s; }
  .pbar-fill.complete { background: #00c853; }

  /* ── Drop rows ── */
  .drop-row {
    display: flex;
    align-items: center;
    padding: 6px 8px;
    border-radius: 3px;
    margin-bottom: 2px;
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .drop-row:hover { background: #1e1e1e; }

  /* owned state */
  .drop-row.owned  { background: #0a1a0a; }
  .drop-row.locked { background: transparent; }

.drop-indicator {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
    margin-right: 10px;
  }
  .drop-indicator.owned  { background: #003d1f; color: #00c853; }
  .drop-indicator.locked { background: #2a1a00; color: #7a5020; border: 1px solid #3a2a10; }
  .drop-indicator.rdt    { background: #1a1a2a; color: #4a5a8a; }

  .drop-name { flex: 1; }
  .drop-name.owned  { color: #00c853; }
  .drop-name.locked { color: #888; }
  .drop-name.rdt    { color: #777; }

  .rarity-badge {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 2px;
    margin: 0 8px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .rarity-Always         { background: #003d1f; color: #00c853; }
  .rarity-Common         { background: #1a2e00; color: #76c442; }
  .rarity-Uncommon       { background: #2a2800; color: #c8b400; }
  .rarity-Rare           { background: #001a3a; color: #4a9eff; }
  .rarity-Very-Rare      { background: #1e0030; color: #b060e0; }
  .rarity-Extremely-Rare { background: #2e1000; color: #ff7020; }
  .rarity-Unknown        { background: #1a1a1a; color: #555; }

  .fraction { font-size: 10px; color: #555; min-width: 60px; text-align: right; flex-shrink: 0; }

  /* ── Tier badge (card rarity) ── */
  .tier-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
    letter-spacing: 0.3px;
  }
  .tier-Common    { background: #1a2800; color: #76c442; }
  .tier-Uncommon  { background: #1e2200; color: #aac020; }
  .tier-Rare      { background: #001a3a; color: #4a9eff; }
  .tier-Epic      { background: #1e0030; color: #c060e0; }
  .tier-Legendary { background: #2e1500; color: #ff8030; }
  .tier-Mythic    { background: #2a0020; color: #ff50d0; }
  .tier-Godly     { background: #300008; color: #ff3040; }

  /* ── Pack acquisition table ── */
  .pack-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .pack-table th { color: #555; font-size: 10px; font-weight: normal; text-align: left; padding: 3px 6px; }
  .pack-table th.r { text-align: right; }
  .pack-table td { padding: 4px 6px; border-top: 1px solid #1a1a1a; }
  .pack-table td.r { text-align: right; }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex;
    gap: 0;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .stat-block {
    flex: 1;
    padding: 10px 14px;
    border-right: 1px solid #2a2a2a;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-block:last-child { border-right: none; }
  .stat-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 16px; font-weight: 700; color: #e8c97a; line-height: 1; }
  .stat-value .den { font-size: 12px; color: #666; font-weight: normal; }
  .stat-value.complete { color: #00c853; }

  .quest-row       { padding: 5px 0; border-bottom: 1px solid #1a1a1a; }
  .quest-name      { color: #c8b400; }
  .quest-prereqs   { font-size: 11px; color: #555; margin-top: 2px; padding-left: 12px; }
  .empty-note      { color: #444; font-style: italic; font-size: 11px; padding: 4px 0; }

  /* ── RDT section note ── */
  .rdt-header-note {
    font-size: 10px;
    color: #4a5a8a;
    font-weight: normal;
    text-transform: none;
    letter-spacing: 0;
  }
  .rdt-banner {
    font-size: 11px;
    color: #4a5a8a;
    background: #0d0d1a;

<script>
// ─── Tool tiers ────────────────────────────────────────────────────────────
// skillReq = Mining/WC level needed to USE the tool (from OSRS wiki skill pages)

// Implicit tools required for production but NOT listed in the wiki ingredient table.
// Most tools are now scraped directly from the wiki's Tools cell — only genuine
// wiki omissions need to be hard-coded here.
function getImplicitTools(skill, ingredients, wikiTools, facilities) {
  // Start with wiki-scraped tools (Knife, Chisel, Ring mould, etc.)
  const tools = [...(wikiTools || [])];

  // Smithing → Hammer needed at an Anvil only; smelting at a Furnace never uses one.
  const isAnvil = !facilities || !/furnace|singing bowl/i.test(facilities);
  if (skill === 'Smithing' && isAnvil && !tools.includes('Hammer'))
    tools.push('Hammer');

  // Crafting + Thread → Needle (wiki lists Thread but never Needle)
  const ings = ingredients || [];
  if (skill === 'Crafting' && ings.some(i => i.item === 'Thread') && !tools.includes('Needle'))
    tools.push('Needle');

  return tools;
}

const TOOL_TIERS = {
  "Pickaxe": [
    {name:"Bronze pickaxe",  skillReq:1},  {name:"Iron pickaxe",    skillReq:1},
    {name:"Steel pickaxe",   skillReq:6},  {name:"Black pickaxe",   skillReq:11},
    {name:"Mithril pickaxe", skillReq:21}, {name:"Adamant pickaxe", skillReq:31},
    {name:"Rune pickaxe",    skillReq:41}, {name:"Dragon pickaxe",  skillReq:61},
    {name:"Crystal pickaxe", skillReq:71},
  ],
  "Axe": [
    {name:"Bronze axe",  skillReq:1},  {name:"Iron axe",    skillReq:1},
    {name:"Steel axe",   skillReq:6},  {name:"Black axe",   skillReq:11},
    {name:"Mithril axe", skillReq:21}, {name:"Adamant axe", skillReq:31},
    {name:"Rune axe",    skillReq:41}, {name:"Dragon axe",  skillReq:61},
    {name:"Crystal axe", skillReq:71},
  ],
};

// ─── Card level-order sort ─────────────────────────────────────────────────
// Used to sort any-of groups by level requirement then alphabetically,
// so e.g. "Bronze axe · Iron axe · Steel axe…" instead of alphabetical.
const CARD_SORT_LEVEL = (() => {
  const m = {};
  for (const tiers of Object.values(TOOL_TIERS))
    for (const t of tiers) m[t.name.toLowerCase()] = t.skillReq;
  // Extra variants not in TOOL_TIERS (Gilded = Rune tier; 3rd age/Infernal = Dragon tier)
  const extras = {
    'Gilded pickaxe': 41, '3rd age pickaxe': 61, 'Infernal pickaxe': 61,
    'Gilded axe':     41, '3rd age axe':     61, 'Infernal axe':     61,
    // Spears (Attack level requirement)
    'Iron spear': 1, 'Steel spear': 5, 'Mithril spear': 20,
    'Adamant spear': 30, 'Rune spear': 40, 'Dragon spear': 60,
    // Feathers — regular first (level 0), coloured variants after (alphabetically at level 1)
    'Feather': 0,
    'Blue feather': 1, 'Orange feather': 1, 'Red feather': 1,
    'Stripy feather': 1, 'Wimpy feather': 1, 'Yellow feather': 1,
  };
  for (const [n, lvl] of Object.entries(extras)) m[n.toLowerCase()] = lvl;
  return m;
})();

// Sort a card-name array by level asc, then alphabetically within same level.
function sortCardsByLevel(cards) {
  return [...cards].sort((a, b) => {
    const la = CARD_SORT_LEVEL[a.toLowerCase()] ?? 999;
    const lb = CARD_SORT_LEVEL[b.toLowerCase()] ?? 999;
    return la !== lb ? la - lb : a.localeCompare(b);
  });
}

// ─── Compound tool resolution ───────────────────────────────────────────────
// Some gathering tools are compound ("Fishing rod + bait"). Each part is
// checked separately; "feathers" matches any of FEATHER_CARDS.
const FEATHER_CARDS = [
  'Feather', 'Red feather', 'Yellow feather', 'Orange feather',
  'Blue feather', 'Stripy feather', 'Wimpy feather',
];
// Maps lowercased shorthand → real card name
// 'bait' is context-sensitive: Karambwan vessel uses Karambwanji, others use Fishing bait.
// resolveToolParts checks the full tool string before splitting to handle that case.
// 'Silver sickle (b)' → base card 'Silver sickle' (blessed via quest, no separate TCG card).
const TOOL_PART_ALIASES = {
  bait:                 'Fishing bait',
  sandworms:            'Sandworms',
  'silver sickle (b)':  'Silver sickle',
};

// Hides that can be tanned into leather at a tanner NPC (no skill req, just Coins).
// The game never makes you pick up the leather from the ground — it converts in your
// inventory — so you only need the hide card + Coins to unlock leather crafting.
const TANNING_MAP = {
  'Leather':              'Cowhide',
  'Hard leather':         'Cowhide',
  'Snakeskin':            'Snake hide',
  'Green dragon leather': 'Green dragonhide',
  'Blue dragon leather':  'Blue dragonhide',
  'Red dragon leather':   'Red dragonhide',
  'Black dragon leather': 'Black dragonhide',
};

function resolveToolParts(toolStr) {
  if (!toolStr || toolStr === 'None') return [];
  // Context-specific alias: Karambwan vessel + bait uses Karambwanji, not Fishing bait
  const effectiveStr = toolStr.startsWith('Karambwan vessel')
    ? toolStr.replace(/\bbait\b/i, 'Karambwanji')
    : toolStr;
  return effectiveStr.split(' + ').map(raw => {
    const part = raw.trim();
    const key  = part.toLowerCase();
    if (key === 'feathers') {
      const ownedF = FEATHER_CARDS.filter(f => isOwned(f));
      return {
        label: 'Feathers',
        owned: ownedF.length > 0,
        note:  ownedF.length > 0
          ? ownedF.slice(0, 2).join(', ') + (ownedF.length > 2 ? ` +${ownedF.length - 2} more` : '')
          : 'any feather card — Feather, Red, Yellow, Orange, Blue, Stripy or Wimpy',
      };
    }
    const name = TOOL_PART_ALIASES[key] || part;
    return { label: name, owned: isOwned(name), note: null };
  });
}

// ─── Recursive item reachability ────────────────────────────────────────────
// canGetItem: can the player actually obtain this item given current level,
// tools, and card ownership? Checks ALL source routes as OR conditions.
// Never returns false from a single failed route — exhausts all options first.
// Memoised per collection state (cache cleared on refreshCollection / lookupLevels).
let _canGetCache = {};

function canGetItem(itemName, visited = new Set()) {
  if (visited.has(itemName)) return false;           // cycle guard
  if (itemName in _canGetCache) return _canGetCache[itemName];

  const data = itemSources[itemName];
  const info = ingredientInfo[itemName];
  if (!data && !info) {
    _canGetCache[itemName] = true;                   // unknown → not in card set, no restriction
    return true;
  }

  const src = data || info;

  // Data gap fallback: entry exists in our data but ALL source fields are empty.
  // Covers both itemSources (TCG cards) and ingredientInfo (non-card intermediates like unf potions).
  // Don't penalise data gaps — assume the item is obtainable.
  {
    const hasSrc = src.shopBought || (src.spawns && src.spawns.length) ||
                   src.gathering || (src.monsters && src.monsters.length) ||
                   src.production || src.alwaysAvailable || (src.clueTiers && src.clueTiers.length);
    if (!hasSrc) { _canGetCache[itemName] = true; return true; }
  }

  // Ground spawn — no Bronzeman restriction (free pickup)
  if (src.spawns && src.spawns.length > 0) { _canGetCache[itemName] = true; return true; }

  // Shop — check whether the item is available via a shop the player can access.
  // item_sources.json records per-shop currency; many items have ONLY special-currency
  // shops (NMZ points, Marks of grace, Tokkul, etc.). We check:
  //  1. Coins-accepting shops — need the Coins card.
  //  2. Special-currency shops — if that currency is itself a TCG card, check ownership.
  if (src.shopBought && src.shops && src.shops.length > 0) {
    const hasCoinsShop = src.shops.some(s => !s.currency || s.currency === 'Coins');
    if (hasCoinsShop && isOwned('Coins')) { _canGetCache[itemName] = true; return true; }
    // Special currencies that are TCG cards (Tokkul, Mark of grace, Abyssal pearls, etc.)
    const specialOwned = src.shops.some(s =>
      s.currency && s.currency !== 'Coins' && isOwned(s.currency)
    );
    if (specialOwned) { _canGetCache[itemName] = true; return true; }
  }

  // Gathering: level + tool (no card needed for the resource itself)
  if (src.gathering) {
    const g = src.gathering;
    if (getLevel(g.skill) >= (g.level || 1)) {
      let toolOk = !g.tool || g.tool === 'None';
      if (!toolOk && TOOL_TIERS[g.tool]) {
        toolOk = TOOL_TIERS[g.tool].some(t => isOwned(t.name) && getLevel(g.skill) >= t.skillReq);
      } else if (!toolOk) {
        const parts = resolveToolParts(g.tool);
        toolOk = parts.every(p => !itemSources[p.label] || isOwned(p.label));
      }
      if (toolOk) { _canGetCache[itemName] = true; return true; }
    }
    // gathering failed — fall through to check other sources
  }

  // Monster drop — need to own the monster card
  if (src.monsters && src.monsters.length > 0) {
    if (src.monsters.some(m => isOwned(m.card))) { _canGetCache[itemName] = true; return true; }
    // no owned monster card — fall through
  }

  // Clue scroll reward — reachable if the item has any clue tier.
  // Any player can accumulate clue scrolls over time; treat all tiers as obtainable.
  // The detail panel already shows which tier(s) the item comes from.
  if (src.clueTiers && src.clueTiers.length > 0) { _canGetCache[itemName] = true; return true; }

  // Production chain — recurse into ingredients and check production tools.
  // Tools (Hammer, Chisel, Knife, Needle, etc.) are TCG cards; you must own them to use them.
  if (src.production) {
    const p = src.production;
    if (!p.skill || getLevel(p.skill) >= (p.level || 1)) {
      const prodTools = getImplicitTools(p.skill, p.ingredients || [], p.tools || [], p.facilities);
      const toolsOk   = prodTools.every(t => !itemSources[t] || isOwned(t));
      if (toolsOk) {
        const newVisited = new Set([...visited, itemName]);
        const ok = (p.ingredients || []).every(ing => {
          if (itemSources[ing.item] && !isOwned(ing.item)) return false; // need card to use as ingredient
          return canGetItem(ing.item, newVisited);
        });
        if (ok) { _canGetCache[itemName] = true; return true; }
      }
    }
    // production failed — fall through
  }

  // Tanning: hides → leathers at a tanner NPC (no skill, just Coins + the hide card)
  // The leather appears directly in inventory — no ground pickup — so only Coins + hide needed.
  const tanHide = TANNING_MAP[itemName];
  if (tanHide) {
    const newV = new Set([...visited, itemName]);
    if (isOwned('Coins') && canGetItem(tanHide, newV)) {
      _canGetCache[itemName] = true; return true;
    }
  }

  // All sources exhausted
  _canGetCache[itemName] = false;
  return false;
}

let bmQuestCards        = {};   // quest name → {sections, ...} from bronzeman plugin data

let _currentRsn = '';
// Both stores are per-account — keys are cq_file_<rsn> / cq_manual_<rsn>.

// when the account is selected and syncQuestsFromScreenshots() runs.
let _cqFile   = new Set();
let _cqManual = new Set();

function _cqFileKey(rsn)   { return rsn ? `cq_file_${rsn}`   : 'cq_file'; }
function _cqManualKey(rsn) { return rsn ? `cq_manual_${rsn}` : 'cq_manual'; }

function _saveCq() {
  localStorage.setItem(_cqFileKey(_currentRsn),   JSON.stringify([..._cqFile]));
  localStorage.setItem(_cqManualKey(_currentRsn), JSON.stringify([..._cqManual]));
  localStorage.setItem('completed_quests', JSON.stringify([...completedQuests]));
}

function _loadManualForRsn(rsn) {
  _currentRsn = rsn || '';
  // Load per-account file completions from localStorage (populated by last sync)
  _cqFile   = new Set(JSON.parse(localStorage.getItem(_cqFileKey(_currentRsn))   || '[]'));
  // Load per-account manual toggles; start clean if no entry yet for this account
  _cqManual = new Set(JSON.parse(localStorage.getItem(_cqManualKey(_currentRsn)) || '[]'));
  completedQuests = new Set([..._cqFile, ..._cqManual]);
}

function toggleQuestDone(name) {
  if (completedQuests.has(name)) {
    // Remove from whichever set(s) it's in
    _cqFile.delete(name);
    _cqManual.delete(name);
    completedQuests.delete(name);
  } else {
    _cqManual.add(name);
    completedQuests.add(name);
  }
  _saveCq();
  renderQuestList();
  showQuestDetail(name, false);
}

// Owned cards — randomised on load (no localStorage persistence for simulation)

function isOwned(name) { return owned.has(name.toLowerCase()); }

// Normalise wiki spawn location text: "1 st floor 2 nd floor" → "1st floor"
// The wiki shows both UK (1st floor) and US (2nd floor) names; keep the first only.
function cleanSpawnText(s) {
  // Collapse "N st/nd/rd/th" → "Nth" (remove the extra space)
  s = s.replace(/(\d+)\s+(st|nd|rd|th)\b/gi, '$1$2');
  // Remove duplicate consecutive floor references e.g. "1st floor 2nd floor" → "1st floor"
  s = s.replace(/(\d+(?:st|nd|rd|th)\s+floor)\s+\d+(?:st|nd|rd|th)\s+floor/gi, '$1');
  return s.trim();
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function wikiLink(name) {
  // Strip disambiguation suffix "Monkey (monster)" → "Monkey" for wiki URL
  const page = name.replace(/ \([^)]+\)$/, '').replace(/ /g, '_');
  const url = 'https://oldschool.runescape.wiki/w/' + encodeURIComponent(page);
  return `<a href="${url}" target="_blank" rel="noopener" title="View on OSRS Wiki"
    style="color:#555;font-size:11px;text-decoration:none;margin-left:8px;vertical-align:middle"
    onclick="event.stopPropagation()">↗ wiki</a>`;
}
function toggleOwned(name) {
  const k = name.toLowerCase();
  if (owned.has(k)) owned.delete(k); else owned.add(k);
  refreshDetail();
}

function updateSimBar() {
  const el = document.getElementById('sim-summary');
  if (!el) return;
  const lvls = Object.entries(skills).map(([s,v]) => `${s.slice(0,3)} ${v}`).join(' · ');

async function loadCollection() {
  // Try real collection first; fall back to random simulation
  try {
    const data = await fetch('output/my_collection.json').then(r => r.json());
    owned = new Set(data.ownedCards.map(n => n.toLowerCase()));
    document.getElementById('sim-summary').textContent =
      `${data.cardCount} cards owned (real collection)`;

// ─── Collection switcher ───────────────────────────────────────────────────
// Called when the RSN input changes. Looks up the player in allCollections
// (pre-decoded from all_collections.json) and switches owned cards client-side.
// If not found, shows a hint without changing the current collection.
function switchCollection(rsn) {
  if (!rsn) return;
  const key = Object.keys(allCollections).find(k => k.toLowerCase() === rsn.toLowerCase());
  if (!key) {
    // Not in local cache — show a subtle hint, don't change anything
    const el = document.getElementById('sim-summary');
    if (el) el.textContent = `'${rsn}' not in local cache — hit ↻ Refresh to decode`;
    return;
  }
  const profile = allCollections[key];
  owned = new Set(profile.ownedCards.map(n => n.toLowerCase()));
  _canGetCache = {};
  document.getElementById('sim-summary').textContent =
    `${profile.cardCount} cards owned · ${key}`;
  document.getElementById('sim-btn').style.display = 'none';
  filterCards();
  refreshDetail();
  if (activeTab === 'skilling')   renderSkillGrid();
  if (activeTab === 'questing')   renderQuestList();
  if (activeTab === 'equipment') { refreshEquipDoll(); updateEquipCount(); renderGearStats(); updateDpsOutput(); }
}

// Populate the account dropdown from an array of {name, cardCount, credits?} objects.
function populateAccountDropdown(accounts) {
  const sel = document.getElementById('rsn-input');
  if (!sel || sel.tagName !== 'SELECT') return;
  const current = sel.value;
  sel.innerHTML = '';
  if (!accounts || !accounts.length) {
    sel.innerHTML = '<option value="">— no accounts found —</option>';
    return;
  }
  for (const a of accounts) {
    const opt = document.createElement('option');
    opt.value = a.name;
    opt.textContent = `${a.name}  (${(a.cardCount || 0).toLocaleString()})`;
    sel.appendChild(opt);
  }
  // Restore previous selection if still present; otherwise first entry
  if (current && [...sel.options].some(o => o.value === current)) {
    sel.value = current;
  } else {
    sel.selectedIndex = 0;
  }
}

// Called when the account dropdown changes — switches collection + levels + quests.
function onAccountChange(rsn) {
  if (!rsn) return;
  _loadManualForRsn(rsn);   // swap to this account's manual quest completions first
  switchCollection(rsn);
  lookupLevels(rsn);
  syncQuestsFromScreenshots(rsn);
}

function simulateRandom() {
  // Random skill levels: uniform 1–99
  for (const s of Object.keys(skills))
    skills[s] = Math.floor(Math.random() * 99) + 1;

  // Collect every card name that appears in the data
  const allNames = new Set();
  for (const name of Object.keys(monsterDrops)) allNames.add(name.toLowerCase());
  for (const name of Object.keys(itemSources))  allNames.add(name.toLowerCase());
  for (const data of Object.values(monsterDrops))
    for (const d of data.drops || []) allNames.add(d.card.toLowerCase());

  // Own ~15% at random
  owned = new Set();
  for (const name of allNames)
    if (Math.random() < 0.15) owned.add(name);
}

// ─── Data loading ──────────────────────────────────────────────────────────
async function loadData() {
  try {
    const cb = `?v=${Date.now()}`;  // cache-bust so updated JSON files are always fresh
    const [md, is, cc, cd, css, cs, crr, ii, qd, ed, fd, bmqc, cq, ac, cst] = await Promise.all([
      fetch(`output/monster_drops.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/item_sources.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/card_categories.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/card_details.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`clue_scroll_sources.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`clue_sources.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`clue_reward_rarities.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`ingredient_info.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/quests.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/equipment_data.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/food_data.json${cb}`).then(r => r.json()).catch(() => ({})),
      fetch(`output/bm_quest_cards.json${cb}`).then(r => r.json()).catch(() => ({quests:[]})),
      fetch(`output/completed_quests.json${cb}`).then(r => r.json()).catch(() => ({completedQuests:[]})),
      fetch(`output/all_collections.json${cb}`).then(r => r.json()).catch(() => ({profiles:{}})),
      fetch(`output/clue_steps.json${cb}`).then(r => r.json()).catch(() => null),
    ]);
    monsterDrops = md; itemSources = is; cardCategories = cc; cardDetails = cd;
    equipBySlot = ed; foodData = fd;
    clueScrollSources  = css;
    clueRewardRarities = crr;
    ingredientInfo     = ii;
    questsData         = qd;
    allCollections     = ac.profiles || {};
    clueSteps          = cst;
    // Build quest name → BM card requirement map; track miniquests separately
    bmQuestCards = {};
    for (const q of (bmqc.quests || [])) {
      if (!q || !q.name) continue;
      if (q.miniquest) {
        // Miniquests: store card data but flag them so the UI can split them
        bmQuestCards[q.name] = { ...q, _miniquest: true };
      } else {
        bmQuestCards[q.name] = q;
      }
    }
    // Only load completed_quests.json at startup if the file has a player tag
    // that matches the currently selected account. A file with no player tag
    // is ambiguous — don't apply it to any specific account (syncQuestsFromScreenshots
    // applies the same rule). This prevents lottie_tcg quests leaking onto tcg_lottie.
    {
      const cqPlayer = (cq.player || cq.rsn || '').toLowerCase();
      const startupRsn = (document.getElementById('rsn-input')?.value || '').trim().toLowerCase();
      const cqMatches = cqPlayer && (!startupRsn || cqPlayer === startupRsn);
      if (cqMatches && (cq.completedQuests || []).length > 0) {
        _cqFile = new Set(cq.completedQuests);
        completedQuests = new Set([..._cqFile, ..._cqManual]);
        _saveCq();
      }
    }
    // Build inverted tier → [item names] map from clue_sources.json
    for (const [name, tiers] of Object.entries(cs)) {
      for (const tier of tiers) {
        if (!clueRewardsByTier[tier]) clueRewardsByTier[tier] = [];
        clueRewardsByTier[tier].push(name);
      }
    }
    await loadCollection();
    buildCardList();
    // Load pack catalog from server (non-blocking — enhances card detail pages once ready)
    fetch('/api/packs').then(r => r.json()).then(data => {
      packCatalog = data;
      packPools   = _buildPackPools();
      // Populate set filter dropdown with single-pack variants only
      const sel = document.getElementById('set-filter');
      if (sel) {
        for (const pack of data.packs) {
          if (pack.id.endsWith('_large')) continue;
          const opt = document.createElement('option');
          opt.value = pack.id;
          opt.textContent = pack.name;
          sel.appendChild(opt);
        }
      }
    }).catch(() => {});
    // Populate account dropdown from pre-loaded all_collections.json (sorted by most recently updated)
    const _startupAccounts = Object.entries(allCollections)
      .map(([name, d]) => ({ name, cardCount: d.cardCount || 0, credits: d.credits || 0, updatedAt: d.updatedAt || '' }))
      .sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
    populateAccountDropdown(_startupAccounts);
    const _selectedRsn = document.getElementById('rsn-input')?.value || '';
    if (_selectedRsn) {
      _loadManualForRsn(_selectedRsn);  // set _currentRsn before any saves happen
      switchCollection(_selectedRsn);
    }
    // Auto-load fresh data on startup (also refreshes dropdown via /api/accounts/list)
    refreshAll();
    // Auto-detect new collection after packs opened / logout — poll every 8s
    setInterval(async () => {
      if (_refreshInProgress) return;
      try {
        const sm = await fetch('/api/collection/source-mtime', { signal: AbortSignal.timeout(3000) }).then(r => r.json());
        if (sm.sourceMtime && sm.sourceMtime > _lastSourceMtime + 0.5) {
          const btn = document.getElementById('refresh-btn');
          if (btn) { btn.style.color = '#b07a30'; btn.title = 'New collection detected — refreshing…'; }
          await refreshAll();
          if (btn) { btn.style.color = ''; btn.title = ''; }
        }
      } catch {}
    }, 8000);
  } catch {
    document.getElementById('detail').innerHTML =
      `<div class="placeholder">⚠ Needs a local server.<br>
       <code>python3 scripts/server.py</code><br>
       Then open <a href="http://localhost:8765/preview.html" style="color:#b07a30">localhost:8765/preview.html</a></div>`;
  }
}

const CLUE_TIER_CONFIG = {
  beginner: {label:'Beginner', color:'#c8a830', bg:'#2a2010'},
  easy:     {label:'Easy',     color:'#50c050', bg:'#102010'},
  medium:   {label:'Medium',   color:'#c8c030', bg:'#202010'},
  hard:     {label:'Hard',     color:'#4080c0', bg:'#101828'},
  elite:    {label:'Elite',    color:'#9050d0', bg:'#1e1028'},
  master:   {label:'Master',   color:'#d03030', bg:'#280a0a'},
};
const CLUE_TIER_ORDER = ['beginner','easy','medium','hard','elite','master'];

function buildCardList() {
  for (const name of Object.keys(monsterDrops)) {
    const hasCombat = !!monsterDrops[name]?.combatLevel;
    allCards.push({name, type: hasCombat ? 'monster' : 'npc'});
  }
  for (const [name, d] of Object.entries(itemSources)) {
    // Every entry in itemSources is a v1.0 catalog card — show them all.
    // Currency and Food get their own categories; others use cardCategories tags.
    let cats;
    if (CURRENCY_NAMES.has(name)) cats = ['Currency'];
    else if (name in foodData) cats = ['Food'];
    else cats = cardCategories[name] || [];
    allCards.push({name, type:'item', cats});
  }
  // Virtual clue scroll cards — always at top of list
  for (const tier of CLUE_TIER_ORDER)
    allCards.push({name: `Clue scroll (${tier})`, type: 'clue', tier});
  allCards.sort((a,b) => {
    // Clue scrolls sort before everything else
    if (a.type === 'clue' && b.type !== 'clue') return -1;
    if (b.type === 'clue' && a.type !== 'clue') return  1;
    if (a.type === 'clue' && b.type === 'clue')
      return CLUE_TIER_ORDER.indexOf(a.tier) - CLUE_TIER_ORDER.indexOf(b.tier);
    return a.name.localeCompare(b.name);
  });
  renderList(allCards);
}

function filterCards() {
  const q       = document.getElementById('search').value.toLowerCase();
  const owned_f = document.getElementById('owned-filter').value;
  const catFil  = document.getElementById('cat-filter').value;
  const setFil  = document.getElementById('set-filter')?.value || 'all';

  // Resolve the pack object once for set filtering
  const setPackObj = (setFil !== 'all' && packCatalog)
    ? packCatalog.packs.find(p => p.id === setFil) : null;

  renderList(allCards.filter(c => {
    if (q && !c.name.toLowerCase().includes(q)) return false;
    // Clue scroll virtual cards: skip owned/set filters; pass cat filter when 'all' or 'clueScrolls'
    if (c.type === 'clue') {
      return catFil === 'all' || catFil === 'clueScrolls';
    }
    if (owned_f === 'owned'     && !isOwned(c.name)) return false;
    if (owned_f === 'not-owned' &&  isOwned(c.name)) return false;
    if (catFil !== 'all') {
      if (catFil === 'clueScrolls') return false;
      if (catFil === 'monsters') return c.type === 'monster';
      if (catFil === 'npcs')     return c.type === 'npc';
      if (c.type !== 'item') return false;
      const cats = c.cats || [];
      if (catFil === 'other') {
        if (cats.length > 0) return false;
      } else {
        if (!cats.includes(catFil)) return false;
      }
    }
    if (setPackObj && !_cardInPack(c.name, setPackObj)) return false;
    return true;
  }));
}

// Items that should be classified as Currency regardless of Card.json categories
const CURRENCY_NAMES = new Set([
  'Coins', 'Platinum token', 'Tokkul', 'Trading sticks', 'Mark of grace',
  'Ecto-token', 'Golden nugget', 'Nuggets', 'Crystal shards', 'Hallowed mark',
  'Hallowed crystal shard', 'Warrior guild token', 'Castle wars ticket',
  'Archery ticket', 'Agility arena ticket', 'Wilderness agility ticket',
  'Coin pouch',
]);

// Short category abbreviation for the sidebar badge
const CAT_ABBR = {
  Weapon:'Wpn', Ammo:'Ammo', Rune:'Rune',
  Armour:'Arm', Consumable:'Pot', Food:'Food', Clue:'Clue',
  Slayer:'Slay', General:'Gen', Currency:'Coin',
};

function renderList(cards) {
  const list = document.getElementById('card-list');
  list.innerHTML = '';
  for (const card of cards) {
    const el = document.createElement('div');
    if (card.type === 'clue') {
      const cfg = CLUE_TIER_CONFIG[card.tier] || {};
      el.className = 'card-item' + (card.name === selected ? ' selected' : '');
      el.innerHTML = `<span class="card-name">${card.name}</span>`
        + `<span style="font-size:9px;color:${cfg.color};background:${cfg.bg};border-radius:2px;padding:1px 5px">${cfg.label}</span>`;
    } else {
      const ownedCls = isOwned(card.name) ? ' owned-card' : '';
      el.className = 'card-item' + (card.name === selected ? ' selected' : '') + ownedCls;
      const firstCat = card.cats?.[0];
      let catTag;
      if (card.type === 'item' && firstCat) {
        if (firstCat === 'Currency') {
          catTag = `<span class="card-cat" style="background:#1e1600;color:#a07830">Coin</span>`;
        } else if (firstCat === 'Food') {
          const hp = foodData[card.name];
          catTag = `<span class="card-cat food-cat" title="Heals ${hp} HP">+${hp}hp</span>`;
        } else {
          catTag = `<span class="card-cat">${CAT_ABBR[firstCat] || firstCat}</span>`;
        }
      } else if (card.type === 'npc') {
        catTag = `<span class="card-type" style="background:#1a1a2e;color:#6a7aaa">NPC</span>`;
      } else if (card.type === 'monster') {
        const cb = monsterDrops[card.name]?.combatLevel;
        catTag = `<span class="card-type">Cb ${cb ?? '?'}</span>`;
      } else {
        catTag = `<span class="card-type">${card.type}</span>`;
      }
      el.innerHTML = `<span class="card-name">${card.name}</span>${catTag}`;
    }
    el.onclick = () => showCard(card.name, card.type);
    list.appendChild(el);
  }
}

// ─── Skill levels ──────────────────────────────────────────────────────────
function getLevel(skill) { return skills[skill] || 1; }

// ─── Cross-tab navigation history ─────────────────────────────────────────
// Each entry: {tab, name, type, skill, quest} — full app state snapshot
let navHistory = [];
let navForward = [];

function captureState() {
  return {tab: activeTab, name: selected, type: selectedType,
          skill: selectedSkill, quest: selectedQuest};
}

function pushHistoryEntry() {
  const state = captureState();
  // Only push if there's meaningful state to save
  if (!state.tab) return;
  navHistory.push(state);
  if (navHistory.length > 50) navHistory.shift();
  navForward = [];
  updateNavButtons();
}

function updateNavButtons() {
  const backBtn = document.getElementById('global-back-btn');
  const fwdBtn  = document.getElementById('global-fwd-btn');
  if (backBtn) backBtn.disabled = navHistory.length === 0;
  if (fwdBtn)  fwdBtn.disabled  = navForward.length === 0;
}

function navigate(state) {
  // Restore full app state without pushing history
  _renderTab(state.tab, false);  // don't reset selection — we restore it below
  if (state.tab === 'skilling') {
    selectedSkill = null;
    if (state.skill) showSkillDetail(state.skill, false);
    else renderSkillGrid();
  } else if (state.tab === 'questing') {
    selectedQuest = null;
    if (state.quest) showQuestDetail(state.quest, false);
    else renderQuestList();
  } else if (state.tab === 'cards') {
    selected = state.name; selectedType = state.type;
    filterCards();
    if (state.name) refreshDetail();
  }
  updateNavButtons();
}

function navigateBack() {
  if (!navHistory.length) return;
  navForward.push(captureState());
  const prev = navHistory.pop();
  navigate(prev);
}

function navigateForward() {
  if (!navForward.length) return;
  navHistory.push(captureState());
  const next = navForward.pop();
  navigate(next);
}

// ─── Card display ──────────────────────────────────────────────────────────
function showCard(name, type, push = true) {
  if (push) pushHistoryEntry();
  selected = name; selectedType = type;
  filterCards();
  refreshDetail();
}

function refreshDetail() {
  if (!selected) return;
  const detail = document.getElementById('detail');
  if (!detail) return;
  const scroll = detail.scrollTop;
  if (selectedType === 'monster') renderMonster(selected, detail);
  else if (selectedType === 'clue') renderClueScroll(selected.match(/\((\w+)\)$/)?.[1], detail);
  else if (selectedType === 'ingredient') renderIngredient(selected, detail);
  else renderItem(selected, detail);
  detail.scrollTop = scroll;
  updateNavButtons();
}

function rarityClass(r) { return 'rarity-' + (r||'Unknown').replace(/ /g,'-'); }

// Convert a fraction string like "1/128" to a rarity label
function fractionToRarity(frac) {
  if (!frac) return 'Unknown';
  if (frac === '1/1') return 'Always';
  const m = frac.match(/^([\d.]+)\/([\d,]+)$/);
  if (!m) return 'Unknown';
  const rate = parseFloat(m[1]) / parseFloat(m[2].replace(/,/g,''));
  if (rate >= 0.1)    return 'Common';
  if (rate >= 0.02)   return 'Uncommon';
  if (rate >= 0.005)  return 'Rare';
  if (rate >= 0.001)  return 'Very Rare';
  return 'Extremely Rare';
}

// ─── Rarity helpers ────────────────────────────────────────────────────────
const RARITY_RANK = { Always:0, Common:1, Uncommon:2, Rare:3, 'Very Rare':4, 'Extremely Rare':5 };
function fractionValue(f) {
  // Returns numeric drop probability (lower = rarer)
  if (!f) return 1;
  const m = f.match(/^([\d.]+)\/([\d,.]+)$/);
  if (!m) return 1;
  return parseFloat(m[1]) / parseFloat(m[2].replace(/,/g,''));
}

// Deduplicate a monster list by card name, keeping the most common entry per monster
// (highest drop probability — best rate the player can get this item).
function dedupeMonsters(list) {
  const best = {};
  for (const m of list) {
    const prev = best[m.card];
    if (!prev) { best[m.card] = m; continue; }
    const prevRank = RARITY_RANK[prev.rarity] ?? 99;
    const newRank  = RARITY_RANK[m.rarity]  ?? 99;
    // Lower rank = more common; prefer that
    if (newRank < prevRank) { best[m.card] = m; continue; }
    // Same rarity label — prefer higher fraction value (more frequent)
    if (newRank === prevRank && fractionValue(m.fraction) > fractionValue(prev.fraction))
      best[m.card] = m;
  }
  return Object.values(best);
}

// ─── Progress pill HTML ────────────────────────────────────────────────────
function progressPill(count, total, isRdt) {
  if (total === 0) return '';
  const pct  = total ? (count/total)*100 : 0;
  const done = count === total;
  const color = isRdt ? '#2a3a6a' : (done ? '#00c853' : '#e8c97a');
  return `<div class="progress-pill">
    <span class="fraction">
      <span class="num" style="color:${color}">${count}</span>
      <span class="den"> / ${total}</span>
    </span>
    <div class="pbar">
      <div class="pbar-fill${done && !isRdt ? ' complete' : ''}" style="width:${pct}%;${isRdt?'background:#2a3a6a':''}"></div>
    </div>
  </div>`;
}

// ─── Drop row HTML (clickable to toggle owned) ─────────────────────────────
// Inline req tags shown next to a monster name in drop rows
// Returns HTML string for e.g. "Slay 85 ✓" / "Sail 75 ✗"
function monsterReqTags(monsterData) {
  if (!monsterData) return '';
  let html = '';
  const checks = [
    {key:'slayerLevel',  skill:'Slayer',  abbr:'Slay'},
    {key:'sailingLevel', skill:'Sailing', abbr:'Sail'},
  ];
  for (const {key, skill, abbr} of checks) {
    const lvl = monsterData[key];
    if (!lvl) continue;
    const met = getLevel(skill) >= lvl;
    html += `<span style="font-size:10px;margin-left:4px;color:${met?'#c87820':'#8a4a10'}">${abbr} ${lvl}${met?' ✓':' ✗'}</span>`;
  }
  return html;
}

function dropRowHtml(cardName, rarity, fraction, isRdt) {
  const ownedCard = isOwned(cardName);
  // RDT rows still show ownership — owned = green tick, not-owned = dimmed diamond
  const indClass  = ownedCard ? 'owned' : (isRdt ? 'rdt' : 'locked');
  const nameClass = ownedCard ? 'owned' : (isRdt ? 'rdt' : 'locked');
  const rowClass  = ownedCard ? 'owned' : (isRdt ? '' : 'locked');
  const symbol    = ownedCard ? '✓' : (isRdt ? '◇' : '✗');
  const rarityBg  = isRdt && !ownedCard ? 'background:#0d0d1a;color:#4a5a8a;' : '';

  const reqTags = monsterReqTags(monsterDrops[cardName]);

  return `<div class="drop-row ${rowClass}" style="cursor:pointer" data-nav="${cardName}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
    <div class="drop-indicator ${indClass}">${symbol}</div>
    <span class="drop-name ${nameClass}">${cardName}${reqTags}</span>
    <span class="rarity-badge ${rarityClass(rarity)}" style="${rarityBg}">${rarity}</span>
    <span class="fraction">${fraction || '—'}</span>
  </div>`;
}

// ─── Monster view ──────────────────────────────────────────────────────────
// Deduplicate drops by card name, keeping the entry with the highest drop probability.
// Some monsters (e.g. Scurrius) have multiple drop tables on the same wiki page,
// causing the same item to appear twice with different fractions.
function dedupeDrops(drops) {
  const best = new Map();
  for (const d of drops) {
    const key = d.card;
    if (!best.has(key)) { best.set(key, d); continue; }
    // Compare probabilities: parse "N/D" → rate, keep higher rate
    const rate = frac => {
      if (!frac) return 0;
      const m = frac.match(/^([\d.]+)\/([\d,]+)$/);
      return m ? parseFloat(m[1]) / parseFloat(m[2].replace(/,/g,'')) : 0;
    };
    if (rate(d.fraction) > rate(best.get(key).fraction)) best.set(key, d);
  }
  return [...best.values()];
}

// ─── Pack acquisition helpers ──────────────────────────────────────────────

function _buildPackPools() {
  // Build {packId → {tierLabel → count}} from card_details (tier + regions) and
  // card_categories (labels). Single-pack only (skip *_large variants).
  if (!packCatalog) return null;
  const pools = {};
  for (const pack of packCatalog.packs) {
    if (!pack.id.endsWith('_large')) pools[pack.id] = {};
  }
  for (const [name, detail] of Object.entries(cardDetails)) {
    const tier    = detail.tier;
    if (!tier) continue;
    const regions = detail.regions || [];
    const labels  = cardCategories[name] || [];
    for (const pack of packCatalog.packs) {
      if (pack.id.endsWith('_large')) continue;
      const filters = pack.category || [];
      let inPack = filters.length === 0;   // Standard = all cards
      if (!inPack) {
        for (const f of filters) {
          if (regions.includes(f) || labels.includes(f)) { inPack = true; break; }
        }
      }
      if (inPack) {
        if (!pools[pack.id][tier]) pools[pack.id][tier] = 0;
        pools[pack.id][tier]++;
      }
    }
  }
  return pools;
}

function _cardInPack(name, pack) {
  const filters = pack.category || [];
  if (filters.length === 0) return true;
  const regions = (cardDetails[name] || {}).regions || [];
  const labels  = cardCategories[name] || [];
  for (const f of filters) {
    if (regions.includes(f) || labels.includes(f)) return true;
  }
  return false;
}

function packAcquisitionHtml(name) {
  if (!packCatalog || !packPools) return '';
  const tier = (cardDetails[name] || {}).tier;
  if (!tier) return '';

  const rows = [];
  for (const pack of packCatalog.packs) {
    if (pack.id.endsWith('_large')) continue;
    if (!_cardInPack(name, pack)) continue;
    const tierPool  = (packPools[pack.id] || {})[tier] || 0;
    const totalPool = Object.values(packPools[pack.id] || {}).reduce((s, n) => s + n, 0);
    rows.push({ name: pack.name, price: pack.price, tierPool, totalPool });
  }
  if (rows.length === 0) return '';

  const fmt = n => n.toLocaleString();
  return `<div class="section">
    <div class="section-header">Pack Acquisition</div>
    <table class="pack-table">
      <tr><th>Pack</th><th class="r">Price</th><th class="r">${tier}s / set size</th></tr>
      ${rows.map(r => `<tr>
        <td style="color:#ccc">${r.name}</td>
        <td class="r" style="color:#e8c97a">${fmt(r.price)}</td>
        <td class="r"><span style="color:#888">${r.tierPool}</span><span style="color:#444"> / ${fmt(r.totalPool)}</span></td>
      </tr>`).join('')}
    </table>
    <div style="font-size:10px;color:#444;margin-top:4px">Smaller pool = better odds. Exact drop rates are server-side.</div>
  </div>`;
}

function tierBadgeHtml(name) {
  const tier = (cardDetails[name] || {}).tier;
  if (!tier) return '';
  return `<span class="tier-badge tier-${tier}">${tier}</span>`;
}

function renderMonster(name, container) {
  const data      = monsterDrops[name] || {};
  const allDropsRaw = data.drops || [];
  const allDrops  = dedupeDrops(allDropsRaw);
  const mainDrops = allDrops.filter(d => !d.fromRdt);
  const rdtDrops  = allDrops.filter(d => d.fromRdt);

  const mainOwned = mainDrops.filter(d => isOwned(d.card)).length;
  const rdtOwned  = rdtDrops.filter(d => isOwned(d.card)).length;

  const reqs = [];
  if (data.slayerLevel)  reqs.push({label: `Slayer ${data.slayerLevel}`,  locked: getLevel('Slayer')  < data.slayerLevel});
  if (data.sailingLevel) reqs.push({label: `Sailing ${data.sailingLevel}`, locked: getLevel('Sailing') < data.sailingLevel});
  if (data.quests?.length) reqs.push({label: `Quest locked`, locked: true});
  if (name.startsWith('Revenant')) reqs.push({label: 'Coins (entrance fee)', locked: !isOwned('Coins')});

  const mDetail  = cardDetails[name] || {};
  const mImgHtml = mDetail.imageUrl
    ? `<img src="${mDetail.imageUrl}" style="float:right;max-width:64px;max-height:64px;image-rendering:pixelated;margin-left:8px" onerror="this.style.display='none'">`
    : '';
  const mExamHtml = mDetail.examine
    ? `<div style="font-size:11px;color:#888;font-style:italic;margin-top:3px">${mDetail.examine}</div>`
    : '';

  const monsterOwned = isOwned(name);
  let html = `<h1>${name}${mImgHtml}${wikiLink(name)}</h1>
    <div class="subtitle">
      ${data.combatLevel ? 'Monster card' : 'NPC card'}${tierBadgeHtml(name)}
      ${data.combatLevel ? ` · Combat ${data.combatLevel}` : ''}
      · <span style="color:${monsterOwned?'#00c853':'#7a5020'}">${monsterOwned?'✓ Owned':'✗ Not owned'}</span>
      <span style="color:#555;font-size:10px;margin-left:8px;cursor:pointer" data-nav="${name}" onclick="toggleOwned(this.dataset.nav)">(toggle)</span>
      ${reqs.map(r => `<span style="margin-left:8px;padding:2px 7px;border-radius:10px;font-size:10px;
        background:${r.locked?'#3a1a00':'#003d1f'};color:${r.locked?'#c84a00':'#00c853'}">${r.label}</span>`).join('')}
      ${mExamHtml}
    </div>`;

  // Stats blocks
  html += `<div class="stats-bar">
    <div class="stat-block">
      <div class="stat-label">Main Drops</div>
      <div class="stat-value${mainOwned===mainDrops.length&&mainDrops.length>0?' complete':''}">${mainOwned}<span class="den"> / ${mainDrops.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Rare Drop Table</div>
      <div class="stat-value" style="color:${rdtOwned===rdtDrops.length&&rdtDrops.length>0?'#00c853':'#4a6aaa'}">${rdtOwned}<span class="den"> / ${rdtDrops.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">All TCG Drops</div>
      <div class="stat-value${(mainOwned+rdtOwned)===allDrops.length&&allDrops.length>0?' complete':''}">${mainOwned+rdtOwned}<span class="den"> / ${allDrops.length}</span></div>
    </div>
  </div>`;

  html += packAcquisitionHtml(name);

  // Main drops
  html += `<div class="section">
    <div class="section-header">
      TCG Card Drops
      ${progressPill(mainOwned, mainDrops.length, false)}
    </div>`;
  if (mainDrops.length === 0) {
    html += `<div class="empty-note">No main-table TCG drops found.</div>`;
  } else {
    // Owned first, then locked
    const sorted = [...mainDrops].sort((a,b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return 0;
    });
    for (const d of sorted)
      html += dropRowHtml(d.card, d.rarity, d.fraction, false);
  }
  html += `</div>`;

  // RDT drops
  if (rdtDrops.length > 0) {
    html += `<div class="section">
      <div class="section-header">
        Rare Drop Table
        <span class="rdt-header-note">shared · ${progressPill(rdtOwned, rdtDrops.length, true)}</span>
      </div>
      <div class="rdt-banner">These drops come from the shared Rare &amp; Gem Drop Table, which many monsters access. Owning these doesn't require farming this specific monster.</div>`;
    const sorted = [...rdtDrops].sort((a,b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return 0;
    });
    for (const d of sorted)
      html += dropRowHtml(d.card, d.rarity, d.fraction, true);
    html += `</div>`;
  }

  // ── Area access requirements ──────────────────────────────────────────────
  const areaKey = CARD_AREAS[name];
  if (areaKey && AREA_GATES[areaKey]) {
    const gate = AREA_GATES[areaKey];
    const completable = computeCompletableQuests();
    html += `<div class="section">
      <div class="section-header">Location: ${gate.label} <span style="font-size:10px;color:#555;font-weight:normal">${gate.note}</span></div>
      <div style="margin-top:8px">`;
    if (gate.questRequired) {
      const qDone = completedQuests.has(gate.questRequired);
      const qOk   = qDone || completable.has(gate.questRequired);
      const sym   = qDone ? '✓' : qOk ? '~' : '✗';
      const cls   = qDone ? 'ok' : qOk ? 'close' : 'fail';
      const note  = qDone ? 'complete' : qOk ? 'completable' : 'locked';
      const safeQ = gate.questRequired.replace(/'/g, "\\'");
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          onclick="pushHistoryEntry();selectedQuest='${safeQ}';_renderTab('questing',false);showQuestDetail('${safeQ}',false)">Quest: ${gate.questRequired}</span>
        <span class="req-note">${note}</span>
      </div>`;
    }
    if (gate.npcRequired) {
      const nOk = isOwned(gate.npcRequired);
      const sym  = nOk ? '✓' : '✗';
      const cls  = nOk ? 'ok' : 'fail';
      const safeN = gate.npcRequired.replace(/'/g, "\\'");
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          onclick="pushHistoryEntry();_renderTab('cards');setTimeout(()=>showCard('${safeN}','monster',false),50)">NPC card: ${gate.npcRequired}</span>
        <span class="req-note">${nOk ? 'card owned' : 'need card'}</span>
      </div>`;
    }
    for (const item of (gate.itemsRequired || [])) {
      const iOk = isOwned(item);
      const sym  = iOk ? '✓' : '✗';
      const cls  = iOk ? 'ok' : 'fail';
      const safeI = item.replace(/'/g, "\\'");
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          onclick="pushHistoryEntry();_renderTab('cards');setTimeout(()=>showCard('${safeI}','item',false),50)">Item: ${item}</span>
        <span class="req-note">${iOk ? 'owned' : 'need card'}</span>
      </div>`;
    }
    const extras = CARD_AREA_EXTRAS[name] || [];
    for (const item of extras) {
      const iOk = isOwned(item);
      const sym  = iOk ? '✓' : '✗';
      const cls  = iOk ? 'ok' : 'fail';
      const safeI = item.replace(/'/g, "\\'");
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          onclick="pushHistoryEntry();_renderTab('cards');setTimeout(()=>showCard('${safeI}','item',false),50)">${item}</span>
        <span class="req-note">${iOk ? 'owned' : 'need card'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Slayer tasks (if this NPC is a Slayer master) ─────────────────────────
  const slayerKey = SLAYER_MASTER_MAP[name];
  if (slayerKey && SLAYER_TASKS[slayerKey]) {
    const master = SLAYER_TASKS[slayerKey];
    const tasks = master.tasks;
    const totalWeight = tasks.reduce((s,t) => s + t.weight, 0);
    const sorted2 = [...tasks].sort((a,b) => {
      const ao = a.cards.some(c => isOwned(c)), bo = b.cards.some(c => isOwned(c));
      if (ao !== bo) return ao ? -1 : 1;
      return b.weight - a.weight;
    });
    const availCount = tasks.filter(t => t.cards.some(c => isOwned(c))).length;
    const alias = (name !== slayerKey) ? ` <span style="font-size:10px;color:#555;font-weight:normal">(same list as ${slayerKey})</span>` : '';
    html += `<div class="section">
      <div class="section-header">Slayer Tasks${alias} <span style="font-size:10px;color:#555;font-weight:normal">${availCount}/${tasks.length} available</span></div>
      <div style="margin-top:8px">`;
    for (const t of sorted2) {
      const owned = t.cards.some(c => isOwned(c));
      const pct = ((t.weight / totalWeight) * 100).toFixed(1);
      const ownedCard = t.cards.find(c => isOwned(c)) || t.cards[0];
      const navCard = t.cards[0].replace(/'/g, "\\'");
      html += `<div class="method-row">
        <div class="method-indicator ${owned ? 'available' : 'locked'}"></div>
        <span class="method-name ${owned ? 'available' : 'locked'}" style="cursor:pointer"
          onclick="pushHistoryEntry();_renderTab('cards');setTimeout(()=>showCard('${navCard}','monster',false),50)">${t.task}</span>
        <span class="method-level" style="min-width:46px;text-align:right">${pct}%</span>
        <span class="method-note">${owned ? ownedCard : 'no card'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Required for quests ───────────────────────────────────────────────────
  html += requiredForQuestsHtml(name);

  // ── Clue step NPC usage ────────────────────────────────────────────────────
  html += clueStepNpcHtml(name);

  container.innerHTML = html;
}

// ─── Production card HTML ──────────────────────────────────────────────────
// Maps wiki facility strings → human-readable access notes.
// Altars are locations (not cards) — show what the player actually needs to carry.
// Access options for each altar. Strings that match itemSources keys will show
// ownership indicators; others (e.g. 'Abyss') are shown as plain grey text.
const FACILITY_NOTES = {
  'None': null,
  'Air Altar':    ['Air talisman', 'Air tiara', 'Abyss'],
  'Water Altar':  ['Water talisman', 'Water tiara', 'Abyss'],

  'Mind Altar':   ['Mind talisman', 'Mind tiara', 'Abyss'],
  'Body Altar':   ['Body talisman', 'Body tiara', 'Abyss'],
  'Chaos Altar':  ['Chaos talisman', 'Chaos tiara', 'Abyss'],
  'Nature Altar': ['Nature talisman', 'Nature tiara', 'Abyss'],
  'Cosmic Altar': ['Cosmic talisman', 'Cosmic tiara', 'Abyss'],
  'Law Altar':    ['Law talisman', 'Law tiara', 'Abyss'],
  'Death Altar':  ['Death talisman', 'Death tiara', 'Abyss'],
  'Astral Altar': ['Astral talisman', 'Abyss'],
  'Blood Altar':  ['Blood talisman', 'Abyss'],
  'Blood AltarBlood Altar (Kourend)': ['Blood talisman', 'Abyss'],
  'Soul Altar':   ['Soul talisman', 'Abyss'],
  'Wrath Altar':  ['Wrath talisman', 'Abyss'],
};
function facilityNote(f) {
  if (!f || f === 'None') return null;
  const opts = FACILITY_NOTES[f];
  if (!opts) return `<span style="color:#888">Requires: ${f}</span>`;
  const sep = ' <span style="color:#555">/</span> ';
  const parts = opts.map(opt => {
    const isCard = itemSources[opt] !== undefined;
    if (!isCard) return `<span style="color:#666">${opt}</span>`;
    const owned = isOwned(opt);
    const col = owned ? '#76c442' : '#c84a00';
    const sym = owned ? '✓' : '✗';
    return `<span style="cursor:pointer;color:${col}" data-nav="${opt}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">${opt} ${sym}</span>`;
  });
  return `Access: ${parts.join(sep)}`;
}
