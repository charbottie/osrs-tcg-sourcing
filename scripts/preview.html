// ─── Tool tier rows HTML ───────────────────────────────────────────────────
// skillName = e.g. "Mining" or "Woodcutting" — used to check level gate
function renderToolTiers(tiers, skillName) {
  const skillLvl = getLevel(skillName);

  // best = highest tier the player OWNS and can USE (skill level ok)
  let bestName = null;
  for (const t of tiers)
    if (isOwned(t.name) && skillLvl >= t.skillReq) bestName = t.name;

  let html = `<div class="tool-tiers">`;
  for (const t of tiers) {
    const hasCard  = isOwned(t.name);
    const levelOk  = skillLvl >= t.skillReq;
    const isBest   = t.name === bestName;

    let cls, label;
    if (isBest) {
      cls = 'best';    label = '✓';
    } else if (hasCard && !levelOk) {
      // Own it but level gate not met — show the level required
      cls = 'locked';  label = `need ${skillName} ${t.skillReq}`;
    } else if (hasCard) {
      // Own it, level ok, just not the best available
      cls = 'available'; label = '✓';
    } else {
      // Don't own the card — show as unavailable, no level details
      cls = '';         label = '—';
    }

    html += `<div class="tool-tier-row ${cls}">
      <div class="tier-dot"></div>
      <span class="tier-name"${t.rare ? ' style="font-style:italic"' : ''}>
        <span style="cursor:pointer" data-nav="${escHtml(t.name)}" data-nav-type="item"
          onclick="showCard(this.dataset.nav,this.dataset.navType)">${t.name}</span>
      </span>
      <span class="tier-req">${label}</span>
    </div>`;
  }
  return html + `</div>`;
}

// ─── Live sync — polls cloud revision every 15 s for cloud accounts ──────────
let _liveStateHash = null;
let _liveTimer     = null;

function _startLiveSync(rsn) {
  _stopLiveSync();
  if (!rsn) return;

  async function _poll() {
    try {
      const data = await fetch(`/api/collection/revision?player=${encodeURIComponent(rsn)}`,
        { signal: AbortSignal.timeout(8000) }).then(r => r.json());
      if (!data.isCloud) { _stopLiveSync(); return; }
      if (_liveStateHash === null) {
        // First successful poll — record baseline, don't refresh yet
        _liveStateHash = data.stateHash;
        return;
      }
      if (data.stateHash !== _liveStateHash) {
        _liveStateHash = data.stateHash;
        await refreshCollection();
      }
    } catch {
      // Server not running or network error — hide the indicator silently
    }
  }

  _liveTimer = setInterval(_poll, 15000);
  _poll();  // fire immediately to set baseline
}

function _stopLiveSync() {
  if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
  _liveStateHash = null;
}

// ─── Refresh all — collection + levels + quest sync ───────────────────────
async function refreshAll() {
  if (_refreshInProgress) return;
  _refreshInProgress = true;
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.disabled = true; btn.textContent = '↻ …'; }
  const rsn = document.getElementById('rsn-input')?.value.trim() || '';
  await Promise.allSettled([
    refreshCollection(),
    lookupLevels(rsn),
    syncQuestsFromScreenshots(rsn),
  ]);
  // Refresh the account dropdown with latest data from server
  try {
    const acData = await fetch('/api/accounts/list', { signal: AbortSignal.timeout(8000) }).then(r => r.json());
    if (acData.accounts?.length) {
      // Merge fresh ownedCards from allCollections into the account list
      populateAccountDropdown(acData.accounts);
      // Re-select current account so dropdown stays put
      const sel = document.getElementById('rsn-input');
      if (sel && rsn && [...sel.options].some(o => o.value === rsn)) sel.value = rsn;
    }
  } catch {}
  // Record source mtime so auto-poll knows when next change occurs
  try {
    const sm = await fetch('/api/collection/source-mtime', { signal: AbortSignal.timeout(3000) }).then(r => r.json());
    if (sm.sourceMtime) _lastSourceMtime = sm.sourceMtime;
  } catch {}
  if (btn) { btn.textContent = '↻ Refresh'; btn.disabled = false; }
  _refreshInProgress = false;
}

// ─── Live collection refresh (requires server.py) ──────────────────────────
async function refreshCollection() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = '↻ …';
  const rsn = document.getElementById('rsn-input')?.value.trim() || '';
  const url = rsn ? `/api/collection/refresh?player=${encodeURIComponent(rsn)}` : '/api/collection/refresh';
  try {
    const data = await fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    if (data.error) throw new Error(data.error);
    owned = new Set(data.ownedCards.map(n => n.toLowerCase()));
    cardTimestamps = data.cardTimestamps || {};
    cardFirstTimestamps = data.cardFirstTimestamps || {};
    _updateSortVisibility();
    _canGetCache = {};
    // Also update allCollections so subsequent client-side switches are fresh
    if (rsn && data.ownedCards) {
      const acKey = Object.keys(allCollections).find(k => k.toLowerCase() === rsn.toLowerCase()) || rsn;
      allCollections[acKey] = { cardCount: data.cardCount, ownedCards: data.ownedCards,
                                credits: data.credits || 0, cardTimestamps: data.cardTimestamps || {},
                                cardFirstTimestamps: data.cardFirstTimestamps || {} };
    }
    const label = rsn ? `${data.cardCount} cards owned · ${rsn}` : `${data.cardCount} cards owned · refreshed ${new Date().toLocaleTimeString()}`;
    document.getElementById('sim-summary').textContent = label;
    // Surface decode warnings (cloud API failures, auth errors, etc.)
    const log = data.log || '';
    if (/401|unauthorized/i.test(log)) {
      showToast('⚠ Cloud auth failed (401) — game may be offline or account not logged in. Showing last cached collection.', 'warn');
    } else if (/fetch failed|error/i.test(log) && data.cardCount === 0) {
      showToast('⚠ Collection decode returned 0 cards — check server log for details.', 'warn');
    } else if (data.cardCount === 0 && rsn) {
      showToast(`⚠ No cards found for "${rsn}" — account may be new or not yet decoded.`, 'warn');
    }
    document.getElementById('sim-btn').style.display = 'none';
    filterCards();
    refreshDetail();
    if (activeTab === 'skilling') renderSkillGrid();
    if (activeTab === 'questing') renderQuestList();
    btn.textContent = '↻ Refresh';
    btn.disabled = false;
    // Start live sync if this is a cloud account (has timestamps); stop if not
    if (Object.keys(cardTimestamps).length && rsn) _startLiveSync(rsn); else _stopLiveSync();
  } catch (e) {
    console.error('Refresh failed:', e);
    showToast('⚠ Refresh failed — is the server running? (' + e.message + ')', 'error');
    btn.textContent = '✗ Error';
    btn.style.color = '#c84a00';
    setTimeout(() => {
      btn.textContent = '↻ Refresh';
      btn.style.color = '';
      btn.disabled = false;
    }, 3000);
  }
}

// ─── Hiscores level lookup (requires server.py) ────────────────────────────
async function lookupLevels(rsn) {
  const _rsn = rsn || document.getElementById('rsn-input')?.value.trim();
  if (!_rsn) return;

  try {
    const data = await fetch(`/api/hiscores?player=${encodeURIComponent(_rsn)}`).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
    if (data.error) throw new Error(data.error);

    // Merge returned levels into skills — only update skills we track
    for (const [skill, lvl] of Object.entries(data.levels)) {
      if (skill in skills) skills[skill] = lvl;
    }
    _canGetCache = {};
    refreshDetail();
    if (activeTab === 'skilling') renderSkillGrid();
    if (activeTab === 'questing') renderQuestList();
  } catch (e) {
    console.error('Level lookup failed:', e);
  }
}

// ─── Quest sync from RuneLite screenshots ──────────────────────────────────
// Tries server API first (/api/quests/completed?player=RSN), falls back to
// the static output/completed_quests.json generated by decode_completed_quests.py.
async function syncQuestsFromScreenshots(rsn) {
  const btn = document.getElementById('quest-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }

  const _rsn = rsn || (document.getElementById('quest-rsn-input')?.value ||
               document.getElementById('rsn-input')?.value || '').trim();

  let data = null;
  let source = 'file';

  // Try server API if we have an RSN
  if (_rsn) {
    try {
      const resp = await fetch(`/api/quests/completed?player=${encodeURIComponent(_rsn)}`, { signal: AbortSignal.timeout(3000) });
      if (resp.ok) {
        data = await resp.json();
        source = 'server';
      }
    } catch (_) { /* server not running — fall through */ }
  }

  // Fall back to static file — only apply it when the file's player matches the requested RSN
  if (!data) {
    try {
      const resp = await fetch(`output/completed_quests.json?v=${Date.now()}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const fileData = await resp.json();
      const filePlayer = (fileData.player || fileData.rsn || '').toLowerCase();
      // Accept only if: no RSN requested, OR file has a matching player tag.
      // A file with no player tag is ambiguous and must NOT be applied to a specific account.
      if (!_rsn || (filePlayer && filePlayer === _rsn.toLowerCase())) {
        data = fileData;
        source = 'file';
      }
      // else: file belongs to a different account — don't pollute this account's quests
    } catch (_) { /* file not found */ }
  }

  if (!data) {
    if (btn) {
      btn.textContent = 'No file';
      btn.style.color = '#884444';
      btn.title = _rsn
        ? `Server not running and no matching quest file.\nRun: python3 scripts/decode_completed_quests.py --player ${_rsn}`
        : 'Run: python3 scripts/decode_completed_quests.py';
      setTimeout(() => { btn.textContent = '↻ Sync'; btn.style.color = ''; btn.title = ''; btn.disabled = false; }, 3000);
    }
    return;
  }

  const before = _cqFile.size;
  _cqFile = new Set(data.completedQuests || []);
  completedQuests = new Set([..._cqFile, ..._cqManual]);
  _saveCq();
  const delta = _cqFile.size - before;
  renderQuestList();

  if (btn) {
    const label = source === 'server'
      ? (delta ? `+${delta} synced` : '✓ Up to date')
      : (delta ? `+${delta} (file)` : '✓ (file)');
    btn.textContent = label;
    btn.style.color = delta ? '#4a9a4a' : '#666';
    setTimeout(() => { btn.textContent = '↻ Sync'; btn.style.color = ''; btn.disabled = false; }, 2000);
  }
}

// ─── Tab navigation ────────────────────────────────────────────────────────
function switchTab(tab) {
  if (tab !== activeTab) pushHistoryEntry();
  _renderTab(tab);
}

function _renderTab(tab, resetSelection = true) {
  activeTab = tab;
  // Update tab button styles
  for (const t of ['cards','skilling','questing','packs','wishlist','equipment','bosses','diaries','rules'])
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);

  const sidebar     = document.getElementById('sidebar');
  const mainContent = document.getElementById('main-content');

  if (tab === 'cards') {
    sidebar.style.display = 'flex';
    mainContent.style.display = 'flex';
    // Rebuild detail pane only if it doesn't exist (was replaced by another tab)
    if (!document.getElementById('detail')) {
      mainContent.innerHTML = `<div id="detail" style="flex:1;overflow-y:auto;padding:20px 24px;"><div class="placeholder">← Select a card to see sourcing info</div></div>`;
    }
    if (resetSelection) { selected = null; selectedType = null; }
    filterCards();
  } else {
    sidebar.style.display = 'none';
    mainContent.style.display = 'flex';
    mainContent.style.flexDirection = 'column';
    if (tab === 'skilling') {
      if (resetSelection) selectedSkill = null;
      mainContent.innerHTML = `<div id="skill-panel">
        <div id="skill-list-pane">
          <div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Skills</div>
          <div class="skill-grid" id="skill-grid"></div>
        </div>
        <div id="skill-detail-pane">
          <div class="placeholder" style="margin-top:60px;color:#444">← Select a skill</div>
        </div>
      </div>`;
      renderSkillGrid();

// Case-insensitive gate lookup (card names in data may differ in case from the catalog).
const _SLAYER_GATES_LC = Object.fromEntries(Object.entries(SLAYER_CARD_GATES).map(([k,v]) => [k.toLowerCase(), v]));
function _slayerGate(card) { return _SLAYER_GATES_LC[card.toLowerCase()] || null; }

// Returns true if card is owned AND all access gates are met.
// For cards with no entry in SLAYER_CARD_GATES, equivalent to isOwned(card).
function _slayerCardFeasible(card) {
  if (!isOwned(card)) return false;
  const gate = _slayerGate(card);
  if (!gate) return true;
  if ((gate.quests || []).some(q => !completedQuests.has(q))) return false;
  if (Object.entries(gate.skills || {}).some(([s,l]) => getLevel(s) < l)) return false;
  return true;
}

// ── Boss loot ───────────────────────────────────────────────────────────────
// Chest/reward-based bosses (raids, Barrows, Moons, Gauntlet…) come from
// boss_loot.json. Everything else uses the main boss monster's drop table:
// boss.lootFrom if set, else the monster named like the boss, else monsters[0].
// 'Unique' = share of a raid's unique roll (not a per-raid chance); 'Conditional' = consolation /
// first-completion items (see boss_loot.json notes). Both come from generate_boss_loot.py.
const _RARITY_RANK = {'Unique':-1, 'Extremely Rare':0, 'Very Rare':1, 'Rare':2, 'Uncommon':3, 'Common':4, 'Always':5, 'Varies':6, 'Conditional':7};
// Tooltip text for a loot row: wiki rarity text, combined per-chest rate, wiki notes
function _lootTip(d) {
  const parts = [];
  if (d.rarity === 'Unique') parts.push(`${d.fraction} of uniques`);
  else if (d.fraction) parts.push(d.fraction + (d.rate ? ` (\u2248 ${d.rate} per chest)` : ''));
  for (const n of (d.notes || [])) parts.push(n);
  return parts.join('\n');
}
function _bossLoot(boss) {
  const chest = bossLoot[boss.name];
  if (chest && chest.drops) return { source: chest.source, page: chest.page, drops: chest.drops,
                                     uniqueRoll: chest.uniqueRoll, basis: chest.basis };
  // Otherwise: the boss monster's drop table, plus any wiki-stated extras
  // (chest.extra — e.g. Yama's dossier-only Rite of vile transference).
  const mons = boss.monsters || [];
  const from = boss.lootFrom ||
    [mons.find(m => m.toLowerCase() === boss.name.toLowerCase()) || mons[0]].filter(Boolean);
  const seen = new Map();
  for (const m of from) {
    const exact = _cardInfo(m)?.exact || m;
    for (const d of (monsterDrops[exact]?.drops || [])) {
      if (d.fromRdt) continue;  // shared rare drop table — not boss loot
      const prev = seen.get(d.card);
      if (!prev || (_RARITY_RANK[d.rarity] ?? 9) < (_RARITY_RANK[prev.rarity] ?? 9)) seen.set(d.card, d);
    }
  }
  for (const e of (chest?.extra || [])) if (!seen.has(e.card)) seen.set(e.card, e);
  return { source: from.join(', '), page: null, drops: [...seen.values()] };
}

// item card name (lowercase) → [{bossName, rarity, fraction, source}] — chest loot only
// (monster-table drops already appear as monster sources on item pages).
let _bossLootByItem = null;
function _bossRewardsFor(itemName) {
  if (!_bossLootByItem) {
    _bossLootByItem = {};
    for (const [bossName, e] of Object.entries(bossLoot))
      for (const d of [...(e.drops || []), ...(e.extra || [])])
        (_bossLootByItem[d.card.toLowerCase()] ||= []).push({ bossName, source: e.source, drop: d });
  }
  return _bossLootByItem[itemName.toLowerCase()] || [];
}

// ── Boss ↔ card reverse lookup ─────────────────────────────────────────────
// Maps card name → [{bossName, role}] for "Boss Encounters" cross-links.
var BOSS_BY_CARD = {};
(function _buildBossByCard() {
  function _add(card, bossName, role) {
    if (!card) return;
    card = card.toLowerCase();  // keyed lowercase — look up with name.toLowerCase()
    if (!BOSS_BY_CARD[card]) BOSS_BY_CARD[card] = [];
    BOSS_BY_CARD[card].push({ bossName, role });
  }
  for (const boss of BOSS_DATA) {
    for (const m of (boss.monsters || []))      _add(m, boss.name, 'monster');
    for (const m of (boss.kcMonsters || []))    _add(m, boss.name, 'kc');
    for (const i of (boss.items || []))         _add(i, boss.name, 'item');
    for (const t of (boss.tools || [])) {
      for (const tier of (TOOL_TIERS[t] || [])) _add(tier.name, boss.name, 'tool');
    }
    for (const i of (boss.optionalItems || [])) _add(i, boss.name, 'optional');
    for (const c of (boss.relatedCards || []))  _add(c, boss.name, 'related');
    for (const c of (boss.warmClothing || []))  _add(c, boss.name, 'warm');
    if (boss.lightSource) {
      for (const c of LIGHT_SOURCE_ITEMS)       _add(c, boss.name, 'light');
    }
    if (boss.dragonfire) {
      for (const c of DRAGONFIRE_ITEMS)        _add(c, boss.name, 'dragonfire');
    }
  }
})();

// Lazy reverse index: card name → [quest names that require it via bm_quest_cards.json]
let _questCardIndex = null;
function getQuestCardIndex() {
  if (_questCardIndex) return _questCardIndex;
  _questCardIndex = {};
  for (const [questName, q] of Object.entries(bmQuestCards)) {
    for (const section of (q.sections || [])) {
      for (const req of (section.requirements || [])) {
        for (const card of (req.cards || [])) {
          (_questCardIndex[card] = _questCardIndex[card] || []).push(questName);
        }
        for (const child of (req.children || [])) {
          for (const card of (child.cards || [])) {
            (_questCardIndex[card] = _questCardIndex[card] || []).push(questName);
          }
        }
      }
    }
  }
  return _questCardIndex;
}

// Shared HTML for "Required For" quest list section
function requiredForQuestsHtml(cardName) {
  const quests = getQuestCardIndex()[cardName] || [];
  if (quests.length === 0) return '';
  const completable = computeCompletableQuests();
  let html = `<div class="section"><div class="section-header">Required For</div><div style="margin-top:8px">`;
  const sorted = [...new Set(quests)].sort();
  for (const qName of sorted) {
    const done = completedQuests.has(qName);
    const ok   = completable.has(qName);
    const col  = done ? '#7ab07a' : ok ? '#c8a830' : '#9a5a5a';
    const sym  = done ? '☑' : ok ? '✓' : '✗';
    const status = done ? 'done' : ok ? 'available' : 'locked';
    html += `<div class="req-row" style="cursor:pointer"
      data-quest="${escHtml(qName)}" onclick="_navToQuest(this)">
      <span class="req-icon" style="color:${col}">${sym}</span>
      <span class="req-label" style="color:${col}">${qName}</span>
      <span class="req-note">${status}</span>
    </div>`;
  }
  html += `</div></div>`;
  return html;
}

function getTrainingMethods(skillName) {
  /**
   * Return an array of training method objects for a given skill.
   * Each object: {name, level, status, cardOwned, note, type}
   * status: 'available' | 'no-card' | 'locked-level' | 'locked-tool'
   */
  const myLevel = getLevel(skillName);
  const results = [];

  const GATHERING_SKILLS = new Set(['Mining','Woodcutting','Fishing','Farming']);
  const PRODUCTION_SKILLS = new Set(['Fletching','Smithing','Crafting','Cooking','Herblore','Construction','Runecrafting']);
  const MELEE_SKILLS = new Set(['Attack','Strength','Defence','Hitpoints']);

  if (skillName === 'Hunter') {
    // Hardcoded creature list — level + tool only (gathering rule, no card needed)
    for (const c of HUNTER_CREATURES) {
      const parts = resolveToolParts(c.tool);
      const missingCardParts = parts.filter(p => itemSources[p.label] && (!p.owned || !canGetItem(p.label)));
      let status, note;
      if (myLevel < c.level) {
        status = 'locked-level';
        note = missingCardParts.length ? 'need: ' + missingCardParts.map(p => p.label).join(', ') : '';
      } else if (missingCardParts.length > 0) {
        status = 'locked-tool';
        note = 'need: ' + missingCardParts.map(p => p.label).join(', ');
      } else {
        status = 'available';
        note = c.tool !== 'None' ? c.tool : '';
      }
      results.push({name:c.name, level:c.level, status, cardOwned:true, note, xp:c.xp, type:'hunter'});
    }

  } else if (GATHERING_SKILLS.has(skillName)) {
    for (const [cardName, data] of Object.entries(itemSources)) {
      if (!data) continue;
      const g = data.gathering;
      if (!g || g.skill !== skillName) continue;
      const level = g.level;
      const cardOwned = isOwned(cardName);

      // Tool check — tool IS required to gather (Bronzeman: gated by level + tool)
      let toolNote = '';
      let toolLocked = false;
      if (g.tool && TOOL_TIERS[g.tool]) {
        const tiers = TOOL_TIERS[g.tool];
        // Tool is usable only if: card owned + level met + physically obtainable
        const hasTool = tiers.some(t => isOwned(t.name) && canGetItem(t.name) && myLevel >= t.skillReq);
        if (!hasTool) {
          toolLocked = true;
          const ownedAndLevelMet = tiers.some(t => isOwned(t.name) && myLevel >= t.skillReq);
          const ownedAny         = tiers.some(t => isOwned(t.name));
          toolNote = ownedAndLevelMet ? 'no tool source'
                   : ownedAny        ? 'level too low for tool'
                   : 'no tool';
        } else {
          const bestTool = [...tiers].reverse().find(t => isOwned(t.name) && canGetItem(t.name) && myLevel >= t.skillReq);
          if (bestTool) toolNote = bestTool.name;
        }
      } else if (g.tool && g.tool !== 'None') {
        const parts = resolveToolParts(g.tool);
        const cardParts = parts.filter(p => itemSources[p.label]);
        if (cardParts.length > 0) {
          // Part missing = not owned OR owned but no physical source
          const missingCardParts = cardParts.filter(p => !p.owned || !canGetItem(p.label));
          if (missingCardParts.length > 0) {
            toolLocked = true;
            toolNote = missingCardParts.map(p => p.label).join(', ') + ' needed';
          } else {
            toolNote = cardParts.map(p => p.label).slice(0, 2).join(' + ');
          }
        } else {
          // No parts match any TCG card — tool is freely available (not a Bronzeman restriction).
          // Show the tool name as context but don't lock the activity.
          toolNote = g.tool;
        }
      }

      // Quest/area gate — some gathering spots require quest completion to access
      let questLocked = false, questNote = '';
      if (g.questRequired) {
        const completable = computeCompletableQuests();
        if (!completedQuests.has(g.questRequired) && !completable.has(g.questRequired)) {
          questLocked = true;
          questNote = `needs: ${g.questRequired}`;
        }
      }

      // If there's a tool requirement, gathering is level+tool gated (card not needed to gather).
      // If there's NO tool (e.g. Flax), the card itself is the gate.
      const hasTool = !!(g.tool && g.tool !== 'None');
      let status;
      if (myLevel < level)             status = 'locked-level';
      else if (toolLocked)             status = 'locked-tool';
      else if (questLocked)            status = 'locked';
      else if (!hasTool && !cardOwned) status = 'no-card';
      else                             status = 'available';

      // If gatherable via tool but card not owned, note it — resource can be banked but not used
      const gatherNote = questLocked
        ? questNote
        : (hasTool && !cardOwned)
          ? (toolNote ? toolNote + ' · no card' : 'no card')
          : toolNote;

      results.push({name:cardName, level, status, cardOwned, note:gatherNote, xp:g.xp, method:g.method, type:'gathering'});
    }

  } else if (skillName === 'Firemaking') {
    // Burning logs requires: log card + tinderbox card (physical) + Firemaking level
    const hasTinderboxCard  = isOwned('Tinderbox');
    const canGetTinderbox   = canGetItem('Tinderbox');
    for (const [logName, fireLevel] of Object.entries(FIREMAKING_LEVELS)) {
      if (!itemSources[logName]) continue;
      const cardOwned = isOwned(logName);
      const canGetLog = canGetItem(logName);
      let status, note;
      if (!hasTinderboxCard) {
        status = 'locked-tool';
        note = 'no Tinderbox';
      } else if (!canGetTinderbox) {
        status = 'no-source';
        note = 'no Tinderbox source';
      } else if (myLevel < fireLevel) {
        status = 'locked-level';
        note = '';
      } else if (!cardOwned) {
        status = 'no-card';
        note = '';
      } else if (!canGetLog) {
        status = 'no-source';
        note = '';
      } else {
        status = 'available';
        note = '';
      }
      results.push({name:logName, level:fireLevel, status, cardOwned, note, type:'firemaking'});
    }
    // Wintertodt — minigame requiring only Tinderbox, no log cards
    {
      const hasTinderbox  = isOwned('Tinderbox');
      const canGetTinderbox = canGetItem('Tinderbox');
      let wStatus, wNote;
      if (myLevel < 50)          { wStatus = 'locked-level'; wNote = ''; }
      else if (!hasTinderbox)    { wStatus = 'locked-tool';  wNote = 'no Tinderbox'; }
      else if (!canGetTinderbox) { wStatus = 'no-source';    wNote = 'no Tinderbox source'; }
      else                       { wStatus = 'available';    wNote = 'Tinderbox'; }
      results.push({name:'Wintertodt', level:50, status:wStatus, cardOwned:hasTinderbox, note:wNote, type:'firemaking'});
    }

  } else if (skillName === 'Thieving') {
    // ── Stalls: hardcoded list (stolen items go to inventory, no card gate) ──
    for (const stall of THIEVING_STALLS) {
      const status = myLevel < stall.level ? 'locked-level' : 'available';
      results.push({name:stall.name, level:stall.level, status, cardOwned:true,
        note: `${stall.xp} xp`, xp:stall.xp, isPickpocket:false, npcCardRequired:false, type:'thieving'});
    }
    // ── Pickpockets: hardcoded NPC list (wiki scraper doesn't capture all NPCs) ─
    for (const npc of PICKPOCKET_NPCS) {
      const cardOwned = npc.card ? isOwned(npc.card) : true; // no card → no restriction
      const npcCardRequired = !!npc.card;
      let status;
      if (myLevel < npc.level) {
        status = 'locked-level';
      } else if (npcCardRequired && !cardOwned) {
        status = 'no-card';
      } else {
        status = 'available';
      }
      results.push({name:`Pickpocket ${npc.name}`, level:npc.level, status, cardOwned,
        note:`${npc.xp} xp`, xp:npc.xp, isPickpocket:true, npcCardRequired, type:'thieving'});
    }

  } else if (skillName === 'Prayer') {
    // Burying bones/ashes: need the card to use the item (Bronzeman rule)
    // Also check if the item is actually gettable (e.g. own Ourg bones card but no Ourg monster card)
    for (const bone of PRAYER_BONES) {
      if (!itemSources[bone.name]) continue;
      const cardOwned = isOwned(bone.name);
      const gettable = canGetItem(bone.name);
      let status;
      if (!cardOwned)      status = 'no-card';
      else if (!gettable)  status = 'no-source';
      else                 status = 'available';
      results.push({name:bone.name, level:1, status,
        cardOwned, note:`${bone.xp} xp`, xp:bone.xp, type:'prayer'});
    }

  } else if (skillName === 'Magic') {
    // Show actual castable spells based on rune card ownership + level
    for (const spell of MAGIC_SPELLS) {
      const missingCards      = Object.keys(spell.runes).filter(r => !isOwned(r));
      const unobtainableRunes = Object.keys(spell.runes).filter(r => isOwned(r) && !canGetItem(r));
      const levelOk = myLevel >= spell.level;
      let status, note;
      if (!levelOk) {
        status = 'locked-level';
        note = missingCards.length ? 'need: ' + missingCards.slice(0,2).join(', ') : '';
      } else if (missingCards.length > 0) {
        status = 'no-card'; note = 'need: ' + missingCards.slice(0,3).join(', ');
      } else if (unobtainableRunes.length > 0) {
        status = 'no-source'; note = 'no source: ' + unobtainableRunes.slice(0,2).join(', ');
      } else {
        status = 'available'; note = Object.keys(spell.runes).join(', ');
      }
      results.push({name:spell.name, level:spell.level, status,
        cardOwned:missingCards.length===0, note, type:'magic-spell'});
    }

  } else if (skillName === 'Ranged') {
    // Bow + arrow / crossbow + bolt combos, and standalone thrown
    for (const [bow, cfg] of Object.entries(BOW_COMPAT)) {
      if (!itemSources[bow]) continue;
      const bowOwned = isOwned(bow);
      const levelOk = myLevel >= cfg.level;
      const ownedAmmo = cfg.ammo.filter(a => isOwned(a));
      const canGetBow = canGetItem(bow);
      if (bowOwned && ownedAmmo.length) {
        for (const ammo of ownedAmmo) {
          const canGetAmmo = canGetItem(ammo);
          const status = !canGetBow ? 'no-source' : !canGetAmmo ? 'no-source'
                       : !levelOk   ? 'locked-level' : 'available';
          const note   = !canGetBow ? 'no bow source' : !canGetAmmo ? 'no ammo source' : '';
          results.push({name:`${bow} + ${ammo}`, level:cfg.level,
            status, cardOwned:true, note, weapon:bow, ammo, type:'ranged-setup'});
        }
      } else if (bowOwned && canGetBow) {
        results.push({name:bow, level:cfg.level, status:'no-card', cardOwned:false,
          note:`no ammo`, weapon:bow, ammo:null, type:'ranged-setup'});
      } else if (ownedAmmo.length && canGetBow) {
        results.push({name:bow, level:cfg.level, status:'no-card', cardOwned:false,
          note:`no bow`, weapon:bow, ammo:null, type:'ranged-setup'});
      }
      // If neither bow nor any ammo owned, or bow not obtainable — skip
    }
    for (const t of STANDALONE_THROWN) {
      if (!itemSources[t.name]) continue;
      const owned = isOwned(t.name);
      const levelOk = myLevel >= t.level;
      const canGet = canGetItem(t.name);
      if (!owned && !canGet) continue; // not obtainable — skip
      const tStatus = !canGet ? 'no-source' : !owned ? 'no-card' : !levelOk ? 'locked-level' : 'available';
      results.push({name:t.name, level:t.level,
        status: tStatus, cardOwned:owned, note: !canGet ? 'no source' : '',
        weapon:t.name, ammo:null, type:'ranged-setup'});
    }

  } else if (MELEE_SKILLS.has(skillName)) {
    // Melee combat: need monster card to fight — NPCs with no combat level cannot be trained on
    const mySlayer = getLevel('Slayer');
    for (const mName of Object.keys(monsterDrops)) {
      if (!isOwned(mName)) continue;
      const cbLv = monsterDrops[mName].combatLevel;
      if (!cbLv) continue;   // NPC card — no combat level, can't train on
      const slayerReq = monsterDrops[mName].slayerLevel || 0;
      const slayerLocked = slayerReq > mySlayer;
      const status = slayerLocked ? 'locked-level' : 'available';
      results.push({name:mName, level:cbLv, status,
        cardOwned:true, note: slayerLocked ? `Slayer ${slayerReq}` : '',
        combatLevel:cbLv, slayerReq, type:'combat'});
    }
    results.sort((a,b) => {
      // Available monsters first (by combat level), locked monsters second (by combat level)
      const aAvail = a.status === 'available' ? 0 : 1;
      const bAvail = b.status === 'available' ? 0 : 1;
      if (aAvail !== bAvail) return aAvail - bAvail;
      return (a.level||0) - (b.level||0);
    });
    return results;

  } else if (PRODUCTION_SKILLS.has(skillName)) {
    for (const [cardName, data] of Object.entries(itemSources)) {
      if (!data) continue;
      const p = data.production;
      if (!p || p.skill !== skillName) continue;
      // Skip methods that grant 0 XP — not training methods
      if (!p.xp || p.xp <= 0) continue;
      // For Cooking: skip burnt items (failed cooks, not intentional training)
      if (skillName === 'Cooking' && cardName.toLowerCase().startsWith('burnt')) continue;
      // Skip Chambers of Xeric fish — raw form only obtainable inside the raid, not a normal training method
      if (skillName === 'Cooking' && /^Raw .+ fish \(\d+\)$/.test(p.ingredients?.[0]?.item || '')) continue;
      const level = p.level || 0;
      const ings = p.ingredients || [];
      // Tool card check — production tools that are TCG cards must be owned.
      // Runecrafting: tiaras are altar-access items that can be bypassed via the Abyss.
      // Detect them by name pattern (all end in "tiara") and treat as optional.
      const isTiara = t => t.toLowerCase().endsWith('tiara');
      const allTools = p.tools || [];
      const hardTools = skillName === 'Runecrafting' ? allTools.filter(t => !isTiara(t)) : allTools;
      const missingTools = hardTools.filter(t => itemSources[t] && !isOwned(t));
      const missingTiara = skillName === 'Runecrafting' ? allTools.find(t => isTiara(t) && !isOwned(t)) : null;
      // Ingredient assessment: unowned cards → no-card; owned but unobtainable → no-source
      const blockedBy = [];    // owned-card or non-card ingredients that can't be obtained
      const missingCards = []; // card ingredients not yet owned
      for (const ing of ings) {
        const isCard = !!itemSources[ing.item];
        if (isCard && !isOwned(ing.item)) {
          missingCards.push(ing.item);       // don't own the card → no-card
        } else if (isCard && !canGetItem(ing.item)) {
          blockedBy.push(ing.item);          // own card but can't obtain → no-source
        } else if (!isCard && !canGetItem(ing.item)) {
          blockedBy.push(ing.item);          // non-card ingredient unreachable → no-source
        }
      }
      // Quest requirement check
      const prodQuestLocked = (p.quests && p.quests.length > 0) && (() => {
        const completable = computeCompletableQuests();
        const locked = p.quests.filter(q => !completedQuests.has(q) && !completable.has(q));
        return locked.length > 0 ? locked : null;
      })();

      let status, note;
      if (myLevel < level) {
        status = 'locked-level'; note = '';
      } else if (prodQuestLocked) {
        status = 'locked'; note = 'needs: ' + prodQuestLocked.join(', ');
      } else if (missingTools.length > 0) {
        status = 'locked-tool'; note = 'need: ' + missingTools.slice(0,2).join(', ');
      } else if (blockedBy.length > 0) {
        status = 'no-source';
        // Show all blocking items (both unobtainable and missing cards) up to 3 total
        const allBlocked = [...blockedBy, ...missingCards].slice(0, 3);
        note = 'no source: ' + allBlocked.join(', ');
      } else if (missingCards.length > 0) {
        status = 'no-card'; note = 'need: ' + missingCards.slice(0,3).join(', ');
      } else {
        status = 'available';
        if (skillName === 'Runecrafting') {
          // Prefer talisman > tiara > Abyss (requires Enter the Abyss miniquest)
          const altarOpts = FACILITY_NOTES[p.facilities] || [];
          const talisman = altarOpts.find(o => o.toLowerCase().endsWith('talisman'));
          const tiara    = altarOpts.find(o => o.toLowerCase().endsWith('tiara'));
          const hasTalisman = talisman && isOwned(talisman);
          const hasTiara    = tiara    && isOwned(tiara);
          const abyssOk     = completedQuests.has('Enter the Abyss');
          const ess = ings[0]?.item || '';
          if (hasTalisman)        note = ess ? `${ess} + ${talisman}` : talisman;
          else if (hasTiara)      note = ess ? `${ess} + ${tiara}` : tiara;
          else if (abyssOk)       note = `via Abyss`;
          else if (talisman) {
            const abyssLink = `<span style="color:#3a3a3a;cursor:pointer;text-decoration:underline dotted" data-quest="Enter the Abyss" onclick="_navToQuest(this)" title="Enter the Abyss miniquest">Abyss (locked)</span>`;
            note = `need ${talisman} · ${abyssLink}`;
          } else                  note = ess;
        } else {
          const parts = [...ings.slice(0, 2).map(i => i.item), ...hardTools.slice(0, 1)];
          note = parts.join(' + ');
        }
      }
      // For Cooking with a single card ingredient, show that as the method name
      // For simple 1-ingredient cooking (e.g. Raw pike → Pike), show the raw ingredient as the name.
      // Don't apply to multi-ingredient recipes — they'd collapse to a shared ingredient (e.g. Equa leaves).
      const cardIngs = ings.filter(i => !!itemSources[i.item]).map(i => i.item);
      const singleIng = skillName === 'Cooking' && ings.length === 1 && cardIngs.length === 1 ? cardIngs[0] : null;
      results.push({name:cardName, displayName:singleIng||cardName, displayNav:singleIng||cardName, level, status, cardOwned:isOwned(cardName), note, xp:p.xp, type:'production', quests:p.quests||null});
    }
    // ── Smithing: activity methods requiring only a tool, no ingredient cards ─
    if (skillName === 'Smithing') {
      const hasHammer = isOwned('Hammer');
      const canGetHammer = canGetItem('Hammer');
      let mStatus, mNote;
      if (myLevel < 30)       { mStatus = 'locked-level'; mNote = ''; }
      else if (!hasHammer)    { mStatus = 'locked-tool';  mNote = 'no Hammer'; }
      else if (!canGetHammer) { mStatus = 'no-source';    mNote = 'no Hammer source'; }
      else                    { mStatus = 'available';    mNote = 'Hammer'; }
      results.push({name:'Motherlode Mine (wheel repair)', level:30, status:mStatus, cardOwned:hasHammer, note:mNote, type:'production'});
    }

  } else if (skillName === 'Agility') {
    for (const c of AGILITY_COURSES) {
      results.push({name:c.name, level:c.level,
        status: myLevel >= c.level ? 'available' : 'locked-level',
        cardOwned:true, note:`${c.xp} xp/lap`, type:'agility'});
    }
  } else if (skillName === 'Slayer') {
    for (const [masterName, master] of Object.entries(SLAYER_TASKS)) {
      const levelOk = myLevel >= (master.slayerReq || 1);
      const mCards = Object.entries(SLAYER_MASTER_MAP).filter(([,k]) => k === masterName).map(([c]) => c);
      const masterCardOk = mCards.length === 0 || mCards.some(c => isOwned(c));
      const masterCardName = mCards.find(c => isOwned(c)) || mCards[0] || masterName;
      const availTasks = master.tasks.filter(t => t.cards.some(_slayerCardFeasible)).length;
      const totalTasks = master.tasks.length;
      const reqStr = master.slayerReq > 1 ? `Sl ${master.slayerReq}` : master.combatReq > 3 ? `Cb ${master.combatReq}` : '';
      const status = !levelOk || !masterCardOk ? 'locked' : availTasks > 0 ? 'available' : 'no-card';
      results.push({name:masterName, level:master.slayerReq||0,
        status, cardOwned:availTasks > 0, note:`${availTasks}/${totalTasks} tasks`,
        type:'slayer', masterCardName, availTasks, totalTasks, reqStr});
    }
  }

  // Sort: available first, then by level asc
  results.sort((a,b) => {
    const order = {available:0,'no-source':1,'no-card':2,'locked-tool':3,'locked-level':4};
    if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
    return (a.level||0) - (b.level||0);
  });
  return results;
}

function countAvailableMethods(skillName) {
  if (['Attack','Strength','Defence','Hitpoints'].includes(skillName))
    return getTrainingMethods(skillName).filter(m => m.status === 'available').length;
  if (skillName === 'Magic')
    return getTrainingMethods('Magic').filter(m => m.status === 'available').length;
  if (skillName === 'Ranged')
    return getTrainingMethods('Ranged').filter(m => m.status === 'available').length;
  if (skillName === 'Prayer')
    return PRAYER_BONES.filter(b => itemSources[b.name] && isOwned(b.name) && canGetItem(b.name)).length;
  if (skillName === 'Agility') return AGILITY_COURSES.filter(c => getLevel('Agility') >= c.level).length;
  if (skillName === 'Slayer')  return getTrainingMethods('Slayer').filter(m => m.status === 'available').length;
  return getTrainingMethods(skillName).filter(m => m.status === 'available').length;
}

function renderSkillGrid() {
  const grid = document.getElementById('skill-grid');
  if (!grid) return;
  let html = '';
  for (const skill of SKILL_ORDER) {
    const lvl   = getLevel(skill);
    const count = countAvailableMethods(skill);
    const sel   = skill === selectedSkill ? ' selected' : '';
    const hasMeth = count > 0 ? ' has-methods' : '';
    html += `<div class="skill-cell${sel}${hasMeth}" onclick="showSkillDetail('${skill}')">
      <div class="skill-cell-name">${skillIcon(skill, 14)} ${skill}</div>
      <div class="skill-cell-level">${lvl}</div>
      <div class="skill-cell-count ${count===0?'zero':''}">${count} ${skill==='Slayer'?`master${count!==1?'s':''}`:`method${count!==1?'s':''}`}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

function showSkillDetail(skillName, push = true) {
  if (push) pushHistoryEntry();
  selectedSkill = skillName;
  // Update grid selection
  renderSkillGrid();
  const pane = document.getElementById('skill-detail-pane');
  if (!pane) return;
  delete pane.dataset.masterName; // clear master context when showing skill overview

  const myLevel = getLevel(skillName);
  const methods = getTrainingMethods(skillName);
  const avail = methods.filter(m => m.status === 'available').length;

  const GATHERING_SKILLS = new Set(['Mining','Woodcutting','Fishing','Farming']);
  const PRODUCTION_SKILLS = new Set(['Fletching','Smithing','Crafting','Cooking','Herblore','Construction','Runecrafting']);
  const MELEE_SKILLS = new Set(['Attack','Strength','Defence','Hitpoints']);
  const COMBAT_LIKE = new Set(['Attack','Strength','Defence','Hitpoints']);

  let intro = '';
  if (GATHERING_SKILLS.has(skillName)) {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Available = level met + tool card owned. Card ownership is not required to gather — you can always chop/mine/fish if you have the tool. "no card" note means the resource can be banked but not used.</p>`;
  } else if (skillName === 'Hunter') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Hunting is gated by level and the catching tool only — no card needed for the creature. Caught items can only be used once you own the item card.</p>`;
  } else if (skillName === 'Firemaking') {
    const hasTinderboxCard = isOwned('Tinderbox');
    const canGetTinderbox  = canGetItem('Tinderbox');
    const tbStatus = !hasTinderboxCard ? '<b style="color:#aa4040">not owned</b>'
                   : !canGetTinderbox  ? '<b style="color:#cc7700">owned (no source)</b>'
                   : '<b style="color:#3a8a3a">owned</b>';
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Burning logs requires the log card and a physical Tinderbox. Tinderbox: ${tbStatus}.</p>`;
  } else if (skillName === 'Thieving') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Stalls are free — level only. Pickpocketing NPCs requires their monster card.</p>`;
  } else if (skillName === 'Prayer') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Burying bones/ashes requires the card (using an item = card required).</p>`;
  } else if (skillName === 'Magic') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Shows spells you can cast based on rune cards owned. Use castable combat spells on any monster you own the card for.</p>`;
  } else if (skillName === 'Ranged') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Shows weapon + ammo combos you can use. Use any available setup on monsters you own the card for.</p>`;
  } else if (MELEE_SKILLS.has(skillName)) {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">You need the monster card to fight. Grey = Slayer level required. Sorted by combat level.</p>`;
  } else if (PRODUCTION_SKILLS.has(skillName)) {
    let prodNote = 'Ingredient cards required. Orange = have the card but no way to obtain the item right now. Output card not required to produce.';
    if (skillName === 'Construction') prodNote += ' <b>Note: POH furniture data not yet scraped — only ship construction items shown. Your house costs 1,000 coins from an Estate Agent (no card needed for the NPC, but coins required).</b>';
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">${prodNote}</p>`;
  } else if (skillName === 'Agility') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Agility courses need no card — level only.</p>`;
  } else if (skillName === 'Slayer') {
    intro = `<p style="color:#666;font-size:11px;margin-bottom:12px">Click a master to see their task list and available monsters. Star (☆) a task to add it to your Wishlist as a group.</p>`;
  }

  let rows = '';
  if (skillName === 'Slayer') {
    // ── Master list ────────────────────────────────────────────────────────
    rows += `<div class="section"><div class="section-header">Slayer masters</div><div style="margin-top:8px">`;
    for (const m of methods) {
      const indCls = m.status === 'available' ? 'available' : m.status === 'no-card' ? 'no-card' : 'locked';
      const imgUrl = (cardDetails[m.masterCardName] || {}).imageUrl || '';
      const img = imgUrl
        ? `<img src="${imgUrl}" style="width:18px;height:18px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`
        : '<span style="width:18px;flex-shrink:0"></span>';
      rows += `<div class="method-row" style="cursor:pointer" data-nav="${escHtml(m.masterCardName)}" data-nav-type="monster" onclick="_navToCard(this)">
        <div class="method-indicator ${indCls}"></div>
        ${img}
        <span class="method-name ${indCls}">${m.name}</span>
        <span class="method-level">${m.reqStr}</span>
        <span class="method-note">${m.availTasks}/${m.totalTasks} tasks →</span>
      </div>`;
    }
    rows += `</div></div>`;
  } else if (methods.length === 0) {
    rows = `<div style="color:#444;font-size:12px;margin-top:12px">No training data available for ${skillName}.</div>`;
  } else {
    const isCombatLike = COMBAT_LIKE.has(skillName);
    rows = `<div class="section">`;
    if (isCombatLike) {
      rows += `<div class="section-header">${avail} monster${avail!==1?'s':''} available</div>`;
    } else {
      rows += `<div class="section-header">${avail} available · ${methods.length - avail} locked</div>`;
    }
    rows += `<div style="margin-top:8px">`;
    for (const m of methods) {
      const indCls  = m.status === 'available' ? 'available' : m.status === 'no-card' ? 'no-card' : m.status === 'no-source' ? 'no-source' : 'locked';
      const nameCls = m.status === 'available' ? 'available' : m.status === 'no-card' ? 'no-card' : m.status === 'no-source' ? 'no-source' : 'locked';

      // Name HTML — clickable for items, monsters
      let nameHtml;
      if (m.type === 'gathering' || m.type === 'production' || m.type === 'prayer' || m.type === 'firemaking') {
        const navName = m.displayNav || m.name;
        const dispName = m.displayName || m.name;
        const navType = itemSources[navName] ? 'item' : 'ingredient';
        nameHtml = `<span class="method-name ${nameCls}" style="cursor:pointer" data-nav="${escHtml(navName)}" data-nav-type="${navType}" onclick="_navToCard(this)">${dispName}</span>`;
      } else if (m.type === 'hunter' && itemSources[m.name]) {
        nameHtml = `<span class="method-name ${nameCls}" style="cursor:pointer" data-nav="${escHtml(m.name)}" data-nav-type="item" onclick="_navToCard(this)">${m.name}</span>`;
      } else if (m.type === 'combat') {
        nameHtml = `<span class="method-name ${nameCls}" style="cursor:pointer" data-nav="${escHtml(m.name)}" data-nav-type="monster" onclick="_navToCard(this)">${m.name}</span>`;
      } else if (m.type === 'ranged-setup') {
        // Weapon is clickable; show combo name
        const weaponLink = m.weapon && itemSources[m.weapon]
          ? `<span style="cursor:pointer" data-nav="${escHtml(m.weapon)}" data-nav-type="item" onclick="_navToCard(this)">${m.weapon}</span>`
          : m.weapon || '';
        const ammoLink = m.ammo && itemSources[m.ammo]
          ? ` + <span style="cursor:pointer" data-nav="${escHtml(m.ammo)}" data-nav-type="item" onclick="_navToCard(this)">${m.ammo}</span>`
          : '';
        nameHtml = `<span class="method-name ${nameCls}">${weaponLink}${ammoLink}</span>`;
      } else if (m.type === 'magic-spell') {
        nameHtml = `<span class="method-name ${nameCls}">${m.name}</span>`;
      } else if (m.type === 'thieving' && m.npcName && m.npcCardRequired) {
        nameHtml = `<span class="method-name ${nameCls}">${m.name}</span>`;
      } else {
        nameHtml = `<span class="method-name ${nameCls}">${m.name}</span>`;
      }

      // Level string — combat level for monsters, skill level for others
      const isCombatType = ['combat','magic','ranged'].includes(m.type);
      const levelStr = (m.combatLevel != null && isCombatType) ? `Cb ${m.combatLevel}` :
                       (m.level > 0 ? `Lv ${m.level}` : '');
      const noteStr  = m.note ? `<span class="method-note">${m.note}</span>` : '';
      const questStr = m.quests && m.quests.length
        ? `<span class="method-note" style="color:#a06800" title="Quest required">🗺 ${m.quests[0]}</span>`
        : '';

      const _mImgName = m.type === 'ranged-setup' ? m.weapon : (m.displayNav || m.name);
      const _mImgUrl  = (cardDetails[_mImgName] || {}).imageUrl || '';
      const _mImg = _mImgUrl
        ? `<img src="${_mImgUrl}" style="width:18px;height:18px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`
        : '<span style="width:18px;flex-shrink:0"></span>';
      rows += `<div class="method-row">
        <div class="method-indicator ${indCls}"></div>
        ${_mImg}
        ${nameHtml}
        <span class="method-level">${levelStr}</span>
        ${noteStr}${questStr}
      </div>`;
    }
    rows += `</div></div>`;
  }

  pane.innerHTML = `
    <h1>${skillIcon(skillName, 18)} ${skillName}
      <span style="font-size:13px;color:#888;font-weight:normal;margin-left:8px">Level ${myLevel}</span>
    </h1>
    <div class="subtitle">${skillName === 'Slayer' ? `${avail} slayer master${avail!==1?'s':''} available` : `${avail} training method${avail!==1?'s':''} available`}</div>
    ${intro}
    ${rows}
  `;
}

function evaluateBoss(boss) {
  const blockers = [];    // hard gates: quest / area / card — make boss 'locked'
  const levelGates = [];  // skill level gates — unmet ones lock the boss, same as quests

  // Area gate
  if (boss.area && AREA_GATES[boss.area]) {
    const gate = AREA_GATES[boss.area];
    if (gate.questRequired && !completedQuests.has(gate.questRequired)) {
      blockers.push('Quest: ' + gate.questRequired);
    }
    if (gate.npcRequired && !isOwned(gate.npcRequired)) {
      blockers.push('Card: ' + gate.npcRequired);
    }
    if (gate.itemsRequired) {
      for (const it of gate.itemsRequired) {
        if (itemSources[it] && !isOwned(it)) blockers.push('Card: ' + it);
      }
    }
  }

  // Quest requirements (skip if already added via area gate to avoid duplicates)
  for (const q of (boss.quests || [])) {
    if (!completedQuests.has(q) && !blockers.includes('Quest: ' + q)) blockers.push('Quest: ' + q);
  }

  // Skill level requirements — hard access gates (Slayer bosses, GWD doors, Wintertodt…)
  for (const [skill, req] of Object.entries(boss.levels || {})) {
    const have = getLevel(skill);
    levelGates.push({ skill, have, req, ok: have >= req });
  }

  // Tool requirements — check TOOL_TIERS (any tier owned is sufficient)
  const missingTools = [];
  const ownedToolName = {};
  for (const toolKey of (boss.tools || [])) {
    const tiers = TOOL_TIERS[toolKey];
    if (!tiers) continue;
    const best = [...tiers].reverse().find(t => isOwned(t.name));
    if (best) ownedToolName[toolKey] = best.name;
    else missingTools.push(toolKey);
  }

  // Item card requirements
  const missingItems = [];
  for (const item of (boss.items || [])) {
    if (itemSources[item] && !isOwned(item)) missingItems.push(item);
  }

  // Monster card requirements
  const ownedMonsters   = (boss.monsters || []).filter(m => isOwned(m));
  const missingMonsters = (boss.monsters || []).filter(m => !isOwned(m));

  // KC monsters — needed to unlock boss room; tracked separately for rendering
  const ownedKcMonsters   = (boss.kcMonsters || []).filter(m => isOwned(m));
  const missingKcMonsters = (boss.kcMonsters || []).filter(m => !isOwned(m));

  // Optional items — informational only, don't affect status
  const optionalOwned   = (boss.optionalItems || []).filter(i => isOwned(i));
  const optionalMissing = (boss.optionalItems || []).filter(i => !isOwned(i));

  // Warm clothing — informational count, don't affect status
  const warmOwned   = (boss.warmClothing || []).filter(i => isOwned(i));
  const warmMissing = (boss.warmClothing || []).filter(i => !isOwned(i));

  // Light source — need at least 1; affects status
  const lightOwned   = boss.lightSource    ? LIGHT_SOURCE_ITEMS.filter(i => isOwned(i)) : [];
  const lightMissing = boss.lightSource    ? LIGHT_SOURCE_ITEMS.filter(i => !isOwned(i)) : [];
  const dfOwned      = boss.dragonfire ? DRAGONFIRE_ITEMS.filter(i => isOwned(i)) : [];
  const dfMissing    = boss.dragonfire ? DRAGONFIRE_ITEMS.filter(i => !isOwned(i)) : [];

  let status;
  if (blockers.length > 0 || levelGates.some(g => !g.ok)) status = 'locked';
  else if (missingMonsters.length > 0 || missingKcMonsters.length > 0 || missingItems.length > 0 || missingTools.length > 0
        || (boss.lightSource    && lightOwned.length === 0)
        || (boss.dragonfire && dfOwned.length === 0)) status = 'partial';
  else status = 'available';

  return { status, ownedMonsters, missingMonsters, ownedKcMonsters, missingKcMonsters, blockers, levelGates, missingItems, missingTools, ownedToolName, optionalOwned, optionalMissing, warmOwned, warmMissing, lightOwned, lightMissing, dfOwned, dfMissing };
}

const _BOSS_CATEGORIES = [
  { key:'raid',       label:'Raids' },
  { key:'wave',       label:'Waves' },
  { key:'minigame',   label:'Minigames' },
  { key:'skilling',   label:'Skilling' },
  { key:'boss',       label:'Bosses', subs:[
    { key:'low',        label:'Low level' },
    { key:'mid',        label:'Mid level' },
    { key:'high',       label:'High level' },
    { key:'gwd',        label:'God Wars' },
    { key:'slayer',     label:'Slayer' },
    { key:'wilderness', label:'Wilderness' },
  ]},
];

function _renderBossFilterBtns() {
  const el = document.getElementById('boss-filter-btns');
  if (!el) return;
  const all = [['all','All'], ...(_BOSS_CATEGORIES.map(c => [c.key, c.label]))];
  el.innerHTML = all.map(([k, l]) =>
    `<button id="boss-filt-${k}" onclick="setBossFilter('${k}')"
      style="font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;border:1px solid #333;
             background:${bossFilter===k?'#2a2000':'#1a1a1a'};color:${bossFilter===k?'#e8c97a':'#666'};
             transition:background 0.1s">${l}</button>`
  ).join('');
}

function setBossFilter(key) {
  bossFilter = key;
  ['all',..._BOSS_CATEGORIES.map(c=>c.key)].forEach(k => {
    const btn = document.getElementById('boss-filt-' + k);
    if (!btn) return;
    btn.style.background = k === key ? '#2a2000' : '#1a1a1a';
    btn.style.color       = k === key ? '#e8c97a' : '#666';
  });
  renderBossList();
}

function renderBossList() {
  const listEl = document.getElementById('boss-list-scroll');
  if (!listEl) return;

  const cats = bossFilter === 'all'
    ? _BOSS_CATEGORIES
    : _BOSS_CATEGORIES.filter(c => c.key === bossFilter);

  // Evaluate + sort (ready first, then by owned-card fraction)
  function _evalSorted(bosses) {
    const evaluated = bosses.map(b => ({ boss:b, ...evaluateBoss(b) }));
    evaluated.sort((a, b) => {
      const so = ({available:0,partial:1,locked:2}[a.status]||0) - ({available:0,partial:1,locked:2}[b.status]||0);
      if (so !== 0) return so;
      const aT = (a.boss.monsters||[]).length + (a.boss.kcMonsters||[]).length;
      const bT = (b.boss.monsters||[]).length + (b.boss.kcMonsters||[]).length;
      const aP = aT ? (a.ownedMonsters.length + a.ownedKcMonsters.length) / aT : 1;
      const bP = bT ? (b.ownedMonsters.length + b.ownedKcMonsters.length) / bT : 1;
      return bP - aP;
    });
    return evaluated;
  }
  const _counts = ev => `${ev.filter(e => e.status === 'available').length} ready \xb7 ${ev.filter(e => e.status === 'partial').length} partial`;
  function _itemsHtml(evaluated) {
    let html = '';
    for (const { boss, status, ownedMonsters, ownedKcMonsters } of evaluated) {
      const dot = status==='available' ? '#76c442' : status==='partial' ? '#c8a020' : '#6a2a2a';
      const total = (boss.monsters||[]).length + (boss.kcMonsters||[]).length;
      const owned = ownedMonsters.length + ownedKcMonsters.length;
      const countStr = total > 0 ? `${owned}/${total}` : '';
      const isSel = selectedBoss === boss.name;
      html += `<div class="boss-item${isSel?' selected':''}"
        data-boss="${escHtml(boss.name)}" onclick="showBossDetail(this.dataset.boss)">
        <span class="boss-status-dot" style="background:${dot}"></span>
        <span style="flex:1;font-size:12px;color:${isSel?'#e8c97a':'#ccc'}">${escHtml(boss.name)}</span>
        ${countStr ? `<span style="font-size:10px;color:#555">${countStr}</span>` : ''}
      </div>`;
    }
    return html;
  }

  let html = '';
  for (const { key, label, subs } of cats) {
    const bosses = BOSS_DATA.filter(b => b.category === key &&
      (!bossSearch || b.name.toLowerCase().includes(bossSearch)));
    if (!bosses.length) continue;

    const evaluated = _evalSorted(bosses);
    html += `<div class="boss-section-header">${label}
      <span style="font-weight:400;color:#444;margin-left:6px">${_counts(evaluated)}</span></div>`;

    if (!subs) { html += _itemsHtml(evaluated); continue; }
    // Sub-grouped category (e.g. Bosses → Low level / God Wars / Wilderness…)
    for (const sc of subs) {
      const subEv = evaluated.filter(e => e.boss.sub === sc.key);
      if (!subEv.length) continue;
      html += `<div class="boss-subsection-header">${sc.label}
        <span style="font-weight:400;color:#3a3a3a;margin-left:6px">${_counts(subEv)}</span></div>`;
      html += _itemsHtml(subEv);
    }
    const other = evaluated.filter(e => !subs.some(sc => sc.key === e.boss.sub));
    if (other.length) html += `<div class="boss-subsection-header">Other</div>` + _itemsHtml(other);
  }

  listEl.innerHTML = html ||
    `<div style="padding:16px;color:#444;font-size:12px">No bosses match</div>`;
}

function showBossDetail(name) {
  selectedBoss = name;
  renderBossList();  // re-render to update selected highlight

  const pane = document.getElementById('boss-detail-pane');
  if (!pane) return;

  const boss = BOSS_DATA.find(b => b.name === name);
  if (!boss) return;

  const ev = evaluateBoss(boss);
  const { status, ownedMonsters, ownedKcMonsters,
          blockers, levelGates, optionalOwned, optionalMissing,
          warmOwned, lightOwned, dfOwned, ownedToolName } = ev;

  const statusCol   = status==='available' ? '#76c442' : status==='partial' ? '#c8a020' : '#c85040';
  const statusLabel = status==='available' ? 'Ready'   : status==='partial' ? 'Partial' : 'Locked';
  const statusBg    = status==='available' ? '#0d2210' : status==='partial' ? '#1a1400' : '#1a0808';
  const statusBdr   = status==='available' ? '#2a5a2a' : status==='partial' ? '#3a2a00' : '#4a1a1a';
  const _subLabel   = _BOSS_CATEGORIES.find(c => c.key === boss.category)?.subs?.find(sc => sc.key === boss.sub)?.label;
  const catLabel    = boss.sub === 'wilderness' ? 'Wilderness Boss'
    : ({raid:'Raid',wave:'Wave Content',minigame:'Minigame',skilling:'Skilling Boss',boss:'Boss'}[boss.category] || boss.category)
      + (_subLabel ? ' \xb7 ' + _subLabel : '');

  // Helper — clickable card chip with image
  function cardChip(cardName, opts) {
    const { type='item', owned=isOwned(cardName), required=true, dashed=false } = opts || {};
    const img = (cardDetails[cardName] || {}).imageUrl;
    const imgHtml = img
      ? `<img src="${img}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`
      : '';
    let col, bg, bdr;
    if (owned)          { col='#76c442'; bg='#0d2210'; bdr='#2a5a2a'; }
    else if (!required) { col='#555';    bg='#111';    bdr=dashed?'#333':'#222'; }
    else                { col='#e8a030'; bg='#1a0f00'; bdr='#4a2800'; }
    const prefix = owned ? '\u2713 ' : required ? '\u2691 ' : '';
    const suffix = (!required && !dashed) ? ` <span style="font-size:9px;color:#333">opt</span>` : '';
    return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:${col};background:${bg};border:1px ${dashed?'dashed':'solid'} ${bdr};border-radius:3px;padding:2px 7px;cursor:pointer;white-space:nowrap;opacity:${(!required&&!dashed)?0.8:1}"
      data-card="${escHtml(cardName)}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">${imgHtml}${prefix}${escHtml(cardName)}${suffix}</span>`;
  }

  // Helper — section header
  function sHead(title, count) {
    return `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#555;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #222">${title}${count!=null?` <span style="font-weight:400;color:#444">${count}</span>`:''}</div>`;
  }

  // Blockers & level gates
  let reqHtml = '';
  for (const b of blockers)
    reqHtml += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px"><span style="color:#c85040">\u2717</span><span style="color:#888">${escHtml(b)}</span></div>`;
  for (const { skill, have, req, ok } of (levelGates||[]))
    reqHtml += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px">
      <span style="color:${ok?'#76c442':'#c85040'}">${ok?'\u2713':'\u2717'}</span>
      <span style="color:${ok?'#aaa':'#888'}">${skill} ${req}</span>
      <span style="color:${ok?'#555':'#c85040'};font-size:10px">(you: ${have})</span></div>`;

  // Boss room monsters
  let monsHtml = '';
  if ((boss.monsters||[]).length) {
    const tot = boss.monsters.length, own = ownedMonsters.length;
    monsHtml = sHead('Boss Room', `${own}/${tot}`);
    monsHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const m of boss.monsters)
      monsHtml += cardChip(m, {type:_cardType(m)||'monster', owned:isOwned(m), required:true});
    monsHtml += `</div>`;
  }

  // KC monsters
  let kcHtml = '';
  if ((boss.kcMonsters||[]).length) {
    const tot = boss.kcMonsters.length, own = ownedKcMonsters.length;
    kcHtml = sHead('Kill Count', `${own}/${tot}`);
    kcHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const m of boss.kcMonsters)
      kcHtml += cardChip(m, {type:_cardType(m)||'monster', owned:isOwned(m), required:true});
    kcHtml += `</div>`;
  }

  // Required items (only those with TCG cards)
  let itemsHtml = '';
  const reqItems = (boss.items||[]).filter(i => itemSources[i]);
  if (reqItems.length) {
    itemsHtml = sHead('Required Items');
    itemsHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const i of reqItems)
      itemsHtml += cardChip(i, {type:'item', owned:isOwned(i), required:true});
    itemsHtml += `</div>`;
  }

  // Tools — show every tier as a chip; highlight best-owned tier
  let toolsHtml = '';
  if ((boss.tools||[]).length) {
    toolsHtml = sHead('Tools');
    toolsHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const toolKey of boss.tools) {
      const bestOwned = ownedToolName[toolKey];
      for (const tier of (TOOL_TIERS[toolKey]||[])) {
        const own = isOwned(tier.name);
        const isBest = bestOwned === tier.name;
        const img = (cardDetails[tier.name]||{}).imageUrl;
        const imgHtml = img
          ? `<img src="${img}" style="width:14px;height:14px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`
          : '';
        toolsHtml += `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:${own?'#76c442':'#333'};background:${own?'#0d2210':'#0e0e0e'};border:1px solid ${own?'#2a5a2a':'#1e1e1e'};border-radius:3px;padding:2px 6px;cursor:pointer;white-space:nowrap${isBest?';box-shadow:0 0 0 1px #4a8a4a':''}"
          data-card="${escHtml(tier.name)}" onclick="showCard(this.dataset.card,'item')" title="${escHtml(tier.name)}">${imgHtml}${escHtml(tier.name)}</span>`;
      }
    }
    toolsHtml += `</div><div style="font-size:10px;color:#444;margin-top:4px">Any tier satisfies the requirement${Object.keys(ownedToolName).length?' \u2014 best owned highlighted':''}</div>`;
  }

  // Optional items
  let optHtml = '';
  if ((boss.optionalItems||[]).length) {
    optHtml = sHead('Optional');
    optHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const item of [...optionalOwned, ...optionalMissing])
      optHtml += cardChip(item, {type:'item', owned:isOwned(item), required:false});
    optHtml += `</div>`;
  }

  // Related cards
  let relHtml = '';
  if ((boss.relatedCards||[]).length) {
    relHtml = sHead('Related Cards');
    relHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const c of boss.relatedCards)
      relHtml += cardChip(c, {type:_cardType(c)||'item', owned:isOwned(c), required:false, dashed:true});
    relHtml += `</div>`;
  }

  // Warm clothing
  let warmHtml = '';
  if (boss.warmClothing) {
    const wOwned = warmOwned.length, wTotal = boss.warmClothing.length;
    const wCapped = wOwned >= 4;
    warmHtml = sHead('Warm Clothing', `${wOwned}/${wTotal} owned \u00b7 ${wCapped?'capped':'need 4'}`);
    warmHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const item of boss.warmClothing)
      warmHtml += cardChip(item, {type:'item', owned:isOwned(item), required:!wCapped});
    warmHtml += `</div>`;
  }

  // Light source
  let lightHtml = '';
  if (boss.lightSource) {
    const lOwned = lightOwned.length, lTotal = LIGHT_SOURCE_ITEMS.length;
    const lOk = lOwned > 0;
    lightHtml = sHead('Light Source', `${lOwned}/${lTotal} owned \u00b7 need 1`);
    lightHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const item of LIGHT_SOURCE_ITEMS)
      lightHtml += cardChip(item, {type:'item', owned:isOwned(item), required:!lOk});
    lightHtml += `</div>`;
  }

  // Dragonfire protection
  let dfHtml = '';
  if (boss.dragonfire) {
    const dOwned = dfOwned.length, dTotal = DRAGONFIRE_ITEMS.length;
    const dOk = dOwned > 0;
    dfHtml = sHead('Dragonfire Protection', `${dOwned}/${dTotal} owned \u00b7 need 1`);
    dfHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
    for (const item of DRAGONFIRE_ITEMS)
      dfHtml += cardChip(item, {type:'item', owned:isOwned(item), required:!dOk});
    dfHtml += `</div>`;
    dfHtml += `<div style="font-size:10px;color:#444;margin-top:4px">Super/Extended super antifire work standalone. Regular antifire needs a shield for full protection.</div>`;
  }

  // Loot — one list grouped by rarity, rarest first. Collection-log items (the boss's
  // uniques) lead each rarity row with a gold border + ◆. Chips green when owned.
  let lootHtml = '';
  const loot = _bossLoot(boss);
  if (loot.drops.length) {
    const ownedN = loot.drops.filter(d => isOwned(d.card)).length;
    const srcHtml = loot.page
      ? `<a href="https://oldschool.runescape.wiki/w/${encodeURIComponent(loot.page)}" target="_blank" style="color:#4a6a8a;text-decoration:none">${escHtml(loot.source)}</a>`
      : escHtml(loot.source);
    const logSet = new Set(((collectionLog[boss.name] || {}).items || []).map(c => c.toLowerCase()));
    const isUnique = d => logSet.has(d.card.toLowerCase());
    lootHtml = sHead('Loot', `${ownedN}/${loot.drops.length} owned`);
    lootHtml += `<div style="font-size:10px;color:#444;margin:-2px 0 6px">From ${srcHtml}`
      + (loot.drops.some(isUnique) ? ` \xb7 <span style="color:#b08a3a">\u25c6</span> collection log unique` : '') + `</div>`;
    for (const line of [loot.uniqueRoll && 'Unique roll: ' + loot.uniqueRoll, loot.basis].filter(Boolean))
      lootHtml += `<div style="font-size:10px;color:#6a5a3a;margin:-2px 0 6px">${escHtml(line)}</div>`;

    const byRarity = {};
    for (const d of loot.drops) (byRarity[d.rarity] ||= []).push(d);
    const order = Object.keys(byRarity).sort((x, y) => (_RARITY_RANK[x] ?? 9) - (_RARITY_RANK[y] ?? 9));
    for (const r of order) {
      lootHtml += `<div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:5px">
        <span class="rarity-badge ${rarityClass(r)}" style="flex-shrink:0;min-width:74px;text-align:center">${escHtml(r)}</span>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      const rowDrops = byRarity[r].sort((x, y) => (isUnique(y) - isUnique(x)) || x.card.localeCompare(y.card));
      for (const d of rowDrops) {
        let chip = cardChip(d.card, {type:'item', owned:isOwned(d.card), required:false, dashed:true});
        if (isUnique(d))
          chip = chip.replace('<span style="', '<span style="border-color:#8a6a2a !important;border-style:solid !important;')
                     .replace(/<\/span>$/, ` <span style="font-size:8px;color:#b08a3a">\u25c6</span></span>`);
        if (d.rarity === 'Unique' && d.fraction)  // share of the unique roll, shown inline
          chip = chip.replace(/<\/span>$/, ` <span style="font-size:9px;color:#8a7a4a">${escHtml(d.fraction)}</span></span>`);
        const tip = _lootTip(d);
        lootHtml += tip ? chip.replace('<span ', `<span title="${escHtml(tip)}" `) : chip;
      }
      lootHtml += `</div></div>`;
    }
  }

  // Boss image — try boss card first, then first monster card
  const bossImg = (cardDetails[boss.name]||{}).imageUrl ||
    (boss.monsters && boss.monsters[0] && (cardDetails[boss.monsters[0]]||{}).imageUrl) || '';
  const bossImgHtml = bossImg
    ? `<img src="${bossImg}" style="float:right;max-width:72px;max-height:72px;image-rendering:pixelated;margin-left:12px;margin-bottom:4px" onerror="this.style.display='none'">`
    : '';

  const wikiHref = `https://oldschool.runescape.wiki/w/${encodeURIComponent(boss.name.replace(/ /g,'_'))}`;

  pane.innerHTML = `
    <div style="padding:20px 24px;max-width:780px">
      ${bossImgHtml}
      <h1 style="font-size:18px;color:#e8c97a;margin:0 0 4px">${escHtml(boss.name)}
        <a href="${wikiHref}" target="_blank" style="font-size:11px;color:#4a6a8a;margin-left:8px;text-decoration:none" title="OSRS Wiki">\u2197 wiki</a>
      </h1>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:${reqHtml?'12px':'4px'}">
        <span style="font-size:11px;color:#666">${catLabel}</span>
        <span style="font-size:11px;color:${statusCol};background:${statusBg};padding:1px 8px;border-radius:10px;border:1px solid ${statusBdr}">${statusLabel}</span>
      </div>
      ${reqHtml ? `<div style="margin-bottom:12px">${reqHtml}</div>` : ''}
      ${monsHtml}
      ${kcHtml}
      ${itemsHtml}
      ${toolsHtml}
      ${optHtml}
      ${relHtml}
      ${warmHtml}
      ${lightHtml}
      ${dfHtml}
      ${lootHtml}
      ${boss.note ? `<div style="margin-top:14px;font-size:11px;color:#555;line-height:1.5;border-top:1px solid #1e1e1e;padding-top:10px">${escHtml(boss.note)}</div>` : ''}
    </div>`;
}

function showBoss(name) {
  if (activeTab !== 'bosses') {
    pushHistoryEntry();
    selectedBoss = name;
    _renderTab('bosses', false);
  } else {
    if (name !== selectedBoss) pushHistoryEntry();
    selectedBoss = name;
    renderBossList();
    showBossDetail(name);
  }
}

// renderBossing kept as alias for refresh callers (e.g. switchCollection)
// Refreshes the boss list (and detail pane if a boss is selected) when the bosses tab is active.
function renderBossing() {
  if (!document.getElementById('boss-list-scroll')) return; // not on bosses tab — nothing to refresh
  renderBossList();
}

// Area schema:
//   rewardNpc: string            — NPC who hands out diary rewards
// Tier schema:
//   skills:   {SkillName: level} — highest level required per skill across all tasks
//   quests:   string[]           — quests required by any task in this tier
//   items:    string[]           — item card names (used for DIARY_BY_CARD cross-links)
//   monsters: string[]           — monster card names (used for DIARY_BY_CARD cross-links)
//   tasks:    TaskObj[]          — actual in-game tasks to tick off (manual)
// TaskObj schema:
//   task:     string             — in-game task description
//   skills?:  {SkillName:level}  — specific skill levels needed for this task
//   items?:   string[]           — item cards needed for this task (clickable, owned/not-owned)
//   monsters?:string[]           — monster cards relevant to this task (clickable, owned/not-owned)
//   npc?:     string             — NPC to interact with (card chip if it's a card, gray if not)
//   tools?:   string[]           — generic tools needed (always gray, no ownership check)
//   quests?:  string[]           — quest prerequisites for this specific task (green✓ / red✗)
// Area-level quest prerequisites — applied to EVERY task in that diary area.
// Only use for quests that literally gate access to the area (e.g. you cannot
// enter Morytania at all without completing Priest in Peril).
// Task-specific quests still go on the individual task object.
