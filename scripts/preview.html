  const rarityBg  = isRdt && !ownedCard ? 'background:#0d0d1a;color:#4a5a8a;' : '';

  const reqTags = monsterReqTags(monsterDrops[cardName]);

  return `<div class="drop-row ${rowClass}" style="cursor:pointer" data-nav="${escHtml(cardName)}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">
    <div class="drop-indicator ${indClass}">${symbol}</div>
    <span class="drop-name ${nameClass}">${cardName}${reqTags}</span>
    <span class="rarity-badge ${rarityClass(rarity)}" style="${rarityBg}">${rarity}</span>
    <span class="fraction">${fraction || '—'}</span>
    ${_rowWishStar(cardName, ownedCard, note)}
  </div>`;
}

// ─── Monster view ──────────────────────────────────────────────────────────
// Deduplicate drops by card name, keeping the entry with the highest drop probability.
// Some monsters (e.g. Scurrius) have multiple drop tables on the same wiki page,
// causing the same item to appear twice with different fractions.
function dedupeDrops(drops) {
  const best = new Map();
  for (const d of drops) {
    const key = d.card;
    if (!best.has(key)) { best.set(key, d); continue; }
    // Compare probabilities: parse "N/D" → rate, keep higher rate
    const rate = frac => {
      if (!frac) return 0;
      const m = frac.match(/^([\d.]+)\/([\d,.]+)$/);
      return m ? parseFloat(m[1]) / parseFloat(m[2].replace(/,/g,'')) : 0;
    };
    if (rate(d.fraction) > rate(best.get(key).fraction)) best.set(key, d);
  }
  return [...best.values()];
}

// ─── Pack acquisition helpers ──────────────────────────────────────────────

function _buildPackPools() {
  // Build {packId → {tierLabel → count}} from card_details (tier + regions) and
  // card_categories (labels). Single-pack only (skip *_large variants).
  if (!packCatalog) return null;
  const pools = {};
  for (const pack of packCatalog.packs) {
    if (!pack.id.endsWith('_large')) pools[pack.id] = {};
  }
  for (const [name, detail] of Object.entries(cardDetails)) {
    const tier    = detail.tier;
    if (!tier) continue;
    const regions = detail.regions || [];
    const labels  = cardCategories[name] || [];
    for (const pack of packCatalog.packs) {
      if (pack.id.endsWith('_large')) continue;
      const filters = pack.category || [];
      let inPack = filters.length === 0;   // Standard = all cards
      if (!inPack) {
        for (const f of filters) {
          if (regions.includes(f) || labels.includes(f)) { inPack = true; break; }
        }
      }
      if (inPack) {
        if (!pools[pack.id][tier]) pools[pack.id][tier] = 0;
        pools[pack.id][tier]++;
      }
    }
  }
  return pools;
}

function _cardInPack(name, pack) {
  const filters = pack.category || [];
  if (filters.length === 0) return true;
  const regions = (cardDetails[name] || {}).regions || [];
  const labels  = cardCategories[name] || [];
  for (const f of filters) {
    if (regions.includes(f) || labels.includes(f)) return true;
  }
  return false;
}

function packAcquisitionHtml(name) {
  if (!packCatalog || !packPools) return '';
  const tier = (cardDetails[name] || {}).tier;
  if (!tier) return '';

  const rows = [];
  for (const pack of packCatalog.packs) {
    if (pack.id.endsWith('_large')) continue;
    if (!_cardInPack(name, pack)) continue;
    const tierPool  = (packPools[pack.id] || {})[tier] || 0;
    const totalPool = Object.values(packPools[pack.id] || {}).reduce((s, n) => s + n, 0);
    rows.push({ id: pack.id, name: pack.name, price: pack.price, tierPool, totalPool });
  }
  if (rows.length === 0) return '';

  const fmt = n => n.toLocaleString();
  return `<div class="section">
    <div class="section-header">Pack Acquisition</div>
    <table class="pack-table">
      <tr><th>Pack</th><th class="r">Price</th><th class="r">${tier}s / set size</th></tr>
      ${rows.map(r => `<tr>
        <td style="cursor:pointer;color:#bba050;text-decoration:underline dotted"
          data-pack="${r.id}" onclick="_navToPack(this)">${r.name}</td>
        <td class="r" style="color:#e8c97a">${fmt(r.price)}</td>
        <td class="r"><span style="color:#888">${r.tierPool}</span><span style="color:#444"> / ${fmt(r.totalPool)}</span></td>
      </tr>`).join('')}
    </table>
    <div style="font-size:10px;color:#444;margin-top:4px">Smaller pool = better odds. Exact drop rates are server-side.</div>
  </div>`;
}

// ─── Wishlist ──────────────────────────────────────────────────────────────

// All wishlisted card names across all sources (owned or not).
function _wishlistedCardSet() {
  const s = new Set(wishlist.keys());
  for (const qn of wishlistedQuests) {
    const bm = bmQuestCards[qn];
    if (!bm) continue;
    for (const sec of (bm.sections || []))
      for (const r of (sec.requirements || []))
        for (const c of (r.cards || [])) s.add(c);
  }
  for (const g of wishlistGroups)
    for (const c of g.cards) s.add(c);
  return s;
}

// Collect every unowned card the player still needs across all wishlist sources.
function _wishlistUnownedTargets() {
  const targets = new Set();
  // Individual starred cards
  for (const [name] of wishlist) {
    if (!isOwned(name)) targets.add(name);
  }
  // Quest-wishlisted cards (all requirement cards in every section)
  for (const qn of wishlistedQuests) {
    const bm = bmQuestCards[qn];
    if (!bm) continue;
    for (const s of (bm.sections || []))
      for (const r of (s.requirements || []))
        for (const c of (r.cards || []))
          if (!isOwned(c)) targets.add(c);
  }
  // Groups: only include cards from unsatisfied groups
  for (const g of wishlistGroups) {
    if (g.cards.some(_slayerCardFeasible)) continue; // already satisfied (owned + accessible)
    for (const c of g.cards) if (!isOwned(c)) targets.add(c);
  }
  // Clue steps: include unowned items from wishlisted steps
  for (const step of wishlistedClueSteps) {
    for (const item of (step.items || [])) {
      if (!isOwned(item)) targets.add(item);
    }
  }
  return targets;
}

// For each non-large pack, count how many unowned targets fall in its pool.
// Returns [{id, name, thumbnail, count, totalPool, cards}] sorted by count desc, then pool asc.
function _wishlistPackRecs(targets) {
  if (!packCatalog || !packPools || !targets.size) return [];
  const recs = [];
  for (const pack of packCatalog.packs) {
    if (pack.id.endsWith('_large')) continue;
    const matching = [];
    for (const name of targets) {
      if ((cardDetails[name] || {}).tier && _cardInPack(name, pack)) matching.push(name);
    }
    if (!matching.length) continue;
    const totalPool = Object.values(packPools[pack.id] || {}).reduce((s, n) => s + n, 0);
    recs.push({ id: pack.id, name: pack.name, thumbnail: pack.thumbnail || '', count: matching.length, totalPool });
  }
  return recs.sort((a, b) => b.count - a.count || a.totalPool - b.totalPool);
}

function _showPackTip(event, el) {
  el.style.borderColor = '#4a4030';
  if (!_wishlistTipCards.length || !packCatalog) return;
  const pack = packCatalog.packs.find(p => p.id === el.dataset.pack);
  if (!pack) return;

  let tip = document.getElementById('_pack-wishlist-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = '_pack-wishlist-tip';
    tip.style.cssText = 'position:fixed;z-index:9999;background:#1c1c1c;border:1px solid #3a3020;border-radius:4px;padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.75);pointer-events:none;display:none';
    document.body.appendChild(tip);
  }

  const inPack = [], notInPack = [];
  for (const name of _wishlistTipCards) {
    const hasTier = !!(cardDetails[name] || {}).tier;
    if (hasTier && _cardInPack(name, pack)) inPack.push(name);
    else notInPack.push(name);
  }

  const chipHtml = (c, dim) => {
    const img = (cardDetails[c] || {}).imageUrl;
    const style = `display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:3px;overflow:hidden;background:#111;border:1px solid ${dim?'#222':'#4a3800'};opacity:${dim?'0.3':'1'}`;
    const inner = img
      ? `<img src="${img}" style="width:28px;height:28px;object-fit:contain;image-rendering:pixelated" title="${c.replace(/"/g,'&quot;')}" onerror="this.style.display='none'">`
      : `<span style="font-size:8px;color:#666;padding:2px;text-align:center;line-height:1.1">${c.slice(0,6)}</span>`;
    return `<div style="${style}" title="${c.replace(/"/g,'&quot;')}">${inner}</div>`;
  };

  tip.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:4px;max-width:200px">` +
    inPack.map(c => chipHtml(c, false)).join('') +
    notInPack.map(c => chipHtml(c, true)).join('') +
    `</div>`;

  const rect = el.getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = rect.left + 'px';
  tip.style.top  = (rect.bottom + 6) + 'px';
  requestAnimationFrame(() => {
    const tr = tip.getBoundingClientRect();
    if (tr.right  > window.innerWidth  - 8) tip.style.left = (window.innerWidth  - tr.width  - 8) + 'px';
    if (tr.bottom > window.innerHeight - 8) tip.style.top  = (rect.top - tr.height - 6) + 'px';
  });
}

function _hidePackTip(el) {
  if (el) el.style.borderColor = '#2a2a2a';
  const tip = document.getElementById('_pack-wishlist-tip');
  if (tip) tip.style.display = 'none';
}

function _loadWishlist() {
  try {
    const raw = localStorage.getItem('tcg_wishlist');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.v === 2) {
      wishlist = new Map(Object.entries(d.items || {}));
      wishlistedQuests = new Set(d.quests || []);
      wishlistGroups = d.groups || [];
      wishlistedClueSteps = d.clueSteps || [];
    } else {
      // Migrate from old Set format (v1 — just an array of names)
      wishlist = new Map((Array.isArray(d) ? d : []).map(n => [n, {note:''}]));
      wishlistedQuests = new Set();
      wishlistGroups = [];
      wishlistedClueSteps = [];
    }
  } catch { wishlist = new Map(); wishlistedQuests = new Set(); wishlistGroups = []; wishlistedClueSteps = []; }
}

function _saveWishlist() {
  const items = {};
  for (const [k, v] of wishlist) items[k] = v;
  localStorage.setItem('tcg_wishlist', JSON.stringify({
    v: 2,
    items,
    quests: [...wishlistedQuests].sort(),
    groups: wishlistGroups,
    clueSteps: wishlistedClueSteps,
  }));
}

function _isClueStepWishlisted(text) {
  return wishlistedClueSteps.some(s => s.text === text);
}

// Strip a step's card contributions from wishlist when it is un-starred.
function _removeClueStepCards(step) {
  const noteTag = `${step.tier} clue`;
  for (const card of (step.items || [])) {
    if (!wishlist.has(card)) continue;
    const entry = wishlist.get(card);
    const remaining = entry.note.split(',').map(t => t.trim()).filter(t => t && t !== noteTag);
    if (remaining.length === 0) {
      wishlist.delete(card);
    } else {
      entry.note = remaining.join(', ');
    }
  }
}

function _toggleClueStepWish(el) {
  const text  = el.dataset.stepText;
  const type  = el.dataset.stepType;
  const tier  = el.dataset.stepTier;
  const items = JSON.parse(el.dataset.stepItems || '[]');
  const idx   = wishlistedClueSteps.findIndex(s => s.text === text);
  if (idx >= 0) {
    const step = wishlistedClueSteps[idx];
    wishlistedClueSteps.splice(idx, 1);
    _removeClueStepCards(step);
    el.textContent = '☆';
    el.classList.remove('active');
  } else {
    wishlistedClueSteps.push({ type, tier, text, items });
    // Add unowned items to the main wishlist card grid (same pattern as wishlistQuest)
    const noteTag = `${tier} clue`;
    for (const card of items) {
      if (isOwned(card)) continue;
      if (wishlist.has(card)) {
        const entry = wishlist.get(card);
        if (!entry.note.includes(noteTag)) entry.note = entry.note ? entry.note + ', ' + noteTag : noteTag;
      } else {
        wishlist.set(card, { note: noteTag });
      }
    }
    el.textContent = '★';
    el.classList.add('active');
  }
  _saveWishlist();
  refreshDetail();
  if (activeTab === 'wishlist') renderWishlist();
}

function removeClueStep(text) {
  const step = wishlistedClueSteps.find(s => s.text === text);
  wishlistedClueSteps = wishlistedClueSteps.filter(s => s.text !== text);
  if (step) _removeClueStepCards(step);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

// Clue step card chip — navigatable chip with an embedded ★ split off to the right.
// navType: 'item' or 'monster'
function _clueCardChipHtml(name, navType) {
  const own = isOwned(name);
  const bg  = own ? '#0d1c09' : '#1c0d09';
  const col = own ? '#76c442' : '#c84a00';
  const sym = own ? '✓' : '✗';
  const wled = wishlist.has(name);
  const divCol = own ? '#1a3a0d' : '#3a1a0d';
  return `<span style="display:inline-flex;align-items:center;background:${bg};border-radius:3px;overflow:hidden">` +
    `<span style="font-size:11px;color:${col};padding:2px 6px 2px 7px;cursor:pointer"` +
    ` data-nav="${escHtml(name)}" data-nav-type="${navType}"` +
    ` onclick="showCard(this.dataset.nav,this.dataset.navType)">${sym} ${escHtml(name)}</span>` +
    `<span class="wish-star${wled?' active':''}" style="font-size:10px;padding:2px 5px;border-left:1px solid ${divCol}"` +
    ` data-card="${escHtml(name)}"` +
    ` onclick="event.stopPropagation();toggleWishlist(this.dataset.card)"` +
    ` title="${wled?'Remove from wishlist':'Add to wishlist'}">${wled?'★':'☆'}</span>` +
    `</span>`;
}

// Small inline wish star for use inside rows (drop tables, quest requirements, etc.).
// owned=true → greyed out (you already have it); stop propagation to avoid row navigation.
// When note is provided, active state reflects whether that specific context tag is present,
// so each page's star toggles its own contribution independently.
function _rowWishStar(name, owned, note) {
  const inWishlist = wishlist.has(name);
  let wled, elsewhere;
  if (note) {
    const entry = wishlist.get(name);
    wled = entry ? entry.note.split(',').map(t => t.trim()).includes(note) : false;
    elsewhere = inWishlist && !wled;
  } else {
    wled = inWishlist;
    elsewhere = false;
  }
  const cls = wled ? ' active' : (elsewhere ? ' elsewhere' : '');
  const sym = (wled || elsewhere) ? '★' : '☆';
  const tip = wled ? 'Remove tag' : (elsewhere ? 'Already wishlisted — click to add this tag' : 'Add to wishlist');
  return `<span class="wish-star${cls}"
    ${owned ? 'style="opacity:0.3"' : ''}
    data-card="${escHtml(name)}"
    ${note ? `data-note="${escHtml(note)}"` : ''}
    onclick="event.stopPropagation();toggleWishlist(this.dataset.card,this.dataset.note)"
    title="${tip}">${sym}</span>`;
}

function toggleWishlist(name, note) {
  if (note) {
    // Context-aware toggle: add/remove just this tag, keep other tags intact
    if (wishlist.has(name)) {
      const entry = wishlist.get(name);
      const parts = entry.note.split(',').map(t => t.trim()).filter(Boolean);
      if (parts.includes(note)) {
        // This tag is already present — remove it
        const remaining = parts.filter(t => t !== note);
        if (remaining.length === 0) wishlist.delete(name);
        else entry.note = remaining.join(', ');
      } else {
        // Append this tag to the existing entry
        entry.note = [...parts, note].join(', ');
      }
    } else {
      // Not yet wishlisted — add with context + any auto-discovered tags
      const autoNote = _buildAutoNote(name);
      const combined = [note, autoNote].filter(Boolean).join(', ');
      wishlist.set(name, {note: combined});
    }
  } else {
    // No context — simple toggle (header stars)
    if (wishlist.has(name)) wishlist.delete(name);
    else {
      // Add '★' marker so manual pins survive quest/clue/group auto-removal
      const autoNote = _buildAutoNote(name);
      const combined = ['★', autoNote].filter(Boolean).join(', ');
      wishlist.set(name, {note: combined});
    }
  }
  _saveWishlist();
  refreshDetail();
  if (activeTab === 'wishlist') renderWishlist();
}

// Build a note for a newly-added card by checking which wishlisted quests,
// groups, and clue steps it belongs to, so the label is restored on re-add.
function _buildAutoNote(name) {
  const tags = [];
  for (const qn of wishlistedQuests) {
    const cards = (bmQuestCards[qn]?.sections || [])
      .flatMap(s => s.requirements || []).flatMap(r => r.cards || []);
    if (cards.includes(name)) tags.push(qn);
  }
  for (const g of wishlistGroups) {
    if (g.cards.includes(name)) tags.push(g.name);
  }
  for (const step of wishlistedClueSteps) {
    if ((step.items || []).includes(name)) {
      const tag = `${step.tier} clue`;
      if (!tags.includes(tag)) tags.push(tag);
    }
  }
  return tags.join(', ');
}

// ── Wishlist left-panel search ────────────────────────────────────────────────
function _wlSearchInput(q) {
  const el = document.getElementById('wl-search-results');
  if (!el) return;
  const lower = q.trim().toLowerCase();

  let cards, quests;
  if (lower.length > 0) {
    cards  = allCards.filter(c => c.type !== 'clue' && c.name.toLowerCase().includes(lower));
    quests = Object.keys(questsData).filter(n => n.toLowerCase().includes(lower));
  } else {
    // No query: show all wishlisted items
    cards  = allCards.filter(c => wishlist.has(c.name));
    quests = [...wishlistedQuests];
  }

  if (!lower && !cards.length && !quests.length) {
    el.innerHTML = '<div style="padding:20px 12px;color:#333;font-size:11px;text-align:center;line-height:1.7">Type a card or quest name<br>to search &amp; add</div>';
    return;
  }
  if (lower && !cards.length && !quests.length) {
    el.innerHTML = '<div style="padding:10px 12px;color:#444;font-size:11px">No cards or quests found</div>';
    return;
  }

  const cardHtml = cards.slice(0, 40).map(c => {
    const wled = wishlist.has(c.name);
    const own  = isOwned(c.name);
    const safe = c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    const imgUrl = (cardDetails[c.name] || {}).imageUrl || '';
    const ctype = c.type || 'item';
    return `<div style="display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;border-bottom:1px solid #0f0f0f"
      data-card="${safe}" onclick="_wlSearchToggle(this.dataset.card)"
      onmouseenter="this.style.background='#161616'" onmouseleave="this.style.background=''">
      ${imgUrl ? `<img src="${imgUrl}" style="width:20px;height:20px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">` : '<span style="width:20px;flex-shrink:0"></span>'}
      <span style="flex:1;font-size:11px;color:${own?'#76c442':'#aaa'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted"
        data-nav="${safe}" data-nav-type="${ctype}" onclick="event.stopPropagation();_navToCard(this)" title="View card">${c.name}</span>
      <span style="font-size:12px;flex-shrink:0;color:${wled?'#4a7a4a':'#2a4a2a'};font-weight:700" title="${wled?'Remove from wishlist':'Add to wishlist'}">${wled?'★':'☆'}</span>
    </div>`;
  }).join('');

  const questHtml = quests.slice(0, 20).map(qn => {
    const wled = wishlistedQuests.has(qn);
    const safe = qn.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div style="display:flex;align-items:center;gap:7px;padding:5px 10px;cursor:pointer;border-bottom:1px solid #0f0f0f"
      data-quest="${safe}" onclick="_wlQuestToggle(this.dataset.quest)"
      onmouseenter="this.style.background='#161616'" onmouseleave="this.style.background=''">
      <span style="width:20px;flex-shrink:0;font-size:10px;text-align:center;color:#7a6a3a">Q</span>
      <span style="flex:1;font-size:11px;color:#bba050;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline dotted"
        data-quest="${safe}" onclick="event.stopPropagation();_navToQuest(this)"
        title="Open quest page">${qn}</span>
      <span style="font-size:12px;flex-shrink:0;color:${wled?'#7a6a3a':'#2a2a1a'};font-weight:700" title="${wled?'Remove quest from wishlist':'Add quest cards to wishlist'}">${wled?'★':'☆'}</span>
    </div>`;
  }).join('');

  // If both sections have results and we have a query, show section headers
  let html = '';
  if (lower && quests.length && cards.length) {
    if (cardHtml) html += `<div style="padding:4px 10px;font-size:9px;color:#444;letter-spacing:.05em;text-transform:uppercase;background:#0a0a0a">Cards</div>${cardHtml}`;
    if (questHtml) html += `<div style="padding:4px 10px;font-size:9px;color:#444;letter-spacing:.05em;text-transform:uppercase;background:#0a0a0a">Quests</div>${questHtml}`;
  } else {
    html = cardHtml + questHtml;
  }
  el.innerHTML = html;
}

function _wlQuestToggle(questName) {
  if (wishlistedQuests.has(questName)) {
    removeQuestFromWishlist(questName);
  } else {
    wishlistQuest(questName);
  }
  const input = document.getElementById('wl-search');
  if (input) _wlSearchInput(input.value);
}

function _wlSearchToggle(name) {
  if (wishlist.has(name)) {
    wishlist.delete(name);
  } else {
    wishlist.set(name, {note: _buildAutoNote(name)});
  }
  _saveWishlist();
  renderWishlist();
}

function removeFromWishlist(name) {
  wishlist.delete(name);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

function removeWishlistTag(name, tag) {
  if (!wishlist.has(name)) return;
  const entry = wishlist.get(name);
  const remaining = entry.note.split(',').map(t => t.trim()).filter(t => t && t !== tag);
  if (remaining.length === 0) wishlist.delete(name);
  else entry.note = remaining.join(', ');
  _saveWishlist();
  renderWishlist();
  refreshDetail();
}

function removeQuestFromWishlist(questName) {
  // Smart cleanup: strip quest name from auto-added card notes
  const questCards = (bmQuestCards[questName]?.sections || [])
    .flatMap(s => s.requirements || []).flatMap(r => r.cards || [])
    .filter((c, i, a) => a.indexOf(c) === i);
  for (const card of questCards) {
    if (!wishlist.has(card)) continue;
    const entry   = wishlist.get(card);
    const cleaned = _noteRemoveTag(entry.note, questName);
    if (!cleaned) wishlist.delete(card); else entry.note = cleaned;
  }
  wishlistedQuests.delete(questName);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

// Strip a single tag from a comma-separated note string
function _noteRemoveTag(note, tag) {
  return note.split(',').map(p => p.trim()).filter(p => p && p !== tag).join(', ');
}

function clearWishlist() {
  const parts = [
    wishlist.size && `${wishlist.size} card${wishlist.size === 1 ? '' : 's'}`,
    wishlistedQuests.size && `${wishlistedQuests.size} quest${wishlistedQuests.size === 1 ? '' : 's'}`,
    wishlistGroups.length && `${wishlistGroups.length} group${wishlistGroups.length === 1 ? '' : 's'}`,
    wishlistedClueSteps.length && `${wishlistedClueSteps.length} clue step${wishlistedClueSteps.length === 1 ? '' : 's'}`,
  ].filter(Boolean);
  if (!parts.length) return;
  if (!confirm(`Clear your whole wishlist?\n\nThis removes ${parts.join(', ')}. It can't be undone.`)) return;
  wishlist.clear();
  wishlistedQuests.clear();
  wishlistGroups = [];
  wishlistedClueSteps = [];
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
  refreshDetail();  // un-star any open card page
}

function saveWishlistNote(name, note) {
  const entry = wishlist.get(name);
  if (entry) { entry.note = note.trim(); _saveWishlist(); }
}

// ── Note popover ──────────────────────────────────────────────────────────────
let _notePopoverCloseHandler = null;

function openNotePopover(btn, cardName) {
  // Close any existing popover first
  _closeNotePopover();

  const meta = wishlist.get(cardName) || {note:''};
  const pop = document.createElement('div');
  pop.id = 'note-popover';
  pop.style.cssText = 'position:fixed;z-index:9999;background:#1c1c1c;border:1px solid #333;border-radius:4px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,0.6);width:220px';

  const safeCard = cardName.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  pop.innerHTML = `
    <div style="font-size:10px;color:#777;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${cardName}</div>
    <textarea id="note-popover-input" placeholder="Why do you want this?" rows="3"
      style="width:100%;box-sizing:border-box;background:#111;border:1px solid #333;color:#ccc;padding:5px 7px;border-radius:3px;font-size:11px;resize:vertical;outline:none;font-family:inherit">${meta.note}</textarea>
    <div style="display:flex;gap:5px;margin-top:7px;justify-content:flex-end">
      <button onclick="_closeNotePopover()" style="background:none;border:1px solid #2a2a2a;color:#666;padding:2px 9px;border-radius:3px;font-size:10px;cursor:pointer">Cancel</button>
      <button data-card="${safeCard}" onclick="_saveNotePopover(this.dataset.card)"
        style="background:#1a2a1a;border:1px solid #2a4a2a;color:#76c442;padding:2px 9px;border-radius:3px;font-size:10px;cursor:pointer">Save</button>
    </div>`;
  document.body.appendChild(pop);

  // Position below the button, left-aligned, clamped to viewport
  const rect = btn.getBoundingClientRect();
  let top  = rect.bottom + 5;
  let left = rect.left;
  pop.style.top  = top  + 'px';
  pop.style.left = left + 'px';
  // After paint, clamp right edge
  requestAnimationFrame(() => {
    const pr = pop.getBoundingClientRect();
    if (pr.right > window.innerWidth - 8)  pop.style.left = (window.innerWidth - pr.width - 8) + 'px';
    if (pr.bottom > window.innerHeight - 8) pop.style.top  = (rect.top - pr.height - 5) + 'px';
  });

  pop.querySelector('#note-popover-input').focus();

  // Close on outside click (next tick so this click doesn't immediately close it)
  setTimeout(() => {
    _notePopoverCloseHandler = e => { if (!pop.contains(e.target)) _closeNotePopover(); };
    document.addEventListener('click', _notePopoverCloseHandler);
  }, 0);
}

function _closeNotePopover() {
  const pop = document.getElementById('note-popover');
  if (pop) pop.remove();
  if (_notePopoverCloseHandler) {
    document.removeEventListener('click', _notePopoverCloseHandler);
    _notePopoverCloseHandler = null;
  }
}

function _saveNotePopover(cardName) {
  const input = document.getElementById('note-popover-input');
  if (input) saveWishlistNote(cardName, input.value);
  _closeNotePopover();
  // Re-render so button colour/title updates
  if (activeTab === 'wishlist') renderWishlist();
}

// ── Group editor ──────────────────────────────────────────────────────────────
function openGroupEditor(gi) {
  // gi = -1 for new, else index into wishlistGroups
  const g = gi >= 0 ? wishlistGroups[gi] : {name: '', cards: []};
  window._geCards = [...g.cards];
  window._geIdx   = gi;

  let overlay = document.getElementById('group-editor-overlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'group-editor-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.72);display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = `
    <div id="group-editor-modal" style="background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:18px 20px;width:360px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;gap:10px;overflow:hidden">
      <div style="display:flex;align-items:center">
        <span style="font-size:13px;color:#ccc;font-weight:500">${gi < 0 ? 'New group' : 'Edit group'}</span>
        <button onclick="closeGroupEditor()" style="margin-left:auto;background:none;border:none;color:#555;cursor:pointer;font-size:18px;line-height:1">×</button>
      </div>
      <input id="ge-name" placeholder="Group name, e.g. Low level axe" value="${g.name.replace(/</g,'&lt;').replace(/"/g,'&quot;')}"
        style="background:#111;border:1px solid #333;color:#ccc;padding:6px 9px;border-radius:3px;font-size:12px;outline:none">
      <div style="font-size:10px;color:#666;margin-bottom:-6px">Add cards — group is satisfied when you own <em>any one</em></div>
      <input id="ge-search" placeholder="Search cards…" autocomplete="off" oninput="_geRenderSearch(this.value)"
        style="background:#111;border:1px solid #333;color:#ccc;padding:6px 9px;border-radius:3px;font-size:11px;outline:none">
      <div id="ge-results" style="overflow-y:auto;max-height:140px;border:1px solid #222;border-radius:3px;background:#0c0c0c"></div>
      <div>
        <div style="font-size:10px;color:#666;margin-bottom:5px">In group (<span id="ge-count">${g.cards.length}</span>)</div>
        <div id="ge-chips" style="display:flex;flex-wrap:wrap;gap:4px;min-height:22px"></div>
      </div>
      <div style="display:flex;gap:6px;justify-content:flex-end;padding-top:4px;border-top:1px solid #222">
        <button onclick="closeGroupEditor()" style="background:none;border:1px solid #2a2a2a;color:#666;padding:4px 14px;border-radius:3px;font-size:11px;cursor:pointer">Cancel</button>
        <button data-gi="${gi}" onclick="saveGroupEditor(parseInt(this.dataset.gi))"
          style="background:#1a2a1a;border:1px solid #2a4a2a;color:#76c442;padding:4px 14px;border-radius:3px;font-size:11px;cursor:pointer">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  _geRenderChips();
  document.getElementById('ge-name').focus();
}

function _geRenderSearch(q) {
  const el = document.getElementById('ge-results');
  if (!el) return;
  if (!q || q.length < 2) { el.innerHTML = ''; return; }
  const lower = q.toLowerCase();
  const matches = allCards.filter(c => c.name.toLowerCase().includes(lower) && !window._geCards.includes(c.name)).slice(0, 25);
  if (!matches.length) { el.innerHTML = '<div style="padding:6px 9px;color:#333;font-size:10px">No matches</div>'; return; }
  el.innerHTML = matches.map(c => {
    const own  = isOwned(c.name);
    const safe = c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<div style="padding:5px 9px;cursor:pointer;font-size:11px;color:${own?'#76c442':'#999'};display:flex;align-items:center;gap:7px;border-bottom:1px solid #111"
      data-card="${safe}" onclick="_geAddCard(this.dataset.card)"
      onmouseenter="this.style.background='#1c1c1c'" onmouseleave="this.style.background=''">
      <span style="font-size:9px;color:${own?'#00c853':'#333'}">${own?'✓':'○'}</span>${c.name}</div>`;
  }).join('');
}

function _geAddCard(name) {
  if (window._geCards.includes(name)) return;
  window._geCards.push(name);
  _geRenderChips();
  const search = document.getElementById('ge-search');
  if (search) _geRenderSearch(search.value);
}

function _geRemoveCard(name) {
  window._geCards = window._geCards.filter(c => c !== name);
  _geRenderChips();
  const search = document.getElementById('ge-search');
  if (search) _geRenderSearch(search.value);
}

function _geRenderChips() {
  const el    = document.getElementById('ge-chips');
  const count = document.getElementById('ge-count');
  if (!el) return;
  if (count) count.textContent = window._geCards.length;
  if (!window._geCards.length) { el.innerHTML = '<span style="font-size:10px;color:#2a2a2a">None yet</span>'; return; }
  el.innerHTML = window._geCards.map(c => {
    const own  = isOwned(c);
    const safe = c.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
    return `<span style="display:inline-flex;align-items:center;gap:4px;background:${own?'#0d2210':'#111'};border:1px solid ${own?'#2a5a2a':'#2a2a2a'};color:${own?'#76c442':'#aaa'};border-radius:3px;padding:2px 5px;font-size:10px">
      ${c}<span data-card="${safe}" onclick="_geRemoveCard(this.dataset.card)" style="color:#555;cursor:pointer;line-height:1" title="Remove">×</span></span>`;
  }).join('');
}

function closeGroupEditor() {
  const overlay = document.getElementById('group-editor-overlay');
  if (overlay) overlay.remove();
  window._geCards = null; window._geIdx = null;
}

function saveGroupEditor(gi) {
  const nameEl = document.getElementById('ge-name');
  const name   = (nameEl ? nameEl.value.trim() : '') || 'Unnamed group';
  const cards  = window._geCards || [];
  if (!cards.length) { closeGroupEditor(); return; }

  // If editing, strip the old group name from any auto-added notes first
  const oldGroup = (gi >= 0 && gi < wishlistGroups.length) ? wishlistGroups[gi] : null;
  if (oldGroup) {
    for (const card of oldGroup.cards) {
      if (!wishlist.has(card)) continue;
      const entry   = wishlist.get(card);
      const cleaned = _noteRemoveTag(entry.note, oldGroup.name);
      if (!cleaned) wishlist.delete(card); else entry.note = cleaned;
    }
  }

  // Save group
  if (oldGroup) wishlistGroups[gi] = {name, cards: [...cards]};
  else wishlistGroups.push({name, cards: [...cards]});

  // Auto-populate individual wishlist with group name as note (unowned cards only)
  for (const card of cards) {
    if (isOwned(card)) continue;  // already have it — show in group but don't clutter wishlist
    if (wishlist.has(card)) {
      const entry = wishlist.get(card);
      if (!entry.note.includes(name)) entry.note = entry.note ? entry.note + ', ' + name : name;
    } else {
      wishlist.set(card, {note: name});
    }
  }

  _saveWishlist();
  closeGroupEditor();
  if (activeTab === 'wishlist') renderWishlist();
}

function removeGroup(gi) {
  const g = wishlistGroups[gi];
  if (!g) return;
  // Smart cleanup: strip group name from auto-added card notes
  for (const card of g.cards) {
    if (!wishlist.has(card)) continue;
    const entry   = wishlist.get(card);
    const cleaned = _noteRemoveTag(entry.note, g.name);
    if (!cleaned) wishlist.delete(card); else entry.note = cleaned;
  }
  wishlistGroups.splice(gi, 1);
  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
}

function wishlistQuest(questName) {
  if (wishlistedQuests.has(questName)) return 0;
  wishlistedQuests.add(questName);

  // Add unowned BM quest cards to the individual wishlist with the quest name as the note
  const questCards = (bmQuestCards[questName]?.sections || [])
    .flatMap(s => s.requirements || [])
    .flatMap(r => r.cards || [])
    .filter((c, i, a) => a.indexOf(c) === i);
  for (const card of questCards) {
    if (isOwned(card)) continue;  // already have it — no need to wishlist
    if (wishlist.has(card)) {
      const entry = wishlist.get(card);
      if (!entry.note.includes(questName)) entry.note = entry.note ? entry.note + ', ' + questName : questName;
    } else {
      wishlist.set(card, {note: questName});
    }
  }

  _saveWishlist();
  if (activeTab === 'wishlist') renderWishlist();
  return 1;
}

// ── Category helper ───────────────────────────────────────────────────────────
const _EQUIP_CATS = new Set(['Weapon','Armour','Ammo','Shield','Cape','Helm','Boot','Glove','Amulet','Ring','Jewellery']);
function _wlCategory(name) {
  if (monsterDrops[name]) return monsterDrops[name].combatLevel ? 'monster' : 'npc';
  const cats = cardCategories[name] || [];
  if (cats.includes('Tool')) return 'tool';
  if (cats.some(c => _EQUIP_CATS.has(c))) return 'equipment';
  if (cats.includes('Currency')) return 'currency';
  return 'other';
}

function _cardType(name) {
  const card = allCards.find(c => c.name === name);
  return card ? card.type : (monsterDrops[name] ? 'monster' : 'item');
}

// ── Main render ───────────────────────────────────────────────────────────────
// Re-renders both the main wishlist page and the left panel, so removals made
// from the main page (tile ✕, tag ✕, group/quest removal) show up in the panel immediately.
function renderWishlist() {
  _renderWishlistMain();
  const input = document.getElementById('wl-search');
  if (input) _wlSearchInput(input.value);
}

function _renderWishlistMain() {
  const container = document.getElementById('wishlist-content');
  if (!container) return;

  const isEmpty = wishlist.size === 0 && wishlistedQuests.size === 0 && wishlistGroups.length === 0 && wishlistedClueSteps.length === 0;

  if (isEmpty) {
    container.innerHTML = `<div style="color:#444;font-size:13px;line-height:2;margin:60px auto;max-width:360px;text-align:center">
      <div style="font-size:22px;margin-bottom:12px">☆</div>
      No cards wishlisted yet.<br>
      <span style="font-size:11px;color:#555">Click <span style="color:#e8c97a">☆</span> on any card detail page to add a card,<br>
      use the <em>☆ Wishlist quest cards</em> button on a quest page,<br>
      or create a group for "any one of these will do".</span>
      <div style="margin-top:16px">
        <button onclick="openGroupEditor(-1)" style="background:none;border:1px solid #2a3a2a;color:#5a8a5a;padding:5px 14px;border-radius:3px;font-size:11px;cursor:pointer">+ New group</button>
      </div>
    </div>`;
    return;
  }

  // Stats
  const allItems  = [...wishlist.keys()];
  const obtained  = allItems.filter(n => isOwned(n)).length;
  const questCards = [...wishlistedQuests].flatMap(qn => {
    const bm = bmQuestCards[qn];
    if (!bm) return [];
    return (bm.sections || []).flatMap(s => (s.requirements || []).flatMap(r => r.cards || []));
  });
  const uniqueQuestCards = [...new Set(questCards)];
  const questObtained = uniqueQuestCards.filter(n => isOwned(n)).length;
  const groupsSatisfied = wishlistGroups.filter(g => g.cards.some(_slayerCardFeasible)).length;

  const unownedTargets = _wishlistUnownedTargets();
  _wishlistTipCards = [...unownedTargets].sort();
  const packRecs = _wishlistPackRecs(unownedTargets);
  const packTargetCount = [...unownedTargets].filter(n => (cardDetails[n] || {}).tier).length;

  let html = `<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;align-items:center">
    ${wishlist.size ? `<span style="font-size:12px;color:#888">★ Cards: <span style="color:${obtained===wishlist.size?'#00c853':'#e8c97a'}">${obtained}/${wishlist.size}</span> obtained</span>` : ''}
    ${wishlistedQuests.size ? `<span style="font-size:12px;color:#888">📋 Quests: <span style="color:#aaa">${wishlistedQuests.size}</span> tracked · <span style="color:${questObtained===uniqueQuestCards.length?'#00c853':'#e8c97a'}">${questObtained}/${uniqueQuestCards.length}</span> cards obtained</span>` : ''}
    ${wishlistGroups.length ? `<span style="font-size:12px;color:#888">⊕ Groups: <span style="color:${groupsSatisfied===wishlistGroups.length?'#00c853':'#e8c97a'}">${groupsSatisfied}/${wishlistGroups.length}</span> satisfied</span>` : ''}
    ${wishlistedClueSteps.length ? (() => { const csOk = wishlistedClueSteps.filter(s => (s.items||[]).every(i => isOwned(i))).length; return `<span style="font-size:12px;color:#888">🗺 Clue steps: <span style="color:${csOk===wishlistedClueSteps.length?'#00c853':'#e8c97a'}">${csOk}/${wishlistedClueSteps.length}</span> ready</span>`; })() : ''}
    <button onclick="openGroupEditor(-1)" style="margin-left:auto;background:none;border:1px solid #2a3a2a;color:#5a8a5a;padding:3px 10px;border-radius:3px;font-size:10px;cursor:pointer">+ New group</button>
    <button onclick="clearWishlist()" style="background:none;border:1px solid #3a1a1a;color:#7a3a3a;padding:3px 10px;border-radius:3px;font-size:10px;cursor:pointer">Clear all</button>
  </div>`;

  // ── Pack suggestions ────────────────────────────────────────────────────────
  if (packRecs.length) {
    html += `<div class="section">
      <div class="section-header">Suggested Packs
        <span style="font-size:10px;font-weight:400;color:#444;margin-left:6px">· ${packTargetCount} pack-eligible target${packTargetCount !== 1 ? 's' : ''}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">`;
    for (const r of packRecs) {
      html += `<div style="flex:0 0 80px;cursor:pointer;border:1px solid #2a2a2a;border-radius:4px;overflow:hidden;background:#0d0d0d;transition:border-color .15s"
        onmouseover="_showPackTip(event,this)" onmouseout="_hidePackTip(this)"
        data-pack="${r.id}" onclick="_navToPack(this)">
        ${r.thumbnail
          ? `<img src="${r.thumbnail}" style="width:80px;height:80px;object-fit:cover;display:block;pointer-events:none" onerror="this.style.background='#1a1a1a'">`
          : `<div style="width:80px;height:80px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#333;font-size:11px;pointer-events:none">?</div>`}
        <div style="padding:5px 6px 6px;border-top:1px solid #1e1e1e;pointer-events:none">
          <div style="font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px">${r.name}</div>
          <div style="font-size:11px;color:#e8c97a;font-weight:600">${r.count} targets</div>
        </div>
      </div>`;
    }
    html += `</div>
    </div>`;
  }

  // ── Quest sections (built now, appended after individual cards) ────────────
  let questHtml = '';
  if (wishlistedQuests.size) {
    questHtml += `<div class="section"><div class="section-header">Wishlisted Quests</div>`;
    for (const qn of [...wishlistedQuests].sort()) {
      const bm = bmQuestCards[qn];
      const cards = bm ? (bm.sections || []).flatMap(s => (s.requirements || []).flatMap(r => r.cards || [])) : [];
      const unique = [...new Set(cards)];
      const got = unique.filter(n => isOwned(n)).length;
      const qSafe = qn.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      questHtml += `<div style="margin:10px 0;background:#161616;border:1px solid #2a2a2a;border-radius:4px;padding:10px 12px">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
          <span style="font-size:13px;color:#bba050;font-weight:500;cursor:pointer;text-decoration:underline dotted"
            data-quest="${qSafe}" onclick="_navToQuest(this)"
            title="Open quest page">${qn}</span>
          <span style="font-size:10px;color:${got===unique.length&&unique.length?'#00c853':'#888'}">${got}/${unique.length} obtained</span>
          <button data-quest="${qSafe}" onclick="removeQuestFromWishlist(this.dataset.quest)"
            style="margin-left:auto;background:none;border:none;color:#444;cursor:pointer;font-size:12px" title="Remove quest">×</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      for (const c of unique.sort()) {
        const own  = isOwned(c);
        const wled = wishlist.has(c);
        const safe = c.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        const type = _cardType(c);
        const chipStyle = own
          ? 'background:#0d2210;border-color:#2a5a2a;color:#76c442'
          : wled
            ? 'background:#111;border-color:#222;color:#555'
            : 'background:#1a0808;border-color:#4a1a1a;color:#6a2a2a;text-decoration:line-through';
        const chipTitle = wled ? '' : `title="${c.replace(/"/g,'&quot;')} removed from wishlist"`;
        questHtml += `<span style="${chipStyle};border:1px solid;border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer" ${chipTitle}
          data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">${own?'✓ ':''}${c}</span>`;
      }
      questHtml += `</div></div>`;
    }
    questHtml += `</div>`;
  }

  // ── Groups sections ─────────────────────────────────────────────────────────
  if (wishlistGroups.length) {
    const satCount = wishlistGroups.filter(g => g.cards.some(_slayerCardFeasible)).length;
    html += `<div class="section"><div class="section-header">Groups <span style="font-size:10px;font-weight:400;color:#555;margin-left:6px">${satCount}/${wishlistGroups.length} satisfied</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:10px">`;
    for (let gi = 0; gi < wishlistGroups.length; gi++) {
      const g = wishlistGroups[gi];
      const satisfied = g.cards.some(_slayerCardFeasible);
      const ownedCount = g.cards.filter(c => isOwned(c)).length;
      const anyBlocked = !satisfied && g.cards.some(c => isOwned(c) && !_slayerCardFeasible(c));
      const groupBdr = satisfied ? '#1e3a1e' : anyBlocked ? '#3a2a00' : '#2a2a2a';
      const groupHdr = satisfied ? '#76c442' : anyBlocked ? '#c89020' : '#ccc';
      html += `<div style="background:#161616;border:1px solid ${groupBdr};border-radius:4px;padding:10px 12px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
          <span style="font-size:12px;color:${groupHdr};font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${satisfied?'✓ ':anyBlocked?'\u26a0 ':''}${g.name.replace(/&/g,'&amp;')}</span>
          <span style="font-size:10px;color:${satisfied?'#00c853':anyBlocked?'#c89020':'#666'};flex-shrink:0">${ownedCount}/${g.cards.length}</span>
          <button data-gi="${gi}" onclick="openGroupEditor(parseInt(this.dataset.gi))"
            style="background:none;border:1px solid #2a2a2a;color:#555;padding:1px 5px;border-radius:2px;font-size:9px;cursor:pointer;flex-shrink:0">✎</button>
          <button data-gi="${gi}" onclick="removeGroup(parseInt(this.dataset.gi))"
            style="background:none;border:none;color:#333;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0" title="Remove">×</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      for (const c of g.cards) {
        const own  = isOwned(c);
        const feasible = _slayerCardFeasible(c);
        const blocked = own && !feasible;
        const wled = wishlist.has(c);
        const safe = c.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        const type = _cardType(c);
        const chipStyle = own
          ? (blocked ? 'background:#1a1400;border-color:#5a4010;color:#c89020' : 'background:#0d2210;border-color:#2a5a2a;color:#76c442')
          : 'background:#111;border-color:#222;color:#555';
        const _gateDesc = (() => {
          if (!blocked) return '';
          const g2 = _slayerGate(c);
          return [
            ...((g2.quests||[]).filter(q => !completedQuests.has(q)).map(q => 'Quest: '+q)),
            ...(Object.entries(g2.skills||{}).filter(([s,l]) => getLevel(s)<l).map(([s,l]) => s+' '+l+' req')),
          ].join('; ');
        })();
        const tip = blocked ? 'Owned — '+_gateDesc : own ? 'Owned' : 'Not owned';
        html += `<span style="${chipStyle};border:1px solid;border-radius:3px;padding:2px 7px;font-size:10px;cursor:pointer"
          title="${tip.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">${own?(blocked?'\u26a0 ':'✓ '):''}${c}</span>`;
      }
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }

  // ── Individual card sections ────────────────────────────────────────────────
  const SECTIONS = [
    {key:'tool',      label:'Tools'},
    {key:'equipment', label:'Equipment'},
    {key:'currency',  label:'Currency'},
    {key:'monster',   label:'Monsters'},
    {key:'npc',       label:'NPCs'},
    {key:'other',     label:'Other'},
  ];

  const byCategory = {tool:[], equipment:[], currency:[], monster:[], npc:[], other:[]};
  for (const [name] of wishlist) byCategory[_wlCategory(name)]?.push(name);

  for (const {key, label} of SECTIONS) {
    const items = byCategory[key].sort();
    if (!items.length) continue;
    const got = items.filter(n => isOwned(n)).length;
    html += `<div class="section"><div class="section-header">${label} <span style="font-size:10px;font-weight:400;color:#555;margin-left:6px">${got}/${items.length} obtained</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px">`;
    for (const name of items) {
      const own  = isOwned(name);
      const meta = wishlist.get(name) || {note:''};
      const safe = name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      const type = _cardType(name);
      const imgUrl = (cardDetails[name] || {}).imageUrl || '';
      const hasNote = meta.note && meta.note.trim();
      const noteTags = hasNote ? meta.note.split(',').map(t => t.trim()).filter(Boolean) : [];
      const noteChips = noteTags.map(tag => {
        const isPin = tag === '★';
        const chipStyle = isPin ? ' style="border-color:#3a2a00;background:#1a1400"' : '';
        const labelStyle = isPin ? ' style="color:#e8c97a;padding:1px 3px 1px 5px"' : '';
        const label = isPin ? '★ pinned' : escHtml(tag);
        const title = isPin ? 'Manually pinned' : escHtml(tag);
        const removeTitle = isPin ? 'Remove pin' : 'Remove tag';
        return `<span class="wl-tag-chip"${chipStyle}>` +
          `<span title="${title}"${labelStyle}>${label}</span>` +
          `<span class="wl-tag-chip-x" data-card="${safe}" data-tag="${escHtml(tag)}"` +
          ` onclick="event.stopPropagation();removeWishlistTag(this.dataset.card,this.dataset.tag)"` +
          ` title="${removeTitle}">×</span>` +
          `</span>`;
      }).join('');
      // Orange badge: not owned, but a group containing this card is satisfied via another card
      const groupCovered = !own && wishlistGroups.some(g =>
        g.cards.includes(name) && g.cards.some(c => c !== name && isOwned(c)));
      const badge = own
        ? `<div style="position:absolute;top:3px;right:3px;background:#00c853;color:#000;border-radius:2px;font-size:8px;padding:1px 4px;font-weight:700;line-height:1.5" title="Owned">✓</div>`
        : groupCovered
          ? `<div style="position:absolute;top:3px;right:3px;background:#a05000;color:#ffd080;border-radius:2px;font-size:8px;padding:1px 4px;font-weight:700;line-height:1.5" title="Group satisfied by another card">✓</div>`
          : '';
      html += `<div class="wl-tile" style="border:1px solid ${own?'#1e3a1e':'#222'};border-radius:4px;overflow:hidden;background:#0f0f0f">
        <div style="position:relative;cursor:pointer;background:#080808;aspect-ratio:1;overflow:hidden"
          data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">
          ${imgUrl
            ? `<img src="${imgUrl}" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;${own?'opacity:0.5':''}" onerror="this.style.opacity=0.04">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-size:22px">?</div>`}
          ${badge}
        </div>
        <div style="padding:4px 5px 5px;background:#141414">
          <div data-card="${safe}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)"
            style="font-size:10px;color:${own?'#555':'#ccc'};${own?'text-decoration:line-through;':''}cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px">${name}</div>
          <div style="display:flex;align-items:center;gap:3px">
            <div class="wl-tile-note${hasNote?'':' empty'}" data-card="${safe}"
              onclick="openNotePopover(this,this.dataset.card)"
              title="${hasNote?'Click to add/edit note':'Click to add a note'}">${hasNote?noteChips:'note…'}</div>
            <span class="wl-tile-remove" data-card="${safe}" onclick="removeFromWishlist(this.dataset.card)"
              style="color:#2a2a2a;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0" title="Remove">×</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Clue step sections ──────────────────────────────────────────────────────
  let clueStepHtml = '';
  if (wishlistedClueSteps.length) {
    clueStepHtml += `<div class="section"><div class="section-header">Clue Steps</div>`;
    const _WL_TIER_COLORS = {
      Beginner:'#c8a830', Easy:'#50c050', Medium:'#c8c030',
      Hard:'#4080c0', Elite:'#9050d0', Master:'#d03030',
    };
    const _WL_TYPE_LABELS = {
      emote:'Emote', sherlock:'Sherlock', falo:'Falo',
      cryptic:'Cryptic', anagram:'Anagram', cipher:'Cipher',
    };
    for (const step of wishlistedClueSteps) {
      const allItems  = step.items || [];
      // Determine nav type per item: monster card → 'monster', else 'item'
      const anyReady  = allItems.some(i => isOwned(i));
      const allReady  = allItems.length > 0 && allItems.every(i => isOwned(i));
      const borderCol = allReady ? '#76c442' : anyReady ? '#c8a830' : (allItems.length ? '#c84a00' : '#333');
      const tierCol   = _WL_TIER_COLORS[step.tier] || '#666';
      const typeStr   = _WL_TYPE_LABELS[step.type] || step.type;
      const tierBadge = `<span style="font-size:9px;color:${tierCol};border:1px solid ${tierCol}55;background:${tierCol}18;border-radius:2px;padding:1px 5px;white-space:nowrap;flex-shrink:0">${step.tier} clue · ${typeStr}</span>`;
      const textSafe = step.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      const displayText = step.type === 'falo' ? `"${escHtml(step.text)}"` : escHtml(step.text);
      const textStyle = step.type === 'falo' ? 'font-style:italic;color:#888' : 'color:#bbb';
      clueStepHtml += `<div style="margin:6px 0;background:#161616;border:1px solid #2a2a2a;border-radius:4px;padding:8px 10px;border-left:3px solid ${borderCol}">
        <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:${allItems.length?'6px':'0'}">
          <span style="font-size:11px;flex:1;${textStyle}">${displayText}</span>
          ${tierBadge}
          <button data-step-text="${textSafe}" onclick="removeClueStep(this.dataset.stepText)"
            style="background:none;border:none;color:#333;cursor:pointer;font-size:14px;line-height:1;flex-shrink:0" title="Remove">×</button>
        </div>`;
      if (allItems.length) {
        clueStepHtml += `<div style="display:flex;flex-wrap:wrap;gap:4px">`;
        for (const it of allItems) {
          const navType = monsterDrops[it] ? 'monster' : 'item';
          clueStepHtml += _clueCardChipHtml(it, navType);
        }
        clueStepHtml += `</div>`;
      }
      clueStepHtml += `</div>`;
    }
    clueStepHtml += `</div>`;
  }

  html += questHtml;
  html += clueStepHtml;
  container.innerHTML = html;
}

// Keep for backwards compat (called from navigate/switchCollection)
function renderWishlistList() { renderWishlist(); }

function showWishlistCard(name, type, push = false) {
  showCard(name, type);
}

// ─── Pack tab ──────────────────────────────────────────────────────────────

const PACK_TIER_ORDER = ['Common','Uncommon','Rare','Epic','Legendary','Mythic','Godly'];

function _getPackCards(pack) {
  // All allCards entries that belong to this pack and have a tier (excludes virtual clue scroll cards)
  return allCards.filter(c => {
    if (!(cardDetails[c.name] || {}).tier) return false;
    return _cardInPack(c.name, pack);
  });
}

function renderPackList() {
  const pane = document.getElementById('pack-list-pane');
  if (!pane || !packCatalog) return;
  const singles = packCatalog.packs.filter(p => !p.id.endsWith('_large'));
  let html = `<div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Packs</div>`;
  for (const pack of singles) {
    const cards = _getPackCards(pack);
    const total = cards.length;
    const ownedCount = cards.filter(c => isOwned(c.name)).length;
    const pct = total ? Math.round(ownedCount / total * 100) : 0;
    const isSel = selectedPack === pack.id;
    const barColor  = pct === 100 ? '#00c853' : pct >= 75 ? '#76c442' : pct >= 40 ? '#e8c97a' : '#c87030';
    const pctColor  = pct === 100 ? '#00c853' : pct >= 75 ? '#76c442' : pct >= 40 ? '#e8c97a' : '#888';
    const nameColor = isSel ? '#e8c97a' : pct === 100 ? '#76c442' : '#ccc';
    html += `<div class="pack-list-item${isSel ? ' selected' : ''}" data-pack="${pack.id}" onclick="showPackDetail(this.dataset.pack)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px;color:${nameColor};font-weight:${isSel ? 600 : 400}">${pack.name}</span>
        <span style="font-size:10px;color:#555">${pack.price.toLocaleString()} cr</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:3px">
        <span style="font-size:10px;color:#888">${ownedCount.toLocaleString()} / ${total.toLocaleString()}</span>
        <span style="font-size:10px;color:${pctColor}">${pct}%</span>
      </div>
      <div class="pack-mini-bar"><div class="pack-mini-fill" style="width:${pct}%;background:${barColor}"></div></div>
    </div>`;
  }
  pane.innerHTML = html;
}

function showPackDetail(packId, filter, push = true) {
  if (push) pushHistoryEntry();
  selectedPack = packId;
  renderPackList();

  const pane = document.getElementById('pack-detail-pane');
  if (!pane || !packCatalog) return;

  const pack = packCatalog.packs.find(p => p.id === packId);
  if (!pack) return;

  // Preserve filter selection across re-renders
  const currentFilter = filter
    || document.getElementById('pack-filter-sel')?.value
    || 'all';

  const allPackCards = _getPackCards(pack);
  const total      = allPackCards.length;
  const ownedCount = allPackCards.filter(c => isOwned(c.name)).length;
  const missing    = total - ownedCount;
  const pct        = total ? Math.round(ownedCount / total * 100) : 0;

  // Group by tier
  const byTier = {};
  for (const c of allPackCards) {
    const tier = (cardDetails[c.name] || {}).tier || 'Unknown';
    (byTier[tier] = byTier[tier] || []).push(c);
  }

  // Use local proxy so the image is served from localhost (avoids CDN blocking)
  const packImgUrl = pack.thumbnail ? pack.thumbnail : '';
  const packImgHtml = packImgUrl
    ? `<img src="${packImgUrl}" style="float:right;width:48px;height:48px;border-radius:3px;margin:0 0 12px 16px;box-shadow:0 2px 6px #000" onerror="this.style.display='none'">`
    : '';

  let html = `<h1>${pack.name}${packImgHtml}</h1>
    <div class="subtitle" style="margin-bottom:12px">
      ${pack.price.toLocaleString()} credits · 5 cards per pack
      · <span style="color:#e8c97a">${ownedCount.toLocaleString()} / ${total.toLocaleString()} owned (${pct}%)</span>
      · <span style="color:#c84a00">${missing.toLocaleString()} missing</span>
    </div>
    <div style="margin-bottom:16px">
      <select id="pack-filter-sel" onchange="showPackDetail('${packId}', this.value, false)"
        style="background:#222;border:1px solid #444;color:#ccc;padding:4px 8px;border-radius:3px;font-size:11px">
        <option value="all"    ${currentFilter==='all'    ?' selected':''}>All cards</option>
        <option value="missing"${currentFilter==='missing'?' selected':''}>Missing only</option>
        <option value="owned"  ${currentFilter==='owned'  ?' selected':''}>Owned only</option>
      </select>
    </div>`;

  // Stats bar by tier
  html += `<div class="stats-bar" style="flex-wrap:wrap;gap:6px;margin-bottom:16px">`;
  for (const tier of PACK_TIER_ORDER) {
    const t = byTier[tier];
    if (!t) continue;
    const to = t.filter(c => isOwned(c.name)).length;
    html += `<div class="stat-block">
      <div class="stat-label"><span class="tier-badge tier-${tier}" style="font-size:9px">${tier}</span></div>
      <div class="stat-value${to===t.length?' complete':''}" style="font-size:12px">${to}<span class="den"> / ${t.length}</span></div>
    </div>`;
  }
  html += `</div>`;

  // Card chips by tier
  const wishlisted = _wishlistedCardSet();

  for (const tier of PACK_TIER_ORDER) {
    const t = byTier[tier];
    if (!t) continue;
    let tierCards = [...t].sort((a, b) => a.name.localeCompare(b.name));
    if (currentFilter === 'missing') tierCards = tierCards.filter(c => !isOwned(c.name));
    if (currentFilter === 'owned')   tierCards = tierCards.filter(c =>  isOwned(c.name));
    if (tierCards.length === 0) continue;

    const to = t.filter(c => isOwned(c.name)).length;
    const tw = t.filter(c => !isOwned(c.name) && wishlisted.has(c.name)).length;
    html += `<div class="section">
      <div class="section-header">
        <span class="tier-badge tier-${tier}">${tier}</span>
        <span style="font-size:10px;font-weight:400;color:#555;margin-left:8px">${to} / ${t.length} owned</span>
        ${tw ? `<span style="font-size:10px;font-weight:400;color:#a08030;margin-left:6px">· ${tw} wishlisted</span>` : ''}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:8px 0">`;

    for (const c of tierCards) {
      const own  = isOwned(c.name);
      const wled = !own && wishlisted.has(c.name);
      const safeName = c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      const chipClass = own ? 'owned' : wled ? 'wishlisted' : 'missing';
      const prefix    = own ? '✓ ' : wled ? '★ ' : '';
      html += `<span class="pack-chip ${chipClass}"
        data-card="${safeName}" data-type="${c.type}"
        onclick="showCard(this.dataset.card,this.dataset.type)">${prefix}${c.name}</span>`;
    }

    html += `</div></div>`;
  }

  pane.innerHTML = html;
}

function tierBadgeHtml(name) {
  const tier = (cardDetails[name] || {}).tier;
  if (!tier) return '';
  return `<span class="tier-badge tier-${tier}">${tier}</span>`;
}

function renderMonster(name, container) {
  const data      = monsterDrops[name] || {};
  const allDropsRaw = data.drops || [];
  const allDrops  = dedupeDrops(allDropsRaw);
  const mainDrops = allDrops.filter(d => !d.fromRdt);
  const rdtDrops  = allDrops.filter(d => d.fromRdt);

  const mainOwned = mainDrops.filter(d => isOwned(d.card)).length;
  const rdtOwned  = rdtDrops.filter(d => isOwned(d.card)).length;

  const reqs = [];
  if (data.slayerLevel)  reqs.push({label: `Slayer ${data.slayerLevel}`,  locked: getLevel('Slayer')  < data.slayerLevel});
  if (data.sailingLevel) reqs.push({label: `Sailing ${data.sailingLevel}`, locked: getLevel('Sailing') < data.sailingLevel});
  if (data.quests?.length) reqs.push({label: `Quest locked`, locked: true});
  if (name.startsWith('Revenant')) reqs.push({label: 'Coins (entrance fee)', locked: !isOwned('Coins')});

  const mDetail  = cardDetails[name] || {};
  const mImgHtml = mDetail.imageUrl
    ? `<img src="${mDetail.imageUrl}" style="float:right;max-width:64px;max-height:64px;image-rendering:pixelated;margin-left:8px" onerror="this.style.display='none'">`
    : '';
  const mExamHtml = mDetail.examine
    ? `<div style="font-size:11px;color:#888;font-style:italic;margin-top:3px">${mDetail.examine}</div>`
    : '';

  const monsterOwned = isOwned(name);
  const monsterLastTs  = cardTimestamps[name];
  const monsterFirstTs = cardFirstTimestamps[name];
  const _fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const monsterPulledHtml = monsterLastTs
    ? (monsterFirstTs && monsterFirstTs !== monsterLastTs
        ? ` · <span style="color:#555;font-size:10px">First pulled ${_fmtDate(monsterFirstTs)} · Last pulled ${_fmtDate(monsterLastTs)}</span>`
        : ` · <span style="color:#555;font-size:10px">Pulled ${_fmtDate(monsterLastTs)}</span>`)
    : '';
  const monsterWishSafe = name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const monsterWishHtml = `<span class="wish-star${wishlist.has(name)?' active':''}" data-card="${monsterWishSafe}" onclick="toggleWishlist(this.dataset.card)" title="${wishlist.has(name)?'Remove from wishlist':'Add to wishlist'}" style="margin-left:8px">${wishlist.has(name)?'★':'☆'}</span>`;
  let html = `<h1>${name}${mImgHtml}${wikiLink(name)}</h1>
    <div class="subtitle">
      ${data.combatLevel ? 'Monster card' : 'NPC card'}${tierBadgeHtml(name)}
      ${data.combatLevel ? ` · Combat ${data.combatLevel}` : ''}
      · <span style="color:${monsterOwned?'#00c853':'#7a5020'}">${monsterOwned?'✓ Owned':'✗ Not owned'}</span>
      <span style="color:#555;font-size:10px;margin-left:8px;cursor:pointer" data-nav="${escHtml(name)}" onclick="toggleOwned(this.dataset.nav)">(toggle)</span>${monsterWishHtml}${monsterPulledHtml}
      ${reqs.map(r => `<span style="margin-left:8px;padding:2px 7px;border-radius:10px;font-size:10px;
        background:${r.locked?'#3a1a00':'#003d1f'};color:${r.locked?'#c84a00':'#00c853'}">${r.label}</span>`).join('')}
      ${mExamHtml}
    </div>`;

  // Stats blocks
  html += `<div class="stats-bar">
    <div class="stat-block">
      <div class="stat-label">Main Drops</div>
      <div class="stat-value${mainOwned===mainDrops.length&&mainDrops.length>0?' complete':''}">${mainOwned}<span class="den"> / ${mainDrops.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Rare Drop Table</div>
      <div class="stat-value" style="color:${rdtOwned===rdtDrops.length&&rdtDrops.length>0?'#00c853':'#4a6aaa'}">${rdtOwned}<span class="den"> / ${rdtDrops.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">All TCG Drops</div>
      <div class="stat-value${(mainOwned+rdtOwned)===allDrops.length&&allDrops.length>0?' complete':''}">${mainOwned+rdtOwned}<span class="den"> / ${allDrops.length}</span></div>
    </div>
  </div>`;

  html += packAcquisitionHtml(name);

  // Main drops
  html += `<div class="section">
    <div class="section-header">
      TCG Card Drops
      ${progressPill(mainOwned, mainDrops.length, false)}
    </div>`;
  if (mainDrops.length === 0) {
    html += `<div class="empty-note">No main-table TCG drops found.</div>`;
  } else {
    // Owned first, then locked
    const sorted = [...mainDrops].sort((a,b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return 0;
    });
    for (const d of sorted)
      html += dropRowHtml(d.card, d.rarity, d.fraction, false, selected);
  }
  html += `</div>`;

  // RDT drops
  if (rdtDrops.length > 0) {
    html += `<div class="section">
      <div class="section-header">
        Rare Drop Table
        <span class="rdt-header-note">shared · ${progressPill(rdtOwned, rdtDrops.length, true)}</span>
      </div>
      <div class="rdt-banner">These drops come from the shared Rare &amp; Gem Drop Table, which many monsters access. Owning these doesn't require farming this specific monster.</div>`;
    const sorted = [...rdtDrops].sort((a,b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return 0;
    });
    for (const d of sorted)
      html += dropRowHtml(d.card, d.rarity, d.fraction, true, selected);
    html += `</div>`;
  }

  // ── Area access requirements ──────────────────────────────────────────────
  const areaKey = CARD_AREAS[name];
  if (areaKey && AREA_GATES[areaKey]) {
    const gate = AREA_GATES[areaKey];
    const completable = computeCompletableQuests();
    html += `<div class="section">
      <div class="section-header">Location: ${gate.label} <span style="font-size:10px;color:#555;font-weight:normal">${gate.note}</span></div>
      <div style="margin-top:8px">`;
    if (gate.questRequired) {
      const qDone = completedQuests.has(gate.questRequired);
      const qOk   = qDone || completable.has(gate.questRequired);
      const sym   = qDone ? '✓' : qOk ? '~' : '✗';
      const cls   = qDone ? 'ok' : qOk ? 'close' : 'fail';
      const note  = qDone ? 'complete' : qOk ? 'completable' : 'locked';
      const safeQ = gate.questRequired.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-quest="${safeQ}" onclick="_navToQuest(this)">Quest: ${gate.questRequired}</span>
        <span class="req-note">${note}</span>
      </div>`;
    }
    if (gate.npcRequired) {
      const nOk = isOwned(gate.npcRequired);
      const sym  = nOk ? '✓' : '✗';
      const cls  = nOk ? 'ok' : 'fail';
      const safeN = gate.npcRequired.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-nav="${safeN}" data-nav-type="monster" onclick="_navToCard(this)">NPC card: ${gate.npcRequired}</span>
        <span class="req-note">${nOk ? 'card owned' : 'need card'}</span>
      </div>`;
    }
    for (const item of (gate.itemsRequired || [])) {
      const iOk = isOwned(item);
      const sym  = iOk ? '✓' : '✗';
      const cls  = iOk ? 'ok' : 'fail';
      const safeI = item.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-nav="${safeI}" data-nav-type="item" onclick="_navToCard(this)">Item: ${item}</span>
        <span class="req-note">${iOk ? 'owned' : 'need card'}</span>
      </div>`;
    }
    const extras = CARD_AREA_EXTRAS[name] || [];
    for (const item of extras) {
      const iOk = isOwned(item);
      const sym  = iOk ? '✓' : '✗';
      const cls  = iOk ? 'ok' : 'fail';
      const safeI = item.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-nav="${safeI}" data-nav-type="item" onclick="_navToCard(this)">${item}</span>
        <span class="req-note">${iOk ? 'owned' : 'need card'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Slayer tasks (if this NPC is a Slayer master) ─────────────────────────
  const slayerKey = SLAYER_MASTER_MAP[name];
  if (slayerKey && SLAYER_TASKS[slayerKey]) {
    const master = SLAYER_TASKS[slayerKey];
    const tasks = master.tasks;
    const totalWeight = tasks.reduce((s,t) => s + t.weight, 0);
    const sorted2 = [...tasks].sort((a,b) => {
      const ao = a.cards.some(_slayerCardFeasible), bo = b.cards.some(_slayerCardFeasible);
      if (ao !== bo) return ao ? -1 : 1;
      return b.weight - a.weight;
    });
    const availCount = tasks.filter(t => t.cards.some(_slayerCardFeasible)).length;
    const alias = (name !== slayerKey) ? ` <span style="font-size:10px;color:#555;font-weight:normal">(same list as ${slayerKey})</span>` : '';

    html += `<div class="section">
      <div class="section-header">Slayer Tasks${alias} <span style="font-size:10px;color:#555;font-weight:normal">${availCount}/${tasks.length} available</span></div>
      <div style="margin-top:8px">`;
    for (const t of sorted2) {
      const owned = t.cards.some(_slayerCardFeasible);
      const wishlisted = wishlistGroups.some(g => g.name === t.task);
      const pct = ((t.weight / totalWeight) * 100).toFixed(1);
      const ownedCard = t.cards.find(_slayerCardFeasible) || t.cards.find(c => isOwned(c)) || t.cards[0];
      const navCard = escHtml(t.cards[0]);
      const starStyle = wishlisted
        ? 'color:#c8a020;background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;flex-shrink:0;line-height:1;margin-left:auto'
        : 'color:#555;background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;flex-shrink:0;line-height:1;margin-left:auto';
      html += `<div class="method-row">
        <div class="method-indicator ${owned ? 'available' : 'locked'}"></div>
        <span class="method-name ${owned ? 'available' : 'locked'}" style="cursor:pointer"
          data-nav="${navCard}" data-nav-type="monster" onclick="_navToCard(this)">${escHtml(t.task)}</span>
        <span class="method-level" style="min-width:46px;text-align:right">${pct}%</span>
        <span class="method-note">${owned ? escHtml(ownedCard) : 'no card'}</span>
        <button style="${starStyle}" onclick="toggleSlayerWishlistGroup(${escHtml(JSON.stringify(t.task))})" title="${wishlisted?'Remove from wishlist':'Add to wishlist'}">${wishlisted?'★':'☆'}</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;padding:2px 0 5px 20px">`;
      for (const card of t.cards) {
        const cardOwned = isOwned(card);
        const _gate = _slayerGate(card);
        let _gateMet = true, _gateDesc = '';
        if (_gate) {
          const _qFail = (_gate.quests || []).filter(q => !completedQuests.has(q));
          const _sFail = Object.entries(_gate.skills || {}).filter(([s,l]) => getLevel(s) < l);
          if (_qFail.length || _sFail.length) {
            _gateMet = false;
            _gateDesc = [
              ..._qFail.map(q => 'Quest: '+q),
              ..._sFail.map(([s,l]) => s+' '+l+' req'),
            ].join('; ');
          }
        }
        const _blocked = cardOwned && !_gateMet;
        const col = !cardOwned ? '#555' : _blocked ? '#c89020' : '#76c442';
        const bg  = !cardOwned ? '#111' : _blocked ? '#1a1400' : '#0d2210';
        const bdr = !cardOwned ? '#222' : _blocked ? '#5a4010' : '#2a5a2a';
        const pfx = !cardOwned ? '' : _blocked ? '\u26a0 ' : '\u2713 ';
        const imgUrl = (cardDetails[card] || {}).imageUrl || '';
        const img = imgUrl ? `<img src="${imgUrl}" style="width:12px;height:12px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;opacity:${cardOwned?1:0.35}" onerror="this.style.display='none'">` : '';
        const _tip = cardOwned ? (_blocked ? 'Owned — '+_gateDesc : 'Owned') : (_gateDesc ? 'Not owned — '+_gateDesc : 'Not owned');
        html += `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:${col};background:${bg};border:1px solid ${bdr};border-radius:3px;padding:1px 4px;cursor:pointer"
          title="${escHtml(_tip)}" data-nav="${escHtml(card)}" data-nav-type="monster" onclick="_navToCard(this)">${img}${pfx}${escHtml(card)}</span>`;
      }
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  // ── Assigned by slayer masters ────────────────────────────────────────────
  {
    const slayerAssignedBy = [];
    for (const [masterKey, master] of Object.entries(SLAYER_TASKS)) {
      const totalWeight = master.tasks.reduce((s,t) => s + t.weight, 0);
      const matchingTasks = master.tasks.filter(t => t.cards.includes(name));
      if (matchingTasks.length === 0) continue;
      const combinedWeight = matchingTasks.reduce((s,t) => s + t.weight, 0);
      const pct = ((combinedWeight / totalWeight) * 100).toFixed(1);
      const taskLabel = [...new Set(matchingTasks.map(t => t.task))].join(' / ');
      const _mCards = Object.entries(SLAYER_MASTER_MAP).filter(([,k]) => k === masterKey).map(([c]) => c);
      const masterOwned = _mCards.length === 0 || _mCards.some(c => isOwned(c));
      const masterCardName = _mCards.find(c => isOwned(c)) || _mCards[0] || masterKey;
      const slayerOk = getLevel('Slayer') >= (master.slayerReq || 1);
      slayerAssignedBy.push({masterKey, masterCardName, masterOwned, slayerOk, taskLabel, pct, slayerReq: master.slayerReq});
    }
    if (slayerAssignedBy.length > 0) {
      // Sort: unlocked masters first, then by pct desc
      slayerAssignedBy.sort((a,b) => {
        const aOk = a.slayerOk && a.masterOwned, bOk = b.slayerOk && b.masterOwned;
        if (aOk !== bOk) return aOk ? -1 : 1;
        return parseFloat(b.pct) - parseFloat(a.pct);
      });
      html += `<div class="section">
        <div class="section-header">Assigned by Slayer masters</div>
        <div style="margin-top:8px">`;
      for (const m of slayerAssignedBy) {
        const safeMasterName = m.masterCardName.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        const indCls2 = !m.slayerOk ? 'locked' : !m.masterOwned ? 'no-card' : 'available';
        const mImgUrl2 = (cardDetails[m.masterCardName] || {}).imageUrl || '';
        const mImgHtml2 = mImgUrl2
          ? `<img src="${mImgUrl2}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;margin-right:4px" onerror="this.style.display='none'">`
          : '<span style="width:16px;flex-shrink:0;margin-right:4px"></span>';
        const noteText2 = !m.slayerOk ? `Slayer ${m.slayerReq} req` : !m.masterOwned ? 'no master card' : m.taskLabel;
        html += `<div class="method-row">
          <div class="method-indicator ${indCls2}"></div>
          ${mImgHtml2}
          <span class="method-name ${indCls2}" style="cursor:pointer"
            data-nav="${safeMasterName}" data-nav-type="monster" onclick="_navToCard(this)">${m.masterKey}</span>
          <span class="method-level" style="min-width:46px;text-align:right">${m.pct}%</span>
          <span class="method-note">${noteText2}</span>
        </div>`;
      }
      html += `</div></div>`;
    }
  }

  // ── Required for quests ───────────────────────────────────────────────────
  html += requiredForQuestsHtml(name);

  // ── Clue step NPC usage ────────────────────────────────────────────────────
  html += clueStepNpcHtml(name);

  // ── Boss Encounters cross-link ────────────────────────────────────────────
  const _mBossEncs = (typeof BOSS_BY_CARD !== 'undefined') ? (BOSS_BY_CARD[name.toLowerCase()] || []) : [];
  if (_mBossEncs.length) {
    const BOSS_ROLE_LABEL = {monster:'Boss Room',kc:'Kill Count',item:'Required Item',tool:'Tool',optional:'Optional',related:'Related',warm:'Warm Clothing',light:'Light Source',dragonfire:'Dragonfire Protection'};
    html += `<h2 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:20px 0 8px;padding-top:16px;border-top:1px solid #222">Boss Encounters</h2>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px">`;
    for (const { bossName, role } of _mBossEncs) {
      html += `<span data-boss="${escHtml(bossName)}" onclick="showBoss(this.dataset.boss);event.stopPropagation()"
        style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#aaa;background:#161616;border:1px solid #2a2a2a;border-radius:3px;padding:3px 9px;cursor:pointer;white-space:nowrap"
        title="${BOSS_ROLE_LABEL[role]||role}">${escHtml(bossName)} <span style="font-size:9px;color:#555">${BOSS_ROLE_LABEL[role]||role}</span></span>`;
    }
    html += `</div>`;
  }

  // ── Diary Requirements cross-link ─────────────────────────────────────────
  const _mDiaryEncs = (typeof DIARY_BY_CARD !== 'undefined') ? (DIARY_BY_CARD[name.toLowerCase()] || []) : [];
  if (_mDiaryEncs.length) {
    const DTIER_COLOR_M = {easy:'#50c050',medium:'#c8c030',hard:'#4080c0',elite:'#9050d0'};
    html += `<h2 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:20px 0 8px;padding-top:16px;border-top:1px solid #222">Diary Requirements</h2>`;
    html += `<div style="display:flex;flex-direction:column;gap:4px">`;
    for (const { diaryName, tier, task: taskText } of _mDiaryEncs) {
      const tierLabel = tier.charAt(0).toUpperCase()+tier.slice(1);
      const tierCol   = DTIER_COLOR_M[tier] || '#555';
      html += `<div data-diary="${escHtml(diaryName)}" onclick="showDiary(this.dataset.diary);event.stopPropagation()"
        style="display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#aaa;background:#161616;border:1px solid #2a2a2a;border-radius:3px;padding:4px 8px;cursor:pointer">
        <span style="white-space:nowrap;flex-shrink:0">${escHtml(diaryName)} <span style="color:${tierCol}">${tierLabel}</span></span>
        ${taskText ? `<span style="color:#666;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(taskText)}">${escHtml(taskText)}</span>` : ''}
        </div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html;
}

// ─── Production card HTML ──────────────────────────────────────────────────
// Maps wiki facility strings → human-readable access notes.
// Altars are locations (not cards) — show what the player actually needs to carry.
// Access options for each altar. Strings that match itemSources keys will show
// ownership indicators; others (e.g. 'Abyss') are shown as plain grey text.
const FACILITY_NOTES = {
  'None': null,
  'Air Altar':    ['Air talisman', 'Air tiara', 'Abyss'],
  'Water Altar':  ['Water talisman', 'Water tiara', 'Abyss'],
  'Earth Altar':  ['Earth talisman', 'Earth tiara', 'Abyss'],
  'Fire Altar':   ['Fire talisman', 'Fire tiara', 'Abyss'],
  'Mind Altar':   ['Mind talisman', 'Mind tiara', 'Abyss'],
