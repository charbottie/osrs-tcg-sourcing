}

function checkQuestCards(name, q) {
  const bm = bmQuestCards[name];
  if (bm) {
    let missing = 0;
    // Schema 2: sections → requirements → {cards, type}
    for (const section of (bm.sections || [])) {
      for (const req of (section.requirements || [])) {
        if (!_reqCards(req).length) continue;
        if (req.optional) continue;  // avoidable — not counted as blocking
        if (!_reqMet(req)) missing++;
      }
    }
    return { cardsOk: missing === 0, missingCount: missing };
  }
  // Fallback to wiki infobox data
  const missingItems = (q.itemsRequired || []).filter(i => !isOwned(i));
  const missingKills = (q.killsRequired || []).filter(k => !isOwned(k));
  const missing = missingItems.length + missingKills.length;
  return { cardsOk: missing === 0, missingCount: missing };
}

function computeCompletableQuests() {
  /**
   * Iteratively propagate completability. A quest is completable if:
   *   - Manually marked done (always counts — player has finished it)
   *   - All prerequisites are completable/done (or not in our dataset)
   *   - All skill requirements are met (player level >= req)
   *   - All card groups satisfied (prefer BM data; fallback to wiki infobox)
   * Returns a Set of completable quest names (includes done quests).
   */
  const completable = new Set(completedQuests); // done quests seed the set
  let changed = true;
  while (changed) {
    changed = false;
    for (const [name, q] of Object.entries(questsData)) {
      if (completable.has(name)) continue;
      const prereqsOk = (q.prerequisites || []).every(p => completable.has(p) || !questsData[p]);
      const skillsOk  = (q.skillRequirements || []).every(r => getLevel(r.skill) >= r.level);
      const { cardsOk } = checkQuestCards(name, q);
      if (prereqsOk && skillsOk && cardsOk) {
        completable.add(name); changed = true;
      }
    }
  }
  return completable;
}

function questStatus(questName, completable) {
  if (completedQuests.has(questName)) return 'done';
  const q = questsData[questName];
  if (!q) return 'locked';
  if (completable.has(questName)) return 'ok';
  // "Close" = prereqs completable + skills ok, but missing ≤2 cards
  const prereqsOk = (q.prerequisites || []).every(p => completable.has(p) || !questsData[p]);
  const skillsOk  = (q.skillRequirements || []).every(r => getLevel(r.skill) >= r.level);
  if (!prereqsOk || !skillsOk) return 'locked';
  const { missingCount } = checkQuestCards(questName, q);
  if (missingCount <= 2) return 'close';
  return 'locked';
}

function isMiniquest(name) {
  // A quest is a miniquest if BM data flags it, or if it has 0 quest points and
  // isn't in the main BM quest list (best-effort for wiki-only entries).
  if (bmQuestCards[name]?._miniquest) return true;
  if (!bmQuestCards[name] && questsData[name]?.questPoints === 0) return true;
  return false;
}

function questItemHtml(name, data, completable) {
  const st = questStatus(name, completable);
  const badge = st === 'done' ? '☑' : (st === 'ok' ? '✓' : (st === 'close' ? '~' : '✗'));
  const doneCls = st === 'done' ? ' done-quest' : '';
  const sel = name === selectedQuest ? ' selected' : '';
  const qp = data.questPoints ? `<span class="quest-qp">${data.questPoints}qp</span>` : '';
  const mem = data.members ? `<span class="quest-members-tag">M</span>` : '';
  const mini = isMiniquest(name) ? `<span class="quest-miniquest-tag">mini</span>` : '';
  return `<div class="quest-item${sel}${doneCls}" data-quest="${escHtml(name)}" onclick="showQuestDetail(this.dataset.quest)">
    <span class="quest-badge ${st}">${badge}</span>
    <span class="quest-name">${name}</span>
    ${qp}${mem}${mini}
  </div>`;
}

function renderQuestStats(completable) {
  const el = document.getElementById('quest-stats');
  if (!el) return;

  let doneCount = 0, doneQP = 0;
  let availCount = 0, availQP = 0;
  let totalCount = 0, totalQP = 0;

  for (const [name, q] of Object.entries(questsData)) {
    const qp = q.questPoints || 0;
    totalCount++;
    totalQP += qp;
    if (completedQuests.has(name)) {
      doneCount++; doneQP += qp;
    } else if (completable.has(name)) {
      availCount++; availQP += qp;
    }
  }

  el.innerHTML = `
    <div class="qstat done-col">
      <div class="qstat-val">${doneCount}</div>
      <div class="qstat-sub">Completed</div>
      <div class="qstat-qp">${doneQP} QP</div>
    </div>
    <div class="qstat avail-col">
      <div class="qstat-val">${availCount}</div>
      <div class="qstat-sub">Available</div>
      <div class="qstat-qp">+${availQP} QP</div>
    </div>
    <div class="qstat">
      <div class="qstat-val">${totalCount}</div>
      <div class="qstat-sub">Total</div>
      <div class="qstat-qp">${totalQP} QP</div>
    </div>`;
}

function renderQuestList() {
  const scroll = document.getElementById('quest-list-scroll');
  if (!scroll) return;
  const search = (document.getElementById('quest-search')?.value || '').toLowerCase();
  const f      = document.getElementById('quest-filter')?.value || 'all';
  const completable = computeCompletableQuests();
  renderQuestStats(completable);

  const orderMap = {ok:0, close:1, locked:2, done:3};
  const sortFn = ([an], [bn]) => {
    const as = questStatus(an, completable), bs = questStatus(bn, completable);
    if (orderMap[as] !== orderMap[bs]) return orderMap[as] - orderMap[bs];
    return an.localeCompare(bn);
  };

  let mainQuests = [], miniquests = [];
  for (const [name, data] of Object.entries(questsData)) {
    if (search && !name.toLowerCase().includes(search)) continue;
    const st = questStatus(name, completable);
    if (f === 'ok'      && st !== 'ok')       continue;
    if (f === 'close'   && st !== 'close')    continue;
    if (f === 'done'    && st !== 'done')     continue;
    if (f === 'notdone' && st === 'done')     continue;
    if (f === 'free'    && data.members)      continue;
    if (f === 'members' && !data.members)     continue;
    if (isMiniquest(name)) miniquests.push([name, data]);
    else                   mainQuests.push([name, data]);
  }

  mainQuests.sort(sortFn);
  miniquests.sort(sortFn);

  const doneMain  = mainQuests.filter(([n]) => completedQuests.has(n)).length;
  const doneMini  = miniquests.filter(([n]) => completedQuests.has(n)).length;

  let html = '';
  if (mainQuests.length) {
    const doneStr = doneMain ? ` · ${doneMain} done` : '';
    html += `<div class="quest-section-header">Quests (${mainQuests.length}${doneStr})</div>`;
    for (const [name, data] of mainQuests) html += questItemHtml(name, data, completable);
  }
  if (miniquests.length) {
    const doneStr = doneMini ? ` · ${doneMini} done` : '';
    html += `<div class="quest-section-header" style="margin-top:4px">Miniquests (${miniquests.length}${doneStr}) — wiki data only</div>`;
    for (const [name, data] of miniquests) html += questItemHtml(name, data, completable);
  }
  if (!html) html = `<div style="padding:12px;color:#444;font-size:12px">No quests match this filter.</div>`;
  scroll.innerHTML = html;
}

function showQuestDetail(questName, push = true) {
  if (push) pushHistoryEntry();
  selectedQuest = questName;
  // Hide welcome panel, update list selection
  const welcome = document.getElementById('quest-welcome');
  if (welcome) welcome.style.display = 'none';
  document.querySelectorAll('.quest-item').forEach(el => {
    el.classList.toggle('selected', el.querySelector('.quest-name')?.textContent === questName);
  });

  const pane = document.getElementById('quest-detail-pane');
  if (!pane) return;
  const q = questsData[questName];
  if (!q) { pane.innerHTML = `<div class="placeholder">Quest data not found.</div>`; return; }

  const completable = computeCompletableQuests();
  const st = questStatus(questName, completable);
  const mini = isMiniquest(questName);

  const statusColor = st === 'ok' ? '#3a9a3a' : (st === 'close' ? '#c8a020' : '#9a3a3a');
  const statusLabel = st === 'ok' ? 'Completable' : (st === 'close' ? 'Almost ready' : 'Locked');

  // Subtitle
  const typeStr = mini
    ? (q.members ? 'Members miniquest' : 'Free miniquest')
    : (q.members ? 'Members quest' : 'Free quest');
  const qpStr   = q.questPoints ? ` · ${q.questPoints} quest point${q.questPoints!==1?'s':''}` : '';

  const isDone = completedQuests.has(questName);
  const doneBtn = `<button data-quest="${escHtml(questName)}" onclick="toggleQuestDone(this.dataset.quest)"
    style="float:right;margin-top:2px;padding:4px 10px;font-size:11px;cursor:pointer;border-radius:3px;border:1px solid;
      ${isDone
        ? 'background:#2a1e08;border-color:#7a5020;color:#b07a30'
        : 'background:#0e1e0e;border-color:#2a5a2a;color:#4a9a4a'}">
    ${isDone ? '✓ Completed — mark undone' : 'Mark as completed'}
  </button>`;

  // Two ways to wishlist: required cards only, or required + optional/recommended
  const _qnSafe = questName.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const _wishReq = _questWishCards(questName, false), _wishAll = _questWishCards(questName, true);
  const _miss = cards => cards.filter(c => !isOwned(c) && !wishlist.has(c)).length;
  const _wlState = !wishlistedQuests.has(questName) ? 0 : wishlistQuestRec.has(questName) ? 2 : 1;
  const _wishBtn = (rec, text, n, done) => `<button data-quest="${_qnSafe}" ${done ? 'disabled' : ''}
      onclick="wishlistQuest(this.dataset.quest, ${rec});showQuestDetail(this.dataset.quest, false)"
      style="margin-left:8px;background:none;border:1px solid ${done ? '#2a2a2a' : '#3a3a1a'};color:${done ? '#666' : '#9a9a3a'};padding:3px 9px;border-radius:3px;font-size:10px;cursor:${done ? 'default' : 'pointer'}">
      ${done ? '★' : '☆'} ${text}${!done && n ? ` (${n} missing)` : ''}</button>`;
  const wishQuestBtn = !_wishReq.length && !_wishAll.length ? '' :
    _wishBtn(false, _wlState ? 'Required cards wishlisted' : 'Wishlist required', _miss(_wishReq), _wlState >= 1)
    + (_wishAll.length > _wishReq.length
      ? _wishBtn(true, _wlState === 2 ? 'Recommended wishlisted' : 'Wishlist required + recommended', _miss(_wishAll), _wlState === 2) : '');

  let html = `<h1>${questName} ${wikiLink(questName)}
    <span style="font-size:12px;color:${isDone?'#b07a30':statusColor};font-weight:normal;margin-left:8px">${isDone?'Done':statusLabel}</span>
  </h1>
  <div class="subtitle">${typeStr}${qpStr} ${doneBtn}${wishQuestBtn}</div>
  ${_questProgressHtml(questName)}
  ${bmQuestCards[questName]?.note ? `<div style="color:#888;font-size:11px;line-height:1.5;margin:4px 0 8px;padding:6px 10px;border-left:2px solid #3a3010;background:#12100a">${escHtml(bmQuestCards[questName].note)}</div>` : ''}`;

  if (mini) {
    html += `<div style="background:#150e1a;border:1px solid #3a2850;border-radius:4px;padding:8px 12px;margin:10px 0;font-size:11px;color:#8a6aaa;line-height:1.6">
      ⚠ <strong style="color:#a080cc">Miniquest</strong> — requirements shown here come from the OSRS wiki infobox only.
      Mid-quest items and exact card names may be missing. Check the wiki for the full walkthrough.
    </div>`;
  }

  if (q.questNpc) {
    const _bmForNpc = bmQuestCards[questName];
    const _hasNpcSection = _bmForNpc?.sections?.some(s => s.label === 'NPC Interactions');
    if (!_hasNpcSection) {
      html += `<div class="section">
        <div class="section-header">Start NPC</div>
        <div style="margin-top:8px;font-size:13px;color:#aaa">${q.questNpc} <span style="color:#555;font-size:11px">(talk to — no card required)</span></div>
      </div>`;
    }
  }

  // Prerequisites
  if (q.prerequisites?.length) {
    html += `<div class="section"><div class="section-header">Quest prerequisites</div><div style="margin-top:8px">`;
    for (const prereq of q.prerequisites) {
      const st    = questStatus(prereq, completable);
      const pass  = st === 'done' || st === 'ok';
      const sym   = pass ? '✓' : st === 'close' ? '~' : '✗';
      const col   = pass ? '#c8c8c8' : st === 'close' ? '#c8a830' : '#9a5a5a';
      const iCls  = pass ? 'ok' : st === 'close' ? 'close' : 'fail';
      const note  = pass ? 'ready' : st === 'close' ? 'close' : (!questsData[prereq] ? 'unknown' : 'locked');
      html += `<div class="req-row">
        <span class="req-icon ${iCls}">${sym}</span>
        <span class="req-label" style="cursor:pointer;color:${col}"
          data-quest="${escHtml(prereq)}" onclick="showQuestDetail(this.dataset.quest)">
          ${prereq}</span>
        <span class="req-note">${note}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Skill requirements
  // Skills that can ONLY be trained by fighting monsters with a combat level.
  // Reaching these levels requires owning at least some monster cards.
  const MONSTER_TRAINED_SKILLS = new Set([
    'Attack', 'Strength', 'Defence', 'Hitpoints', 'Ranged', 'Slayer',
  ]);
  if (q.skillRequirements?.length) {
    html += `<div class="section"><div class="section-header">Skill requirements</div><div style="margin-top:8px">`;
    for (const r of q.skillRequirements) {
      const myLvl     = getLevel(r.skill);
      const ok        = myLvl >= r.level;
      const needsMobs = MONSTER_TRAINED_SKILLS.has(r.skill);
      const mobTag    = needsMobs
        ? ` <span style="font-size:10px;color:#666" title="This skill can only be trained by fighting monsters with a combat level">⚔ monsters</span>`
        : '';
      html += `<div class="req-row">
        <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
        <span class="req-label">${r.skill} ${r.level}${r.boostable?'':' <span style="font-size:10px;color:#666">(not boostable)</span>'}${mobTag}</span>
        <span class="req-note">you: ${myLvl}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // Card requirements — BM data (schema 2: sections → requirements → {label, cards, type})
  const bm = bmQuestCards[questName];
  if (bm) {
    const itemRows = [], monsterRows = [], npcRows = [], recRows = [], accessRows = [];

    for (const section of (bm.sections || [])) {
      for (const req of (section.requirements || [])) {
        if (!_reqCards(req).length && !req.info) continue;
        const bucket = req.type === 'npc' ? npcRows : req.type === 'enemy' ? monsterRows : itemRows;
        const row = _questReqRow(req);
        (req.optional ? recRows : req.access ? accessRows : bucket).push(row);
      }
    }

    const totalRows = itemRows.length + monsterRows.length + npcRows.length + recRows.length + accessRows.length;
    if (totalRows > 0) {
      if (accessRows.length > 0) {
        html += `<div class="section"><div class="section-header">Access <span style="font-size:10px;color:#555;font-weight:normal">(any one route)</span></div><div style="margin-top:8px">`;
        for (const r of _questRowOrder(accessRows)) html += r.html;
        html += `</div></div>`;
      }
      if (npcRows.length > 0) {
        html += `<div class="section"><div class="section-header">NPC interactions</div><div style="margin-top:8px">`;
        for (const r of _questRowOrder(npcRows)) html += r.html;
        html += `</div></div>`;
      }
      if (monsterRows.length > 0) {
        const optionalCount = monsterRows.filter(r => r.optional).length;
        const hdr = optionalCount
          ? `Enemies to defeat <span style="font-size:10px;color:#555;font-weight:normal">(${optionalCount} optional)</span>`
          : 'Enemies to defeat';
        html += `<div class="section"><div class="section-header">${hdr}</div><div style="margin-top:8px">`;
        for (const r of _questRowOrder(monsterRows)) html += r.html;
        html += `</div></div>`;
      }
      if (itemRows.length > 0) {
        html += `<div class="section"><div class="section-header">Items &amp; tools</div><div style="margin-top:8px">`;
        for (const r of _questRowOrder(itemRows)) html += r.html;
        html += `</div></div>`;
      }
      if (recRows.length > 0) {
        html += `<div class="section"><div class="section-header">Optional &amp; recommended <span style="font-size:10px;color:#555;font-weight:normal">(never blocks)</span></div><div style="margin-top:8px">`;
        for (const r of [...recRows.filter(r => r.ok), ...recRows.filter(r => !r.ok)]) html += r.html;
        html += `</div></div>`;
      }
    } else {
      html += `<div style="color:#555;font-size:12px;margin-top:4px">No card requirements tracked. Check the wiki for full details.</div>`;
    }
    // NPCs and items checked against the wiki that have no TCG card — no restriction
    html += _checkedListsHtml(bm.consideredNoCard || []);
  } else {
    // Fallback: wiki infobox data (may include non-card items)
    if (q.itemsRequired?.length) {
      html += `<div class="section"><div class="section-header">Items Required <span style="font-size:10px;color:#555;font-weight:normal">(wiki infobox)</span></div><div style="margin-top:8px">`;
      for (const item of q.itemsRequired) {
        const ok = isOwned(item);
        const isCard = !!itemSources[item];
        html += `<div class="req-row">
          <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
          <span class="req-label" ${isCard?`style="cursor:pointer" data-nav="${escHtml(item)}" data-nav-type="item" onclick="_navToCard(this)"`:''}>${item}</span>
          <span class="req-note">${ok ? 'owned' : (isCard ? 'need card' : 'no TCG card')}</span>
          ${isCard ? _rowWishStar(item, ok) : ''}
        </div>`;
      }
      html += `</div></div>`;
    }
    if (q.killsRequired?.length) {
      html += `<div class="section"><div class="section-header">Enemies to Defeat</div><div style="margin-top:8px">`;
      for (const kill of q.killsRequired) {
        const ok = isOwned(kill);
        const isCard = !!monsterDrops[kill];
        html += `<div class="req-row">
          <span class="req-icon ${ok?'ok':'fail'}">${ok?'✓':'✗'}</span>
          <span class="req-label" ${isCard?`style="cursor:pointer" data-nav="${escHtml(kill)}" data-nav-type="monster" onclick="_navToCard(this)"`:''}>${kill}</span>
          <span class="req-note">${ok ? 'card owned' : (isCard ? 'need monster card' : 'no TCG card')}</span>
          ${isCard ? _rowWishStar(kill, ok) : ''}
        </div>`;
      }
      html += `</div></div>`;
    }
  }

  // Reward items note
  if (q.rewardItems?.length) {
    html += `<div class="section"><div class="section-header">Reward Items</div>
      <div style="margin-top:8px;font-size:12px;color:#888">
        ${q.rewardItems.map(r => `<span style="margin-right:8px">${r}</span>`).join('')}
      </div>
      <div style="font-size:10px;color:#555;margin-top:6px">Quest rewards are given directly — no card required to receive. You can drop/bank items you haven't unlocked.</div>
    </div>`;
  }

  if (!q.prerequisites?.length && !q.skillRequirements?.length && !bm && !q.itemsRequired?.length && !q.killsRequired?.length) {
    html += `<div style="color:#555;font-size:12px;margin-top:12px">No tracked requirements. Check the wiki for full details.</div>`;
  }

  pane.innerHTML = html;
}

// ─── Rules tab ─────────────────────────────────────────────────────────────
function renderRulesTab() {
  return `<div id="rules-panel">
    <h2>Bronzeman TCG — Rules Reference</h2>
    <p>This tool helps you figure out what you can do based on your OSRS TCG card collection.
    The Bronzeman TCG mod enforces the following restrictions:</p>

    <h3>Core Rules</h3>
    <table>
      <tr><th>Action</th><th>Card Required?</th></tr>
      <tr><td>Talk to / interact with an NPC (if they have a TCG card)</td><td>Yes — need the NPC card, for <em>any</em> interaction (talking, trading, quests, slayer masters, diary rewards) — including NPCs who speak in a quest cutscene</td></tr>
      <tr><td>Talk to / interact with an NPC (no TCG card exists)</td><td>No — always accessible</td></tr>
      <tr><td>Fight or kill an NPC</td><td>Yes — need the monster card</td></tr>
      <tr><td>Pickpocket an NPC</td><td>Yes — need the monster card</td></tr>
      <tr><td>Gather a resource (mine, chop, fish, farm, hunt)</td><td>No — gated by level + tool only</td></tr>
      <tr><td>Thieve from a stall</td><td>No — gated by level only; individual stolen items still require their card to use</td></tr>
      <tr><td>Buy from a shop</td><td>Yes — spending coins or any currency counts as using it; need the currency card</td></tr>
      <tr><td>Use, eat, equip, or operate an item</td><td>Yes — need the item card</td></tr>
      <tr><td>Use an item as a crafting ingredient</td><td>Yes — need the item card</td></tr>
      <tr><td>Produce an output item</td><td>No — you can produce even without the output card</td></tr>
      <tr><td>Pick up loot or items from the ground</td><td>No — you can always pick things up and bank them</td></tr>
      <tr><td>Receive an item as a quest reward</td><td>No — given directly, no card needed</td></tr>
      <tr><td>Hand over or use an item during a quest</td><td>Yes — need the item card, even if you were handed it during the quest</td></tr>
      <tr><td>Sell a card</td><td>You lose access — selling a card removes that unlock until you get it back</td></tr>
    </table>

    <h3>Gathering</h3>
    <p>You can mine, chop, fish, farm, hunt, and thieve from stalls based on your skill level and the tools you have — regardless of whether you own the card for the resource. Items you gather without owning the card can be banked but not used, equipped, or consumed.</p>
    <p><strong>Example:</strong> You own a Bronze axe but not the Logs card. You can still chop trees — but you can't light the logs, fletch them, or use them in any recipe.</p>

    <h3>Production</h3>
    <p>You need the card for every ingredient you actively use in a recipe. The output item doesn't need a card — you can produce it freely. But without the output card, you can only bank the result, not use it further.</p>
    <p><strong>Example:</strong> You own the Iron ore card. You can smelt Iron bars even without the Iron bar card. But you can't then smith those bars into equipment — that requires the Iron bar card.</p>

    <h3>NPC Interactions</h3>
    <p>If a TCG card exists for an NPC, you need that card to interact with them in any way — including talking to them to start or progress a quest, using a Slayer master, or claiming Achievement Diary rewards. NPCs with no TCG card are always accessible. (The Bronzeman plugin enforces most of this; the rule applies even where it doesn't — e.g. NPCs of quests you've already started.) NPCs who speak during a cutscene count too: the planner lists them as quest requirements.</p>

    <h3>Item versions</h3>
    <p>One card covers every version of an item listed for it in the TCG catalog: all potion doses, noted items, poisoned weapons, charged/uncharged and damaged versions — and some raw forms, e.g. the <em>Ranarr weed</em> card covers Grimy ranarr weed and the <em>Diamond</em> card covers Uncut diamond. The planner matches drops, loot and requirements using these lists.</p>

    <h3>Achievement Diaries</h3>
    <p>Each task needs the cards for the items you use, the monsters you kill and the NPCs you interact with. Claiming the rewards needs the reward NPC's card, and using a reward (e.g. the antique lamp, or equipping the diary item) needs that item's card.</p>

    <h3>Ironman</h3>
    <p>This account is an Ironman, and those rules apply on top of the card rules: no trading and no Grand Exchange, no loot from monsters other players damaged, diary kill tasks can't be assisted, and shops sell only their base stock. Where the wiki gives an ironman-specific requirement (e.g. Hunter 69 for the spottier cape furs) the planner uses it.</p>

    <h3>Combat</h3>
    <p>You need the monster card to attack any NPC with a combat level.</p>

    <h3>Shops</h3>
    <p>Spending coins or any other currency counts as <em>using</em> it, so you need the currency's card before you can buy from shops. Coins is a TCG card — until you unlock it, you can earn and bank gold but not spend it. The same applies to special currencies like Tokkul or marks of grace.</p>

    <h3>Quests</h3>
    <p>To start or complete a quest you need:</p>
    <ul>
      <li>All prerequisite quests completed</li>
      <li>Skill levels meeting all requirements</li>
      <li>NPC card for the quest's start NPC (if a TCG card exists for them)</li>
      <li>Monster cards for any required kills</li>
      <li>Cards for any items you must use or hand over during the quest — even if the game hands you that item mid-quest</li>
      <li>Cards for every NPC you talk to, including NPCs who speak in a cutscene</li>
      <li>As an Ironman, cards for the full production chain of anything you have to make yourself (e.g. ogre arrows: logs, knife, feathers, wolf bones, chisel)</li>
    </ul>
    <p>How the Questing tab reads a requirement:</p>
    <ul>
      <li><strong>Any of</strong>: one owned card from the list is enough (e.g. any pickaxe, Turael or Aya). "Need all" means every card listed</li>
      <li><strong>Routes</strong>: different ways to do the same step, one per line. A route counts when you own every card on it. A chip marked +N also accepts any of N alternatives; hover it to see them</li>
      <li><strong>Spells</strong>: a spell route needs its full rune cost (from the wiki spellbooks) and the Magic level. An elemental rune can also come from an elemental staff, battlestaff, mystic staff or combination rune</li>
      <li><strong>Desert access</strong> is one shared set of routes, used by every desert quest: the Shantay Pass (Shantay + Coins + Shantay pass), a fairy ring (Dramen or Lunar staff), Pharaoh's sceptre, Desert amulet 2+ or Necklace of passage. Routes with no card to check (Desert elite diary, the Lumbridge Swamp shortcut) are listed but not tracked</li>
      <li><strong>Optional &amp; recommended</strong> requirements have their own section. They never block a quest, but show ✓ / ✗ like required ones, with an "optional" tag. Things that were checked and have a card but aren't needed (e.g. an avoidable enemy) are listed the same way under "Checked — not required"</li>
      <li><strong>Progress bars</strong> (quests and diaries): Required x/y counts prerequisite quests done, skill levels, and card requirements met. An "any of" group or a set of routes counts as one, met when you own any option, so long lists don't inflate the total. Quests also show Recommended and All; diaries show <em>eligible tasks</em> (tasks whose every requirement is met, or that you've ticked done) and <em>requirements met</em>, each for the selected tier and for all tiers, plus a small bar on each tier card</li>
      <li><strong>Wishlist</strong>: a quest can be wishlisted with its required cards only, or required + recommended. The Wishlist tab shows which mode each quest uses</li>
    </ul>

    <h3>Bosses</h3>
    <p>Boss requirements are generated from the OSRS Wiki Boss page plus a checked list of what each fight needs, and use the same rows as quests. A boss is <em>Locked</em> until its quests, skill levels and area access are met, and <em>Partial</em> while a required card is missing. Required cards are:</p>
    <ul>
      <li>Every boss that can appear in the encounter, including all of CoX's random rooms</li>
      <li>Every monster you can't avoid (kill count, adds you must kill). Avoidable ones are listed under "Checked — not required"</li>
      <li>NPCs you must talk to, plus entry items, keys and tools</li>
    </ul>
    <p>Things only needed to <em>collect the loot</em> (e.g. a fishing net for the Tempoross reward pool) are shown in the loot section with their own progress bar. Area access (Morytania, Kourend, the desert…) uses the same shared routes as quests.</p>

    <h3>Foils</h3>
    <p>Foil cards are cosmetically shiny but don't grant any extra unlocks. A foil Iron ore card unlocks exactly the same things as a regular Iron ore card.</p>

    <h3>No card exists</h3>
    <p>If no TCG card exists for an NPC or item, there is no restriction — you can interact with it freely. The v1.0 card set covers 1,391 NPCs and 3,809 items (5,200 cards); anything outside that set is unrestricted.</p>

    <h3>Tabs in this tool</h3>

function computeTotalStats() {
  const totals = {};
  for (const k of STAT_KEYS) totals[k] = 0;
  // If a 2H weapon is equipped, ignore the shield slot entirely
  const wpnName = getEquipped('weapon');
  const wpnItem = wpnName ? (equipBySlot['weapon'] || []).find(i => i.name === wpnName) : null;
  const has2h   = wpnItem && wpnItem.is2h;
  for (const slot of Object.keys(SLOT_FULL)) {
    if (slot === 'shield' && has2h) continue;
    const eq = getEquipped(slot);
    if (!eq) continue;
    const item = (equipBySlot[slot] || []).find(i => i.name === eq);
    if (!item || !item.stats) continue;
    for (const [k, v] of Object.entries(item.stats)) {
      if (totals[k] !== undefined) totals[k] += v;
    }
  }
  return totals;
}

function buildItemTooltip(item, eqItem) {
  const stats  = item.stats  || {};
  const eqStats = (eqItem && eqItem.name !== item.name && eqItem.stats) || {};
  const activeKeys = STAT_KEYS.filter(k => stats[k] || eqStats[k]);
  if (!activeKeys.length && !Object.keys(item.reqLvl || {}).length) {
    return '<div style="color:#444;font-style:italic;font-size:10px">No combat stats</div>';
  }
  const rows = activeKeys.map(k => {
    const v   = stats[k]   || 0;
    const ev  = eqStats[k] || 0;
    const d   = v - ev;
    const suf = k === 'magic_damage' ? '%' : '';
    const sign = v >= 0 ? '+' : '';
    let delta = '';
    if (eqItem && eqItem.name !== item.name && d !== 0) {
      delta = d > 0
        ? ` <span class="tt-delta pos">(+${d})</span>`
        : ` <span class="tt-delta neg">(${d})</span>`;
    }
    return `<div class="tt-row"><span>${STAT_SHORT[k]}</span><span>${sign}${v}${suf}${delta}</span></div>`;
  }).join('');
  const reqs = item.reqLvl || {};
  const reqStr = Object.entries(reqs).filter(([,v])=>v>0)
    .map(([k,v])=>`${k[0].toUpperCase()+k.slice(1)} ${v}`).join(', ');
  const reqHtml = reqStr
    ? `<div class="tt-req">Requires: ${reqStr}</div>`
    : '';
  return rows + reqHtml;
}

const DPS_PRAYERS = {
  none:       { mAtk:1.00, mStr:1.00, rAtk:1.00, rStr:1.00, mgAtk:1.00, label:'None' },
  piety:      { mAtk:1.20, mStr:1.23, rAtk:1.00, rStr:1.00, mgAtk:1.00, label:'Piety' },

const PRAYER_BY_STYLE = {
  melee:  ['none','piety','chivalry'],

  magic:  ['none','augury','mystic'],
};

let dpsSettings = {
  prayer: 'none',
  atkStyle: 'aggressive', // melee: accurate/aggressive/controlled; ranged: rapid/accurate
  enemyDefLvl: 1,
  enemyDefBonus: 0,
};

function loadDpsSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('dps_settings') || '{}');
    Object.assign(dpsSettings, s);
  } catch {}
}
function saveDpsSettings() {
  localStorage.setItem('dps_settings', JSON.stringify(dpsSettings));
}

function meetsReqLvl(item) {
  const reqs = item.reqLvl || {};
  for (const [skill, lvl] of Object.entries(reqs)) {
    const skillName = skill.charAt(0).toUpperCase() + skill.slice(1);
    if (getLevel(skillName) < lvl) return false;
  }
  return true;
}

function calcDps() {
  const style  = activeEquipStyle;
  const s      = computeTotalStats();
  const prayer = DPS_PRAYERS[dpsSettings.prayer] || DPS_PRAYERS.none;
  const enemyDef   = Math.max(1, parseInt(dpsSettings.enemyDefLvl)  || 1);
  const enemyBonus = Math.max(0, parseInt(dpsSettings.enemyDefBonus) || 0);

  // Get equipped weapon speed
  const eqWpnName = getEquipped('weapon');
  const wpnItem   = eqWpnName ? (equipBySlot['weapon'] || []).find(i => i.name === eqWpnName) : null;
  let   baseSpeed = (wpnItem && wpnItem.attackSpeed) || 4;

  if (style === 'melee') {
    const strOff = dpsSettings.atkStyle === 'aggressive' ? 3 : dpsSettings.atkStyle === 'controlled' ? 1 : 0;
    const atkOff = dpsSettings.atkStyle === 'accurate'   ? 3 : dpsSettings.atkStyle === 'controlled' ? 1 : 0;
    const effStr = Math.floor(getLevel('Strength') * prayer.mStr) + strOff + 8;
    const effAtk = Math.floor(getLevel('Attack')   * prayer.mAtk) + atkOff + 8;
    const eqStr  = s.melee_strength || 0;
    const eqAtk  = Math.max(s.attack_stab || 0, s.attack_slash || 0, s.attack_crush || 0);
    const maxHit = Math.floor(0.5 + effStr * (eqStr + 64) / 640);
    const atkRoll = Math.floor(effAtk * (eqAtk + 64));
    const defRoll = Math.floor((enemyDef + 9) * (enemyBonus + 64));
    const hitChance = atkRoll > defRoll
      ? 1 - (defRoll + 2) / (2 * (atkRoll + 1))
      : atkRoll / (2 * (defRoll + 1));
    const dps = (maxHit / 2) * Math.max(0, Math.min(1, hitChance)) / (baseSpeed * 0.6);
    return { maxHit, hitChance: Math.max(0, Math.min(1, hitChance)), dps, speed: baseSpeed };
  }

  if (style === 'ranged') {
    const isRapid = dpsSettings.atkStyle === 'rapid';
    const atkOff  = isRapid ? 0 : 3;
    const speed   = isRapid ? Math.max(1, baseSpeed - 1) : baseSpeed;
    const effAtk  = Math.floor(getLevel('Ranged') * prayer.rAtk) + atkOff + 8;
    const effStr  = Math.floor(getLevel('Ranged') * prayer.rStr) + atkOff + 8;
    const eqStr   = s.ranged_strength || 0;
    const eqAtk   = s.attack_ranged || 0;
    const maxHit  = Math.floor(0.5 + effStr * (eqStr + 64) / 640);
    const atkRoll = Math.floor(effAtk * (eqAtk + 64));
    const defRoll = Math.floor((enemyDef + 9) * (enemyBonus + 64));
    const hitChance = atkRoll > defRoll
      ? 1 - (defRoll + 2) / (2 * (atkRoll + 1))
      : atkRoll / (2 * (defRoll + 1));
    const dps = (maxHit / 2) * Math.max(0, Math.min(1, hitChance)) / (speed * 0.6);
    return { maxHit, hitChance: Math.max(0, Math.min(1, hitChance)), dps, speed };
  }

  return null; // magic — too spell-dependent
}

function dpsSettingChanged() {
  const prayerEl = document.getElementById('dps-prayer');
  const styleEl  = document.getElementById('dps-style');
  const defLvlEl = document.getElementById('dps-def-lvl');
  const defBonEl = document.getElementById('dps-def-bonus');
  if (prayerEl) dpsSettings.prayer    = prayerEl.value;
  if (styleEl)  dpsSettings.atkStyle  = styleEl.value;
  if (defLvlEl) dpsSettings.enemyDefLvl   = parseInt(defLvlEl.value) || 1;
  if (defBonEl) dpsSettings.enemyDefBonus = parseInt(defBonEl.value) || 0;
  saveDpsSettings();
  updateDpsOutput();
}

function updateDpsOutput() {
  const el = document.getElementById('dps-output');
  if (!el) return;
  const result = calcDps();
  if (!result) {
    el.innerHTML = `<span style="color:#333;font-style:italic">Magic DPS requires spell selection</span>`;
    return;
  }
  const { maxHit, hitChance, dps, speed } = result;
  el.innerHTML = `
    <div class="dps-val"><span class="dps-val-num">${maxHit}</span><span class="dps-val-lbl">Max Hit</span></div>
    <div class="dps-val"><span class="dps-val-num">${(hitChance*100).toFixed(1)}%</span><span class="dps-val-lbl">Accuracy</span></div>
    <div class="dps-val"><span class="dps-val-num">${dps.toFixed(2)}</span><span class="dps-val-lbl">DPS</span></div>
    <div class="dps-val"><span class="dps-val-num">${speed}t</span><span class="dps-val-lbl">Speed</span></div>`;
}

function equipKey(slot) { return `equip_${activeEquipStyle}_${slot}`; }
function getEquipped(slot) { return localStorage.getItem(equipKey(slot)) || ''; }
function setEquipped(slot, name) {
  hideEquipTooltip();
  localStorage.setItem(equipKey(slot), name);

  // 2H weapon clears the shield slot; equipping a shield clears a 2H weapon
  if (slot === 'weapon' && name) {
    const item = (equipBySlot['weapon'] || []).find(i => i.name === name);
    if (item && item.is2h) localStorage.setItem(equipKey('shield'), '');
  } else if (slot === 'shield' && name) {
    const wpnName = getEquipped('weapon');
    if (wpnName) {
      const wpn = (equipBySlot['weapon'] || []).find(i => i.name === wpnName);
      if (wpn && wpn.is2h) localStorage.setItem(equipKey('weapon'), '');
    }
  }

  refreshEquipDoll();
  renderGearStats();
  updateDpsOutput();
  if (selectedEquipSlot === slot) renderEquipSlotDetail(slot);
}

// Returns items for a slot sorted: equipped → owned → gettable → locked
// Within each tier: style-matching items first, then by value desc
function slotItems(slot) {
  const raw = equipBySlot[slot] || [];
  const eq  = getEquipped(slot);
  return raw.map(item => {
    const owned       = isOwned(item.name);
    const equipped    = item.name === eq;
    const srcData     = itemSources[item.name];
    const gettable    = owned || (srcData ? canGetItem(item.name) : false);
    const styleMatch  = item.combatType === activeEquipStyle || item.combatType === 'all' || !item.combatType;
    const meetsReq    = meetsReqLvl(item);
    return { ...item, owned, equipped, gettable, styleMatch, meetsReq };
  }).sort((a, b) => {
    const rank = x => x.equipped ? 0 : x.owned ? 1 : x.gettable ? 2 : 3;
    const rd = rank(a) - rank(b);
    if (rd !== 0) return rd;
    // Within tier: style match first
    const sm = (b.styleMatch ? 1 : 0) - (a.styleMatch ? 1 : 0);
    if (sm !== 0) return sm;
    return (b.value || 0) - (a.value || 0);
  });
}

function slotHasUpgrade(slot) {
  const eq = getEquipped(slot);
  const items = slotItems(slot);
  // upgrade = owned item that meets level reqs and isn't currently equipped
  return items.some(i => i.owned && i.meetsReq && i.name !== eq);
}

  loadDpsSettings();
  refreshEquipDoll();
  updateEquipCount();
  renderGearStats();
  updateDpsOutput();
  const savedSlot = localStorage.getItem('equip_selected_slot');
  if (savedSlot && SLOT_FULL[savedSlot]) {
    selectedEquipSlot = savedSlot;
    refreshEquipDoll();
    renderEquipSlotDetail(savedSlot);
  }
}

function switchEquipStyle(style) {
  activeEquipStyle = style;
  localStorage.setItem('equip_active_style', style);
  document.querySelectorAll('.equip-style-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase().includes(style));
  });
  refreshEquipDoll();
  updateEquipCount();
  renderGearStats();
  updateDpsOutput();
  if (selectedEquipSlot) renderEquipSlotDetail(selectedEquipSlot);
}

function updateEquipCount() {
  const el = document.getElementById('equip-owned-count');
  if (!el) return;
  const allSlots = Object.keys(SLOT_FULL);
  const totalOwned  = allSlots.reduce((n, s) => n + (equipBySlot[s]||[]).filter(i => isOwned(i.name)).length, 0);
  const totalItems  = allSlots.reduce((n, s) => n + (equipBySlot[s]||[]).length, 0);
  el.textContent = `${totalOwned} / ${totalItems} owned`;
}

function refreshEquipDoll() {
  const pane = document.getElementById('equip-doll-pane');
  if (!pane) return;
  // Determine if a 2H weapon is currently equipped (blocks shield slot)
  const _wpnName = getEquipped('weapon');
  const _wpnItem = _wpnName ? (equipBySlot['weapon'] || []).find(i => i.name === _wpnName) : null;
  const has2h    = !!(_wpnItem && _wpnItem.is2h);
  let html = '';
  for (const row of DOLL_LAYOUT) {
    html += `<div class="doll-row">`;
    const rowMap = {};
    for (const [r, c, slot, lbl] of row) rowMap[c] = { slot, lbl };
    for (let col = 0; col < 3; col++) {
      const cell = rowMap[col];
      if (!cell) { html += `<div class="doll-slot doll-empty"></div>`; continue; }
      const { slot, lbl } = cell;
      const eq         = getEquipped(slot);
      const upgrade    = slotHasUpgrade(slot);
      const isSelected = selectedEquipSlot === slot;
      // Shield is unavailable when a 2H weapon is equipped
      const shieldBlocked = slot === 'shield' && has2h;
      let cls = 'doll-slot';
      if (upgrade && !shieldBlocked) cls += ' has-upgrade';
      if (isSelected)                cls += ' selected';
      if (shieldBlocked)             cls += ' doll-slot-blocked';
      const upgradeDot = (upgrade && !shieldBlocked) ? `<div class="doll-upgrade-dot"></div>` : '';

      let inner;
      if (eq && !shieldBlocked) {
        const imgUrl = _cardImg(eq) || '';
        inner = imgUrl
          ? `<img src="${imgUrl}" class="doll-item-img" onerror="this.style.display='none'">`
          : `<div class="doll-slot-item owned">${eq.length > 10 ? eq.slice(0,9)+'…' : eq}</div>`;
      } else if (shieldBlocked) {
        inner = `<div class="doll-slot-label" style="color:#3a3a3a">2H</div>`;
      } else {
        inner = `<div class="doll-slot-label">${lbl}</div>`;
      }

      const slotTitle = shieldBlocked ? '2H weapon equipped — shield slot unavailable' : (eq ? eq : lbl);
      html += `<div class="${cls}" title="${slotTitle}" onclick="${shieldBlocked ? '' : `selectEquipSlot('${slot}')`}">
        ${upgradeDot}
        ${inner}
        ${(eq && !shieldBlocked) ? `<div class="doll-slot-label doll-slot-label-overlay">${lbl}</div>` : ''}
      </div>`;
    }
    html += `</div>`;
  }
  pane.innerHTML = html;
}

const SLOT_DEFAULT_SORT = {
  weapon: 'dps',
  ammo:   'atk_style',
  neck:   'atk_style',
  ring:   'atk_style',
  cape:   'atk_style',
  head:   'def_style',
  body:   'def_style',
  legs:   'def_style',
  hands:  'def_style',
  feet:   'def_style',
  shield: 'def_style',
};

function selectEquipSlot(slot) {
  selectedEquipSlot = slot;
  localStorage.setItem('equip_selected_slot', slot);
  // Apply a sensible default sort for this slot type
  const def = SLOT_DEFAULT_SORT[slot] || 'value';
  equipSortBy = def;
  localStorage.setItem('equip_sort_by', def);
  refreshEquipDoll();
  renderEquipSlotDetail(slot);
}

const EQUIP_SORT_OPTS = [
  { key: 'value',           label: 'Value'     },
  { key: 'dps',             label: 'DPS'       },
  { key: 'atk_style',       label: 'Attack'    },
  { key: 'def_style',       label: 'Defence'   },
  { key: 'attack_slash',    label: 'Slash'     },
  { key: 'attack_stab',     label: 'Stab'      },
  { key: 'attack_crush',    label: 'Crush'     },
  { key: 'attack_magic',    label: 'Magic atk' },
  { key: 'attack_ranged',   label: 'Ranged atk'},
  { key: 'melee_strength',  label: 'Str bonus' },
  { key: 'ranged_strength', label: 'Rng str'   },
  { key: 'magic_damage',    label: 'Mag dmg'   },
  { key: 'defence_slash',   label: 'Def slash' },
  { key: 'defence_stab',    label: 'Def stab'  },
  { key: 'defence_crush',   label: 'Def crush' },
  { key: 'defence_magic',   label: 'Def magic' },
  { key: 'defence_ranged',  label: 'Def ranged'},
  { key: 'prayer',          label: 'Prayer'    },
];

function setEquipSort(key) {
  equipSortBy = key;
  localStorage.setItem('equip_sort_by', key);
  if (selectedEquipSlot) renderEquipSlotDetail(selectedEquipSlot);
}

function calcDpsForItem(slot, item) {
  // Full-gear DPS with `item` swapped into `slot` — keeps all other equipped gear.
  const s = computeTotalStats();

  // Remove current occupant's stats from this slot
  const cur = getEquipped(slot);
  if (cur) {
    const curItem = (equipBySlot[slot] || []).find(i => i.name === cur);
    if (curItem && curItem.stats)
      for (const [k, v] of Object.entries(curItem.stats))
        if (s[k] !== undefined) s[k] -= v;
  }
  // Add candidate item's stats
  if (item.stats)
    for (const [k, v] of Object.entries(item.stats))
      if (s[k] !== undefined) s[k] += v;

  // Weapon speed: use candidate's own speed for weapon slot, else current weapon
  let baseSpeed;
  if (slot === 'weapon') {
    baseSpeed = item.attackSpeed || 4;
  } else {
    const wpnName = getEquipped('weapon');
    const wpn = wpnName ? (equipBySlot['weapon'] || []).find(i => i.name === wpnName) : null;
    baseSpeed = (wpn && wpn.attackSpeed) || 4;
  }

  const style   = activeEquipStyle;
  const prayer  = DPS_PRAYERS[dpsSettings.prayer] || DPS_PRAYERS.none;
  const eDef    = Math.max(1, parseInt(dpsSettings.enemyDefLvl)  || 1);
  const eBonus  = Math.max(0, parseInt(dpsSettings.enemyDefBonus) || 0);
  const defRoll = Math.floor((eDef + 9) * (eBonus + 64));

  if (style === 'melee') {
    const strOff = dpsSettings.atkStyle === 'aggressive' ? 3 : dpsSettings.atkStyle === 'controlled' ? 1 : 0;
    const atkOff = dpsSettings.atkStyle === 'accurate'   ? 3 : dpsSettings.atkStyle === 'controlled' ? 1 : 0;
    const effStr = Math.floor(getLevel('Strength') * prayer.mStr) + strOff + 8;
    const effAtk = Math.floor(getLevel('Attack')   * prayer.mAtk) + atkOff + 8;
    const eqStr  = s.melee_strength || 0;
    const eqAtk  = Math.max(s.attack_stab || 0, s.attack_slash || 0, s.attack_crush || 0);
    const maxHit  = Math.floor(0.5 + effStr * (eqStr + 64) / 640);
    const atkRoll = Math.floor(effAtk * (eqAtk + 64));
    const hit = atkRoll > defRoll ? 1 - (defRoll + 2) / (2*(atkRoll+1)) : atkRoll / (2*(defRoll+1));
    return (maxHit / 2) * Math.max(0, Math.min(1, hit)) / (baseSpeed * 0.6);
  }
  if (style === 'ranged') {
    const isRapid = dpsSettings.atkStyle === 'rapid';
    const atkOff  = isRapid ? 0 : 3;
    const speed   = isRapid ? Math.max(1, baseSpeed - 1) : baseSpeed;
    const effAtk  = Math.floor(getLevel('Ranged') * prayer.rAtk) + atkOff + 8;
    const effStr  = Math.floor(getLevel('Ranged') * prayer.rStr) + atkOff + 8;
    const eqStr   = s.ranged_strength || 0;
    const eqAtk   = s.attack_ranged   || 0;
    const maxHit  = Math.floor(0.5 + effStr * (eqStr + 64) / 640);
    const atkRoll = Math.floor(effAtk * (eqAtk + 64));
    const hit = atkRoll > defRoll ? 1 - (defRoll + 2) / (2*(atkRoll+1)) : atkRoll / (2*(defRoll+1));
    return (maxHit / 2) * Math.max(0, Math.min(1, hit)) / (speed * 0.6);
  }
  return 0; // magic — too spell-dependent
}

function styleAtkStat(stats) {
  // Best offensive bonus for the current combat style
  if (activeEquipStyle === 'melee')
    return Math.max(stats.attack_stab||0, stats.attack_slash||0, stats.attack_crush||0);
  if (activeEquipStyle === 'ranged')
    return (stats.attack_ranged||0) + (stats.ranged_strength||0);
  if (activeEquipStyle === 'magic')
    return (stats.attack_magic||0) + (stats.magic_damage||0);
  return Math.max(stats.attack_stab||0, stats.attack_slash||0, stats.attack_crush||0,
                  stats.attack_ranged||0, stats.attack_magic||0);
}

function styleDefStat(stats) {
  // Defence against the current combat style's attack type
  if (activeEquipStyle === 'melee')
    return (stats.defence_stab||0) + (stats.defence_slash||0) + (stats.defence_crush||0);
  if (activeEquipStyle === 'ranged')
    return stats.defence_ranged||0;
  if (activeEquipStyle === 'magic')
    return stats.defence_magic||0;
  // 'all': total defence
  return (stats.defence_stab||0) + (stats.defence_slash||0) + (stats.defence_crush||0)
       + (stats.defence_ranged||0) + (stats.defence_magic||0);
}

function getStatVal(item, key) {
  if (key === 'value')    return item.value || 0;
  if (key === 'dps')      return selectedEquipSlot ? calcDpsForItem(selectedEquipSlot, item) : 0;
  if (key === 'atk_style') return styleAtkStat(item.stats || {});
  if (key === 'def_style') return styleDefStat(item.stats || {});
  return (item.stats && item.stats[key]) || 0;
}

function renderEquipSlotDetail(slot) {
  const pane = document.getElementById('equip-detail-pane');
  if (!pane) return;
  const items  = slotItems(slot);
  const eq     = getEquipped(slot);
  const label  = SLOT_FULL[slot] || slot;
  const col    = STYLE_COLOR[activeEquipStyle] || '#e8c97a';
  const owned  = items.filter(i => i.owned).length;
  // Find the currently equipped item object for delta comparisons
  const eqItem = items.find(i => i.equipped) || null;

  const sortOpts = EQUIP_SORT_OPTS.map(o =>
    `<option value="${o.key}"${o.key === equipSortBy ? ' selected' : ''}>${o.label}</option>`
  ).join('');

  let html = `
    <div class="equip-slot-header" style="color:${col}">${label}
      <select onchange="setEquipSort(this.value)" onclick="event.stopPropagation()"
        style="margin-left:auto;font-size:10px;background:#1a1a1a;border:1px solid #333;color:#888;padding:2px 4px;border-radius:3px;cursor:pointer">
        ${sortOpts}
      </select>
    </div>
    <div class="equip-slot-sub">${owned} owned · ${items.length} total in this slot</div>`;

  const sectionDefs = [
    { key: 'equipped',    label: 'Equipped',                filter: i =>  i.equipped },
    { key: 'owned',       label: 'Owned — can equip',       filter: i =>  i.owned && !i.equipped &&  i.meetsReq },
    { key: 'level_req',   label: 'Owned — level required',  filter: i =>  i.owned && !i.equipped && !i.meetsReq },
    { key: 'gettable',    label: 'Obtainable (no card yet)',filter: i => !i.owned &&  i.gettable },
    { key: 'locked',      label: 'Not yet accessible',      filter: i => !i.owned && !i.gettable },
  ];

  for (const sec of sectionDefs) {
    const group = items.filter(sec.filter)
      .sort((a, b) => getStatVal(b, equipSortBy) - getStatVal(a, equipSortBy));
    if (group.length === 0) continue;
    html += `<div class="equip-section-title">${sec.label} (${group.length})</div>`;
    for (const item of group) {
      const dotCls  = item.owned ? 'owned' : item.gettable ? 'obtainable' : 'locked';
      const nameCls = item.owned ? 'owned' : item.gettable ? 'obtainable' : 'locked';
      const rowCls  = item.equipped ? ' equipped' : (item.owned && !item.equipped && sec.key === 'owned') ? ' new-unlock' : '';
      const tag2h   = item.is2h ? `<span class="equip-2h-tag">2H</span>` : '';
      const valStr  = equipSortBy === 'value'
        ? (item.value > 0 ? formatGp(item.value) : '')
        : equipSortBy === 'dps'
        ? (() => { const v = calcDpsForItem(slot, item); return v > 0 ? v.toFixed(2) : ''; })()
        : (() => { const v = getStatVal(item, equipSortBy); return v !== 0 ? (v > 0 ? '+' : '') + v : ''; })();
      const combatBadge = (item.combatType && item.combatType !== 'all')
        ? `<span class="combat-badge ${item.combatType}">${item.combatType}</span>`
        : '';
      const styleExtra = (!item.styleMatch && item.combatType !== 'all')
        ? ' style="opacity:0.55"'
        : '';
      const safeItem = encodeURIComponent(item.name);
      const safeNavName = escHtml(item.name);

      // Row click: equip for owned+meets-req, clear for equipped, view sourcing otherwise
      let rowOnclick, rowTitle;
      if (item.equipped) {
        rowOnclick = `setEquipped('${slot}','')`;
        rowTitle   = 'Click to remove';
      } else if (item.owned && item.meetsReq) {
        rowOnclick = `setEquipped('${slot}', decodeURIComponent(this.dataset.item))`;
        rowTitle   = 'Click to equip';
      } else if (item.owned && !item.meetsReq) {
        rowOnclick = ``;
        rowTitle   = 'Level too low to equip';
      } else {
        rowOnclick = `navigateToCard(this.dataset.nav)`;
        rowTitle   = 'Click to view sourcing';
      }

      // Equip state badge
      const badge = item.equipped
        ? `<span class="equip-item-badge equipped">Equipped</span>`
        : '';

      // Level requirement tag shown on level-locked owned items
      const reqTag = (() => {
        if (!item.owned || item.meetsReq || !item.reqLvl) return '';
        const missing = Object.entries(item.reqLvl)
          .filter(([k, v]) => getLevel(k.charAt(0).toUpperCase() + k.slice(1)) < v)
          .map(([k, v]) => `${k.charAt(0).toUpperCase() + k.slice(1)} ${v}`)
          .join(', ');
        return missing ? `<span class="req-tag">${missing}</span>` : '';
      })();

      // "View ↗" for owned items (click=equip, so they need another route to sourcing)
      const viewBtn = item.owned
        ? `<button class="view-card-btn" title="View card sourcing" data-nav="${safeNavName}" onclick="event.stopPropagation();navigateToCard(this.dataset.nav)">↗ Card</button>`
        : '';

      // Clear button on equipped item
      const clearBtn = item.equipped
        ? `<button class="equip-set-btn" onclick="event.stopPropagation();setEquipped('${slot}','')">Clear</button>`
        : '';

      const _eImgUrl = _cardImg(item.name) || '';
      const _eImg = _eImgUrl
        ? `<img src="${_eImgUrl}" style="width:20px;height:20px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`
        : '<span style="width:20px;flex-shrink:0"></span>';
      html += `<div class="equip-item-row${rowCls}"
        data-slot="${slot}" data-item="${safeItem}" data-nav="${safeNavName}"
        title="${rowTitle}"
        onmouseenter="showEquipTooltip(event)"
        onmouseleave="hideEquipTooltip()"
        onclick="${rowOnclick}">
        <div class="equip-dot ${dotCls}"></div>
        ${_eImg}
        <div class="equip-item-name ${nameCls}"${styleExtra}>${item.name}${tag2h}</div>
        ${combatBadge}
        <div class="equip-item-value">${valStr}</div>
        ${reqTag}${badge}${viewBtn}${clearBtn}
      </div>`;
    }
  }

  if (items.length === 0) {
    html += `<div class="placeholder" style="color:#444;margin-top:40px">No items in this slot</div>`;
  }

  pane.innerHTML = html;
}

// Floating tooltip for item stats in equipment slot detail
function showEquipTooltip(event) {
  const el = event.currentTarget;
  const slot     = el.dataset.slot;
  const itemName = decodeURIComponent(el.dataset.item || '');
  if (!itemName) return;
  const items  = slotItems(slot);
  const item   = items.find(i => i.name === itemName);
  if (!item) return;
  const eqItem = items.find(i => i.equipped) || null;
  const content = buildItemTooltip(item, eqItem);

  let tt = document.getElementById('equip-tooltip-float');
  if (!tt) {
    tt = document.createElement('div');
    tt.id = 'equip-tooltip-float';
    document.body.appendChild(tt);
  }
  tt.innerHTML = content;
  tt.style.display = 'block';

  // Position: below row by default, flip above if near bottom of viewport
  const rect = el.getBoundingClientRect();
  const ttH  = tt.getBoundingClientRect().height;
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < ttH + 8 && rect.top > ttH + 8) {
    tt.style.top  = (rect.top - ttH - 4) + 'px';
  } else {
    tt.style.top  = (rect.bottom + 4) + 'px';
  }
  tt.style.right = (window.innerWidth - rect.right) + 'px';
  tt.style.left  = 'auto';
}

function hideEquipTooltip() {
  const tt = document.getElementById('equip-tooltip-float');
  if (tt) tt.style.display = 'none';
}

// Navigate to an item in the Cards tab (reuse existing showCard logic)
function navigateToCard(name) {
  hideEquipTooltip();
  const match = allCards.find(c => c.name === name);
  showCard(name, match ? (match.type || 'item') : 'item');
}

function formatGp(n) {
  if (n >= 1_000_000) return (n/1_000_000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1_000)     return (n/1_000).toFixed(1).replace(/\.0$/,'') + 'K';
  return n.toString();
}
