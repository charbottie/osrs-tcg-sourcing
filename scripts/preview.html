             background:${bossFilter===k?'#2a2000':'#1a1a1a'};color:${bossFilter===k?'#e8c97a':'#666'};
             transition:background 0.1s">${l}</button>`
  ).join('');
}

function setBossFilter(key) {
  bossFilter = key;
  ['all',..._BOSS_CATEGORIES.map(c=>c.key)].forEach(k => {
    const btn = document.getElementById('boss-filt-' + k);
    if (!btn) return;
    btn.style.background = k === key ? '#2a2000' : '#1a1a1a';
    btn.style.color       = k === key ? '#e8c97a' : '#666';
  });
  renderBossList();
}

function renderBossList() {
  const listEl = document.getElementById('boss-list-scroll');
  if (!listEl) return;

  const cats = bossFilter === 'all'
    ? _BOSS_CATEGORIES
    : _BOSS_CATEGORIES.filter(c => c.key === bossFilter);

  // Evaluate + sort (ready first, then by owned-card fraction)
  function _evalSorted(bosses) {
    const evaluated = bosses.map(b => ({ boss:b, ...evaluateBoss(b) }));
    evaluated.sort((a, b) => {
      const so = ({available:0,partial:1,locked:2}[a.status]||0) - ({available:0,partial:1,locked:2}[b.status]||0);
      if (so !== 0) return so;
      const frac = p => p.req.total ? p.req.done / p.req.total : 1;
      return frac(b.progress) - frac(a.progress);
    });
    return evaluated;
  }
  const _counts = ev => `${ev.filter(e => e.status === 'available').length} ready \xb7 ${ev.filter(e => e.status === 'partial').length} partial`;
  function _itemsHtml(evaluated) {
    let html = '';
    for (const { boss, status, progress } of evaluated) {
      const dot = status==='available' ? '#76c442' : status==='partial' ? '#c8a020' : '#6a2a2a';
      const countStr = progress.req.total ? `${progress.req.done}/${progress.req.total}` : '';
      const isSel = selectedBoss === boss.name;
      html += `<div class="boss-item${isSel?' selected':''}"
        data-boss="${escHtml(boss.name)}" onclick="showBossDetail(this.dataset.boss)">
        <span class="boss-status-dot" style="background:${dot}"></span>
        <span style="flex:1;font-size:12px;color:${isSel?'#e8c97a':'#ccc'}">${escHtml(boss.name)}</span>
        ${countStr ? `<span style="font-size:10px;color:#555">${countStr}</span>` : ''}
      </div>`;
    }
    return html;
  }

  let html = '';
  for (const { key, label, subs } of cats) {
    const bosses = BOSS_DATA.filter(b => b.category === key &&
      (!bossSearch || b.name.toLowerCase().includes(bossSearch)));
    if (!bosses.length) continue;

    const evaluated = _evalSorted(bosses);
    html += `<div class="boss-section-header">${label}
      <span style="font-weight:400;color:#444;margin-left:6px">${_counts(evaluated)}</span></div>`;

    if (!subs) { html += _itemsHtml(evaluated); continue; }
    // Sub-grouped category (e.g. Bosses → Low level / God Wars / Wilderness…)
    for (const sc of subs) {
      const subEv = evaluated.filter(e => e.boss.sub === sc.key);
      if (!subEv.length) continue;
      html += `<div class="boss-subsection-header">${sc.label}
        <span style="font-weight:400;color:#3a3a3a;margin-left:6px">${_counts(subEv)}</span></div>`;
      html += _itemsHtml(subEv);
    }
    const other = evaluated.filter(e => !subs.some(sc => sc.key === e.boss.sub));
    if (other.length) html += `<div class="boss-subsection-header">Other</div>` + _itemsHtml(other);
  }

  listEl.innerHTML = html ||
    `<div style="padding:16px;color:#444;font-size:12px">No bosses match</div>`;
}

function showBossDetail(name) {
  selectedBoss = name;
  renderBossList();  // re-render to update selected highlight

  const pane = document.getElementById('boss-detail-pane');
  if (!pane) return;

  const boss = BOSS_DATA.find(b => b.name === name);
  if (!boss) return;

  const ev = evaluateBoss(boss);
  const { status, levelGates } = ev;

  const statusCol   = status==='available' ? '#76c442' : status==='partial' ? '#c8a020' : '#c85040';
  const statusLabel = status==='available' ? 'Ready'   : status==='partial' ? 'Partial' : 'Locked';
  const statusBg    = status==='available' ? '#0d2210' : status==='partial' ? '#1a1400' : '#1a0808';
  const statusBdr   = status==='available' ? '#2a5a2a' : status==='partial' ? '#3a2a00' : '#4a1a1a';
  const _subLabel   = _BOSS_CATEGORIES.find(c => c.key === boss.category)?.subs?.find(sc => sc.key === boss.sub)?.label;
  const catLabel    = boss.sub === 'wilderness' ? 'Wilderness Boss'
    : ({raid:'Raid',wave:'Wave Content',minigame:'Minigame',skilling:'Skilling Boss',boss:'Boss'}[boss.category] || boss.category)
      + (_subLabel ? ' \xb7 ' + _subLabel : '');

  // Helper — clickable card chip with image
  function cardChip(cardName, opts) {
    const { type='item', owned=isOwned(cardName), required=true, dashed=false } = opts || {};
    const img = _cardImg(cardName);
    const imgHtml = img
      ? `<img src="${img}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0" onerror="this.style.display='none'">`
      : '';
    let col, bg, bdr;
    if (owned)          { col='#76c442'; bg='#0d2210'; bdr='#2a5a2a'; }
    else if (!required) { col='#555';    bg='#111';    bdr=dashed?'#333':'#222'; }
    else                { col='#e8a030'; bg='#1a0f00'; bdr='#4a2800'; }
    const prefix = owned ? '\u2713 ' : required ? '\u2691 ' : '';
    const suffix = (!required && !dashed) ? ` <span style="font-size:9px;color:#333">opt</span>` : '';
    return `<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:${col};background:${bg};border:1px ${dashed?'dashed':'solid'} ${bdr};border-radius:3px;padding:2px 7px;cursor:pointer;white-space:nowrap;opacity:${(!required&&!dashed)?0.8:1}"
      data-card="${escHtml(cardName)}" data-type="${type}" onclick="showCard(this.dataset.card,this.dataset.type)">${imgHtml}${prefix}${escHtml(cardName)}${suffix}</span>`;
  }

  // Helper — section header
  function sHead(title, count) {
    return `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#555;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #222">${title}${count!=null?` <span style="font-weight:400;color:#444">${count}</span>`:''}</div>`;
  }

  // Requirements — the same rows as the Questing tab (any-of groups, routes, optional…)
  const section = (title, rows, sub) => rows.length
    ? `<div class="section"><div class="section-header">${title}${sub ? ` <span style="font-size:10px;color:#555;font-weight:normal">${sub}</span>` : ''}</div><div style="margin-top:8px">${_questRowOrder(rows).map(r => r.html).join('')}</div></div>` : '';
  const buckets = { access: [], enemy: [], npc: [], item: [], rec: [] };
  for (const r of (boss.requirements || [])) {
    if (!_reqCards(r).length && !(r._routes || []).length && !r.info) continue;
    const row = _questReqRow(r);
    (r.optional ? buckets.rec : r.access ? buckets.access : buckets[r.type === 'enemy' ? 'enemy' : r.type === 'npc' ? 'npc' : 'item']).push(row);
  }
  let reqHtml = '';
  const preRows = [
    ...(boss.quests || []).map(q => { const d = completedQuests.has(q);
      return `<div class="req-row"><span class="req-icon ${d ? 'ok' : 'fail'}">${d ? '✓' : '✗'}</span>
        <span class="req-label" style="cursor:pointer" data-quest="${escHtml(q)}" onclick="_navToQuest(this)">Quest: ${escHtml(q)}</span>
        <span class="req-note">${d ? 'complete' : 'not done'}</span></div>`; }),
    ...levelGates.map(({ skill, have, req, ok }) => `<div class="req-row"><span class="req-icon ${ok ? 'ok' : 'fail'}">${ok ? '✓' : '✗'}</span>
        <span class="req-label">${skillIcon(skill, 12)} ${escHtml(skill)} ${req}</span><span class="req-note">you: ${have}</span></div>`)];
  const nQ = (boss.quests || []).length;
  if (nQ) reqHtml += `<div class="section"><div class="section-header">Quest prerequisites</div><div style="margin-top:8px">${preRows.slice(0, nQ).join('')}</div></div>`;
  if (preRows.length > nQ) reqHtml += `<div class="section"><div class="section-header">Skill requirements</div><div style="margin-top:8px">${preRows.slice(nQ).join('')}</div></div>`;
  reqHtml += section('Access', buckets.access, '(any one route)');
  reqHtml += section('NPC interactions', buckets.npc);
  reqHtml += section('Enemies to defeat', buckets.enemy);
  reqHtml += section('Items &amp; tools', buckets.item);
  reqHtml += section('Optional &amp; recommended', buckets.rec, '(never blocks)');
  const lootReqRows = (boss.lootRequirements || []).map(_questReqRow);
  const relHtml = (boss.relatedCards || []).length
    ? sHead('Related Cards') + `<div style="display:flex;flex-wrap:wrap;gap:4px">${boss.relatedCards.map(c => cardChip(c, {type:_cardType(c)||'item', owned:isOwned(c), required:false, dashed:true})).join('')}</div>` : '';
  const checkedHtml = _checkedListsHtml([...(boss.consideredNotRequired || []), ...(boss.consideredNoCard || [])]);
  const p = ev.progress;
  const progressHtml = `<div style="margin:6px 0 4px">
    ${_progressBar('Required', p.req, '#c8a830', 'Quests, skill levels, access and card requirements met (an "any of" group counts once)')}
    ${p.rec.total ? _progressBar('Recommended', p.rec, '#6a7a9a', 'Optional / recommended requirements met') : ''}
    ${p.loot.total ? _progressBar('To collect loot', p.loot, '#8a7a4a', 'Needed only to claim rewards') : ''}</div>`;

  // Loot — one list grouped by rarity, rarest first. Collection-log items (the boss's
  // uniques) lead each rarity row with a gold border + ◆. Chips green when owned.
  let lootHtml = '';
  const loot = _bossLoot(boss);
  if (!loot.drops.length && lootReqRows.length)
    lootHtml = sHead('Loot') + `<div style="font-size:10px;color:#8a7a4a;margin-bottom:2px">To collect the rewards:</div>${lootReqRows.map(r => r.html).join('')}`;
  if (loot.drops.length) {
    const ownedN = loot.drops.filter(d => isOwned(d.card)).length;
    const srcHtml = loot.page
      ? `<a href="https://oldschool.runescape.wiki/w/${encodeURIComponent(loot.page)}" target="_blank" style="color:#4a6a8a;text-decoration:none">${escHtml(loot.source)}</a>`
      : escHtml(loot.source);
    const logSet = new Set(((collectionLog[boss.name] || {}).items || []).map(c => c.toLowerCase()));
    const isUnique = d => logSet.has(d.card.toLowerCase());
    lootHtml = sHead('Loot', `${ownedN}/${loot.drops.length} owned`);
    if (lootReqRows.length) lootHtml += `<div style="margin:0 0 8px"><div style="font-size:10px;color:#8a7a4a;margin-bottom:2px">To collect the rewards:</div>${lootReqRows.map(r => r.html).join('')}</div>`;
    lootHtml += `<div style="font-size:10px;color:#444;margin:-2px 0 6px">From ${srcHtml}`
      + (loot.drops.some(isUnique) ? ` \xb7 <span style="color:#b08a3a">\u25c6</span> collection log unique` : '') + `</div>`;
    for (const line of [loot.uniqueRoll && 'Unique roll: ' + loot.uniqueRoll, loot.basis].filter(Boolean))
      lootHtml += `<div style="font-size:10px;color:#6a5a3a;margin:-2px 0 6px">${escHtml(line)}</div>`;

    const byRarity = {};
    for (const d of loot.drops) (byRarity[d.rarity] ||= []).push(d);
    const order = Object.keys(byRarity).sort((x, y) => (_RARITY_RANK[x] ?? 9) - (_RARITY_RANK[y] ?? 9));
    for (const r of order) {
      lootHtml += `<div style="display:flex;gap:6px;align-items:flex-start;margin-bottom:5px">
        <span class="rarity-badge ${rarityClass(r)}" style="flex-shrink:0;min-width:74px;text-align:center">${escHtml(r)}</span>
        <div style="display:flex;flex-wrap:wrap;gap:4px">`;
      const rowDrops = byRarity[r].sort((x, y) => (isUnique(y) - isUnique(x)) || x.card.localeCompare(y.card));
      for (const d of rowDrops) {
        let chip = cardChip(d.card, {type:'item', owned:isOwned(d.card), required:false, dashed:true});
        if (isUnique(d))
          chip = chip.replace('<span style="', '<span style="border-color:#8a6a2a !important;border-style:solid !important;')
                     .replace(/<\/span>$/, ` <span style="font-size:8px;color:#b08a3a">\u25c6</span></span>`);
        if (d.rarity === 'Unique' && d.fraction)  // share of the unique roll, shown inline
          chip = chip.replace(/<\/span>$/, ` <span style="font-size:9px;color:#8a7a4a">${escHtml(d.fraction)}</span></span>`);
        const tip = _lootTip(d);
        lootHtml += tip ? chip.replace('<span ', `<span title="${escHtml(tip)}" `) : chip;
      }
      lootHtml += `</div></div>`;
    }
  }

  // Boss image — try boss card first, then first monster card
  const bossImg = _cardImg(boss.name) ||
    _cardImg(((boss.requirements || []).find(r => r.type === 'enemy' && (r.cards || []).length) || {}).cards?.[0]) || '';
  const bossImgHtml = bossImg
    ? `<img src="${bossImg}" style="float:right;max-width:72px;max-height:72px;image-rendering:pixelated;margin-left:12px;margin-bottom:4px" onerror="this.style.display='none'">`
    : '';

  const wikiHref = `https://oldschool.runescape.wiki/w/${encodeURIComponent(boss.name.replace(/ /g,'_'))}`;

  pane.innerHTML = `
    <div style="padding:20px 24px;max-width:780px">
      ${bossImgHtml}
      <h1 style="font-size:18px;color:#e8c97a;margin:0 0 4px">${escHtml(boss.name)}
        <a href="${wikiHref}" target="_blank" style="font-size:11px;color:#4a6a8a;margin-left:8px;text-decoration:none" title="OSRS Wiki">\u2197 wiki</a>
      </h1>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span style="font-size:11px;color:#666">${catLabel}</span>
        <span style="font-size:11px;color:${statusCol};background:${statusBg};padding:1px 8px;border-radius:10px;border:1px solid ${statusBdr}">${statusLabel}</span>
      </div>
      ${progressHtml}
      ${boss.note ? `<div style="color:#888;font-size:11px;line-height:1.5;margin:4px 0 8px;padding:6px 10px;border-left:2px solid #3a3010;background:#12100a">${escHtml(boss.note)}</div>` : ''}
      ${reqHtml}
      ${relHtml}
      ${checkedHtml}
      ${lootHtml}
    </div>`;
}

// A missing requirement as a link: one card → its card page; an "any of" group or routes →
// the boss page, with a hover grid of the options.
function _missingLink(r, bossName) {
  const cards = r.cards || [];
  if (cards.length === 1 && !(r._routes || []).length) {
    const info = _cardInfo(cards[0]);
    if (info) return `<span style="cursor:pointer;color:#c8a060;text-decoration:underline dotted" data-nav="${escHtml(info.exact)}" data-nav-type="${info.type}" onclick="_navToCard(this)" title="${escHtml(r.label)}">${escHtml(info.exact)}</span>`;
  }
  const opts = _reqCards(r);
  return `<span style="cursor:pointer;color:#c8a060;text-decoration:underline dotted" data-boss="${escHtml(bossName)}" onclick="showBossDetail(this.dataset.boss)"
    ${opts.length > 1 ? _cardGridTipAttrs(opts, r.label + ' — any one') : `title="${escHtml(r.label)}"`}>${escHtml(r.label)}</span>`;
}

// Bosses home panel (no boss selected): status counts, closest bosses, top blockers, most-needed cards
function _renderBossHome() {
  const pane = document.getElementById('boss-detail-pane');
  if (!pane) return;
  const ev = BOSS_DATA.map(b => ({ boss: b, ...evaluateBoss(b) }));
  const n = st => ev.filter(e => e.status === st).length;
  const tot = ev.reduce((a, e) => ({ done: a.done + e.progress.req.done, total: a.total + e.progress.req.total }), { done: 0, total: 0 });
  const tile = (label, v, col) => `<div style="flex:1;min-width:110px;background:#111;border:1px solid #222;border-radius:4px;padding:10px 12px">
    <div style="font-size:20px;font-weight:700;color:${col};font-variant-numeric:tabular-nums">${v}</div><div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.05em">${label}</div></div>`;
  // Closest: not-ready bosses with no quest/level/access gate, fewest missing requirements
  const closest = ev.filter(e => e.status === 'partial').sort((a, b) => a.missing.length - b.missing.length || a.boss.name.localeCompare(b.boss.name)).slice(0, 10);
  const closestHtml = closest.map(e => `<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:11px">
      <span style="width:170px;flex-shrink:0;color:#ccc;cursor:pointer" data-boss="${escHtml(e.boss.name)}" onclick="showBossDetail(this.dataset.boss)">${escHtml(e.boss.name)}</span>
      <span style="width:50px;flex-shrink:0;color:#c8a830;font-variant-numeric:tabular-nums">${e.progress.req.done}/${e.progress.req.total}</span>
      <span style="color:#888">missing: ${e.missing.slice(0, 4).map(r => _missingLink(r, e.boss.name)).join(' · ')}${e.missing.length > 4 ? ` +${e.missing.length - 4}` : ''}</span></div>`).join('');
  // Gates blocking the most bosses (quests, skill levels, areas)
  const gates = new Map();
  const gate = (key, label, bossName, quest) => { if (!gates.has(key)) gates.set(key, { label, quest, bosses: [] }); gates.get(key).bosses.push(bossName); };
  for (const e of ev) {
    for (const q of e.questsMissing) gate('q:' + q, `Quest: ${q}`, e.boss.name, q);
    for (const g of e.levelGates.filter(g => !g.ok)) gate(`s:${g.skill}:${g.req}`, `${g.skill} ${g.req} (you: ${g.have})`, e.boss.name);
    for (const r of e.accessMissing) gate('a:' + r.label, r.label, e.boss.name);
  }
  const gateRows = [...gates.values()].sort((a, b) => b.bosses.length - a.bosses.length).slice(0, 12);
  const gatesHtml = gateRows.map(g => `<div style="display:flex;gap:8px;padding:3px 0;font-size:11px">
      <span style="width:260px;flex-shrink:0;color:#ccc;cursor:pointer;text-decoration:underline dotted"
        ${g.quest ? `data-quest="${escHtml(g.quest)}" onclick="_navToQuest(this)" title="Open the quest"`
          : `data-boss="${escHtml(g.bosses[0])}" onclick="showBossDetail(this.dataset.boss)" title="Open ${escHtml(g.bosses[0])} to see the routes"`}>${escHtml(g.label)}</span>
      <span style="color:#c85040;font-variant-numeric:tabular-nums;flex-shrink:0">blocks ${g.bosses.length}:</span>
      <span style="color:#888">${g.bosses.map(b => `<span style="cursor:pointer;text-decoration:underline dotted" data-boss="${escHtml(b)}" onclick="showBossDetail(this.dataset.boss)">${escHtml(b)}</span>`).join(' · ')}</span></div>`).join('');
  const box = (title, sub, inner) => inner ? `<div style="background:#111;border:1px solid #222;border-radius:4px;padding:12px 14px;margin-bottom:14px">
    <div style="color:#c8a830;font-weight:700;font-size:12px;margin-bottom:2px">${title}</div><div style="color:#666;font-size:10px;margin-bottom:8px">${sub}</div>${inner}</div>` : '';
  const demand = _cardDemand(ev.filter(e => e.status !== 'available').map(e => ({ name: e.boss.name, reqs: e.boss.requirements || [] })));
  pane.innerHTML = `<div style="padding:20px 24px;max-width:820px">
    <h1 style="font-size:18px;color:#e8c97a;margin:0 0 12px">Bosses</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${tile('Ready', n('available'), '#76c442')}${tile('Partial', n('partial'), '#c8a020')}${tile('Locked', n('locked'), '#c85040')}${tile('Encounters', ev.length, '#aaa')}
    </div>
    <div style="margin-bottom:14px">${_progressBar('All requirements', tot, '#c8a830', 'Required requirements met across every boss (an "any of" group counts once)')}</div>
    ${box('Closest to ready', 'Partial bosses (no quest, skill or access gate left), fewest missing requirements first', closestHtml)}
    ${box('Biggest blockers', 'Quests, skill levels and area access that lock the most bosses', gatesHtml)}
    ${_demandTableHtml(demand, "Most-needed cards for bosses", 'boss', 'Most-needed for bosses')}
    <div style="color:#555;font-size:11px">Select a boss on the left for its full requirements and loot.</div>
  </div>`;
}

function showBoss(name) {
  if (activeTab !== 'bosses') {
    pushHistoryEntry();
    selectedBoss = name;
    _renderTab('bosses', false);
  } else {
    if (name !== selectedBoss) pushHistoryEntry();
    selectedBoss = name;
    renderBossList();
    showBossDetail(name);
  }
}

// renderBossing kept as alias for refresh callers (e.g. switchCollection)
// Refreshes the boss list (and detail pane if a boss is selected) when the bosses tab is active.
function renderBossing() {
  if (!document.getElementById('boss-list-scroll')) return; // not on bosses tab — nothing to refresh
  renderBossList();
  // the home summary is built from the same data: redraw it when the collection or data loads late
  if (selectedBoss) showBossDetail(selectedBoss); else _renderBossHome();
}

// ═══════════════════════════════════════════════════════════════════════════
// ─── Achievement Diaries tab ────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════

const DIARY_TIERS = ['easy','medium','hard','elite'];
const DIARY_TIER_LABEL = {easy:'Easy',medium:'Medium',hard:'Hard',elite:'Elite'};
const DIARY_TIER_COLOR = {easy:'#50c050',medium:'#c8c030',hard:'#4080c0',elite:'#9050d0'};
const DIARY_TIER_BG    = {easy:'#102010',medium:'#202010',hard:'#101828',elite:'#1e1028'};

// ── Data ────────────────────────────────────────────────────────────────────
// Each diary area has four tier objects: easy / medium / hard / elite.
// Area schema:
//   rewardNpc: string            — NPC who hands out diary rewards
// Tier schema:
//   skills:   {SkillName: level} — highest level required per skill across all tasks
//   quests:   string[]           — quests required by any task in this tier
//   items:    string[]           — item card names (used for DIARY_BY_CARD cross-links)
//   monsters: string[]           — monster card names (used for DIARY_BY_CARD cross-links)
//   tasks:    TaskObj[]          — actual in-game tasks to tick off (manual)
// TaskObj schema:
//   task:     string             — in-game task description
//   skills?:  {SkillName:level}  — specific skill levels needed for this task
//   items?:   string[]           — item cards needed for this task (clickable, owned/not-owned)
//   monsters?:string[]           — monster cards relevant to this task (clickable, owned/not-owned)
//   npc?:     string             — NPC to interact with (card chip if it's a card, gray if not)
//   tools?:   string[]           — generic tools needed (always gray, no ownership check)
//   quests?:  string[]           — quest prerequisites for this specific task (green✓ / red✗)
// Area-level quest prerequisites — applied to EVERY task in that diary area.
// Only use for quests that literally gate access to the area (e.g. you cannot
// enter Morytania at all without completing Priest in Peril).
// Task-specific quests still go on the individual task object.
const AREA_QUESTS = {
  Morytania: ['Priest in Peril'],
};

// Generated from the OSRS Wiki by scripts/generate_diaries.py → output/diaries.json
// (loaded with the other data files). Per area: {name, rewardNpc, easy|medium|hard|elite:
// {skills, quests, items, monsters (derived from tasks), rewards:[{text,sub}], tasks:[{n, task,
// skills, notBoostable?, skillsAny?, combat?, quests, partialQuests?, ironmanSkills?,
// ironmanQuests?, items, monsters, tools?, notes?}]}}
let DIARY_DATA = [];

// ── Reverse lookup: card → [{diaryName, tier, role, task?}] ────────────────
// Each entry now carries the specific task text so card pages can show exactly
// which task uses the card, not just the area+tier.
var DIARY_BY_CARD = {};
function _buildDiaryByCard() {
  DIARY_BY_CARD = {};
  function _add(card, diaryName, tier, role, taskText) {
    if (!card) return;
    card = card.toLowerCase();  // keyed lowercase — look up with name.toLowerCase()
    if (!DIARY_BY_CARD[card]) DIARY_BY_CARD[card] = [];
    // Avoid duplicate entries when same card appears at both tier and task level
    const key = `${diaryName}|${tier}|${role}|${taskText||''}`;
    if (DIARY_BY_CARD[card].some(e => `${e.diaryName}|${e.tier}|${e.role}|${e.task||''}` === key)) return;
    DIARY_BY_CARD[card].push({ diaryName, tier, role, task: taskText || null });
  }
  for (const area of DIARY_DATA) {
    for (const tier of DIARY_TIERS) {
      const t = area[tier];
      if (!t) continue;
      // Task-level: index items, monsters, npc from each individual task
      for (const taskObj of (t.tasks || [])) {
        if (typeof taskObj !== 'object') continue;
        const taskText = taskObj.task || null;
        for (const i of (taskObj.items    || [])) _add(i, area.name, tier, 'item',    taskText);
        for (const m of (taskObj.monsters || [])) _add(m, area.name, tier, 'monster', taskText);
        if (taskObj.npc) _add(taskObj.npc, area.name, tier, 'npc', taskText);
        for (const n of (taskObj.npcs || [])) _add(n, area.name, tier, 'npc', taskText);
        for (const g of (taskObj.itemsAny || [])) for (const c of g) _add(c, area.name, tier, 'item', taskText);
        for (const g of (taskObj.monstersAny || [])) for (const c of g) _add(c, area.name, tier, 'monster', taskText);
        for (const st of ((taskObj.setsAny || {}).sets || [])) for (const c of st.items) _add(c, area.name, tier, 'item', taskText);
      }
    }
  }
}

// ── Dev check: card/quest names in hand-written data ───────────────────────
// Runs after data load. Warns (console only) for any name in SLAYER_TASKS,
// SLAYER_CARD_GATES, BOSS_DATA or DIARY_DATA that isn't a TCG card, and any
// quest name missing from quests.json (would never match completedQuests).
// Diary `npc` fields are skipped — many task NPCs intentionally aren't cards.
function _validateDataNames() {
  if (!Object.keys(monsterDrops).length || !Object.keys(questsData).length) return;
  const bad = [];
  const card = (n, where) => { if (!_cardInfo(n)) bad.push(`card "${n}" (${where})`); };
  const quest = (q, where) => { if (!(q in questsData)) bad.push(`quest "${q}" (${where})`); };
  for (const [c, g] of Object.entries(SLAYER_CARD_GATES)) {
    card(c, 'SLAYER_CARD_GATES');
    (g.quests || []).forEach(q => quest(q, 'SLAYER_CARD_GATES ' + c));
  }
  for (const [m, v] of Object.entries(SLAYER_TASKS))
    for (const t of v.tasks) t.cards.forEach(c => card(c, `SLAYER_TASKS ${m}/${t.task}`));
  for (const b of BOSS_DATA) {
    [...(b.requirements || []), ...(b.lootRequirements || [])].filter(r => !r.group && !r.tool)  // shared lists are checked where defined
      .forEach(r => (r.cards || []).forEach(c => card(c, `bosses.json ${b.name}`)));
    (b.relatedCards || []).forEach(c => card(c, `bosses.json ${b.name}`));
    (b.quests || []).forEach(q => quest(q, `bosses.json ${b.name}`));
  }
  for (const qs of Object.values(AREA_QUESTS)) qs.forEach(q => quest(q, 'AREA_QUESTS'));
  for (const area of DIARY_DATA) for (const tier of DIARY_TIERS) {
    const t = area[tier]; if (!t) continue;
    const where = `DIARY_DATA ${area.name} ${tier}`;
    [...(t.items || []), ...(t.monsters || [])].forEach(c => card(c, where));
    (t.quests || []).forEach(q => quest(q, where));
    for (const x of (t.tasks || [])) {
      if (typeof x !== 'object') continue;
      [...(x.items || []), ...(x.monsters || [])].forEach(c => card(c, where));
      (x.quests || []).forEach(q => quest(q, where));
    }
  }
  if (bad.length) console.warn(`[data check] ${bad.length} unresolved name(s):\n  ` + [...new Set(bad)].join('\n  '));
  else console.info('[data check] all card and quest names resolve');
}

// ── Evaluate a single tier ──────────────────────────────────────────────────
function evaluateDiaryTier(area, tier) {
  const t = area[tier];
  if (!t) return null;

  // Area-wide quests (true blockers — can't start any task without these, e.g. Priest in
  // Peril for Morytania). The tier's own quest list is the union of its tasks' quests, so
  // those are shown per task below rather than blocking the whole tier.
  const tierQuestSet = new Set(AREA_QUESTS[area.name] || []);
  const blockers = [];
  for (const q of tierQuestSet) {
    if (!completedQuests.has(q)) blockers.push('Quest: ' + q);
  }

  // Collect all quests required by individual tasks (not already in tier quests)
  const taskQuestMap = new Map(); // quest → {tasks:[taskText], partial}
  for (const taskObj of (t.tasks || [])) {
    if (typeof taskObj !== 'object') continue;
    const add = (q, partial) => {
      if (tierQuestSet.has(q)) return; // already shown as a blocker
      if (!taskQuestMap.has(q)) taskQuestMap.set(q, { tasks: [], partial });
      const e = taskQuestMap.get(q);
      e.tasks.push(taskObj.task || '');
      e.partial = e.partial && partial;  // full completion wins if any task needs it
    };
    for (const q of (taskObj.quests || [])) add(q, false);
    for (const q of (taskObj.partialQuests || [])) add(q, true);
  }
  const taskQuestGates = [...taskQuestMap.entries()].map(([quest, e]) => ({
    quest,
    done: completedQuests.has(quest),
    partial: e.partial,
    tasks: e.tasks,
  }));

  // Skill gates (informational — shown amber, not hard blockers)
  const levelGates = [];
  for (const [skill, req] of Object.entries(t.skills || {})) {
    if (req <= 1) continue; // level 1 is no real requirement
    const have = getLevel(skill);
    levelGates.push({ skill, have, req, ok: have >= req });
  }

  // Item cards (plus "any one of" groups — a group with nothing owned counts as missing)
  const ownedItems   = (t.items || []).filter(i => isOwned(i));
  const missingItems = (t.items || []).filter(i => !isOwned(i));
  for (const task of (t.tasks || [])) {
    for (const g of (task.itemsAny || []))
      if (!g.some(c => isOwned(c))) missingItems.push(g.join(' or '));
    for (const g of (task.monstersAny || []))
      if (!g.some(c => isOwned(c))) missingItems.push(g.join(' or '));
    if (task.lightSource && !LIGHT_SOURCE_ITEMS.some(c => isOwned(c))) missingItems.push('any light source');
    if (task.setsAny && !(task.setsAny.sets || []).some(st => st.items.every(c => isOwned(c)))) missingItems.push(task.setsAny.label);
    for (const g of (task.anyOf || [])) {
      const met = o => o.card ? isOwned(o.card) : o.skill ? getLevel(o.skill) >= o.level : completedQuests.has(o.quest);
      if (!g.some(met)) missingItems.push(g.map(o => o.card || o.quest || `${o.skill} ${o.level}`).join(' or '));
    }
  }

  // Monster + NPC cards (any NPC interaction needs its card), incl. the reward NPC
  const _npcs = [...(t.monsters || []), ...(t.npcs || []), ...(area.rewardNpc && _isCard(area.rewardNpc) ? [area.rewardNpc] : [])];
  const ownedMonsters   = [...new Set(_npcs)].filter(m => isOwned(m));
  const missingMonsters = [...new Set(_npcs)].filter(m => !isOwned(m));

  let status;
  if (blockers.length > 0) status = 'locked';
  else if (missingItems.length > 0 || missingMonsters.length > 0 || levelGates.some(g => !g.ok)) status = 'partial';
  else status = 'available';

  return { status, blockers, taskQuestGates, levelGates, ownedItems, missingItems, ownedMonsters, missingMonsters };
}

// ── Left-pane list ──────────────────────────────────────────────────────────
function renderDiaryList() {
  const listEl = document.getElementById('diary-list-scroll');
  if (!listEl) return;

  const q = diarySearch.toLowerCase();
  const filtered = DIARY_DATA.filter(a => !q || a.name.toLowerCase().includes(q));

  let html = '';
  for (const area of filtered) {
    const isSel = area.name === selectedDiary;

    // Compute per-tier status for pip dots (task-based)
    const pips = DIARY_TIERS.map(tier => {
      const t2 = area[tier];
      if (!t2) return '';
      const ev2   = evaluateDiaryTier(area, tier);
      const tasks2 = t2.tasks || [];
      const done2  = tasks2.filter((_, i) => isDiaryTicked(area.name, tier, 'task', String(i))).length;
      const skillsOk2 = ev2.levelGates.every(g => g.ok);
      let st2;
      if (done2 === tasks2.length && skillsOk2) st2 = 'available';
      else st2 = 'partial';
      const col = st2 === 'available' ? '#3a7a3a' : st2 === 'partial' ? '#7a6010' : '#5a2020';
      return `<span class="diary-tier-pip" style="background:${col}" title="${DIARY_TIER_LABEL[tier]}: ${st2}"></span>`;
    }).join('');

    html += `<div class="diary-item${isSel?' selected':''}" onclick="showDiary('${escHtml(area.name)}')">
      <div style="font-size:12px;color:${isSel?'#e8c97a':'#bbb'};margin-bottom:3px">${escHtml(area.name)}</div>
      <div>${pips}</div>
    </div>`;
  }

  if (!html) html = `<div style="padding:16px;color:#444;font-size:12px">No diaries match.</div>`;
  listEl.innerHTML = html;
}

// ── Diary tick helpers (localStorage-backed manual task completion) ──────────
function _diaryTickKey(dn, tier, type, task) {
  return `dtick\x1f${dn}\x1f${tier}\x1f${type}\x1f${task}`;
}
function isDiaryTicked(dn, tier, type, task) {
  return localStorage.getItem(_diaryTickKey(dn, tier, type, task)) === '1';
}
function toggleDiaryTick(dn, tier, type, task) {
  const k = _diaryTickKey(dn, tier, type, task);
  if (localStorage.getItem(k) === '1') localStorage.removeItem(k);
  else localStorage.setItem(k, '1');
  showDiaryDetail(dn);
}
// A task's unmet requirements, each one unit (same units as _diaryTaskUnits):
// {label, cards:[options], quest?, skill?}. Area-wide quests count too.
function _diaryTaskMissing(area, task) {
  const miss = [], seen = new Set();
  const push = (key, m) => { if (!seen.has(key)) { seen.add(key); miss.push(m); } };
  for (const q of (AREA_QUESTS[area.name] || [])) if (!completedQuests.has(q)) push('q:' + q, { label: q, quest: q, cards: [] });
  if (typeof task !== 'object') return miss;
  for (const [sk, l] of Object.entries(task.skills || {}))
    if (typeof l === 'number' && l > 1 && getLevel(sk) < l) push('s:' + sk, { label: `${sk} ${l}`, skill: sk, level: l, cards: [] });
  for (const q of [...(task.quests || []), ...(task.partialQuests || [])]) if (!completedQuests.has(q)) push('q:' + q, { label: q, quest: q, cards: [] });
  for (const c of [...(task.items || []), ...(task.monsters || []), ...(task.npcs || [])])
    if (_isCard(c) && !isOwned(c)) push('c:' + c.toLowerCase(), { label: _cardInfo(c).exact, cards: [_cardInfo(c).exact] });
  for (const g of [...(task.itemsAny || []), ...(task.monstersAny || [])])
    if (!g.some(c => isOwned(c))) push('g:' + g.join('|'), { label: 'Any of: ' + g.slice(0, 3).join(', ') + (g.length > 3 ? '…' : ''), cards: g.filter(_isCard) });
  for (const g of (task.skillsAny || []))
    if (!g.some(o => Object.entries(o).every(([sk, l]) => getLevel(sk) >= l)))
      push('sa:' + JSON.stringify(g), { label: g.map(o => Object.entries(o)[0].join(' ')).join(' or '), cards: [] });
  for (const g of (task.anyOf || []))
    if (!g.some(o => o.card ? isOwned(o.card) : o.skill ? getLevel(o.skill) >= o.level : completedQuests.has(o.quest)))
      push('a:' + JSON.stringify(g), { label: g.map(o => o.card || o.quest || `${o.skill} ${o.level}`).join(' or '), cards: g.filter(o => o.card).map(o => o.card) });
  for (const tool of (task.tools || [])) {
    const tiers = TOOL_TIERS[tool];
    if (tiers && !tiers.some(tt => isOwned(tt.name))) push('t:' + tool, { label: 'Any ' + tool.toLowerCase(), cards: tiers.map(t => t.name) });
  }
  if (task.lightSource && !LIGHT_SOURCE_ITEMS.some(c => isOwned(c))) push('light', { label: 'Any light source', cards: LIGHT_SOURCE_ITEMS.filter(_isCard) });
  if (task.setsAny && !(task.setsAny.sets || []).some(st => st.items.every(c => isOwned(c)))) push('set', { label: task.setsAny.label, cards: [] });
  return miss;
}
// A missing diary unit as a link: quest → quest page; one card → card page; group → hover grid
function _diaryMissingLink(m, area, tier) {
  const style = 'cursor:pointer;color:#c8a060;text-decoration:underline dotted';
  if (m.quest) return `<span style="${style}" data-quest="${escHtml(m.quest)}" onclick="_navToQuest(this)">${escHtml(m.label)}</span>`;
  if (m.cards.length === 1) { const i = _cardInfo(m.cards[0]); return `<span style="${style}" data-nav="${escHtml(i.exact)}" data-nav-type="${i.type}" onclick="_navToCard(this)">${escHtml(i.exact)}</span>`; }
  return `<span style="${style}" data-dn="${escHtml(area.name)}" data-tier="${tier}" onclick="showDiary(this.dataset.dn);selectDiaryTier(this.dataset.dn,this.dataset.tier)"
    ${m.cards.length > 1 ? _cardGridTipAttrs(m.cards, m.label) : ''}>${escHtml(m.label)}</span>`;
}
// Diaries home panel (no diary selected)
function _renderDiaryHome() {
  const pane = document.getElementById('diary-detail-pane');
  if (!pane) return;
  const tiers = [];   // {area, tier, tasks:[{task, i, done, missing}]}
  for (const area of DIARY_DATA)
    for (const tier of DIARY_TIERS) {
      if (!area[tier]) continue;
      const tasks = (area[tier].tasks || []).map((task, i) => {
        const done = isDiaryTicked(area.name, tier, 'task', String(i));
        return { task, i, done, missing: done ? [] : _diaryTaskMissing(area, task) };
      });
      tiers.push({ area, tier, tasks });
    }
  const allTasks = tiers.flatMap(t => t.tasks);
  const elig = t => t.done || !t.missing.length;
  const tierDone = tiers.filter(t => t.tasks.every(x => x.done)).length;
  const tierElig = tiers.filter(t => t.tasks.every(elig)).length;
  const tile = (label, v, col) => `<div style="flex:1;min-width:110px;background:#111;border:1px solid #222;border-radius:4px;padding:10px 12px">
    <div style="font-size:20px;font-weight:700;color:${col};font-variant-numeric:tabular-nums">${v}</div><div style="font-size:10px;color:#666;text-transform:uppercase;letter-spacing:.05em">${label}</div></div>`;
  // Area × tier grid of eligible tasks
  const grid = `<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:11px;width:100%">
    <tr><th style="text-align:left;color:#666;font-weight:normal;padding:3px 6px">Area</th>${DIARY_TIERS.map(t => `<th style="color:${DIARY_TIER_COLOR[t]};font-weight:600;padding:3px 6px;text-align:left">${DIARY_TIER_LABEL[t]}</th>`).join('')}</tr>
    ${DIARY_DATA.map(area => `<tr><td style="padding:3px 6px;color:#ccc;cursor:pointer" data-dn="${escHtml(area.name)}" onclick="showDiary(this.dataset.dn)">${escHtml(area.name)}</td>${DIARY_TIERS.map(tier => {
      const t = tiers.find(x => x.area === area && x.tier === tier);
      if (!t) return '<td></td>';
      const e = t.tasks.filter(elig).length, n = t.tasks.length, d = t.tasks.every(x => x.done);
      const pct = n ? Math.round(100 * e / n) : 0, col = d ? '#76c442' : e === n ? '#5a9a5a' : '#c8a830';
      return `<td style="padding:3px 6px;cursor:pointer" data-dn="${escHtml(area.name)}" data-tier="${tier}" onclick="showDiary(this.dataset.dn);selectDiaryTier(this.dataset.dn,this.dataset.tier)" title="${e}/${n} tasks eligible${d ? ' · done' : ''}">
        <div style="display:flex;align-items:center;gap:6px"><div style="width:60px;height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${col}"></div></div>
        <span style="color:${col};font-variant-numeric:tabular-nums">${d ? '✓' : `${e}/${n}`}</span></div></td>`;
    }).join('')}</tr>`).join('')}</table></div>`;
  // Closest tiers: not done, fewest tasks still blocked
  const closest = tiers.filter(t => !t.tasks.every(x => x.done))
    .map(t => { const blocked = t.tasks.filter(x => !elig(x));
      return { ...t, blocked, distinct: new Set(blocked.flatMap(x => x.missing.map(m => m.label))).size }; })
    // closest = fewest distinct things still missing (then fewest blocked tasks)
    .sort((a, b) => a.distinct - b.distinct || a.blocked.length - b.blocked.length || a.area.name.localeCompare(b.area.name)).slice(0, 10);
  const closestHtml = closest.map(t => {
    const miss = new Map();
    for (const x of t.blocked) for (const m of x.missing) if (!miss.has(m.label)) miss.set(m.label, m);
    const ms = [...miss.values()];
    return `<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:11px">
      <span style="width:190px;flex-shrink:0;color:#ccc;cursor:pointer" data-dn="${escHtml(t.area.name)}" data-tier="${t.tier}" onclick="showDiary(this.dataset.dn);selectDiaryTier(this.dataset.dn,this.dataset.tier)">${escHtml(t.area.name)} <span style="color:${DIARY_TIER_COLOR[t.tier]}">${DIARY_TIER_LABEL[t.tier]}</span></span>
      <span style="width:80px;flex-shrink:0;color:#c8a830;font-variant-numeric:tabular-nums">${t.blocked.length ? `${t.blocked.length} blocked` : 'all eligible'}</span>
      <span style="color:#888">${ms.length ? 'missing: ' + ms.slice(0, 5).map(m => _diaryMissingLink(m, t.area, t.tier)).join(' · ') + (ms.length > 5 ? ` +${ms.length - 5}` : '') : 'tick the remaining tasks'}</span></div>`;
  }).join('');
  // Blockers: quests and skill levels locking the most tasks
  const gates = new Map();
  for (const t of tiers) for (const x of t.tasks) for (const m of x.missing) {
    if (!m.quest && !m.skill) continue;
    const key = m.quest ? 'q:' + m.quest : 's:' + m.skill + m.level;
    if (!gates.has(key)) gates.set(key, { m, n: 0, first: t });
    gates.get(key).n++;
  }
  const gateHtml = [...gates.values()].sort((a, b) => b.n - a.n).slice(0, 12).map(g => `<div style="display:flex;gap:8px;padding:3px 0;font-size:11px">
      <span style="width:260px;flex-shrink:0">${g.m.quest ? _diaryMissingLink(g.m, g.first.area, g.first.tier)
        : `<span style="cursor:pointer;color:#ccc;text-decoration:underline dotted" data-dn="${escHtml(g.first.area.name)}" data-tier="${g.first.tier}" onclick="showDiary(this.dataset.dn);selectDiaryTier(this.dataset.dn,this.dataset.tier)">${escHtml(g.m.label)} <span style="color:#666">(you: ${getLevel(g.m.skill)})</span></span>`}</span>
      <span style="color:#c85040;font-variant-numeric:tabular-nums">blocks ${g.n} task${g.n === 1 ? '' : 's'}</span></div>`).join('');
  // Most-needed cards, counted per task (not done, not eligible)
  const demand = new Map();
  for (const t of tiers) for (const x of t.tasks) {
    if (x.done || !x.missing.length) continue;
    const id = `${t.area.name} ${DIARY_TIER_LABEL[t.tier]} #${x.i + 1}`;
    for (const m of x.missing) for (const c of m.cards) {
      if (isOwned(c)) continue;
      if (!demand.has(c)) demand.set(c, { quests: new Set(), last: new Set() });
      demand.get(c).quests.add(id);
      if (x.missing.length === 1) demand.get(c).last.add(id);
    }
  }
  const box = (title, sub, inner) => inner ? `<div style="background:#111;border:1px solid #222;border-radius:4px;padding:12px 14px;margin-bottom:14px">
    <div style="color:#c8a830;font-weight:700;font-size:12px;margin-bottom:2px">${title}</div><div style="color:#666;font-size:10px;margin-bottom:8px">${sub}</div>${inner}</div>` : '';
  pane.innerHTML = `<div style="padding:20px 24px;max-width:860px">
    <h1 style="font-size:18px;color:#e8c97a;margin:0 0 12px">Achievement Diaries</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      ${tile('Tiers done', `${tierDone}/${tiers.length}`, '#76c442')}${tile('Tiers fully eligible', `${tierElig}/${tiers.length}`, '#5a9a5a')}
      ${tile('Tasks eligible', `${allTasks.filter(elig).length}/${allTasks.length}`, '#c8a830')}${tile('Tasks done', `${allTasks.filter(x => x.done).length}/${allTasks.length}`, '#aaa')}
    </div>
    <div style="margin-bottom:14px">${_progressBar('Tasks eligible', { done: allTasks.filter(elig).length, total: allTasks.length }, '#c8a830', 'Tasks you can do now (every requirement met) or have ticked done')}</div>
    ${box('Eligible tasks by diary', 'Click an area or tier to open it', grid)}
    ${box('Closest tiers', 'Unfinished tiers with the fewest distinct requirements still missing', closestHtml)}
    ${box('Biggest blockers', 'Quests and skill levels that block the most tasks', gateHtml)}
    ${_demandTableHtml(demand, 'Most-needed cards for diaries', 'task', 'Most-needed for diaries')}
  </div>`;
}

function selectDiaryTier(dn, tier) {
  selectedDiaryTier = tier;
  showDiaryDetail(dn);
}

// Wishlist all missing cards from a diary tier
// Every card a diary tier needs: task items, monsters to kill, NPCs to interact with,
// plus the reward NPC (to claim) and the cards its rewards involve (lamp, diary item…).
function _diaryTierCards(area, tier) {
  const t = area[tier];
  if (!t) return [];
  const cards = [...(t.items || []), ...(t.monsters || []), ...(t.npcs || [])];
  if (area.rewardNpc) cards.push(area.rewardNpc);
  for (const r of (t.rewards || [])) cards.push(...(r.items || []), ...(r.monsters || []), ...(r.npcs || []));
  return [...new Set(cards)].filter(c => _isCard(c));
}

function wishlistDiaryTier(diaryName, tier) {
  const area = DIARY_DATA.find(a => a.name === diaryName);
  if (!area || !area[tier]) return;
  const label = `${diaryName} ${tier.charAt(0).toUpperCase()+tier.slice(1)}`;
  let added = 0;
  for (const card of _diaryTierCards(area, tier)) {
    if (!isOwned(card) && !wishlist.has(card)) {
      wishlist.set(card, { note: label });
      added++;
    }
  }
  if (added > 0) _saveWishlist();
  // Brief feedback flash on button
  const btn = document.getElementById(`wl-tier-btn-${tier}`);
  if (btn) { btn.textContent = `+${added} added`; btn.style.color='#76c442'; setTimeout(()=>{ btn.textContent='☆ Wishlist missing'; btn.style.color=''; }, 1800); }
}

// ── Right-pane detail ───────────────────────────────────────────────────────
// Diary requirement units: one per distinct requirement (skill, quest, card, tool, and each
// "any of" group counted once, met if any option is owned). `add(key, ok)` dedupes by key.
function _diaryTaskUnits(task, add) {
  if (typeof task !== 'object') return;
  for (const [skill, lvl] of Object.entries(task.skills || {}))
    if (typeof lvl === 'number' && lvl > 1) add('s:' + skill + ':' + lvl, getLevel(skill) >= lvl);
  for (const q of [...(task.quests || []), ...(task.partialQuests || [])]) add('q:' + q, completedQuests.has(q));
  for (const c of [...(task.items || []), ...(task.monsters || []), ...(task.npcs || [])])
    if (_isCard(c)) add('c:' + c.toLowerCase(), isOwned(c));
  for (const g of [...(task.itemsAny || []), ...(task.monstersAny || [])])
    add('g:' + [...g].sort().join('|'), g.some(c => isOwned(c)));
  for (const g of (task.skillsAny || []))
    add('sa:' + JSON.stringify(g), g.some(o => Object.entries(o).every(([sk, l]) => getLevel(sk) >= l)));
  for (const g of (task.anyOf || []))
    add('a:' + JSON.stringify(g), g.some(o => o.card ? isOwned(o.card) : o.skill ? getLevel(o.skill) >= o.level : completedQuests.has(o.quest)));
  for (const tool of (task.tools || [])) {
    const tiers = TOOL_TIERS[tool];
    if (tiers) add('t:' + tool, tiers.some(tt => isOwned(tt.name)));
    else if (_isCard(tool)) add('c:' + tool.toLowerCase(), isOwned(tool));
  }
  if (task.lightSource) add('light', LIGHT_SOURCE_ITEMS.some(c => isOwned(c)));
  if (task.setsAny) add('set:' + task.setsAny.label, (task.setsAny.sets || []).some(st => st.items.every(c => isOwned(c))));
}
// Tier requirements met / total: the tier's distinct units (skills at the tier's max level),
// plus area-wide quests and the reward NPC.
function _diaryTierProgress(area, tier) {
  const t = area[tier];
  if (!t) return { done: 0, total: 0 };
  const units = new Map();
  const add = (key, ok) => { if (!units.has(key)) units.set(key, ok); };
  for (const q of (AREA_QUESTS[area.name] || [])) add('q:' + q, completedQuests.has(q));
  if (area.rewardNpc && _isCard(area.rewardNpc)) add('c:' + area.rewardNpc.toLowerCase(), isOwned(area.rewardNpc));
  for (const [skill, lvl] of Object.entries(t.skills || {})) if (lvl > 1) add('s:' + skill, getLevel(skill) >= lvl);
  for (const task of (t.tasks || [])) _diaryTaskUnits({ ...task, skills: {} }, add);  // tier max levels above
  const vals = [...units.values()];
  return { done: vals.filter(Boolean).length, total: vals.length };
}
// Eligible tasks / total: a task is eligible when it's ticked done, or every one of its
// requirements (plus the area-wide quests) is met.
function _diaryTaskEligible(area, task) {
  let ok = (AREA_QUESTS[area.name] || []).every(q => completedQuests.has(q));
  if (ok) _diaryTaskUnits(task, (_, met) => { if (!met) ok = false; });
  return ok;
}
function _diaryEligibleTasks(area, tier) {
  const tasks = area[tier]?.tasks || [];
  const done = tasks.filter((task, i) => isDiaryTicked(area.name, tier, 'task', String(i)) || _diaryTaskEligible(area, task)).length;
  return { done, total: tasks.length };
}

function showDiaryDetail(name) {
  selectedDiary = name;
  renderDiaryList();

  const pane = document.getElementById('diary-detail-pane');
  if (!pane) return;

  const area = DIARY_DATA.find(a => a.name === name);
  if (!area) return;

  // Default tier selection
  if (!selectedDiaryTier || !area[selectedDiaryTier]) {
    selectedDiaryTier = DIARY_TIERS.find(t => area[t]) || 'easy';
  }

  // Count ticked tasks out of total tasks for a tier
  function countTasks(tier) {
    const t = area[tier];
    if (!t) return { done: 0, total: 0 };
    const tasks = t.tasks || [];
    const done  = tasks.filter((_, i) => isDiaryTicked(name, tier, 'task', String(i))).length;
    return { done, total: tasks.length };
  }

  // Status for the top strip chip
  function chipStatus(tier) {
    const t = area[tier];
    if (!t) return null;
    const ev = evaluateDiaryTier(area, tier);
    const c = countTasks(tier);
    const skillsOk = ev.levelGates.every(g => g.ok);
    return (c.done === c.total && skillsOk) ? 'available' : 'partial';
  }

  const wikiHref = `https://oldschool.runescape.wiki/w/${encodeURIComponent(area.name.replace(/ /g,'_'))}_Diary`;

      <a href="${wikiHref}" target="_blank" style="font-size:11px;color:#4a6a8a;text-decoration:none">\u2197 wiki</a>
    </div>
    ${area.rewardNpc ? (() => {
      const ci = _cardInfo(area.rewardNpc);
      if (!ci) {
        return `<div style="font-size:11px;color:#555;margin-bottom:12px;display:flex;align-items:center;gap:6px">Collect rewards from:

            title="This NPC is not a TCG card">${escHtml(area.rewardNpc)} <span style="font-size:9px;opacity:0.5">not a card</span></span>
        </div>`;
      }
      const npcOwned = isOwned(ci.exact);
      const npcCol   = npcOwned ? '#5a9a5a' : '#c05050';
      const npcBg    = npcOwned ? '#0a180a' : '#180808';
      const npcBdr   = npcOwned ? '#2a5a2a' : '#5a2a2a';
      const npcSym   = npcOwned ? '\u2713' : '\u2717';
      return `<div style="font-size:11px;color:#555;margin-bottom:12px;display:flex;align-items:center;gap:6px">Collect rewards from:
        <span data-card="${escHtml(ci.exact)}" data-type="${ci.type}" onclick="showCard(this.dataset.card,this.dataset.type)"
          style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:3px;background:${npcBg};border:1px solid ${npcBdr};color:${npcCol};cursor:pointer;font-size:11px"
          title="${npcOwned?'Owned — you can claim rewards. Click to view':'Card needed to claim rewards — click to view'}">${npcSym} ${escHtml(area.rewardNpc)}</span>
      </div>`;
    })() : '<div style="margin-bottom:12px"></div>'}
    <div style="display:flex;gap:8px;margin-bottom:20px">`;

  for (const tier of DIARY_TIERS) {
    if (!area[tier]) continue;
    const st     = chipStatus(tier);
    const c      = countTasks(tier);
    const isAct  = tier === selectedDiaryTier;
    const stCol  = st==='available'?'#76c442':st==='partial'?'#c8a020':'#c85040';
    const stLbl  = st==='available'?'Ready'  :st==='partial'?'Partial':'Locked';
    const aBg    = isAct ? DIARY_TIER_BG[tier]   : '#0e0e0e';
    const aBdr   = isAct ? DIARY_TIER_COLOR[tier] : '#2a2a2a';

    html += `<div data-dn="${escHtml(name)}" data-tier="${tier}"
        onclick="selectDiaryTier(this.dataset.dn,this.dataset.tier)"
        style="flex:1;min-width:100px;padding:10px 12px;background:${aBg};border:2px solid ${aBdr};border-radius:6px;cursor:pointer">
      <div style="font-size:12px;font-weight:700;color:${DIARY_TIER_COLOR[tier]};margin-bottom:3px">${DIARY_TIER_LABEL[tier]}</div>
      <div style="font-size:11px;color:${stCol};margin-bottom:3px">${stLbl}</div>
      <div style="font-size:10px;color:#555">${c.done}/${c.total} tasks</div>
      ${(() => { const p = _diaryTierProgress(area, tier), pct = p.total ? Math.round(100 * p.done / p.total) : 100;
        return `<div style="margin-top:5px;height:4px;background:#1a1a1a;border-radius:2px;overflow:hidden" title="Requirements met: ${p.done}/${p.total}"><div style="width:${pct}%;height:100%;background:${p.done === p.total ? '#5a9a5a' : '#c8a830'}"></div></div>
          <div style="font-size:9px;color:#555;margin-top:2px">${p.done}/${p.total} reqs · ${_diaryEligibleTasks(area, tier).done}/${c.total} eligible</div>`; })()}
    </div>`;
  }
  html += `</div>`;

  // ── Selected tier detail ───────────────────────────────────────────────────
  const tier = selectedDiaryTier;
  const t = area[tier];
  if (t) {
    const ev = evaluateDiaryTier(area, tier);
    const hasMissingCards = _diaryTierCards(area, tier).some(c => !isOwned(c));

    html += `<div style="background:#111;border-radius:6px;border:1px solid #222;padding:14px 16px">`;

    // Header: tier name + wishlist button
    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="font-size:13px;font-weight:700;color:${DIARY_TIER_COLOR[tier]}">${DIARY_TIER_LABEL[tier]}</span>
      ${hasMissingCards ? `<button id="wl-tier-btn-${tier}"
        data-dn="${escHtml(name)}" data-tier="${tier}"
        onclick="wishlistDiaryTier(this.dataset.dn,this.dataset.tier)"
        style="font-size:10px;background:none;border:1px solid #333;border-radius:3px;color:#666;padding:2px 8px;cursor:pointer">☆ Wishlist missing cards</button>` : ''}
    </div>
    <div style="margin:-6px 0 12px">
      ${(() => { const sum = f => { const all = DIARY_TIERS.filter(x => area[x]).map(x => f(area, x));
          return { done: all.reduce((n, p) => n + p.done, 0), total: all.reduce((n, p) => n + p.total, 0) }; };
        return _progressBar(`${DIARY_TIER_LABEL[tier]} eligible tasks`, _diaryEligibleTasks(area, tier), '#6a9a6a', 'Tasks you can do now (every requirement met) or have ticked done')
          + _progressBar('All tiers eligible', sum(_diaryEligibleTasks), '#888', 'Eligible tasks across every tier of this diary')
          + _progressBar(`${DIARY_TIER_LABEL[tier]} requirements`, _diaryTierProgress(area, tier), '#c8a830', 'Distinct requirements across this tier\'s tasks: skills, quests, cards, tools (an "any of" group counts once)')
          + _progressBar('All tiers requirements', sum(_diaryTierProgress), '#888', 'Sum over every tier of this diary'); })()}
    </div>`;

    // ── Prerequisites (compact auto-detected section) ────────────────────────
    const hasPrereqs = ev.blockers.length || ev.levelGates.length || ev.taskQuestGates.length;
    if (hasPrereqs) {
      html += `<div style="margin-bottom:14px;padding:10px 12px;background:#0a0a0a;border-radius:4px;border:1px solid #1a1a1a">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#3a3a3a;margin-bottom:7px">Prerequisites</div>`;

      // Tier-wide quest requirements (block the whole tier)
      for (const b of ev.blockers) {
        const qName = b.replace(/^Quest: /, '');
        const done  = completedQuests.has(qName);
        const col   = done ? '#4a7a4a' : '#7a3a3a';
        const icon  = done ? '\u2713' : '\u2717';
        html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:${col}">
          <span>${icon}</span><span>${escHtml(qName)}</span></div>`;
      }

      // Skill requirements
      for (const { skill, have, req, ok } of ev.levelGates) {
        const col     = ok ? '#4a7a4a' : '#7a6a20';
        const icon    = ok ? '\u2713' : '\u26a0\ufe0f';
        const lvlText = ok ? `${req}` : `${have}/${req}`;
        html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:${col}">
          <span>${icon}</span>${skillIcon(skill,13)}<span>${skill} ${lvlText}</span></div>`;
      }

      // Per-task quest requirements (only block individual tasks)
      if (ev.taskQuestGates.length) {
        if (ev.blockers.length || ev.levelGates.length) {
          html += `<div style="margin-top:6px;border-top:1px solid #1a1a1a"></div>`;
        }
        html += `<div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#2a2a2a;margin:5px 0 3px">Some tasks require</div>`;
        for (const { quest, done, partial, tasks } of ev.taskQuestGates) {
          const col  = done ? '#4a7a4a' : '#7a3a3a';
          const icon = done ? '\u2713' : '\u2717';
          const tip  = (partial ? 'Started / partial completion is enough. ' : '') + tasks.join('; ');
          html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px;color:${col}" title="${escHtml(tip)}">
            <span>${icon}</span><span>${escHtml(quest)}</span>${partial ? '<span style="font-size:9px;color:#555">partial</span>' : ''}</div>`;
        }
      }

      html += `</div>`;
    }

    // ── Task checklist ───────────────────────────────────────────────────────
    const tasks = t.tasks || [];
    if (tasks.length) {
      html += `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#3a3a3a;margin-bottom:6px">Tasks</div>`;
      tasks.forEach((taskObj, i) => {
        const taskText    = typeof taskObj === 'object' ? taskObj.task : taskObj;
        const rawSkills   = (typeof taskObj === 'object' && taskObj.skills)   ? taskObj.skills   : {};
        // Filter out non-numeric keys the data script may have nested inside skills
        const reqSkills   = Object.fromEntries(Object.entries(rawSkills).filter(([,v]) => typeof v === 'number'));
        const nestedItems = Array.isArray(rawSkills.items) ? rawSkills.items : [];
        const nestedTools = Array.isArray(rawSkills.tools) ? rawSkills.tools : [];
        const reqItems    = [...(typeof taskObj === 'object' && taskObj.items   ? taskObj.items   : []), ...nestedItems];
        const reqMonsters = (typeof taskObj === 'object' && taskObj.monsters) ? taskObj.monsters : [];
        const reqNpc      = (typeof taskObj === 'object' && taskObj.npc)      ? taskObj.npc      : null;
        const reqTools    = [...(typeof taskObj === 'object' && taskObj.tools  ? taskObj.tools   : []), ...nestedTools];
        const _areaQuests = (typeof AREA_QUESTS !== 'undefined' && AREA_QUESTS[name]) ? AREA_QUESTS[name] : [];
        const _taskQuests = (typeof taskObj === 'object' && taskObj.quests) ? taskObj.quests : [];
        const reqQuests   = [...new Set([..._areaQuests, ..._taskQuests])];

        const ticked = isDiaryTicked(name, tier, 'task', String(i));
        const boxBdr = ticked ? '#2a5a2a' : '#303030';
        const boxBg  = ticked ? '#1a3a1a' : '#141414';
        const rowBg  = ticked ? '#080e08' : '#0c0c0c';
        const rowBdr = ticked ? '#182218' : '#181818';

        // Build inline requirement badges
        let reqHtml = '';
        for (const [skill, req] of Object.entries(reqSkills)) {
          const have = getLevel(skill);
          const ok   = have >= req;
          const col  = ok ? '#2a5a2a' : '#4a3a0a';
          const tcol = ok ? '#4a9a4a' : '#a08020';
          const nb   = (taskObj.notBoostable || []).includes(skill);
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:${ok?'#0d1e0d':'#161000'};border:1px solid ${col};font-size:10px;color:${tcol}"
            title="${nb ? 'Not boostable \u2014 needs the real level' : 'Boostable'}">${skillIcon(skill,10)}${escHtml(skill)} ${req}${nb ? ' <span style="font-size:8px;opacity:.7">nb</span>' : ''}</span>`;
        }
        for (const q of reqQuests) {
          const done = completedQuests.has(q);
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:${done?'#0a180a':'#180808'};border:1px solid ${done?'#2a5a2a':'#5a2a2a'};font-size:10px;color:${done?'#5a9a5a':'#c05050'}"
            title="${done?'Quest complete':'Quest required'}">${done?'\u2713':'\u2717'} ${escHtml(q)}</span>`;
        }
        const _qChip = (q, label) => {
          const done = completedQuests.has(q);
          return `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${done?'#0a180a':'#180808'};border:1px solid ${done?'#2a5a2a':'#5a2a2a'};color:${done?'#5a9a5a':'#c05050'}"
            title="${done?'Quest complete':label}">${done?'\u2713':'\u2717'} ${escHtml(q)}${label.startsWith('Started') ? ' <span style="opacity:.6">(partial)</span>' : ''}</span>`;
        };
        for (const q of (taskObj.partialQuests || [])) reqHtml += _qChip(q, 'Started / partial completion is enough');
        // "Agility 60 or Strength 60" — any one satisfies it
        for (const group of (taskObj.skillsAny || [])) {
          const opts = group.map(o => Object.entries(o)[0]);
          const ok = opts.some(([sk, lv]) => getLevel(sk) >= lv);
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0d1e0d':'#161000'};border:1px solid ${ok?'#2a5a2a':'#4a3a0a'};color:${ok?'#4a9a4a':'#a08020'}"
            title="Any one of these">${opts.map(([sk, lv]) => `${skillIcon(sk,11)}${lv}`).join(' <span style="opacity:.6">or</span> ')}</span>`;
        }
        if (taskObj.combat) {
          const cb = typeof getCombatLevel === 'function' ? getCombatLevel() : null;
          const ok = cb != null && cb >= taskObj.combat;
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:#111418;border:1px solid ${ok?'#2a5a2a':'#252030'};color:${ok?'#4a9a4a':'#888'}" title="Combat level">\u2694 ${taskObj.combat}</span>`;
        }
        // Ironman-only requirements (from the wiki's ironman notes)
        for (const [sk, lv] of Object.entries(taskObj.ironmanSkills || {})) {
          const ok = getLevel(sk) >= lv;
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:#101016;border:1px dashed ${ok?'#2a5a2a':'#3a3a5a'};color:${ok?'#4a9a4a':'#8a8ab0'}"
            title="Ironman accounts only">${skillIcon(sk,11)}${lv} <span style="opacity:.6">iron</span></span>`;
        }
        for (const q of (taskObj.ironmanQuests || [])) reqHtml += _qChip(q, 'Ironman accounts only');
        // Helper: render a card chip — green ✓ if owned, red ✗ if not; grey if not a card
        function chipFor(displayName, fallbackType) {
          const ci = _cardInfo(displayName);
          if (!ci) {
            return `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:#111;border:1px solid #252525;font-size:10px;color:#555"
              title="Not a TCG card">${escHtml(displayName)}</span>`;
          }
          const owned = isOwned(ci.exact);
          const bg  = owned ? '#0a180a' : '#180808';
          const bdr = owned ? '#2a5a2a' : '#5a2a2a';
          const col = owned ? '#5a9a5a' : '#c05050';
          const sym = owned ? '\u2713'  : '\u2717';
          return `<span data-card="${escHtml(ci.exact)}" data-type="${ci.type}" onclick="showCard(this.dataset.card,this.dataset.type);event.stopPropagation()"
            style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;background:${bg};border:1px solid ${bdr};font-size:10px;color:${col};cursor:pointer"
            title="${owned?'Owned \u2014 click to view':'Not owned \u2014 click to view'}">${sym} ${escHtml(displayName)}</span>`;
        }
        for (const item of reqItems) {
          reqHtml += chipFor(item, 'item');
        }
        for (const mon of reqMonsters) {
          reqHtml += chipFor(mon, 'monster');
        }
        if (reqNpc) {
          reqHtml += chipFor(reqNpc, 'monster');
        }
        for (const npc of (taskObj.npcs || [])) {
          if (npc !== reqNpc) reqHtml += chipFor(npc, 'monster');
        }
        // Considered but no TCG card exists → no restriction (shown so nothing looks unchecked)
        for (const x of [...(taskObj.npcsNoCard || []), ...(taskObj.itemsNoCard || [])]) reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:#101010;border:1px solid #2a2a2a;color:#666" title="No TCG card exists — no restriction">${escHtml(x)} <span style="font-size:8px;opacity:.6">no card</span></span>`;
        // "wear any complete Barrows set" — a set counts when all four pieces are owned
        if (taskObj.setsAny) {
          const sets = taskObj.setsAny.sets || [];
          const done = sets.filter(st => st.items.every(c => isOwned(c)));
          const ok = done.length > 0;
          const rows = sets.map(st => ({ label: st.name, cards: [st.monster, ...st.items].filter(Boolean), need: st.items }));
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0a180a':'#180808'};border:1px dashed ${ok?'#2a5a2a':'#5a2a2a'};color:${ok?'#5a9a5a':'#c05050'}"
            ${_cardRowsTipAttrs(rows, taskObj.setsAny.label + ' \u2014 brother, then helm / body / legs / weapon')}>${ok?'\u2713':'\u2717'} ${escHtml(taskObj.setsAny.label)}${ok ? ` <span style="opacity:.7">(${escHtml(done[0].name)})</span>` : ''}</span>`;
        }
        // "kill a chompy or a jubbly" — any one monster card satisfies it
        for (const group of (taskObj.monstersAny || [])) {
          const ok = group.some(c => isOwned(c));
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0a180a':'#180808'};border:1px dashed ${ok?'#2a5a2a':'#5a2a2a'};color:${ok?'#5a9a5a':'#c05050'}"
            title="Kill any one of these">${ok?'\u2713':'\u2717'} \u2694 ${group.map(escHtml).join(' <span style="opacity:.6">or</span> ')}</span>`;
        }
        // "any light source" — uses the shared LIGHT_SOURCE_ITEMS list
        if (taskObj.lightSource) {
          const owned = LIGHT_SOURCE_ITEMS.filter(c => isOwned(c));
          const ok = owned.length > 0;
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0a180a':'#180808'};border:1px dashed ${ok?'#2a5a2a':'#5a2a2a'};color:${ok?'#5a9a5a':'#c05050'}"
            ${_cardGridTipAttrs(LIGHT_SOURCE_ITEMS, 'Any light source')}>${ok?'\u2713':'\u2717'} Any light source${ok ? ` <span style="opacity:.7">(${escHtml(owned[0])})</span>` : ''}</span>`;
        }
        // Mixed alternatives: "Dusty key or Agility 70", "Ecto-tokens or Coins"
        for (const group of (taskObj.anyOf || [])) {
          const met = o => o.card ? isOwned(o.card) : o.skill ? getLevel(o.skill) >= o.level : completedQuests.has(o.quest);
          const ok = group.some(met);
          const label = o => o.card ? escHtml(o.card) : o.skill ? `${skillIcon(o.skill,10)}${escHtml(o.skill)} ${o.level}` : `\u2691 ${escHtml(o.quest)}`;
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0a180a':'#180808'};border:1px dashed ${ok?'#2a5a2a':'#5a2a2a'};color:${ok?'#5a9a5a':'#c05050'}"
            title="Any one of these">${ok?'\u2713':'\u2717'} ${group.map(label).join(' <span style="opacity:.6">or</span> ')}</span>`;
        }
        // "A or B" item alternatives — owning any one card satisfies it
        (taskObj.itemsAny || []).forEach((group, gi) => {
          const owned = group.filter(c => isOwned(c));
          const ok = owned.length > 0;
          const label = (taskObj.itemsAnyLabels || {})[gi];
          if (label || group.length > 4) {   // big category groups: compact chip, full list on hover
            reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0a180a':'#180808'};border:1px dashed ${ok?'#2a5a2a':'#5a2a2a'};color:${ok?'#5a9a5a':'#c05050'}"
              ${_cardGridTipAttrs(group, label || 'Any one of')}>${ok?'\u2713':'\u2717'} ${escHtml(label || `Any of ${group.length}`)}${ok ? ` <span style="opacity:.7">(${escHtml(owned[0])}${owned.length > 1 ? ' +' + (owned.length - 1) : ''})</span>` : ''}</span>`;
            return;
          }
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:${ok?'#0a180a':'#180808'};border:1px dashed ${ok?'#2a5a2a':'#5a2a2a'};color:${ok?'#5a9a5a':'#c05050'}"
            title="Any one of these${ok ? ' — you own ' + owned.join(', ') : ''}">${ok?'\u2713':'\u2717'} ${group.map(c => {
              const ci = _cardInfo(c);
              return ci ? `<span data-card="${escHtml(ci.exact)}" data-type="${ci.type}" onclick="showCard(this.dataset.card,this.dataset.type);event.stopPropagation()" style="cursor:pointer;text-decoration:underline dotted">${escHtml(c)}</span>` : escHtml(c);
            }).join(' <span style="opacity:.6">or</span> ')}</span>`;
        });
        for (const tool of reqTools) {
          const tiers = TOOL_TIERS[tool];
          const best  = tiers && tiers.find(tt => isOwned(tt.name));   // lowest owned tier — the most accessible one
          const col   = !tiers ? '#666' : best ? '#5a9a5a' : '#c05050';
          reqHtml += `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:10px;background:#111418;border:1px solid ${!tiers ? '#252030' : best ? '#2a5a2a' : '#5a2a2a'};color:${col}"
            ${tiers ? _cardGridTipAttrs(tiers.map(tt => tt.name), 'Any ' + tool.toLowerCase() + ' (any tier works)') : 'title="Tool required"'}>\u2692 ${tiers ? (best ? '\u2713 ' : '\u2717 ') : ''}${escHtml(tiers ? 'Any ' + tool.toLowerCase() : tool)}${best ? ` <span style="opacity:.7">(${escHtml(best.name)})</span>` : ''}</span>`;
        }

        html += `<div style="display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:4px;border:1px solid ${rowBdr};background:${rowBg};margin-bottom:3px">
          <div data-dn="${escHtml(name)}" data-tier="${tier}" data-idx="${i}"
            onclick="toggleDiaryTick(this.dataset.dn,this.dataset.tier,'task',String(this.dataset.idx))"
            style="width:16px;height:16px;flex-shrink:0;margin-top:1px;border-radius:3px;border:1px solid ${boxBdr};background:${boxBg};display:flex;align-items:center;justify-content:center;cursor:pointer"
            title="${ticked?'Click to un-tick':'Click to mark done'}">
            ${ticked?`<span style="color:#76c442;font-size:11px;line-height:1">\u2713</span>`:''}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;color:${ticked?'#666':'#aaa'};line-height:1.4;${ticked?'text-decoration:line-through;':''}">${escHtml(taskText)}</div>
            ${reqHtml ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">${reqHtml}</div>` : ''}
            ${(taskObj.notes || []).length ? `<div style="font-size:10px;color:#555;margin-top:4px;line-height:1.4">${taskObj.notes.map(escHtml).join(' \xb7 ')}</div>` : ''}
          </div>
        </div>`;
      });
    }


    // ── Rewards (from the wiki's per-tier Rewards list) ───────────────────────
    if ((t.rewards || []).length) {
      const line = r => {
        const head = r.text.replace(/:$/, '');
        const ci = _cardInfo(head);
        const headHtml = ci
          ? `<span data-card="${escHtml(ci.exact)}" data-type="${ci.type}" onclick="showCard(this.dataset.card,this.dataset.type)"
               style="color:${isOwned(ci.exact) ? '#76c442' : '#c8a060'};cursor:pointer;text-decoration:underline dotted"
               title="${isOwned(ci.exact) ? 'Owned' : 'Not owned'} \u2014 click to view">${escHtml(head)}</span>`
          : escHtml(r.text);
        const subs = (r.sub || []).map(x => `<li style="margin:1px 0">${escHtml(x)}</li>`).join('');
        // cards this reward needs (to use the item, kill the monster, talk to the NPC)
        const need = [...(r.items || []), ...(r.monsters || []), ...(r.npcs || [])].filter(c => _isCard(c) && c !== (ci && ci.exact));
        const chips = need.map(c => {
          const own = isOwned(c), info = _cardInfo(c);
          return `<span data-card="${escHtml(info.exact)}" data-type="${info.type}" onclick="showCard(this.dataset.card,this.dataset.type)"
            style="display:inline-flex;align-items:center;padding:0 5px;margin-left:4px;border-radius:3px;font-size:9px;cursor:pointer;background:${own?'#0a180a':'#180808'};border:1px solid ${own?'#2a5a2a':'#5a2a2a'};color:${own?'#5a9a5a':'#c05050'}"
            title="${own ? 'Owned' : 'Card needed'} \u2014 click to view">${own ? '\u2713' : '\u2717'} ${escHtml(c)}</span>`;
        }).join('');
        const ncChips = [...(r.npcsNoCard || []), ...(r.itemsNoCard || [])].map(x => `<span style="display:inline-flex;align-items:center;gap:2px;padding:1px 5px;border-radius:3px;font-size:9px;margin-left:4px;background:#101010;border:1px solid #2a2a2a;color:#666" title="No TCG card exists — no restriction">${escHtml(x)} <span style="font-size:8px;opacity:.6">no card</span></span>`).join('');
        return `<li style="margin:3px 0">${headHtml}${chips}${ncChips}${subs ? `<ul style="margin:2px 0 0 14px;padding:0;color:#666">${subs}</ul>` : ''}</li>`;
      };
      html += `<details style="margin-bottom:14px;padding:8px 12px;background:#0d0c08;border-radius:4px;border:1px solid #2a2414">
        <summary style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#6a5a3a;cursor:pointer">Rewards</summary>
        <ul style="margin:6px 0 0 14px;padding:0;font-size:11px;color:#999;line-height:1.45">${t.rewards.map(line).join('')}</ul>
      </details>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  pane.innerHTML = html;
}

function showDiary(name) {

/**
 * Check whether all card groups for a quest are satisfied using BM data.
 * Returns {cardsOk, missingCount} where cardsOk=true means all groups have ≥1 owned card.
 * Falls back to quests.json itemsRequired + killsRequired if no BM data.

// ─── Most-needed missing cards (Questing tab welcome panel) ─────────────────
// For every quest not marked done, each unmet *required* requirement credits the unowned
// cards that would satisfy it: any option of an "any of" group (counted once per quest),
// or the missing pieces of a route (each slot's first choice, so staffs don't swamp it).
// "Last card" = owning this one card would complete every card requirement of that quest.
// Unowned cards that would meet a still-unmet *required* requirement, per target (quest or
// boss): any option of an "any of" group counts, and each missing slot's first choice of a
// route. "last" = owning this one card completes every card requirement of that target.
// entries: [{name, reqs}]
function _cardDemand(entries) {
  const demand = new Map();  // card → {quests:Set, last:Set}  (quests = targets helped)
  const credit = (card, qn) => {
    if (!demand.has(card)) demand.set(card, { quests: new Set(), last: new Set() });
    demand.get(card).quests.add(qn);
  };
  for (const { name: qn, reqs } of entries) {
    const unmet = reqs.filter(r => !r.optional && (_reqCards(r).length || (r._routes || []).length) && !_reqMet(r));
    const perReq = unmet.map(r => {
      const cands = new Set();
      for (const c of (r.cards || [])) if (!isOwned(c)) cands.add(c);
      for (const rt of (r._routes || [])) {
        if (rt.manual) continue;
        for (const sl of rt.slots) if (!sl.some(c => isOwned(c))) cands.add(sl[0]);
      }
      return cands;
    });
    for (const cands of perReq) for (const c of cands) credit(c, qn);
    if (unmet.length === 1) {
      const r = unmet[0];
      const opts = r.mode === 'all'
        ? ((r.cards || []).filter(c => !isOwned(c)).length === 1 ? (r.cards || []).filter(c => !isOwned(c)) : [])
        : [...perReq[0]].filter(c => (r.cards || []).includes(c) || (r._routes || []).some(rt => !rt.manual
            && (!rt.magic || getLevel('Magic') >= rt.magic) && (rt.quests || []).every(q => completedQuests.has(q))
            && rt.slots.every(sl => sl.some(x => isOwned(x)) || sl[0] === c)));
      for (const c of opts) demand.get(c)?.last.add(qn);
    }
  }
  return demand;
}
