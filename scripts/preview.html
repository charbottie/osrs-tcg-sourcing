        <span style="font-size:10px;color:${pctColor}">${pct}%</span>
      </div>
      <div class="pack-mini-bar"><div class="pack-mini-fill" style="width:${pct}%;background:${barColor}"></div></div>
    </div>`;
  }
  pane.innerHTML = html;
}

function showPackDetail(packId, filter, push = true) {
  if (push) pushHistoryEntry();
  selectedPack = packId;
  renderPackList();

  const pane = document.getElementById('pack-detail-pane');
  if (!pane || !packCatalog) return;

  const pack = packCatalog.packs.find(p => p.id === packId);
  if (!pack) return;

  // Preserve filter selection across re-renders
  const currentFilter = filter
    || document.getElementById('pack-filter-sel')?.value
    || 'all';

  const allPackCards = _getPackCards(pack);
  const total      = allPackCards.length;
  const ownedCount = allPackCards.filter(c => isOwned(c.name)).length;
  const missing    = total - ownedCount;
  const pct        = total ? Math.round(ownedCount / total * 100) : 0;

  // Group by tier
  const byTier = {};
  for (const c of allPackCards) {
    const tier = (cardDetails[c.name] || {}).tier || 'Unknown';
    (byTier[tier] = byTier[tier] || []).push(c);
  }

  // Use local proxy so the image is served from localhost (avoids CDN blocking)
  const packImgUrl = pack.thumbnail ? pack.thumbnail : '';
  const packImgHtml = packImgUrl
    ? `<img src="${packImgUrl}" style="float:right;width:48px;height:48px;border-radius:3px;margin:0 0 12px 16px;box-shadow:0 2px 6px #000" onerror="_imgRetry(this, () => this.style.display='none')">`
    : '';

  let html = `<h1>${pack.name}${packImgHtml}</h1>
    <div class="subtitle" style="margin-bottom:12px">
      ${pack.price.toLocaleString()} credits · 5 cards per pack
      · <span style="color:#e8c97a">${ownedCount.toLocaleString()} / ${total.toLocaleString()} owned (${pct}%)</span>
      · <span style="color:#c84a00">${missing.toLocaleString()} missing</span>
    </div>
    <div style="margin-bottom:16px">
      <select id="pack-filter-sel" onchange="showPackDetail('${packId}', this.value, false)"
        style="background:#222;border:1px solid #444;color:#ccc;padding:4px 8px;border-radius:3px;font-size:11px">
        <option value="all"    ${currentFilter==='all'    ?' selected':''}>All cards</option>
        <option value="missing"${currentFilter==='missing'?' selected':''}>Missing only</option>
        <option value="owned"  ${currentFilter==='owned'  ?' selected':''}>Owned only</option>
      </select>
    </div>`;

  // Stats bar by tier
  html += `<div class="stats-bar" style="flex-wrap:wrap;gap:6px;margin-bottom:16px">`;
  for (const tier of PACK_TIER_ORDER) {
    const t = byTier[tier];
    if (!t) continue;
    const to = t.filter(c => isOwned(c.name)).length;
    html += `<div class="stat-block">
      <div class="stat-label"><span class="tier-badge tier-${tier}" style="font-size:9px">${tier}</span></div>
      <div class="stat-value${to===t.length?' complete':''}" style="font-size:12px">${to}<span class="den"> / ${t.length}</span></div>
    </div>`;
  }
  html += `</div>`;

  // Card chips by tier
  const wishlisted = _wishlistedCardSet();

  for (const tier of PACK_TIER_ORDER) {
    const t = byTier[tier];
    if (!t) continue;
    let tierCards = [...t].sort((a, b) => a.name.localeCompare(b.name));
    if (currentFilter === 'missing') tierCards = tierCards.filter(c => !isOwned(c.name));
    if (currentFilter === 'owned')   tierCards = tierCards.filter(c =>  isOwned(c.name));
    if (tierCards.length === 0) continue;

    const to = t.filter(c => isOwned(c.name)).length;
    const tw = t.filter(c => !isOwned(c.name) && wishlisted.has(c.name)).length;
    html += `<div class="section">
      <div class="section-header">
        <span class="tier-badge tier-${tier}">${tier}</span>
        <span style="font-size:10px;font-weight:400;color:#555;margin-left:8px">${to} / ${t.length} owned</span>
        ${tw ? `<span style="font-size:10px;font-weight:400;color:#a08030;margin-left:6px">· ${tw} wishlisted</span>` : ''}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:8px 0">`;

    for (const c of tierCards) {
      const own  = isOwned(c.name);
      const wled = !own && wishlisted.has(c.name);
      const safeName = c.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      const chipClass = own ? 'owned' : wled ? 'wishlisted' : 'missing';
      const prefix    = own ? '✓ ' : wled ? '★ ' : '';
      html += `<span class="pack-chip ${chipClass}"
        data-card="${safeName}" data-type="${c.type}"
        onclick="showCard(this.dataset.card,this.dataset.type)">${prefix}${c.name}</span>`;
    }

    html += `</div></div>`;
  }

  pane.innerHTML = html;
}

function tierBadgeHtml(name) {
  const tier = (cardDetails[name] || {}).tier;
  if (!tier) return '';
  return `<span class="tier-badge tier-${tier}">${tier}</span>`;
}

function renderMonster(name, container) {
  const data      = monsterDrops[name] || {};
  const allDropsRaw = data.drops || [];
  const allDrops  = dedupeDrops(allDropsRaw);
  const mainDrops = allDrops.filter(d => !d.fromRdt);
  const rdtDrops  = allDrops.filter(d => d.fromRdt);

  const mainOwned = mainDrops.filter(d => isOwned(d.card)).length;
  const rdtOwned  = rdtDrops.filter(d => isOwned(d.card)).length;

  const reqs = [];
  if (data.slayerLevel)  reqs.push({label: `Slayer ${data.slayerLevel}`,  locked: getLevel('Slayer')  < data.slayerLevel});
  if (data.sailingLevel) reqs.push({label: `Sailing ${data.sailingLevel}`, locked: getLevel('Sailing') < data.sailingLevel});
  if (data.quests?.length) reqs.push({label: `Quest locked`, locked: true});
  if (name.startsWith('Revenant')) reqs.push({label: 'Coins (entrance fee)', locked: !isOwned('Coins')});

  const mDetail  = cardDetails[name] || {};
  const mImgHtml = mDetail.imageUrl
    ? `<img src="${mDetail.imageUrl}" style="float:right;max-width:64px;max-height:64px;image-rendering:pixelated;margin-left:8px" onerror="this.style.display='none'">`
    : '';
  const mExamHtml = mDetail.examine
    ? `<div style="font-size:11px;color:#888;font-style:italic;margin-top:3px">${mDetail.examine}</div>`
    : '';

  const monsterOwned = isOwned(name);
  const monsterLastTs  = cardTimestamps[name];
  const monsterFirstTs = cardFirstTimestamps[name];
  const _fmtDate = ts => new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const monsterPulledHtml = monsterLastTs
    ? (monsterFirstTs && monsterFirstTs !== monsterLastTs
        ? ` · <span style="color:#555;font-size:10px">First pulled ${_fmtDate(monsterFirstTs)} · Last pulled ${_fmtDate(monsterLastTs)}</span>`
        : ` · <span style="color:#555;font-size:10px">Pulled ${_fmtDate(monsterLastTs)}</span>`)
    : '';
  const monsterWishSafe = name.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  const monsterWishHtml = `<span class="wish-star${wishlist.has(name)?' active':''}" data-card="${monsterWishSafe}" onclick="toggleWishlist(this.dataset.card)" title="${wishlist.has(name)?'Remove from wishlist':'Add to wishlist'}" style="margin-left:8px">${wishlist.has(name)?'★':'☆'}</span>`;
  let html = `<h1>${name}${mImgHtml}${wikiLink(name)}</h1>
    <div class="subtitle">
      ${data.combatLevel ? 'Monster card' : 'NPC card'}${tierBadgeHtml(name)}
      ${data.combatLevel ? ` · Combat ${data.combatLevel}` : ''}
      · <span style="color:${monsterOwned?'#00c853':'#7a5020'}">${monsterOwned?'✓ Owned':'✗ Not owned'}</span>
      <span style="color:#555;font-size:10px;margin-left:8px;cursor:pointer" data-nav="${escHtml(name)}" onclick="toggleOwned(this.dataset.nav)">(toggle)</span>${monsterWishHtml}${monsterPulledHtml}
      ${reqs.map(r => `<span style="margin-left:8px;padding:2px 7px;border-radius:10px;font-size:10px;
        background:${r.locked?'#3a1a00':'#003d1f'};color:${r.locked?'#c84a00':'#00c853'}">${r.label}</span>`).join('')}
      ${mExamHtml}
    </div>`;

  // Stats blocks
  html += `<div class="stats-bar">
    <div class="stat-block">
      <div class="stat-label">Main Drops</div>
      <div class="stat-value${mainOwned===mainDrops.length&&mainDrops.length>0?' complete':''}">${mainOwned}<span class="den"> / ${mainDrops.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">Rare Drop Table</div>
      <div class="stat-value" style="color:${rdtOwned===rdtDrops.length&&rdtDrops.length>0?'#00c853':'#4a6aaa'}">${rdtOwned}<span class="den"> / ${rdtDrops.length}</span></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">All TCG Drops</div>
      <div class="stat-value${(mainOwned+rdtOwned)===allDrops.length&&allDrops.length>0?' complete':''}">${mainOwned+rdtOwned}<span class="den"> / ${allDrops.length}</span></div>
    </div>
  </div>`;

  html += packAcquisitionHtml(name);

  // Main drops
  html += `<div class="section">
    <div class="section-header">
      TCG Card Drops
      ${progressPill(mainOwned, mainDrops.length, false)}
    </div>`;
  if (mainDrops.length === 0) {
    html += `<div class="empty-note">No main-table TCG drops found.</div>`;
  } else {
    // Owned first, then locked
    const sorted = [...mainDrops].sort((a,b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return 0;
    });
    for (const d of sorted)
      html += dropRowHtml(d.card, d.rarity, d.fraction, false, selected);
  }
  html += `</div>`;

  // RDT drops
  if (rdtDrops.length > 0) {
    html += `<div class="section">
      <div class="section-header">
        Rare Drop Table
        <span class="rdt-header-note">shared · ${progressPill(rdtOwned, rdtDrops.length, true)}</span>
      </div>
      <div class="rdt-banner">These drops come from the shared Rare &amp; Gem Drop Table, which many monsters access. Owning these doesn't require farming this specific monster.</div>`;
    const sorted = [...rdtDrops].sort((a,b) => {
      const ao = isOwned(a.card), bo = isOwned(b.card);
      if (ao !== bo) return ao ? -1 : 1;
      return 0;
    });
    for (const d of sorted)
      html += dropRowHtml(d.card, d.rarity, d.fraction, true, selected);
    html += `</div>`;
  }

  // ── Area access requirements ──────────────────────────────────────────────
  const areaKey = CARD_AREAS[name];
  if (areaKey && AREA_GATES[areaKey]) {
    const gate = AREA_GATES[areaKey];
    const completable = computeCompletableQuests();
    html += `<div class="section">
      <div class="section-header">Location: ${gate.label} <span style="font-size:10px;color:#555;font-weight:normal">${gate.note}</span></div>
      <div style="margin-top:8px">`;
    if (gate.questRequired) {
      const qDone = completedQuests.has(gate.questRequired);
      const qOk   = qDone || completable.has(gate.questRequired);
      const sym   = qDone ? '✓' : qOk ? '~' : '✗';
      const cls   = qDone ? 'ok' : qOk ? 'close' : 'fail';
      const note  = qDone ? 'complete' : qOk ? 'completable' : 'locked';
      const safeQ = gate.questRequired.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-quest="${safeQ}" onclick="_navToQuest(this)">Quest: ${gate.questRequired}</span>
        <span class="req-note">${note}</span>
      </div>`;
    }
    if (gate.npcRequired) {
      const nOk = isOwned(gate.npcRequired);
      const sym  = nOk ? '✓' : '✗';
      const cls  = nOk ? 'ok' : 'fail';
      const safeN = gate.npcRequired.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-nav="${safeN}" data-nav-type="monster" onclick="_navToCard(this)">NPC card: ${gate.npcRequired}</span>
        <span class="req-note">${nOk ? 'card owned' : 'need card'}</span>
      </div>`;
    }
    for (const item of (gate.itemsRequired || [])) {
      const iOk = isOwned(item);
      const sym  = iOk ? '✓' : '✗';
      const cls  = iOk ? 'ok' : 'fail';
      const safeI = item.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-nav="${safeI}" data-nav-type="item" onclick="_navToCard(this)">Item: ${item}</span>
        <span class="req-note">${iOk ? 'owned' : 'need card'}</span>
      </div>`;
    }
    const extras = CARD_AREA_EXTRAS[name] || [];
    for (const item of extras) {
      const iOk = isOwned(item);
      const sym  = iOk ? '✓' : '✗';
      const cls  = iOk ? 'ok' : 'fail';
      const safeI = item.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      html += `<div class="req-row">
        <span class="req-icon ${cls}">${sym}</span>
        <span class="req-label" style="cursor:pointer"
          data-nav="${safeI}" data-nav-type="item" onclick="_navToCard(this)">${item}</span>
        <span class="req-note">${iOk ? 'owned' : 'need card'}</span>
      </div>`;
    }
    html += `</div></div>`;
  }

  // ── Slayer tasks (if this NPC is a Slayer master) ─────────────────────────
  const slayerKey = SLAYER_MASTER_MAP[name];
  if (slayerKey && SLAYER_TASKS[slayerKey]) {
    const master = SLAYER_TASKS[slayerKey];
    const tasks = master.tasks;
    const totalWeight = tasks.reduce((s,t) => s + t.weight, 0);
    const sorted2 = [...tasks].sort((a,b) => {
      const ao = a.cards.some(_slayerCardFeasible), bo = b.cards.some(_slayerCardFeasible);
      if (ao !== bo) return ao ? -1 : 1;
      return b.weight - a.weight;
    });
    const availCount = tasks.filter(t => t.cards.some(_slayerCardFeasible)).length;
    const alias = (name !== slayerKey) ? ` <span style="font-size:10px;color:#555;font-weight:normal">(same list as ${slayerKey})</span>` : '';

    html += `<div class="section">
      <div class="section-header">Slayer Tasks${alias} <span style="font-size:10px;color:#555;font-weight:normal">${availCount}/${tasks.length} available</span></div>
      <div style="margin-top:8px">`;
    for (const t of sorted2) {
      const owned = t.cards.some(_slayerCardFeasible);
      const wishlisted = wishlistGroups.some(g => g.name === t.task);
      const pct = ((t.weight / totalWeight) * 100).toFixed(1);
      const ownedCard = t.cards.find(_slayerCardFeasible) || t.cards.find(c => isOwned(c)) || t.cards[0];
      const navCard = escHtml(t.cards[0]);
      const starStyle = wishlisted
        ? 'color:#c8a020;background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;flex-shrink:0;line-height:1;margin-left:auto'
        : 'color:#555;background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;flex-shrink:0;line-height:1;margin-left:auto';
      html += `<div class="method-row">
        <div class="method-indicator ${owned ? 'available' : 'locked'}"></div>
        <span class="method-name ${owned ? 'available' : 'locked'}" style="cursor:pointer"
          data-nav="${navCard}" data-nav-type="monster" onclick="_navToCard(this)">${escHtml(t.task)}</span>
        <span class="method-level" style="min-width:46px;text-align:right">${pct}%</span>
        <span class="method-note">${owned ? escHtml(ownedCard) : 'no card'}</span>
        <button style="${starStyle}" onclick="toggleSlayerWishlistGroup(${escHtml(JSON.stringify(t.task))})" title="${wishlisted?'Remove from wishlist':'Add to wishlist'}">${wishlisted?'★':'☆'}</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;padding:2px 0 5px 20px">`;
      for (const card of t.cards) {
        const cardOwned = isOwned(card);
        const _gate = _slayerGate(card);
        let _gateMet = true, _gateDesc = '';
        if (_gate) {
          const _qFail = (_gate.quests || []).filter(q => !completedQuests.has(q));
          const _sFail = Object.entries(_gate.skills || {}).filter(([s,l]) => getLevel(s) < l);
          if (_qFail.length || _sFail.length) {
            _gateMet = false;
            _gateDesc = [
              ..._qFail.map(q => 'Quest: '+q),
              ..._sFail.map(([s,l]) => s+' '+l+' req'),
            ].join('; ');
          }
        }
        const _blocked = cardOwned && !_gateMet;
        const col = !cardOwned ? '#555' : _blocked ? '#c89020' : '#76c442';
        const bg  = !cardOwned ? '#111' : _blocked ? '#1a1400' : '#0d2210';
        const bdr = !cardOwned ? '#222' : _blocked ? '#5a4010' : '#2a5a2a';
        const pfx = !cardOwned ? '' : _blocked ? '\u26a0 ' : '\u2713 ';
        const imgUrl = _cardImg(card) || '';
        const img = imgUrl ? `<img src="${imgUrl}" style="width:12px;height:12px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;opacity:${cardOwned?1:0.35}" onerror="this.style.display='none'">` : '';
        const _tip = cardOwned ? (_blocked ? 'Owned — '+_gateDesc : 'Owned') : (_gateDesc ? 'Not owned — '+_gateDesc : 'Not owned');
        html += `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:${col};background:${bg};border:1px solid ${bdr};border-radius:3px;padding:1px 4px;cursor:pointer"
          title="${escHtml(_tip)}" data-nav="${escHtml(card)}" data-nav-type="monster" onclick="_navToCard(this)">${img}${pfx}${escHtml(card)}</span>`;
      }
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  // ── Assigned by slayer masters ────────────────────────────────────────────
  {
    const slayerAssignedBy = [];
    for (const [masterKey, master] of Object.entries(SLAYER_TASKS)) {
      const totalWeight = master.tasks.reduce((s,t) => s + t.weight, 0);
      const matchingTasks = master.tasks.filter(t => t.cards.includes(name));
      if (matchingTasks.length === 0) continue;
      const combinedWeight = matchingTasks.reduce((s,t) => s + t.weight, 0);
      const pct = ((combinedWeight / totalWeight) * 100).toFixed(1);
      const taskLabel = [...new Set(matchingTasks.map(t => t.task))].join(' / ');
      const _mCards = Object.entries(SLAYER_MASTER_MAP).filter(([,k]) => k === masterKey).map(([c]) => c);
      const masterOwned = _mCards.length === 0 || _mCards.some(c => isOwned(c));
      const masterCardName = _mCards.find(c => isOwned(c)) || _mCards[0] || masterKey;
      const slayerOk = getLevel('Slayer') >= (master.slayerReq || 1);
      slayerAssignedBy.push({masterKey, masterCardName, masterOwned, slayerOk, taskLabel, pct, slayerReq: master.slayerReq});
    }
    if (slayerAssignedBy.length > 0) {
      // Sort: unlocked masters first, then by pct desc
      slayerAssignedBy.sort((a,b) => {
        const aOk = a.slayerOk && a.masterOwned, bOk = b.slayerOk && b.masterOwned;
        if (aOk !== bOk) return aOk ? -1 : 1;
        return parseFloat(b.pct) - parseFloat(a.pct);
      });
      html += `<div class="section">
        <div class="section-header">Assigned by Slayer masters</div>
        <div style="margin-top:8px">`;
      for (const m of slayerAssignedBy) {
        const safeMasterName = m.masterCardName.replace(/&/g,'&amp;').replace(/"/g,'&quot;');
        const indCls2 = !m.slayerOk ? 'locked' : !m.masterOwned ? 'no-card' : 'available';
        const mImgUrl2 = _cardImg(m.masterCardName) || '';
        const mImgHtml2 = mImgUrl2
          ? `<img src="${mImgUrl2}" style="width:16px;height:16px;object-fit:contain;image-rendering:pixelated;flex-shrink:0;margin-right:4px" onerror="this.style.display='none'">`
          : '<span style="width:16px;flex-shrink:0;margin-right:4px"></span>';
        const noteText2 = !m.slayerOk ? `Slayer ${m.slayerReq} req` : !m.masterOwned ? 'no master card' : m.taskLabel;
        html += `<div class="method-row">
          <div class="method-indicator ${indCls2}"></div>
          ${mImgHtml2}
          <span class="method-name ${indCls2}" style="cursor:pointer"
            data-nav="${safeMasterName}" data-nav-type="monster" onclick="_navToCard(this)">${m.masterKey}</span>
          <span class="method-level" style="min-width:46px;text-align:right">${m.pct}%</span>
          <span class="method-note">${noteText2}</span>
        </div>`;
      }
      html += `</div></div>`;
    }
  }

  // ── Required for quests ───────────────────────────────────────────────────
  html += requiredForQuestsHtml(name);

  // ── Clue step NPC usage ────────────────────────────────────────────────────
  html += clueStepNpcHtml(name);

  // ── Boss Encounters cross-link ────────────────────────────────────────────
  const _mBossEncs = (typeof BOSS_BY_CARD !== 'undefined') ? (BOSS_BY_CARD[name.toLowerCase()] || []) : [];
  if (_mBossEncs.length) {
    const BOSS_ROLE_LABEL = {monster:'Boss Room',kc:'Kill Count',item:'Required Item',tool:'Tool',optional:'Optional',related:'Related',warm:'Warm Clothing',light:'Light Source',dragonfire:'Dragonfire Protection'};
    html += `<h2 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:20px 0 8px;padding-top:16px;border-top:1px solid #222">Boss Encounters</h2>`;
    html += `<div style="display:flex;flex-wrap:wrap;gap:6px">`;
    for (const { bossName, role } of _mBossEncs) {
      html += `<span data-boss="${escHtml(bossName)}" onclick="showBoss(this.dataset.boss);event.stopPropagation()"
        style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#aaa;background:#161616;border:1px solid #2a2a2a;border-radius:3px;padding:3px 9px;cursor:pointer;white-space:nowrap"
        title="${BOSS_ROLE_LABEL[role]||role}">${escHtml(bossName)} <span style="font-size:9px;color:#555">${BOSS_ROLE_LABEL[role]||role}</span></span>`;
    }
    html += `</div>`;
  }

  // ── Diary Requirements cross-link ─────────────────────────────────────────
  const _mDiaryEncs = (typeof DIARY_BY_CARD !== 'undefined') ? (DIARY_BY_CARD[name.toLowerCase()] || []) : [];
  if (_mDiaryEncs.length) {
    const DTIER_COLOR_M = {easy:'#50c050',medium:'#c8c030',hard:'#4080c0',elite:'#9050d0'};
    html += `<h2 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#555;margin:20px 0 8px;padding-top:16px;border-top:1px solid #222">Diary Requirements</h2>`;
    html += `<div style="display:flex;flex-direction:column;gap:4px">`;
    for (const { diaryName, tier, task: taskText } of _mDiaryEncs) {
      const tierLabel = tier.charAt(0).toUpperCase()+tier.slice(1);
      const tierCol   = DTIER_COLOR_M[tier] || '#555';
      html += `<div data-diary="${escHtml(diaryName)}" onclick="showDiary(this.dataset.diary);event.stopPropagation()"
        style="display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#aaa;background:#161616;border:1px solid #2a2a2a;border-radius:3px;padding:4px 8px;cursor:pointer">
        <span style="white-space:nowrap;flex-shrink:0">${escHtml(diaryName)} <span style="color:${tierCol}">${tierLabel}</span></span>
        ${taskText ? `<span style="color:#666;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(taskText)}">${escHtml(taskText)}</span>` : ''}
        </div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html;
}

// ─── Production card HTML ──────────────────────────────────────────────────
// Maps wiki facility strings → human-readable access notes.
// Altars are locations (not cards) — show what the player actually needs to carry.
// Access options for each altar. Strings that match itemSources keys will show
// ownership indicators; others (e.g. 'Abyss') are shown as plain grey text.
const FACILITY_NOTES = {
  'None': null,
  'Air Altar':    ['Air talisman', 'Air tiara', 'Abyss'],
  'Water Altar':  ['Water talisman', 'Water tiara', 'Abyss'],
  'Earth Altar':  ['Earth talisman', 'Earth tiara', 'Abyss'],
  'Fire Altar':   ['Fire talisman', 'Fire tiara', 'Abyss'],
  'Mind Altar':   ['Mind talisman', 'Mind tiara', 'Abyss'],
  'Body Altar':   ['Body talisman', 'Body tiara', 'Abyss'],
  'Chaos Altar':  ['Chaos talisman', 'Chaos tiara', 'Abyss'],
  'Nature Altar': ['Nature talisman', 'Nature tiara', 'Abyss'],
  'Cosmic Altar': ['Cosmic talisman', 'Cosmic tiara', 'Abyss'],
  'Law Altar':    ['Law talisman', 'Law tiara', 'Abyss'],
  'Death Altar':  ['Death talisman', 'Death tiara', 'Abyss'],
  'Astral Altar': ['Astral talisman', 'Abyss'],
  'Blood Altar':  ['Blood talisman', 'Abyss'],
  'Blood AltarBlood Altar (Kourend)': ['Blood talisman', 'Abyss'],
  'Soul Altar':   ['Soul talisman', 'Abyss'],
  'Wrath Altar':  ['Wrath talisman', 'Abyss'],
};
function facilityNote(f) {
  if (!f || f === 'None') return null;
  const opts = FACILITY_NOTES[f];
  if (!opts) return `<span style="color:#888">Requires: ${f}</span>`;
  const sep = ' <span style="color:#555">/</span> ';
  const parts = opts.map(opt => {
    if (opt === 'Abyss') {
      const abyssOk = completedQuests.has('Enter the Abyss');
      const col = abyssOk ? '#76c442' : '#3a3a3a';
      const sym = abyssOk ? ' ✓' : '';
      const label = abyssOk ? 'Abyss' : 'Abyss (locked)';
      return `<span style="cursor:pointer;color:${col};text-decoration:underline dotted" title="Enter the Abyss miniquest"
        data-quest="Enter the Abyss" onclick="_navToQuest(this)">${label}${sym}</span>`;
    }
    const isCard = itemSources[opt] !== undefined;
    if (!isCard) return `<span style="color:#666">${opt}</span>`;
    const owned = isOwned(opt);
    const col = owned ? '#76c442' : '#c84a00';
    const sym = owned ? '✓' : '✗';
    return `<span style="cursor:pointer;color:${col}" data-nav="${escHtml(opt)}" data-nav-type="item" onclick="showCard(this.dataset.nav,this.dataset.navType)">${opt} ${sym}</span>`;
  });
  return `Access: ${parts.join(sep)}`;
}
